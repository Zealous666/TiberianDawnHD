<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AoT – Tilesets</title>
<style>
  :root {
    --bg: #0f1117;
    --col-bg: #1a1d27;
    --card-bg: #252938;
    --card-bg-hover: #2d3142;
    --accent: #d9a82e;
    --text: #e6e8ee;
    --text-dim: #9aa0ad;
    --border: #2f3340;
    --phase2-bg: #1a1f2e;
    --phase2-border: #2f3a5a;
    --phase2-accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: 42px;
  }
  .top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; gap: 2px; padding: 6px 16px; background: rgba(15,17,23,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .top-nav a { padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-dim); text-decoration: none; transition: color .15s, background .15s; }
  .top-nav a:hover { color: var(--text); background: var(--card-bg); }
  .top-nav a.active { color: var(--text); background: var(--card-bg); }
  header {
    padding: 24px 32px 8px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  header p {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0;
  }
  .section-label {
    padding: 20px 32px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    margin: 0 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
    padding: 20px 32px 32px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card.phase2 {
    background: var(--phase2-bg);
    border-color: var(--phase2-border);
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    margin-left: 10px;
    margin-top: 2px;
  }
  .badge.id {
    background: rgba(217,168,46,0.15);
    color: var(--accent);
    border: 1px solid rgba(217,168,46,0.3);
  }
  .badge.phase2 {
    background: rgba(91,141,239,0.15);
    color: var(--phase2-accent);
    border: 1px solid rgba(91,141,239,0.3);
  }
  .card-meta {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .card-meta strong {
    color: var(--text);
  }
  .checklist {
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .checklist-header {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 3px 0;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .checklist-item input[type="checkbox"] {
    margin-top: 2px;
    flex-shrink: 0;
    cursor: default;
    pointer-events: none;
    accent-color: var(--accent);
  }
  .card.phase2 .checklist-item input[type="checkbox"] {
    accent-color: var(--phase2-accent);
  }
  .checklist-item label {
    cursor: default;
    flex: 1;
  }
  .checklist-item input:checked + label {
    color: var(--text-dim);
    text-decoration: line-through;
  }
  .progress-bar-wrap {
    background: var(--col-bg);
    border-radius: 4px;
    height: 4px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar {
    height: 4px;
    border-radius: 4px;
    background: var(--accent);
    transition: width 0.3s;
  }
  .card.phase2 .progress-bar {
    background: var(--phase2-accent);
  }
  .progress-label {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: right;
  }
</style>
</head>
<body>

<header>

  <p>Option 2: Eigene AoT-IDs für alle Tilesets. Phase 1 = RA-basiert + TD-Desert/Winter. Phase 2 = Jungle.</p>
</header>

<div class="section-label">Phase 1 — Tileset-Implementierung</div>
<div class="grid" id="grid-p1"></div>

<div class="section-label">Phase 2 — Erweiterung</div>
<div class="grid" id="grid-p2"></div>

<script>

// Default checked states hardcoded here; localStorage stores user overrides on top.

  "aot-temperat-ms-1": true,
  "aot-temperat-ms-2": true,

  "aot-snow-ms-1": true,
  "aot-snow-ms-2": true,
  "aot-snow-ms-3": true,
  "aot-snow-ms-4": true,
  "aot-snow-ms-5": true,
  "aot-snow-ms-6": true,
  "aot-snow-ms-7": true,
  "aot-snow-ms-8": false,

const tilesets = [

    phase: 1,
    meta: [

      "Terrain-Typen auf AoT-Begriffe anpassen (Ore→Tiberium, Gems→BlueTiberium, kein Ore/Gems)",

    ]
  },
  {

    title: "Snow",

    phase: 1,
    meta: [
      { label: "Basis", value: "RA Snow (engine/mods/ra/tilesets/snow.yaml)" },
      { label: "Templates", value: "264 (vs. 144 im aktuellen Fragment)" },
      { label: "Tile-Dateien", value: ".sno – aus RA snow.mix" },
      { label: "Parallel zu", value: "AOT_WINTER (TD Winter bleibt separat)" },
    ],
    milestones: [
      "RA snow.mix korrekt in mod.yaml mounten (bereits teilweise vorhanden prüfen)",
      "Prüfen welche .sno-Dateien bereits in cnc/bits/tilesets/ liegen",
      "aot-snow.yaml aus RA-Engine-Vorlage (264 Templates) ableiten",
      "Terrain-Typen auf AoT-Begriffe anpassen (Ore→Tiberium, Gems→BlueTiberium)",
      "Tileset-ID auf AOT_SNOW setzen",
      "TileSets-Eintrag in mod.yaml: cnchd|tilesets/aot-snow.yaml",

      "Test-Map: Snow-spezifische Bridges, Cliffs, Water-Cliffs testen",
      "TilesetFilenames in Sequence-Overrides auf SNOW prüfen",
    ]
  },
  {
    id: "aot-winter",
    title: "Winter",
    tilesetId: "AOT_WINTER",
    phase: 1,
    meta: [
      { label: "Basis", value: "TD Winter (engine/mods/cnc/tilesets/winter.yaml)" },
      { label: "Templates", value: "146 – unverändert von TD" },
      { label: "Tile-Dateien", value: ".win – aus TD winter.mix / Remaster-Content" },
      { label: "Parallel zu", value: "AOT_SNOW (beide bleiben erhalten)" },
    ],
    milestones: [
      "winter.yaml aus cnchd/tilesets/ als aot-winter.yaml kopieren",
      "Tileset-ID auf AOT_WINTER setzen",

      "TileSets-Eintrag in mod.yaml: cnchd|tilesets/aot-winter.yaml",

    ]
  },
  {

    tilesetId: "AOT_DESERT",
    phase: 1,
    meta: [
      { label: "Basis", value: "TD Desert (engine/mods/cnc/tilesets/desert.yaml)" },
      { label: "Templates", value: "178 – unverändert von TD" },
      { label: "Tile-Dateien", value: ".des – aus TD Remaster-Content" },
      { label: "Hinweis", value: "Kein RA-Äquivalent mit .des-Format vorhanden" },
    ],
    milestones: [
      "desert.yaml aus cnchd/tilesets/ als aot-desert.yaml kopieren",
      "Tileset-ID auf AOT_DESERT setzen",

      "TileSets-Eintrag in mod.yaml: cnchd|tilesets/aot-desert.yaml",

  },
  {
    id: "aot-interior",

      { label: "Benötigt für", value: "5 RA-Kampagnenmissionen (Bunker/Indoor)" },
    ],
    milestones: [
      "RA-Content via ra-classic-content Installer installieren (interior.mix)",

  },

const phase2 = [
  {
    id: "aot-jungle",
    title: "Jungle",
    tilesetId: "AOT_JUNGLE",
    phase: 2,
    meta: [
      { label: "Basis", value: "TD Remastered Jungle (DATA\\ART\\TEXTURES\\SRGB\\TIBERIAN_DAWN\\TERRAIN\\JUNGLE\\)" },
      { label: "Templates", value: "~150+ – vollständig neu zu definieren" },
      { label: "Tile-Dateien", value: ".jun – kein bestehendes YAML in OpenRA" },
      { label: "Aufwand", value: "Hoch – kein Template-YAML vorhanden, alle Tiles manuell kartieren" },
    ],
    milestones: [
      "Remaster-Jungle-DDS-Dateien inventarisieren (welche Tiles existieren?)",
      "TD-Original-Jungle-Tiles (falls .mix vorhanden) als Referenz extrahieren",
      "Template-Struktur anhand Temperate als Vorlage entwickeln",
      "aot-jungle.yaml mit allen Terrain-Typen anlegen",
      "Alle Jungle-Templates definieren (Clear, Tree, Cliff, River, Road, Beach…)",
      "Tileset-ID auf AOT_JUNGLE setzen",
      "RemasteredFilenames für alle DDS-Pfade eintragen",
      "TileSets-Eintrag in mod.yaml eintragen",
      "Im Editor laden und alle Kategorien validieren",
      "Test-Map mit repräsentativen Terrain-Kombinationen",
    ]
  }
];

function uid() { return Math.random().toString(36).slice(2, 8); }

function loadChecks() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return Object.assign({}, DEFAULT_CHECKS, stored);
  } catch { return Object.assign({}, DEFAULT_CHECKS); }
}
function saveChecks(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let checks = loadChecks();

function buildCard(ts) {
  const isPhase2 = ts.phase === 2;
  const checkIds = ts.milestones.map((_, i) => `${ts.id}-ms-${i}`);
  const doneCount = checkIds.filter(id => checks[id]).length;
  const total = checkIds.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;

  const card = document.createElement("div");
  card.className = "card" + (isPhase2 ? " phase2" : "");

  const head = document.createElement("div");
  head.className = "card-head";

  const title = document.createElement("h2");
  title.className = "card-title";
  title.textContent = ts.title;
  head.appendChild(title);

  const badge = document.createElement("span");
  badge.className = "badge " + (isPhase2 ? "phase2" : "id");
  badge.textContent = ts.tilesetId;
  head.appendChild(badge);
  card.appendChild(head);

  const meta = document.createElement("div");
  meta.className = "card-meta";
  ts.meta.forEach(m => {
    const line = document.createElement("div");
    line.innerHTML = `<strong>${m.label}:</strong> ${m.value}`;
    meta.appendChild(line);
  });
  card.appendChild(meta);

  const cl = document.createElement("div");
  cl.className = "checklist";

  const clHeader = document.createElement("div");
  clHeader.className = "checklist-header";
  clHeader.textContent = "Milestones";
  cl.appendChild(clHeader);

  ts.milestones.forEach((text, i) => {
    const id = checkIds[i];
    const row = document.createElement("div");
    row.className = "checklist-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = id;
    cb.checked = !!checks[id];
    cb.onchange = () => {
      checks[id] = cb.checked;
      saveChecks(checks);
      updateProgress(card, checkIds);
    };

    const lbl = document.createElement("label");
    lbl.htmlFor = id;
    lbl.textContent = text;

    row.appendChild(cb);
    row.appendChild(lbl);
    cl.appendChild(row);
  });

  const barWrap = document.createElement("div");
  barWrap.className = "progress-bar-wrap";
  const bar = document.createElement("div");
  bar.className = "progress-bar";
  bar.style.width = pct + "%";
  bar.dataset.checkIds = checkIds.join(",");
  barWrap.appendChild(bar);
  cl.appendChild(barWrap);

  const pLabel = document.createElement("div");
  pLabel.className = "progress-label";
  pLabel.textContent = `${doneCount} / ${total} erledigt`;
  pLabel.dataset.for = ts.id;
  cl.appendChild(pLabel);

  card.appendChild(cl);
  return card;
}

function updateProgress(card, checkIds) {
  const doneCount = checkIds.filter(id => checks[id]).length;
  const total = checkIds.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const bar = card.querySelector(".progress-bar");
  if (bar) bar.style.width = pct + "%";
  const lbl = card.querySelector(".progress-label");
  if (lbl) lbl.textContent = `${doneCount} / ${total} erledigt`;
}

const g1 = document.getElementById("grid-p1");
tilesets.forEach(ts => g1.appendChild(buildCard(ts)));

const g2 = document.getElementById("grid-p2");
phase2.forEach(ts => g2.appendChild(buildCard(ts)));
</script>
