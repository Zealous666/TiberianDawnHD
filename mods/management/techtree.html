<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techtree Editor — Age of Tiberium</title>
<style>
:root {
  --bg: #0f1117;
  --col-bg: #1a1d27;
  --card-bg: #252938;
  --border: #2e3347;
  --text: #d4d8ee;
  --text-dim: #6b7194;
  --blue: #5b8def;
  --blue-bg: #111827;
  --blue-dim: #1e2d50;
  --red: #e05555;
  --red-bg: #1a0f0f;
  --red-dim: #4a1a1a;
  --upgrade: #b06bdb;
  --green: #4caf6a;
  --orange: #e09240;
  --panel-w: 360px;
  --accent: var(--blue);
  --accent-bg: var(--blue-bg);
}
.nod-mode {
  --accent: var(--red);
  --accent-bg: var(--red-bg);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: 42px; }

/* NAV */
.top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; gap: 2px; padding: 6px 16px; background: rgba(15,17,23,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); align-items: center; }
.top-nav a { padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--text-dim); text-decoration: none; transition: color .15s, background .15s; }
.top-nav a:hover { color: var(--text); background: var(--card-bg); }
.top-nav a.active { color: var(--text); background: var(--card-bg); }
.nav-spacer { flex: 1; }
.changes-badge { font-size: 11px; color: var(--orange); margin-right: 8px; display: none; }
.changes-badge.visible { display: inline; }

/* LAYOUT */
.app { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 170px; background: var(--col-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
.search-wrap { padding: 10px 10px 6px; }
.search-wrap input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
.search-wrap input:focus { border-color: var(--accent); }
.sidebar-sep { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
.cat-btn { display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; color: var(--text-dim); border-left: 2px solid transparent; transition: all .13s; font-size: 12px; font-weight: 600; }
.cat-btn:hover { color: var(--text); background: var(--card-bg); }
.cat-btn.active { color: var(--text); border-left-color: var(--accent); background: var(--card-bg); }
.cat-btn .cnt { margin-left: auto; font-size: 10px; color: var(--text-dim); font-weight: 400; }
.sidebar-action { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; color: var(--text-dim); font-size: 11px; border-radius: 0; transition: all .13s; }
.sidebar-action:hover { color: var(--text); background: var(--card-bg); }

/* MAIN */
.main { flex: 1; overflow: auto; }
.tree-wrap { padding: 20px 24px 60px; min-width: 700px; }

/* TIER ROW */
.tier-row { margin-bottom: 28px; }
.tier-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-dim); margin-bottom: 10px;
  border-bottom: 1px solid var(--border); padding-bottom: 5px;
  display: flex; align-items: center; gap: 8px;
}
.tier-pill {
  font-size: 9px; padding: 1px 7px; border-radius: 3px; font-weight: 700;
  border: 1px solid;
}
.tier-pill-0 { border-color: var(--text-dim); color: var(--text-dim); }
.tier-pill-1 { border-color: var(--green); color: var(--green); background: rgba(76,175,106,.07); }
.tier-pill-2 { border-color: var(--orange); color: var(--orange); background: rgba(224,146,64,.07); }
.tier-pill-3 { border-color: var(--red); color: var(--red); background: rgba(224,85,85,.07); }
/* GDI/NOD split */
.faction-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.faction-col-header { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px 4px 0 0; margin-bottom: 6px; border: 1px solid; border-bottom: none; }
.faction-col-header.gdi { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--border)); background: color-mix(in srgb, var(--blue-bg) 60%, var(--bg)); }
.faction-col-header.nod { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); background: color-mix(in srgb, var(--red-bg) 60%, var(--bg)); }
.faction-col { border: 1px solid var(--border); border-radius: 0 0 5px 5px; padding: 8px; min-height: 60px; }
.faction-col.gdi { border-color: color-mix(in srgb, var(--blue) 25%, var(--border)); }
.faction-col.nod { border-color: color-mix(in srgb, var(--red) 25%, var(--border)); }
.cards-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* not-buildable (WIP/placeholder) */
.card.not-buildable { opacity: 0.38; filter: grayscale(0.7); }
.card.not-buildable:hover { opacity: 0.55; }

/* CARD */
.card {
  width: 106px; background: var(--col-bg); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; transition: border-color .13s, box-shadow .13s, transform .1s;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); transform: translateY(-1px); box-shadow: 0 3px 10px #0006; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.card.hidden { display: none; }
.card-icon { width: 100%; aspect-ratio: 4/3; background: var(--bg); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.card-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
.card-icon .no-img { font-size: 9px; color: var(--text-dim); text-align: center; padding: 4px; line-height: 1.4; }
.sprite-badge { position: absolute; top: 3px; right: 3px; font-size: 8px; padding: 1px 4px; border-radius: 2px; font-weight: 700; letter-spacing: .04em; }
.badge-td { background: #0f2010; color: #4fa84f; border: 1px solid #2a4a2a; }
.badge-ra { background: #0f1020; color: #5d7dba; border: 1px solid #1e2d50; }
.badge-ts { background: #1a0f1a; color: #a05dba; border: 1px solid #3a1a3a; }
.changed-dot { position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); border: 1px solid var(--bg); }
.card-info { padding: 5px 7px 7px; }
.card-name { font-size: 10px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-id { font-size: 8px; color: var(--text-dim); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-stats { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.stat-chip { font-size: 8px; padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); }
.stat-chip.cost { color: #f0c040; }
.stat-chip.hp { color: var(--green); }
.stat-chip.pow { color: var(--red); }

/* WEAPONS GRID */
.weapons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 7px; }
.weapon-card { background: var(--col-bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; cursor: pointer; transition: border-color .13s; }
.weapon-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.weapon-card.selected { border-color: var(--accent); }
.weapon-card.hidden { display: none; }
.w-name { font-size: 11px; font-weight: 600; color: var(--text); font-family: monospace; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
.w-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.w-stat { font-size: 10px; color: var(--text-dim); }
.w-stat span { color: var(--text); }
.faction-dot-inline { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot-gdi { background: var(--blue); }
.dot-nod { background: var(--red); }
.dot-both { background: var(--upgrade); }

/* EDIT PANEL */
.panel {
  width: var(--panel-w); background: var(--col-bg); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
  transform: translateX(var(--panel-w)); transition: transform .22s ease;
}
.panel.open { transform: translateX(0); }
.panel-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; }
.ph-text { flex: 1; min-width: 0; }
.p-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-id { font-size: 9px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }
.p-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px 5px; border-radius: 3px; line-height: 1; flex-shrink: 0; }
.p-close:hover { color: var(--text); background: var(--card-bg); }
.panel-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.p-section { display: flex; flex-direction: column; gap: 7px; }
.p-section-title { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.f-row { display: flex; align-items: center; gap: 8px; }
.f-label { font-size: 11px; color: var(--text-dim); width: 68px; flex-shrink: 0; }
.f-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
.f-input:focus { border-color: var(--accent); }
.f-input[readonly] { color: var(--text-dim); cursor: default; }
.f-input.mono { font-family: monospace; font-size: 11px; }
.sprite-row { display: flex; gap: 5px; }
.sprite-opt { flex: 1; padding: 5px 0; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 10px; font-weight: 700; color: var(--text-dim); background: var(--bg); letter-spacing: .04em; cursor: default; user-select: none; }
.sprite-opt.sel-td { border-color: #4fa84f; background: #0f2010; color: #4fa84f; cursor: pointer; }
.sprite-opt.sel-ra { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); cursor: pointer; }
.sprite-opt.sel-ts { border-color: #a05dba; background: #1a0f1a; color: #a05dba; cursor: pointer; }
.sprite-opt.sel-td:hover { filter: brightness(1.3); }
.sprite-opt.sel-ra:hover { filter: brightness(1.3); }
.sprite-opt.sel-ts:hover { filter: brightness(1.3); }

/* Sprite preview popup */
.sprite-popup { position: fixed; z-index: 500; background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 8px 32px #000a; display: none; flex-direction: column; gap: 8px; min-width: 160px; }
.sprite-popup.open { display: flex; }
.sprite-popup-title { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.sprite-popup img { image-rendering: pixelated; max-width: 256px; max-height: 256px; background: #000; border: 1px solid var(--border); border-radius: 3px; object-fit: contain; display: block; }
.sprite-popup-label { font-size: 9px; color: var(--text-dim); font-family: monospace; }
.sprite-popup-close { align-self: flex-end; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 0; line-height: 1; margin-top: -4px; }
.icon-preview-wrap { display: flex; gap: 10px; align-items: flex-start; }
.icon-preview { width: 64px; height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; image-rendering: pixelated; object-fit: contain; display: block; }
.no-icon-box { width: 64px; height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-dim); }
.icon-info { font-size: 10px; color: var(--text-dim); line-height: 1.6; }
.icon-info b { color: var(--text); }
.prereq-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ptag { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); font-family: monospace; color: var(--text-dim); }
.ptag.vis { color: color-mix(in srgb, var(--text-dim) 60%, transparent); border-style: dashed; }
.panel-footer { padding: 11px 14px; border-top: 1px solid var(--border); display: flex; gap: 7px; }
.btn { padding: 6px 13px; border-radius: 5px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .13s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.12); }
.btn-full { flex: 1; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity .18s; }
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal { background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; width: 600px; max-height: 78vh; display: flex; flex-direction: column; }
.modal-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.modal-title { flex: 1; font-weight: 700; font-size: 13px; }
.modal-body { flex: 1; overflow-y: auto; padding: 14px; }
.modal-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: 'Consolas', monospace; font-size: 11px; color: #c0cce8; white-space: pre-wrap; line-height: 1.65; }
.modal-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 7px; justify-content: flex-end; }

/* EMPTY */
.empty { text-align: center; color: var(--text-dim); padding: 50px 24px; font-size: 13px; }
</style>
</head>

  <a href="kanban-board.html">Planning</a>
  <a href="buildorder.html">Build Order</a>
  <a href="techtree.html" class="active">Techtree</a>
  <a href="tilesets.html">Tilesets</a>
  <div class="nav-spacer"></div>
  <span class="changes-badge" id="changesBadge">● Unsaved changes</span>
</nav>

<div class="sprite-popup" id="spritePopup">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <span class="sprite-popup-title" id="spritePopupTitle">Sprite Preview</span>
    <button class="sprite-popup-close" onclick="closeSpritePopup()">✕</button>
  </div>
  <img id="spritePopupImg" src="" alt="">

<div class="app">

  <div class="sidebar">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Search…" oninput="render()">
    </div>
    <hr class="sidebar-sep">
    <div class="cat-btn active" data-cat="main-buildings" onclick="setCategory('main-buildings')">
      🏗 Main Buildings <span class="cnt" id="cnt-main-buildings"></span>
    </div>
    <div class="cat-btn" data-cat="defense" onclick="setCategory('defense')">
      🛡 Defense <span class="cnt" id="cnt-defense"></span>
    </div>
    <div class="cat-btn" data-cat="infantry" onclick="setCategory('infantry')">
      🪖 Infantry <span class="cnt" id="cnt-infantry"></span>
    </div>
    <div class="cat-btn" data-cat="vehicles" onclick="setCategory('vehicles')">
      🚗 Vehicles <span class="cnt" id="cnt-vehicles"></span>
    </div>
    <div class="cat-btn" data-cat="aircraft" onclick="setCategory('aircraft')">
      ✈ Aircraft <span class="cnt" id="cnt-aircraft"></span>
    </div>
    <div class="cat-btn" data-cat="navy" onclick="setCategory('navy')">
      ⚓ Navy <span class="cnt" id="cnt-navy"></span>
    </div>
    <div class="cat-btn" data-cat="upgrades" onclick="setCategory('upgrades')">
      ⬆ Upgrades <span class="cnt" id="cnt-upgrades"></span>
    </div>
    <div class="cat-btn" data-cat="weapons" onclick="setCategory('weapons')">
      💥 Weapons <span class="cnt" id="cnt-weapons"></span>
    </div>
    <hr class="sidebar-sep">
    <div class="sidebar-action" onclick="showAllChanges()">📋 All Changes</div>
    <div class="sidebar-action" onclick="resetChanges()">↩ Reset All</div>
  </div>

  <div class="main">
    <div class="tree-wrap" id="treeWrap"></div>
  </div>

  <div class="panel" id="editPanel">
    <div class="panel-header">
      <div class="ph-text">
        <div class="p-name" id="pName">—</div>

      </div>

    </div>

</div>

  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Generated Prompt</span>
      <button class="btn" onclick="copyPrompt()" style="padding:4px 10px;font-size:11px">Copy</button>
      <button class="p-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body"><pre id="modalPre"></pre></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const BITS = 'bits/';
const ALL_CATS = ['main-buildings','defense','infantry','vehicles','aircraft','navy','upgrades','weapons'];

// ── State ────────────────────────────────────────────────────────────────────
let DATA = { actors: [], weapons: [] };
let category = 'main-buildings';
let selectedId = null;
let changes = {};
let _spritePopupActor = null;

// ── Boot ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('techtree-data.json?' + Date.now());
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch(e) {
    document.getElementById('treeWrap').innerHTML =
      '<div class="empty">Could not load techtree-data.json.<br>Run <code>python3 extract-techtree.py</code> first.</div>';
    return;
  }
  try { const s = localStorage.getItem('aot-techtree-changes'); if (s) changes = JSON.parse(s); } catch(_) {}
  updateCounts();
  render();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function getActors(factionFilter) {
  return DATA.actors.filter(a => {
    if (a.category !== category) return false;
    if (factionFilter === 'gdi' && a.faction === 'nod') return false;
    if (factionFilter === 'nod' && a.faction === 'gdi') return false;
    return true;
  });
}
function getWeapons() { return DATA.weapons; }
function chgVal(id, field) {
  return changes[id]?.[field];
}
function setChange(id, field, value) {
  if (!changes[id]) changes[id] = {};
  changes[id][field] = value;
  localStorage.setItem('aot-techtree-changes', JSON.stringify(changes));
  document.getElementById('changesBadge').classList.add('visible');
}
function hasChange(id) { return !!changes[id] && Object.keys(changes[id]).length > 0; }

// ── Counts ───────────────────────────────────────────────────────────────────
function updateCounts() {
  ALL_CATS.filter(c => c !== 'weapons').forEach(cat => {
    const el = document.getElementById('cnt-' + cat);
    if (el) el.textContent = DATA.actors.filter(a => a.category === cat).length;
  });
  const wEl = document.getElementById('cnt-weapons');
  if (wEl) wEl.textContent = DATA.weapons.length;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  if (category === 'weapons') { renderWeapons(); return; }
  const q = document.getElementById('searchInput').value.toLowerCase();
  const gdiActors = getActors('gdi');
  const nodActors = getActors('nod');

  // group each by tier
  function byTier(actors) {
    const t = {};
    for (const a of actors) (t[a.tier] = t[a.tier] || []).push(a);
    return t;
  }
  const gdiTiers = byTier(gdiActors);
  const nodTiers = byTier(nodActors);
  const allTierKeys = [...new Set([...Object.keys(gdiTiers), ...Object.keys(nodTiers)])].map(Number).sort();

  const wrap = document.getElementById('treeWrap');
  wrap.innerHTML = '';

  const tierNames = ['Age 0 — Base', 'Age 1 — Tiberium Era', 'Age 2 — Advanced', 'Age 3 — Peak'];

  for (const t of allTierKeys) {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label">
      <span class="tier-pill tier-pill-${t}">${t}</span>
      ${tierNames[t] || 'Tier ' + t}
    </div>
    <div class="faction-split">
      <div>
        <div class="faction-col-header gdi">◆ GDI</div>
        <div class="faction-col gdi cards-row" id="tier-${t}-gdi"></div>
      </div>
      <div>
        <div class="faction-col-header nod">◆ NOD</div>
        <div class="faction-col nod cards-row" id="tier-${t}-nod"></div>
      </div>
    </div>`;
    wrap.appendChild(row);

    for (const [fac, tierMap] of [['gdi', gdiTiers], ['nod', nodTiers]]) {
      const col = row.querySelector(`#tier-${t}-${fac}`);
      const list = tierMap[t] || [];
      if (list.length === 0) {
        col.innerHTML = '<span style="font-size:9px;color:var(--text-dim);padding:4px">—</span>';
      }
      for (const a of list) {
        const vis = !q || a.displayName.toLowerCase().includes(q) || a.id.toLowerCase().includes(q);
        col.appendChild(makeCard(a, !vis));
      }
    }
  }
}

function renderWeapons() {
  const weapons = getWeapons();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const wrap = document.getElementById('treeWrap');
  wrap.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'tier-label';
  hdr.style.marginBottom = '12px';
  hdr.innerHTML = `<span class="tier-pill tier-pill-0">W</span> Weapons (${weapons.length})`;
  wrap.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'weapons-grid';
  wrap.appendChild(grid);

  for (const w of weapons) {
    const vis = !q || w.id.toLowerCase().includes(q);
    const s = w.stats;
    const chg = changes[w.id] || {};
    const dmg = chg.damage ?? s.damage;
    const rng = chg.range  ?? s.range;
    const bst = chg.burst  ?? s.burst;
    const rl  = chg.reloadDelay ?? s.reloadDelay;
    const dotCls = w.faction === 'gdi' ? 'dot-gdi' : w.faction === 'nod' ? 'dot-nod' : 'dot-both';
    const el = document.createElement('div');
    el.className = 'weapon-card' + (selectedId === w.id ? ' selected' : '') + (vis ? '' : ' hidden');
    el.onclick = () => selectWeapon(w.id);
    el.innerHTML = `<div class="w-name">
      <span class="faction-dot-inline ${dotCls}"></span>
      ${w.id}${hasChange(w.id) ? '<span style="color:var(--orange);margin-left:4px">●</span>' : ''}
    </div>
    <div class="w-stats">
      ${dmg != null ? `<div class="w-stat">DMG <span>${dmg}</span></div>` : ''}
      ${rng != null ? `<div class="w-stat">RNG <span>${rng}c</span></div>` : ''}
      ${bst > 1    ? `<div class="w-stat">BURST <span>${bst}</span></div>` : ''}
      ${rl  != null ? `<div class="w-stat">RELOAD <span>${rl}</span></div>` : ''}
    </div>`;
    grid.appendChild(el);
  }
}

function makeCard(a, hidden) {
  const div = document.createElement('div');
  div.className = 'card'
    + (hidden ? ' hidden' : '')
    + (selectedId === a.id ? ' selected' : '')
    + (a.notBuildable ? ' not-buildable' : '');
  div.dataset.id = a.id;
  div.onclick = () => selectActor(a.id);

  const sprite  = chgVal(a.id, 'sprite') || a.sprite;
  const cost    = chgVal(a.id, 'cost')  ?? a.stats.cost;
  const hp      = chgVal(a.id, 'hp')    ?? a.stats.hp;
  const power   = chgVal(a.id, 'power') ?? a.stats.power;

  let iconHtml = '';
  if (a.iconFile) {
    iconHtml = `<img src="${BITS}${a.iconFile}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'no-img',textContent:'${a.id}'}))">`;
  } else {
    iconHtml = `<div class="no-img">${a.id}</div>`;
  }

  div.innerHTML = `
    <div class="card-icon">
      ${iconHtml}
      <span class="sprite-badge badge-${sprite}">${sprite.toUpperCase()}</span>
      ${hasChange(a.id) ? '<span class="changed-dot"></span>' : ''}
    </div>
    <div class="card-info">
      <div class="card-name">${a.displayName}</div>
      <div class="card-id">${a.id}</div>
      <div class="card-stats">
        ${cost  != null ? `<span class="stat-chip cost">$${cost}</span>` : ''}
        ${hp    != null ? `<span class="stat-chip hp">${hp >= 1000 ? (hp/1000).toFixed(0)+'k' : hp} HP</span>` : ''}
        ${power ? `<span class="stat-chip pow">${power > 0 ? '+' : ''}${power}⚡</span>` : ''}
      </div>
    </div>`;
  return div;
}

// ── Selection ─────────────────────────────────────────────────────────────────
function selectActor(id) {
  selectedId = id;
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => el.classList.add('selected'));
  const a = DATA.actors.find(x => x.id === id);
  if (a) openActorPanel(a);
}

function selectWeapon(id) {
  selectedId = id;
  renderWeapons();
  const w = DATA.weapons.find(x => x.id === id);
  if (w) openWeaponPanel(w);
}

function closePanel() {
  selectedId = null;
  document.getElementById('editPanel').classList.remove('open');
  document.querySelectorAll('.card.selected,.weapon-card.selected').forEach(el => el.classList.remove('selected'));
}

// ── Actor panel ───────────────────────────────────────────────────────────────
function openActorPanel(a) {
  document.getElementById('pName').textContent = a.displayName;
  document.getElementById('pId').textContent = a.id + ' · ' + a.faction + ' · ' + a.category;

  const chg   = changes[a.id] || {};
  const sprite = chg.sprite || a.sprite;
  const cost  = chg.cost   ?? a.stats.cost;
  const hp    = chg.hp     ?? a.stats.hp;
  const power = chg.power  ?? a.stats.power;
  const weapon= chg.weapon || '';
  const prereqsRaw = chg.prereqsRaw ?? [...a.visibilityPrereqs, ...a.prereqs].join(', ');

  const visTagsHtml = a.visibilityPrereqs.map(p => `<span class="ptag vis">${p}</span>`).join('');
  const buildTagsHtml = a.prereqs.map(p => `<span class="ptag">${p}</span>`).join('');

  const iconHtml = a.iconFile
    ? `<img class="icon-preview" src="${BITS}${a.iconFile}" alt="">`
    : `<div class="no-icon-box">no icon</div>`;

  document.getElementById('panelBody').innerHTML = `
    <div class="p-section">
      <div class="p-section-title">Icon</div>
      <div class="icon-preview-wrap">
        ${iconHtml}
        <div class="icon-info">
          <b>${a.iconFile || '—'}</b><br>
          ${a.customIcon ? 'Custom (bits/)' : 'Standard icon'}<br>
          <span style="color:var(--text-dim)">Edit via bits/ folder</span>
        </div>
      </div>
    </div>

    <div class="p-section">
      <div class="p-section-title">Sprite Source <span style="color:var(--text-dim);font-size:9px;font-weight:400;text-transform:none;letter-spacing:0">(click active to preview)</span></div>
      <div class="sprite-row">
        <div class="sprite-opt ${sprite==='td'?'sel-td':''}" ${sprite==='td'?`onclick="openSpritePopup('${a.id}',this)"`:''}>TD</div>
        <div class="sprite-opt ${sprite==='ra'?'sel-ra':''}" ${sprite==='ra'?`onclick="openSpritePopup('${a.id}',this)"`:''}>RA</div>
        <div class="sprite-opt ${sprite==='ts'?'sel-ts':''}" ${sprite==='ts'?`onclick="openSpritePopup('${a.id}',this)"`:''}>TS</div>
      </div>
    </div>

    <div class="p-section">
      <div class="p-section-title">Stats</div>
      <div class="f-row">
        <span class="f-label">Cost ($)</span>
        <input class="f-input" type="number" value="${cost ?? ''}" placeholder="–"
          oninput="fieldChange('${a.id}','cost',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">HP</span>
        <input class="f-input" type="number" value="${hp ?? ''}" placeholder="–"
          oninput="fieldChange('${a.id}','hp',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">Power</span>
        <input class="f-input" type="number" value="${power ?? 0}"
          oninput="fieldChange('${a.id}','power',this.value)">
      </div>
    </div>

    <div class="p-section">
      <div class="p-section-title">Weapon</div>
      <div class="f-row">
        <span class="f-label">Weapon ID</span>
        <input class="f-input mono" list="wlist" value="${weapon}" placeholder="(not yet parsed per-actor)"
          oninput="fieldChange('${a.id}','weapon',this.value)">
      </div>
      <datalist id="wlist">${DATA.weapons.map(w=>`<option value="${w.id}">`).join('')}</datalist>
    </div>

    <div class="p-section">
      <div class="p-section-title">Prerequisites</div>
      ${visTagsHtml ? `<div style="font-size:9px;color:var(--text-dim);margin-bottom:3px">Visibility (~)</div>
      <div class="prereq-tags">${visTagsHtml}</div>` : ''}
      ${buildTagsHtml ? `<div style="font-size:9px;color:var(--text-dim);margin:5px 0 3px">Build requirements</div>
      <div class="prereq-tags">${buildTagsHtml}</div>` : ''}
      <div class="f-row" style="margin-top:8px">
        <span class="f-label">Edit</span>
        <input class="f-input mono" id="f-prereqs" value="${prereqsRaw}"
          oninput="fieldChange('${a.id}','prereqsRaw',this.value)">
      </div>
      <div style="font-size:9px;color:var(--text-dim);margin-left:76px">Comma-separated. ~ = visibility gate.</div>
    </div>

    <div class="p-section">
      <div class="p-section-title">Info</div>
      <div class="f-row"><span class="f-label">Category</span><input class="f-input" value="${a.category}" readonly></div>
      <div class="f-row"><span class="f-label">Faction</span><input class="f-input" value="${a.faction}" readonly></div>
      <div class="f-row"><span class="f-label">Queue</span><input class="f-input mono" value="${a.queue}" readonly></div>
      <div class="f-row"><span class="f-label">File</span><input class="f-input mono" value="${a.file}" readonly style="font-size:10px"></div>
      <div class="f-row"><span class="f-label">BPO</span><input class="f-input" value="${a.bpo || '—'}" readonly></div>
      <div class="f-row"><span class="f-label">Is Proxy</span><input class="f-input" value="${a.isProxy}" readonly></div>
    </div>
  `;
  document.getElementById('editPanel').classList.add('open');
}

// ── Weapon panel ───────────────────────────────────────────────────────────────
function openWeaponPanel(w) {
  document.getElementById('pName').textContent = w.id;
  document.getElementById('pId').textContent = 'weapon · ' + w.faction;
  const s = w.stats;
  const chg = changes[w.id] || {};

  document.getElementById('panelBody').innerHTML = `
    <div class="p-section">
      <div class="p-section-title">Stats</div>
      <div class="f-row">
        <span class="f-label">Damage</span>
        <input class="f-input" type="number" value="${chg.damage ?? s.damage ?? ''}" placeholder="–"
          oninput="fieldChange('${w.id}','damage',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">Range (c)</span>
        <input class="f-input" type="number" step="0.5" value="${chg.range ?? s.range ?? ''}" placeholder="–"
          oninput="fieldChange('${w.id}','range',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">Burst</span>
        <input class="f-input" type="number" value="${chg.burst ?? s.burst ?? 1}"
          oninput="fieldChange('${w.id}','burst',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">Burst Delays</span>
        <input class="f-input mono" value="${chg.burstDelays ?? s.burstDelays ?? ''}"
          oninput="fieldChange('${w.id}','burstDelays',this.value)">
      </div>
      <div class="f-row">
        <span class="f-label">Reload</span>
        <input class="f-input" type="number" value="${chg.reloadDelay ?? s.reloadDelay ?? ''}" placeholder="ticks"
          oninput="fieldChange('${w.id}','reloadDelay',this.value)">
      </div>
    </div>
    <div class="p-section">
      <div class="p-section-title">Info</div>
      <div class="f-row"><span class="f-label">Inherits</span><input class="f-input mono" value="${w.inherits || '—'}" readonly></div>
      <div class="f-row"><span class="f-label">Faction</span><input class="f-input" value="${w.faction}" readonly></div>
    </div>
    <div class="p-section">
      <div class="p-section-title">Used By</div>
      ${w.usedBy && w.usedBy.length > 0
        ? w.usedBy.map(uid => {
            const a = DATA.actors.find(x => x.id === uid);
            return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
              ${a?.iconFile ? `<img src="${BITS}${a.iconFile}" style="width:32px;height:24px;object-fit:contain;image-rendering:pixelated;background:var(--bg);border:1px solid var(--border);border-radius:2px">` : '<div style="width:32px;height:24px;background:var(--bg);border:1px solid var(--border);border-radius:2px"></div>'}
              <div>
                <div style="font-size:11px;font-weight:600;color:var(--text)">${a?.displayName || uid}</div>
                <div style="font-size:9px;color:var(--text-dim);font-family:monospace">${uid}</div>
              </div>
              <div style="margin-left:auto;cursor:pointer;font-size:10px;color:var(--accent)" onclick="selectActor('${uid}');setCategory('${a?.category||'vehicles'}')">→</div>
            </div>`;
          }).join('')
        : '<div style="font-size:11px;color:var(--text-dim)">Not used by any buildable unit</div>'}
    </div>
  `;
  document.getElementById('editPanel').classList.add('open');
}

// ── Field changes ─────────────────────────────────────────────────────────────
function fieldChange(id, field, value) {
  setChange(id, field, value);
  // Live-update card
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) {
    const a = DATA.actors.find(x => x.id === id);
    if (a) { const nc = makeCard(a, false); nc.classList.add('selected'); card.replaceWith(nc); }
  }
}


// ── Prompt ────────────────────────────────────────────────────────────────────
function generatePrompt() {
  if (!selectedId) return;
  const chg = changes[selectedId];
  const a = DATA.actors.find(x => x.id === selectedId) || DATA.weapons.find(x => x.id === selectedId);
  if (!a) return;

  let text = `Update actor/weapon in YAML:\n\nID: ${selectedId}\nDisplay: ${a.displayName || selectedId}\n`;

  if (!chg || Object.keys(chg).length === 0) {
    text += '\n(No changes recorded yet.)';
  } else {
    text += '\nChanges to apply:\n';
    for (const [k, v] of Object.entries(chg)) text += `  ${k}: ${v}\n`;
    text += '\nSuggested YAML:\n' + buildYaml(selectedId, chg);
  }

  showModal('Generated Prompt — ' + selectedId, text);
}

function buildYaml(id, chg) {
  const lines = [id + ':'];
  if (chg.cost  != null) lines.push('\tValued:\n\t\tCost: ' + chg.cost);
  if (chg.hp    != null) lines.push('\tHealth:\n\t\tHP: '   + chg.hp);
  if (chg.power != null) lines.push('\tPower:\n\t\tAmount: ' + chg.power);
  if (chg.prereqsRaw != null) lines.push('\tBuildable:\n\t\tPrerequisites: ' + chg.prereqsRaw);
  if (chg.damage     != null) lines.push('\t# Warhead → Damage: ' + chg.damage);
  if (chg.range      != null) lines.push('\tRange: ' + (+chg.range).toFixed(1) + 'c0');
  if (chg.burst      != null) lines.push('\tBurst: ' + chg.burst);
  if (chg.reloadDelay!= null) lines.push('\tReloadDelay: ' + chg.reloadDelay);
  if (chg.burstDelays!= null) lines.push('\tBurstDelays: ' + chg.burstDelays);
  return lines.join('\n');
}

function showAllChanges() {
  const ids = Object.keys(changes);
  if (ids.length === 0) { alert('No changes recorded.'); return; }
  let text = `All pending changes (${ids.length} entries):\n\n`;
  for (const id of ids) {
    const a = DATA.actors.find(x=>x.id===id) || DATA.weapons.find(x=>x.id===id);
    text += `── ${id}${a ? ' ('+a.displayName+')' : ''}\n`;
    for (const [k,v] of Object.entries(changes[id])) text += `   ${k}: ${v}\n`;
    text += '\n';
  }
  showModal('All Changes', text);
}

function showModal(title, text) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalPre').textContent = text;
  document.getElementById('modalBg').classList.add('open');
}
function copyPrompt() { navigator.clipboard.writeText(document.getElementById('modalPre').textContent); }
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modalBg')) closeModal(); }

function resetChanges() {
  if (!confirm('Reset all unsaved changes?')) return;
  changes = {};
  localStorage.removeItem('aot-techtree-changes');
  document.getElementById('changesBadge').classList.remove('visible');
  render(); closePanel();
}

// ── Sprite popup ──────────────────────────────────────────────────────────────
function openSpritePopup(actorId, triggerEl) {
  const a = DATA.actors.find(x => x.id === actorId);
  if (!a) return;
  const popup = document.getElementById('spritePopup');
  const img   = document.getElementById('spritePopupImg');
  const label = document.getElementById('spritePopupLabel');
  const title = document.getElementById('spritePopupTitle');

  // prefer idle PNG, fall back to icon PNG
  const previewFile = a.idleFile || a.iconFile;
  if (!previewFile) { alert('No preview PNG available for ' + actorId); return; }

  img.src = BITS + previewFile;
  label.textContent = previewFile + ' · ' + a.sprite.toUpperCase();
  title.textContent = a.displayName + ' — Sprite Preview';
  _spritePopupActor = actorId;

  // position near the trigger element
  const rect = triggerEl.getBoundingClientRect();
  popup.style.display = 'flex'; // measure first
  const pw = popup.offsetWidth || 200;
  const ph = popup.offsetHeight || 160;
  let left = rect.left - pw - 8;
  if (left < 8) left = rect.right + 8;
  let top  = rect.top;
  if (top + ph > window.innerHeight - 8) top = window.innerHeight - ph - 8;
  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';
  popup.classList.add('open');
}

function closeSpritePopup() {
  document.getElementById('spritePopup').classList.remove('open');
  _spritePopupActor = null;
}

// close popup on outside click
document.addEventListener('click', e => {
  const popup = document.getElementById('spritePopup');
  if (popup && popup.classList.contains('open') && !popup.contains(e.target)) {
    const isSpriteTrigger = e.target.classList.contains('sprite-opt') && e.target.classList.contains('sel-td') ||
                            e.target.classList.contains('sel-ra') ||
                            e.target.classList.contains('sel-ts');
    if (!isSpriteTrigger) closeSpritePopup();
  }
});

// ── Nav ───────────────────────────────────────────────────────────────────────
function setCategory(cat) {
  category = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.cat-btn[data-cat="${cat}"]`);
  if (btn) btn.classList.add('active');
  closePanel(); render();
}

init();
</script>
</body>
