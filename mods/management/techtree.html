<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techtree Editor — Age of Tiberium</title>
<style>
:root {
  --bg: #0f1117;
  --col-bg: #1a1d27;
  --card-bg: #252938;
  --border: #2e3347;
  --text: #d4d8ee;
  --text-dim: #6b7194;
  --blue: #5b8def;
  --blue-bg: #111827;
  --blue-dim: #1e2d50;
  --red: #e05555;
  --red-bg: #1a0f0f;
  --red-dim: #4a1a1a;
  --upgrade: #b06bdb;
  --green: #4caf6a;
  --orange: #e09240;
  --accent: var(--blue);
  --accent-bg: var(--blue-bg);
  --nav-h: 38px;
  --cat-h: 40px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  padding-top: calc(var(--nav-h) + var(--cat-h));
}

/* ── TOP NAV (row 1) ────────────────────────────────────────────────────── */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--nav-h);
  display: flex; gap: 2px; padding: 0 16px;
  background: rgba(15,17,23,0.97); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); align-items: center;
}
.top-nav a {
  padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 600;
  letter-spacing: .04em; color: var(--text-dim); text-decoration: none;
  transition: color .15s, background .15s;
}
.top-nav a:hover { color: var(--text); background: var(--card-bg); }
.top-nav a.active { color: var(--text); background: var(--card-bg); }
.nav-spacer { flex: 1; }
.changes-badge { font-size: 11px; color: var(--orange); display: none; margin-right: 6px; }
.changes-badge.visible { display: inline; }
.nav-btn { padding: 4px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .13s; margin-left: 4px; }
.nav-btn:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.top-nav-primary-btn {
  background: #f5c518;
  border: 1px solid #f5c518;
  color: #1a1500;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: filter .15s;
  margin-left: 4px;
}
.top-nav-primary-btn:hover { filter: brightness(1.08); }
.top-nav-primary-btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }

/* ── CAT NAV (row 2) ────────────────────────────────────────────────────── */
.cat-nav {
  position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 190;
  height: var(--cat-h);
  display: flex; align-items: center; gap: 2px; padding: 0 12px;
  background: rgba(26,29,39,0.97); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
}
.cat-btn {
  padding: 5px 11px; border-radius: 5px; cursor: pointer;
  color: var(--text-dim); font-size: 11px; font-weight: 600; letter-spacing: .02em;
  border-bottom: 2px solid transparent; transition: all .13s; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.cat-btn:hover { color: var(--text); background: var(--card-bg); }
.cat-btn.active { color: var(--text); border-bottom-color: var(--accent); background: var(--card-bg); }
.cat-btn .cnt {
  font-size: 9px; color: var(--text-dim); font-weight: 400;
  background: var(--bg); border: 1px solid var(--border);
  padding: 0 4px; border-radius: 3px;
}
.cat-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.cat-nav-end { flex: 1; }
.search-wrap { display: flex; align-items: center; }
.search-wrap input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); padding: 4px 10px; font-size: 12px; outline: none; width: 160px;
}
.search-wrap input:focus { border-color: var(--accent); }
.cat-action {
  padding: 4px 10px; border-radius: 5px; cursor: pointer;
  color: var(--text-dim); font-size: 11px; font-weight: 500; transition: all .13s;
  background: none; border: none; white-space: nowrap;
}
.cat-action:hover { color: var(--text); background: var(--card-bg); }

/* ── MAIN CONTENT ───────────────────────────────────────────────────────── */
.main { flex: 1; overflow: auto; }
.tree-wrap { padding: 20px 24px 60px; }

/* ── TIER ROW ───────────────────────────────────────────────────────────── */
.tier-row { margin-bottom: 80px; }
.tier-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-dim); margin-bottom: 10px;
  border-bottom: 1px solid var(--border); padding-bottom: 5px;
  display: flex; align-items: center; gap: 8px;
}
.tier-pill {
  font-size: 9px; padding: 1px 7px; border-radius: 3px; font-weight: 700; border: 1px solid;
}
.tier-pill-0 { border-color: var(--text-dim); color: var(--text-dim); }
.tier-pill-1 { border-color: var(--green); color: var(--green); background: rgba(76,175,106,.07); }
.tier-pill-2 { border-color: var(--orange); color: var(--orange); background: rgba(224,146,64,.07); }
.tier-pill-3 { border-color: var(--red); color: var(--red); background: rgba(224,85,85,.07); }

/* GDI/NOD split */
.faction-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.faction-col-header {
  font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 4px 4px 0 0; margin-bottom: 0;
  border: 1px solid; border-bottom: none;
}
.faction-col-header.gdi { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--border)); background: color-mix(in srgb, var(--blue-bg) 60%, var(--bg)); }
.faction-col-header.nod { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border)); background: color-mix(in srgb, var(--red-bg) 60%, var(--bg)); }
.faction-col { border: 1px solid var(--border); border-radius: 0 0 5px 5px; padding: 14px 14px 40px; min-height: 90px; }
.faction-col.gdi { border-color: color-mix(in srgb, var(--blue) 25%, var(--border)); }
.faction-col.nod { border-color: color-mix(in srgb, var(--red) 25%, var(--border)); }
.cards-row { display: flex; flex-wrap: wrap; gap: 16px; }

/* ── CARD ───────────────────────────────────────────────────────────────── */
.card.not-buildable { opacity: 0.38; filter: grayscale(0.7); }
.card.not-buildable:hover { opacity: 0.55; }
.card {
  width: 112px; background: var(--col-bg); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; transition: border-color .13s, box-shadow .13s, transform .1s;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); transform: translateY(-1px); box-shadow: 0 3px 10px #0006; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.card.hidden { display: none; }
.card-icon { width: 100%; aspect-ratio: 4/3; background: var(--bg); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.card-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
.card-icon .no-img { font-size: 9px; color: var(--text-dim); text-align: center; padding: 4px; line-height: 1.4; }
.sprite-badge { position: absolute; top: 3px; right: 3px; font-size: 8px; padding: 1px 4px; border-radius: 2px; font-weight: 700; letter-spacing: .04em; }
.badge-td { background: #0f2010; color: #4fa84f; border: 1px solid #2a4a2a; }
.badge-ra { background: #0f1020; color: #5d7dba; border: 1px solid #1e2d50; }
.badge-ts { background: #1a0f1a; color: #a05dba; border: 1px solid #3a1a3a; }
.changed-dot { position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); border: 1px solid var(--bg); }
.card-line-btn { position: absolute; bottom: 3px; right: 3px; width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s, background .15s, color .15s; line-height: 1; padding: 0; z-index: 2; }
.card:hover .card-line-btn { opacity: 1; }
.card-line-btn.active { opacity: 1; background: var(--accent); color: #fff; border-color: var(--accent); }
.card-disable-btn { position: absolute; bottom: 3px; right: 22px; width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.15; transition: opacity .15s, background .15s, color .15s; line-height: 1; padding: 0; z-index: 10; }
.card:hover .card-disable-btn { opacity: 0.7; }
.card-disable-btn.active { opacity: 1 !important; background: #5a1a1a; color: #e26060; border-color: #7a2a2a; }
.card.disabled { display: none; }
body.show-disabled .card.disabled { display: block !important; opacity: 0.25; filter: grayscale(1) brightness(0.5); }
body.show-disabled .card.disabled:hover { opacity: 0.4; transform: none; box-shadow: none; }
body.show-disabled .card.disabled .card-disable-btn { opacity: 1; }
.card-info { padding: 5px 7px 7px; }
.card-name { font-size: 10px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-id { font-size: 8px; color: var(--text-dim); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-stats { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.stat-chip { font-size: 8px; padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); }
.stat-chip.cost { color: #f0c040; }
.stat-chip.hp { color: var(--green); }
.stat-chip.pow { color: var(--red); }

/* ── WEAPONS GRID ───────────────────────────────────────────────────────── */
.weapons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 7px; }
.weapon-card { background: var(--col-bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; cursor: pointer; transition: border-color .13s; }
.weapon-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.weapon-card.selected { border-color: var(--accent); }
.weapon-card.hidden { display: none; }
.w-name { font-size: 11px; font-weight: 600; color: var(--text); font-family: monospace; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
.w-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.w-stat { font-size: 10px; color: var(--text-dim); }
.w-stat span { color: var(--text); }
.faction-dot-inline { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot-gdi { background: var(--blue); }
.dot-nod { background: var(--red); }
.dot-both { background: var(--upgrade); }

/* ── EDIT MODAL ─────────────────────────────────────────────────────────── */
.edit-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 400;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.edit-bg.open { opacity: 1; pointer-events: all; }
.edit-modal {
  background: var(--col-bg); border: 1px solid var(--border); border-radius: 10px;
  width: min(820px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px #000c;
}
.edit-header {
  padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0;
}
.edit-header-text { flex: 1; min-width: 0; }
.edit-h-name { font-size: 16px; font-weight: 700; color: var(--text); }
.edit-h-id { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 2px; }
.edit-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 2px 6px; border-radius: 4px; line-height: 1; flex-shrink: 0; }
.edit-close:hover { color: var(--text); background: var(--card-bg); }
.edit-body {
  flex: 1; overflow-y: auto; padding: 18px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
}
.edit-body.single-col { grid-template-columns: 1fr; }
.p-section { display: flex; flex-direction: column; gap: 7px; }
.p-section-title { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.f-row { display: flex; align-items: center; gap: 8px; }
.f-label { font-size: 11px; color: var(--text-dim); width: 72px; flex-shrink: 0; }
.f-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 5px 8px; font-size: 12px; outline: none; }
.f-input:focus { border-color: var(--accent); }
.f-input[readonly] { color: var(--text-dim); cursor: default; }
.f-input.mono { font-family: monospace; font-size: 11px; }
.sprite-row { display: flex; gap: 5px; }
.sprite-opt { flex: 1; padding: 5px 0; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 10px; font-weight: 700; color: var(--text-dim); background: var(--bg); letter-spacing: .04em; cursor: default; user-select: none; }
.sprite-opt.sel-td { border-color: #4fa84f; background: #0f2010; color: #4fa84f; cursor: pointer; }
.sprite-opt.sel-ra { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); cursor: pointer; }
.sprite-opt.sel-ts { border-color: #a05dba; background: #1a0f1a; color: #a05dba; cursor: pointer; }
.sprite-opt.sel-td:hover, .sprite-opt.sel-ra:hover, .sprite-opt.sel-ts:hover { filter: brightness(1.3); }
.prereq-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ptag { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); font-family: monospace; color: var(--text-dim); }
.ptag.vis { color: color-mix(in srgb, var(--text-dim) 60%, transparent); border-style: dashed; }
.edit-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 7px; justify-content: flex-end; flex-shrink: 0; }
.btn { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .13s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.12); }

/* ── SPRITE INLINE PREVIEW ──────────────────────────────────────────────── */
.sprite-inline-preview { display: none; flex-direction: column; gap: 4px; }
.sprite-inline-preview.visible { display: flex; }
.sprite-inline-preview img { image-rendering: pixelated; display: block; }
.sprite-frame-wrap { width: 128px; height: 96px; background: #000; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.sprite-inline-label { font-size: 9px; color: var(--text-dim); font-family: monospace; }
.icon-preview-wrap { display: flex; gap: 10px; align-items: flex-start; }
.icon-preview { width: 64px; height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; image-rendering: pixelated; object-fit: contain; display: block; }
.no-icon-box { width: 64px; height: 48px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-dim); }
.icon-info { font-size: 10px; color: var(--text-dim); line-height: 1.6; }
.icon-info b { color: var(--text); }

/* ── PROMPT MODAL ───────────────────────────────────────────────────────── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 600; opacity: 0; pointer-events: none; transition: opacity .18s; }
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal { background: var(--col-bg); border: 1px solid var(--border); border-radius: 8px; width: 620px; max-height: 78vh; display: flex; flex-direction: column; }
.modal-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.modal-title { flex: 1; font-weight: 700; font-size: 13px; }
.modal-body { flex: 1; overflow-y: auto; padding: 14px; }
.modal-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: 'Consolas', monospace; font-size: 11px; color: #c0cce8; white-space: pre-wrap; line-height: 1.65; }
.modal-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 7px; justify-content: flex-end; }

/* ── MISC ───────────────────────────────────────────────────────────────── */
.empty { text-align: center; color: var(--text-dim); padding: 50px 24px; font-size: 13px; }
</style>
</head>
<body>

<!-- Row 1: Main nav -->
<nav class="top-nav">
  <a href="kanban-board.html">Planning</a>
  <a href="techtree.html" class="active">Techtree</a>
  <a href="buildorder.html">Build Order</a>
  <a href="tilesets.html">Tilesets</a>
  <div class="nav-spacer"></div>
  <span class="changes-badge" id="changesBadge">● Unsaved changes</span>
  <button class="top-nav-primary-btn" id="genAllBtn" onclick="generateAllPrompt()" disabled>Generate Prompt</button>
</nav>

<!-- Row 2: Category nav -->
<nav class="cat-nav">
  <div class="cat-btn active" data-cat="main-buildings" onclick="setCategory('main-buildings')">🏗 Main <span class="cnt" id="cnt-main-buildings"></span></div>
  <div class="cat-btn" data-cat="defense" onclick="setCategory('defense')">🛡 Defense <span class="cnt" id="cnt-defense"></span></div>
  <div class="cat-btn" data-cat="infantry" onclick="setCategory('infantry')">🪖 Infantry <span class="cnt" id="cnt-infantry"></span></div>
  <div class="cat-btn" data-cat="vehicles" onclick="setCategory('vehicles')">🚗 Vehicles <span class="cnt" id="cnt-vehicles"></span></div>
  <div class="cat-btn" data-cat="aircraft" onclick="setCategory('aircraft')">✈ Aircraft <span class="cnt" id="cnt-aircraft"></span></div>
  <div class="cat-btn" data-cat="navy" onclick="setCategory('navy')">⚓ Navy <span class="cnt" id="cnt-navy"></span></div>
  <div class="cat-btn" data-cat="upgrades" onclick="setCategory('upgrades')">⬆ Upgrades <span class="cnt" id="cnt-upgrades"></span></div>
  <div class="cat-btn" data-cat="weapons" onclick="setCategory('weapons')">💥 Weapons <span class="cnt" id="cnt-weapons"></span></div>
  <div class="cat-sep"></div>
  <button class="cat-action" id="toggleAllLinesBtn" onclick="toggleAllLines()">⋯ Lines: OFF</button>
  <button class="cat-action" id="toggleDisabledBtn" onclick="toggleShowDisabled()">⊘ Show disabled</button>
  <button class="cat-action" onclick="showAllChanges()">📋 Changes</button>
  <button class="cat-action" onclick="resetChanges()">↩ Reset</button>
  <div class="cat-nav-end"></div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search…" oninput="render()">
  </div>
</nav>


<!-- Main content -->
<div class="main">
  <div class="tree-wrap" id="treeWrap"></div>
</div>

<!-- Edit modal (floating centered) -->
<div class="edit-bg" id="editBg" onclick="closeEditOutside(event)">
  <div class="edit-modal" id="editModal">
    <div class="edit-header">
      <div class="edit-header-text">
        <div class="edit-h-name" id="pName">—</div>
        <div class="edit-h-id" id="pId">—</div>
      </div>
      <button class="edit-close" onclick="closePanel()">✕</button>
    </div>
    <div class="edit-body" id="editBody"></div>
    <div class="edit-footer">
      <button class="btn" onclick="closePanel()">Close</button>
      <button class="btn btn-primary" onclick="generatePrompt()">Generate Prompt</button>
    </div>
  </div>
</div>

<!-- Prompt output modal -->
<div class="modal-bg" id="modalBg" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Generated Prompt</span>
      <button class="btn" onclick="copyPrompt()" style="padding:4px 10px;font-size:11px">Copy</button>
      <button class="edit-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body"><pre id="modalPre"></pre></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const BITS = 'bits/';
const ALL_CATS = ['main-buildings','defense','infantry','vehicles','aircraft','navy','upgrades','weapons'];

// ── State ─────────────────────────────────────────────────────────────────
let DATA = { actors: [], weapons: [] };
let category = 'main-buildings';
let selectedId = null;
let changes = {};
let lineEnabled = new Set();  // actor IDs with lines enabled
let globalLinesOn = false;
let showDisabled = false;

// ── Boot ──────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('techtree-data.json?' + Date.now());
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch(e) {
    document.getElementById('treeWrap').innerHTML =
      '<div class="empty">Could not load techtree-data.json.<br>Run <code>python3 extract-techtree.py</code> first.</div>';
    return;
  }
  try { const s = localStorage.getItem('aot-techtree-changes'); if (s) changes = JSON.parse(s); } catch(_) {}
  if (Object.keys(changes).length > 0) {
    document.getElementById('changesBadge').classList.add('visible');
    document.getElementById('genAllBtn').disabled = false;
  }
  updateCounts();
  render();
}

// ── Helpers ───────────────────────────────────────────────────────────────
function getActors(factionFilter) {
  return DATA.actors.filter(a => {
    if (a.category !== category) return false;
    if (factionFilter === 'gdi' && a.faction === 'nod') return false;
    if (factionFilter === 'nod' && a.faction === 'gdi') return false;
    return true;
  });
}
function getWeapons() { return DATA.weapons; }
function chgVal(id, field) { return changes[id]?.[field]; }
function setChange(id, field, value) {
  if (!changes[id]) changes[id] = {};
  changes[id][field] = value;
  localStorage.setItem('aot-techtree-changes', JSON.stringify(changes));
  document.getElementById('changesBadge').classList.add('visible');
  document.getElementById('genAllBtn').disabled = false;
}
function hasChange(id) { return !!changes[id] && Object.keys(changes[id]).length > 0; }

// ── Counts ────────────────────────────────────────────────────────────────
function updateCounts() {
  ALL_CATS.filter(c => c !== 'weapons').forEach(cat => {
    const el = document.getElementById('cnt-' + cat);
    if (el) el.textContent = DATA.actors.filter(a => a.category === cat).length;
  });
  const wEl = document.getElementById('cnt-weapons');
  if (wEl) wEl.textContent = DATA.weapons.length;
}

// ── Connection helpers ────────────────────────────────────────────────────
// Build a map: condition → [actorId] for all actors that provide that condition
function buildProvidesMap() {
  const m = {};
  for (const a of DATA.actors) {
    for (const cond of (a.provides || [])) {
      if (!m[cond]) m[cond] = [];
      m[cond].push(a.id);
    }
  }
  return m;
}

// Build a map: condition → [actorId] for non-upgrade actors that DISAPPEAR when condition is met (~!condition)
// Used to find "base forms" that transform into upgraded variants
function buildNegProvidesMap() {
  const m = {};
  for (const a of DATA.actors) {
    if (a.category === 'upgrades') continue;
    for (const vp of (a.visibilityPrereqs || [])) {
      if (vp.startsWith('~!')) {
        const cond = vp.slice(2);
        if (!m[cond]) m[cond] = [];
        m[cond].push(a.id);
      }
    }
  }
  return m;
}

// For actor A, return all actor IDs that A directly depends on:
//   Type 1 — hard prereqs (must be built first)
//   Type 2 — positive vis-prereqs (~aot-X → the upgrade/building that unlocks X)
//   Type 3 — base-form connection: actor has ~aot-X, find non-upgrade actors with ~!aot-X (they transform INTO this actor)
function getParentIds(actor, providesMap, negProvidesMap) {
  const parents = new Set();

  // Type 1: hard prereqs
  for (const req of actor.prereqs) {
    for (const pid of (providesMap[req] || [])) {
      if (pid !== actor.id) parents.add(pid);
    }
  }

  // Type 2 + 3: visibility prereqs — only for upgrade/progression conditions, not generic queue gates
  for (const vp of (actor.visibilityPrereqs || [])) {
    if (vp.startsWith('~') && !vp.startsWith('~!')) {
      const cond = vp.slice(1);
      if (!cond.endsWith('-upgrade') && !cond.endsWith('-purchased')) continue;
      // Type 2: the upgrade card that provides this condition
      for (const pid of (providesMap[cond] || [])) {
        if (pid !== actor.id) parents.add(pid);
      }
      // Type 3: non-upgrade base units that disappear when this condition is met
      for (const pid of (negProvidesMap[cond] || [])) {
        if (pid !== actor.id) parents.add(pid);
      }
    }
  }

  return [...parents];
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  if (category === 'weapons') { renderWeapons(); clearLines(); return; }
  const q = document.getElementById('searchInput').value.toLowerCase();
  const gdiActors = getActors('gdi');
  const nodActors = getActors('nod');

  function byTier(actors) {
    const t = {};
    for (const a of actors) (t[a.tier] = t[a.tier] || []).push(a);
    // Sort each tier by BPO
    for (const k of Object.keys(t)) t[k].sort((a, b) => a.bpo - b.bpo);
    return t;
  }
  const gdiTiers = byTier(gdiActors);
  const nodTiers = byTier(nodActors);
  const allTierKeys = [...new Set([...Object.keys(gdiTiers), ...Object.keys(nodTiers)])].map(Number).sort();

  const wrap = document.getElementById('treeWrap');
  wrap.innerHTML = '';

  // SVG overlay for connection lines
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'treeSvg';
  svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5';
  wrap.style.position = 'relative';
  wrap.appendChild(svg);

  const tierNames = ['Age 0 — Base', 'Age 1 — Tiberium Era', 'Age 2 — Advanced', 'Age 3 — Peak'];

  for (const t of allTierKeys) {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label">
      <span class="tier-pill tier-pill-${t}">${t}</span>
      ${tierNames[t] || 'Tier ' + t}
    </div>
    <div class="faction-split">
      <div>
        <div class="faction-col-header gdi">◆ GDI</div>
        <div class="faction-col gdi cards-row" id="tier-${t}-gdi"></div>
      </div>
      <div>
        <div class="faction-col-header nod">◆ NOD</div>
        <div class="faction-col nod cards-row" id="tier-${t}-nod"></div>
      </div>
    </div>`;
    wrap.appendChild(row);

    for (const [fac, tierMap] of [['gdi', gdiTiers], ['nod', nodTiers]]) {
      const col = row.querySelector(`#tier-${t}-${fac}`);
      const list = tierMap[t] || [];
      if (list.length === 0) {
        col.innerHTML = '<span style="font-size:9px;color:var(--text-dim);padding:4px">—</span>';
      }
      for (const a of list) {
        const vis = !q || a.displayName.toLowerCase().includes(q) || a.id.toLowerCase().includes(q);
        col.appendChild(makeCard(a, !vis));
      }
    }
  }

  // Draw lines after layout is stable
  requestAnimationFrame(() => requestAnimationFrame(() => drawConnections(svg)));
}

function clearLines() {
  const svg = document.getElementById('treeSvg');
  if (svg) while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function drawConnections(svg) {
  const providesMap = buildProvidesMap();
  const negProvidesMap = buildNegProvidesMap();
  const wrap = document.getElementById('treeWrap');
  const wrapRect = wrap.getBoundingClientRect();

  const visibleActors = DATA.actors.filter(a => a.category === category);

  // Find a card anywhere in the current view (not faction-restricted)
  function findCard(actorId) {
    const el = wrap.querySelector(`.card[data-id="${actorId}"]`);
    return (el && !el.classList.contains('hidden') && !el.classList.contains('disabled')) ? el : null;
  }

  // Both card and wrap scroll together inside .main, so their difference
  // is already scroll-correct — no scroll offset needed.
  function toPos(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left - wrapRect.left, y: r.top - wrapRect.top, w: r.width, h: r.height };
  }

  function drawArrow(x1, y1, x2, y2, color) {
    const dy = y2 - y1;
    const cp = Math.max(40, Math.abs(dy) * 0.5);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${x1},${y1} C${x1},${y1+cp} ${x2},${y2-cp} ${x2},${y2}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.5');
    svg.appendChild(path);
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    tip.setAttribute('points', `${x2-4},${y2-7} ${x2+4},${y2-7} ${x2},${y2}`);
    tip.setAttribute('fill', color);
    svg.appendChild(tip);
  }

  // Precompute parent→children map for this category
  const childrenMap = {};
  for (const actor of visibleActors) {
    for (const pid of getParentIds(actor, providesMap, negProvidesMap)) {
      if (!childrenMap[pid]) childrenMap[pid] = [];
      childrenMap[pid].push(actor.id);
    }
  }

  const drawn = new Set(); // deduplicate lines

  for (const actor of visibleActors) {
    if (!globalLinesOn && !lineEnabled.has(actor.id)) continue;

    const actorEl = findCard(actor.id);
    if (!actorEl) continue;
    const ar = toPos(actorEl);

    const color = actor.faction === 'nod' ? 'rgba(224,85,85,0.55)' : 'rgba(91,141,239,0.55)';

    // Draw lines to parents (things this actor requires/depends on)
    for (const pid of getParentIds(actor, providesMap, negProvidesMap)) {
      const pa = DATA.actors.find(x => x.id === pid);
      if (!pa || pa.category !== category) continue;
      const parentEl = findCard(pid);
      if (!parentEl) continue;
      const key = pid + '→' + actor.id;
      if (drawn.has(key)) continue;
      drawn.add(key);
      const pr = toPos(parentEl);
      drawArrow(pr.x + pr.w/2, pr.y + pr.h, ar.x + ar.w/2, ar.y, color);
    }

    // Draw lines to children (things that depend on this actor)
    for (const cid of (childrenMap[actor.id] || [])) {
      const child = DATA.actors.find(x => x.id === cid);
      if (!child || child.category !== category) continue;
      const childEl = findCard(cid);
      if (!childEl) continue;
      const key = actor.id + '→' + cid;
      if (drawn.has(key)) continue;
      drawn.add(key);
      const cr = toPos(childEl);
      const childColor = child.faction === 'nod' ? 'rgba(224,85,85,0.55)' : 'rgba(91,141,239,0.55)';
      drawArrow(ar.x + ar.w/2, ar.y + ar.h, cr.x + cr.w/2, cr.y, childColor);
    }
  }
}

function cropSpriteFrame(img) {
  const wrap = img.closest('.sprite-frame-wrap');
  if (!wrap) return;
  const frames = parseInt(wrap.dataset.frames) || 1;
  const nw = img.naturalWidth;
  const nh = img.naturalHeight;
  if (!nw || !nh) return;
  if (frames <= 1) {
    // Single frame: fit into 128×96
    img.style.width = '128px';
    img.style.height = '96px';
    img.style.objectFit = 'contain';
    return;
  }
  // Spritesheet: frames laid out horizontally, show frame 0 only
  const frameW = nw / frames;
  const frameH = nh;
  // Scale frame to fit 128×96
  const scale = Math.min(128 / frameW, 96 / frameH);
  img.style.width = (nw * scale) + 'px';
  img.style.height = (frameH * scale) + 'px';
  img.style.imageRendering = 'pixelated';
  img.style.marginLeft = '0';
  // Clip to first frame by wrapping overflow:hidden (already on parent)
}

function toggleCardLines(e, id) {
  e.stopPropagation();
  if (lineEnabled.has(id)) lineEnabled.delete(id);
  else lineEnabled.add(id);
  // Update button appearance on all cards with this id
  document.querySelectorAll(`.card[data-id="${id}"] .card-line-btn`).forEach(btn => {
    btn.classList.toggle('active', lineEnabled.has(id));
  });
  clearLines();
  const svg = ensureSvg();
  requestAnimationFrame(() => requestAnimationFrame(() => drawConnections(svg)));
}

function toggleAllLines() {
  globalLinesOn = !globalLinesOn;
  const btn = document.getElementById('toggleAllLinesBtn');
  btn.textContent = globalLinesOn ? '⋯ Lines: ON' : '⋯ Lines: OFF';
  btn.style.color = globalLinesOn ? 'var(--accent)' : '';
  // Update all card buttons
  document.querySelectorAll('.card-line-btn').forEach(b => b.classList.toggle('active', globalLinesOn));
  clearLines();
  const svg = ensureSvg();
  requestAnimationFrame(() => requestAnimationFrame(() => drawConnections(svg)));
}

function ensureSvg() {
  let svg = document.getElementById('treeSvg');
  if (!svg) {
    const wrap = document.getElementById('treeWrap');
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'treeSvg';
    svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:10';
    wrap.style.position = 'relative';
    wrap.appendChild(svg);
  }
  return svg;
}

function renderWeapons() {
  const weapons = getWeapons();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const wrap = document.getElementById('treeWrap');
  wrap.innerHTML = '';

  const hdr = document.createElement('div');
  hdr.className = 'tier-label';
  hdr.style.marginBottom = '12px';
  hdr.innerHTML = `<span class="tier-pill tier-pill-0">W</span> Weapons (${weapons.length})`;
  wrap.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'weapons-grid';
  wrap.appendChild(grid);

  for (const w of weapons) {
    const vis = !q || w.id.toLowerCase().includes(q);
    const s = w.stats;
    const chg = changes[w.id] || {};
    const dmg = chg.damage ?? s.damage;
    const rng = chg.range  ?? s.range;
    const bst = chg.burst  ?? s.burst;
    const rl  = chg.reloadDelay ?? s.reloadDelay;
    const dotCls = w.faction === 'gdi' ? 'dot-gdi' : w.faction === 'nod' ? 'dot-nod' : 'dot-both';
    const el = document.createElement('div');
    el.className = 'weapon-card' + (selectedId === w.id ? ' selected' : '') + (vis ? '' : ' hidden');
    el.onclick = () => selectWeapon(w.id);
    el.innerHTML = `<div class="w-name">
      <span class="faction-dot-inline ${dotCls}"></span>
      ${w.id}${hasChange(w.id) ? '<span style="color:var(--orange);margin-left:4px">●</span>' : ''}
    </div>
    <div class="w-stats">
      ${dmg != null ? `<div class="w-stat">DMG <span>${dmg}</span></div>` : ''}
      ${rng != null ? `<div class="w-stat">RNG <span>${rng}c</span></div>` : ''}
      ${bst > 1    ? `<div class="w-stat">BURST <span>${bst}</span></div>` : ''}
      ${rl  != null ? `<div class="w-stat">RELOAD <span>${rl}</span></div>` : ''}
    </div>`;
    grid.appendChild(el);
  }
}

function makeCard(a, hidden) {
  const div = document.createElement('div');
  div.className = 'card'
    + (hidden ? ' hidden' : '')
    + (selectedId === a.id ? ' selected' : '')
    + (a.notBuildable ? ' not-buildable' : '')
    + (isDisabled(a) ? ' disabled' : '');
  div.dataset.id = a.id;
  div.onclick = () => selectActor(a.id);

  const sprite = chgVal(a.id, 'sprite') || a.sprite;
  const cost   = chgVal(a.id, 'cost')  ?? a.stats.cost;
  const hp     = chgVal(a.id, 'hp')    ?? a.stats.hp;
  const power  = chgVal(a.id, 'power') ?? a.stats.power;

  const iconHtml = a.iconFile
    ? `<img src="${BITS}${a.iconFile}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'no-img',textContent:'${a.id}'}))">`
    : `<div class="no-img">${a.id}</div>`;

  const lineActive = lineEnabled.has(a.id);
  div.innerHTML = `
    <div class="card-icon">
      ${iconHtml}
      <span class="sprite-badge badge-${sprite}">${sprite.toUpperCase()}</span>
      ${hasChange(a.id) ? '<span class="changed-dot"></span>' : ''}
    </div>
    <div class="card-info">
      <div class="card-name">${a.displayName}</div>
      <div class="card-id">${a.id}</div>
      <div class="card-stats">
        ${cost  != null ? `<span class="stat-chip cost">$${cost}</span>` : ''}
        ${hp    != null ? `<span class="stat-chip hp">${hp >= 1000 ? (hp/1000).toFixed(0)+'k' : hp} HP</span>` : ''}
        ${power ? `<span class="stat-chip pow">${power > 0 ? '+' : ''}${power}⚡</span>` : ''}
      </div>
    </div>
    <button class="card-disable-btn${isDisabled(a) ? ' active' : ''}" title="Mark as disabled/WIP" onclick="toggleDisabled(event,'${a.id}')">⊘</button>
    <button class="card-line-btn${lineActive ? ' active' : ''}" title="Toggle connection lines" onclick="toggleCardLines(event,'${a.id}')">⋯</button>`;
  return div;
}

// ── Selection ──────────────────────────────────────────────────────────────
function selectActor(id) {
  selectedId = id;
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => el.classList.add('selected'));
  const a = DATA.actors.find(x => x.id === id);
  if (a) openActorPanel(a);
}

function selectWeapon(id) {
  selectedId = id;
  renderWeapons();
  const w = DATA.weapons.find(x => x.id === id);
  if (w) openWeaponPanel(w);
}

function closePanel() {
  selectedId = null;
  document.getElementById('editBg').classList.remove('open');
  document.querySelectorAll('.card.selected,.weapon-card.selected').forEach(el => el.classList.remove('selected'));
}

function closeEditOutside(e) {

        <div class="f-row"><span class="f-label">File</span><input class="f-input mono" value="${a.file}" readonly style="font-size:10px"></div>
        <div class="f-row"><span class="f-label">BPO</span><input class="f-input" value="${a.bpo || '—'}" readonly></div>
        <div class="f-row"><span class="f-label">Is Proxy</span><input class="f-input" value="${a.isProxy}" readonly></div>
      </div>
    </div>
  `;
  document.getElementById('editBg').classList.add('open');
}

// ── Weapon panel ───────────────────────────────────────────────────────────
function openWeaponPanel(w) {
  document.getElementById('pName').textContent = w.id;
  document.getElementById('pId').textContent = 'weapon · ' + w.faction;
  const s = w.stats;
  const chg = changes[w.id] || {};

  document.getElementById('editBody').className = 'edit-body';
  document.getElementById('editBody').innerHTML = `
    <!-- Left: Stats + Info -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="p-section">
        <div class="p-section-title">Stats</div>
        <div class="f-row">
          <span class="f-label">Damage</span>
          <input class="f-input" type="number" value="${chg.damage ?? s.damage ?? ''}" placeholder="–"
            oninput="fieldChange('${w.id}','damage',this.value)">
        </div>
        <div class="f-row">
          <span class="f-label">Range (c)</span>
          <input class="f-input" type="number" step="0.5" value="${chg.range ?? s.range ?? ''}" placeholder="–"
            oninput="fieldChange('${w.id}','range',this.value)">
        </div>
        <div class="f-row">
          <span class="f-label">Burst</span>
          <input class="f-input" type="number" value="${chg.burst ?? s.burst ?? 1}"
            oninput="fieldChange('${w.id}','burst',this.value)">
        </div>
        <div class="f-row">
          <span class="f-label">Burst Delays</span>
          <input class="f-input mono" value="${chg.burstDelays ?? s.burstDelays ?? ''}"
            oninput="fieldChange('${w.id}','burstDelays',this.value)">
        </div>
        <div class="f-row">
          <span class="f-label">Reload</span>
          <input class="f-input" type="number" value="${chg.reloadDelay ?? s.reloadDelay ?? ''}" placeholder="ticks"
            oninput="fieldChange('${w.id}','reloadDelay',this.value)">
        </div>
      </div>
      <div class="p-section">
        <div class="p-section-title">Info</div>
        <div class="f-row"><span class="f-label">Inherits</span><input class="f-input mono" value="${w.inherits || '—'}" readonly></div>
        <div class="f-row"><span class="f-label">Faction</span><input class="f-input" value="${w.faction}" readonly></div>
      </div>
    </div>

    <!-- Right: Used By -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="p-section">
        <div class="p-section-title">Used By</div>
        ${w.usedBy && w.usedBy.length > 0
          ? w.usedBy.map(uid => {
              const a = DATA.actors.find(x => x.id === uid);
              return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)">
                ${a?.iconFile ? `<img src="${BITS}${a.iconFile}" style="width:32px;height:24px;object-fit:contain;image-rendering:pixelated;background:var(--bg);border:1px solid var(--border);border-radius:2px">` : '<div style="width:32px;height:24px;background:var(--bg);border:1px solid var(--border);border-radius:2px"></div>'}
                <div>
                  <div style="font-size:11px;font-weight:600;color:var(--text)">${a?.displayName || uid}</div>
                  <div style="font-size:9px;color:var(--text-dim);font-family:monospace">${uid}</div>
                </div>
                <div style="margin-left:auto;cursor:pointer;font-size:10px;color:var(--accent)" onclick="selectActor('${uid}');setCategory('${a?.category||'vehicles'}')">→</div>
              </div>`;
            }).join('')
          : '<div style="font-size:11px;color:var(--text-dim)">Not used by any buildable unit</div>'}
      </div>
    </div>
  `;
  document.getElementById('editBg').classList.add('open');
}

// ── Disabled actors ───────────────────────────────────────────────────────
function isDisabled(a) {
  const raw = changes[a.id]?.prereqsRaw ?? [...a.visibilityPrereqs, ...a.prereqs].join(', ');
  return raw.split(',').map(s => s.trim()).includes('~disabled');
}

function toggleDisabled(e, id) {
  e.stopPropagation();
  const a = DATA.actors.find(x => x.id === id);
  if (!a) return;
  const raw = changes[id]?.prereqsRaw ?? [...a.visibilityPrereqs, ...a.prereqs].join(', ');
  const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
  const idx = parts.indexOf('~disabled');
  if (idx !== -1) parts.splice(idx, 1);
  else parts.push('~disabled');
  fieldChange(id, 'prereqsRaw', parts.join(', '));
  render();
}

function toggleShowDisabled() {
  showDisabled = !showDisabled;
  document.body.classList.toggle('show-disabled', showDisabled);
  const btn = document.getElementById('toggleDisabledBtn');
  btn.textContent = showDisabled ? '⊘ Hide disabled' : '⊘ Show disabled';
  btn.style.color = showDisabled ? 'var(--red)' : '';
  render();
}

// ── Tech Level dropdown ───────────────────────────────────────────────────
function techLevelChange(id, age) {
  const input = document.getElementById('f-prereqs');
  let raw = input ? input.value : (changes[id]?.prereqsRaw ?? '');
  // Remove any existing ~aot-age1/2/3 entry
  raw = raw.split(',').map(s => s.trim()).filter(s => !/^~aot-age[123]$/.test(s)).join(', ');
  if (age) {
    raw = raw ? raw + ', ~aot-age' + age : '~aot-age' + age;
  }
  if (input) input.value = raw;
  fieldChange(id, 'prereqsRaw', raw);
}

// ── Field changes ──────────────────────────────────────────────────────────
function fieldChange(id, field, value) {
  setChange(id, field, value);
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) {
    const a = DATA.actors.find(x => x.id === id);
    if (a) { const nc = makeCard(a, false); nc.classList.add('selected'); card.replaceWith(nc); }
  }
}

// ── Prompt ────────────────────────────────────────────────────────────────
function generatePrompt() {
  if (!selectedId) return;
  const chg = changes[selectedId];
  const a = DATA.actors.find(x => x.id === selectedId) || DATA.weapons.find(x => x.id === selectedId);
  if (!a) return;

  let text = `Update actor/weapon in YAML:\n\nID: ${selectedId}\nDisplay: ${a.displayName || selectedId}\n`;
  if (!chg || Object.keys(chg).length === 0) {
    text += '\n(No changes recorded yet.)';
  } else {
    text += '\nChanges to apply:\n';
    for (const [k, v] of Object.entries(chg)) text += `  ${k}: ${v}\n`;
    text += '\nSuggested YAML:\n' + buildYaml(selectedId, chg);
  }
  showModal('Generated Prompt — ' + selectedId, text);
}

function buildYaml(id, chg) {
  const lines = [id + ':'];
  if (chg.cost  != null) lines.push('\tValued:\n\t\tCost: ' + chg.cost);
  if (chg.hp    != null) lines.push('\tHealth:\n\t\tHP: '   + chg.hp);
  if (chg.power != null) lines.push('\tPower:\n\t\tAmount: ' + chg.power);
  if (chg.prereqsRaw != null) lines.push('\tBuildable:\n\t\tPrerequisites: ' + chg.prereqsRaw);
  if (chg.damage     != null) lines.push('\t# Warhead → Damage: ' + chg.damage);
  if (chg.range      != null) lines.push('\tRange: ' + (+chg.range).toFixed(1) + 'c0');
  if (chg.burst      != null) lines.push('\tBurst: ' + chg.burst);
  if (chg.reloadDelay!= null) lines.push('\tReloadDelay: ' + chg.reloadDelay);
  if (chg.burstDelays!= null) lines.push('\tBurstDelays: ' + chg.burstDelays);
  return lines.join('\n');
}

function showAllChanges() {
  const ids = Object.keys(changes);
  if (ids.length === 0) { alert('No changes recorded.'); return; }
  let text = `All pending changes (${ids.length} entries):\n\n`;
  for (const id of ids) {
    const a = DATA.actors.find(x=>x.id===id) || DATA.weapons.find(x=>x.id===id);
    text += `── ${id}${a ? ' ('+a.displayName+')' : ''}\n`;
    for (const [k,v] of Object.entries(changes[id])) text += `   ${k}: ${v}\n`;
    text += '\n';
  }
  showModal('All Changes', text);
}

function showModal(title, text) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalPre').textContent = text;
  document.getElementById('modalBg').classList.add('open');
}
function copyPrompt() { navigator.clipboard.writeText(document.getElementById('modalPre').textContent); }
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modalBg')) closeModal(); }

function resetChanges() {
  if (!confirm('Reset all unsaved changes?')) return;
  changes = {};
  localStorage.removeItem('aot-techtree-changes');
  document.getElementById('changesBadge').classList.remove('visible');
  document.getElementById('genAllBtn').disabled = true;
  render(); closePanel();
}

function generateAllPrompt() {
  const ids = Object.keys(changes);
  if (ids.length === 0) { alert('No changes recorded.'); return; }

  let text = `Please apply the following changes to the Age of Tiberium mod YAML files.\n`;
  text += `Each entry lists the actor/weapon ID, display name, and the fields to change.\n\n`;
  text += `${'─'.repeat(60)}\n\n`;

  for (const id of ids) {
    const chg = changes[id];
    if (!chg || Object.keys(chg).length === 0) continue;
    const entry = DATA.actors.find(x => x.id === id) || DATA.weapons.find(x => x.id === id);
    const name = entry?.displayName || id;
    const file = entry?.file || '?';
    text += `ID: ${id}\nName: ${name}\nFile: ${file}\n`;
    text += `Changes:\n`;
    for (const [k, v] of Object.entries(chg)) text += `  ${k}: ${v}\n`;
    text += `\nSuggested YAML:\n${buildYaml(id, chg)}\n\n`;
    text += `${'─'.repeat(60)}\n\n`;
  }

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('genAllBtn');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.color = 'var(--green)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 2000);
  }).catch(() => showModal('All Changes — Prompt', text));
}

// ── Nav ────────────────────────────────────────────────────────────────────
function setCategory(cat) {
  category = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.cat-btn[data-cat="${cat}"]`);
  if (btn) btn.classList.add('active');
  closePanel(); render();
}

init();

// Redraw connection lines on scroll so they stay aligned with cards
(function() {
  let scrollRaf = null;
  function onScroll() {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = null;
      if (!globalLinesOn && lineEnabled.size === 0) return;
      const svg = document.getElementById('treeSvg');
      if (!svg) return;
      clearLines();
      drawConnections(svg);
    });
  }
  // Attach after DOM is ready
  document.addEventListener('DOMContentLoaded', () => {
    const main = document.querySelector('.main');
    if (main) main.addEventListener('scroll', onScroll, { passive: true });
  });
  // Also attach immediately in case DOMContentLoaded already fired
  const main = document.querySelector('.main');
  if (main) main.addEventListener('scroll', onScroll, { passive: true });
})();
</script>
</body>
