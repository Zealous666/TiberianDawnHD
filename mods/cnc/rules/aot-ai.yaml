	# =========================================================================
	# AoT OPERATIONS FRAMEWORK (2026-07-21) — Militär/Missionen
	# Modul 1 Starting Units (1:1-Port des ABGENOMMENEN Choke-Verhaltens + ARCO-
	# Raid; Choke bleibt nach Abmarsch LEER — User-Entscheidung), Modul 2 Regular
	# Waves (75% Kern / 25% adaptiv, Budget +25%/Welle, GDI-Rückzug 75% Stückzahl),
	# Modul 3 Scouts (2 leichte Fahrzeuge, 50% Spawn-Abdeckung), Modul 4 Derrick-
	# Engineer-Squads (v19 einnehmen, 10-min-Check, permanente Wache).
	# Varianten-Ketten enthalten ALLE Ausschluss-Zweige (beste zuerst) —
	# die erste AKTUELL BAUBARE Variante gewinnt.
	# =========================================================================
	AotMapIntelBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		GroundLocomotor: foot
		ArcoTypes: arco
		DerrickTypes: v19
		CrateTypes: oilcrate1000

	AotOperationsBotModule@gdi:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: gdi
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		ExcludeFromOpsTypes: aot-harv, aot-harv-nod, aot-mcv-age0, aot-mcv-age1, aot-surveyor-gdi, aot-surveyor-nod, oret, aot-oret-lite, aot-minelayer, aot-aray, aot-mgap, aot-mstealth, aot-subapc, truck, mcv
		ChokepointReserveSize: 4
		ChokepointHoldRadius: 4
		ChokeClearRadius: 5
		ChokeClearExcludeTypes: aot-ore-mine, arco, v19
		WaveTankTypes: aot-mtnk-titn-rail, aot-mtnk-titn, aot-mtnk-rail, aot-mtnk-pred, aot-mtnk-base
		WaveLightTypes: aot-jeep-wolverine, aot-jeep-humvee, aot-apc-amphibious, aot-jeep-base
		WaveSupportTypes: aot-jugg, aot-msam-hover-mlrs, aot-msam-hover-aa
		WaveTankShare: 60
		WaveLightShare: 25
		WaveSupportShare: 15
		WaveRetreatLossPercent: 75
		AntiInfantryTypes: aot-jeep-wolverine, aot-jeep-humvee, aot-jeep-base
		AntiTankTypes: aot-htnk-laser, aot-htnk-rocket, aot-htnk-base, aot-mtnk-rail, aot-mtnk-pred, aot-mtnk-base
		AntiAirTypes: aot-msam-hover-aa
		# Naval ferry (User 2026-07-21): if there is no ground route to the enemy, a wave builds/
		# reuses 2 Hovercraft once the Shipyard exists, ferries itself across water in batches
		# (1 vehicle per transport), regroups on the far shore, then continues the attack.
		NavalProductionTypes: aot-shipyard
		FerryTypes: aot-transport-hover-proxy
		FerryCount: 2
		ScoutTypes: aot-jeep-base, aot-jeep-humvee, aot-jeep-wolverine, aot-apc-amphibious
		DerrickMaxTargets: 2
		EngineerTypes: aot-e6-gdi
		RocketInfantryTypes: aot-e3-gdi
		MgInfantryTypes: aot-e1-gdi

	AotOperationsBotModule@nod:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: nod
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		ExcludeFromOpsTypes: aot-harv, aot-harv-nod, aot-mcv-age0, aot-mcv-age1, aot-surveyor-gdi, aot-surveyor-nod, oret, aot-oret-lite, aot-minelayer, aot-aray, aot-mgap, aot-mstealth, aot-subapc, truck, mcv
		ChokepointReserveSize: 4
		ChokepointHoldRadius: 4
		ChokeClearRadius: 5
		ChokeClearExcludeTypes: aot-ore-mine, arco, v19
		WaveTankTypes: aot-ttnk-toxin, aot-ttnk-flame, aot-ltnk-tick, aot-ltnk-laser, aot-ttnk-base, aot-ltnk-base
		WaveLightTypes: aot-bike-laser, aot-bggy-laser, aot-bike-base, aot-bggy-base
		WaveSupportTypes: aot-arty-heavy, aot-arty-howitzer, aot-v2-napalm, aot-v2-toxic, aot-v2-base
		WaveTankShare: 50
		WaveLightShare: 30
		WaveSupportShare: 20
		WaveRetreatLossPercent: 0
		AntiInfantryTypes: aot-ttnk-flame, aot-v2-napalm, aot-bggy-laser, aot-bggy-base
		AntiTankTypes: aot-ltnk-tick, aot-ltnk-laser, aot-ltnk-base, aot-ttnk-base
		# Naval ferry (User 2026-07-21): if there is no ground route to the enemy, a wave builds/
		# reuses 2 Transport Vessels once the Sub Pen exists, ferries itself across water in
		# batches (1 vehicle per transport), regroups on the far shore, then continues the attack.
		NavalProductionTypes: aot-subpen
		FerryTypes: aot-transport-base, aot-transport-gun-proxy
		FerryCount: 2
		# Bike/Buggy need ~aot-age1 -> not buildable in Age 0. Scout squad is a 3-man
		# infantry mix instead (User 2026-07-21): 1 MG (Role A) + 1 Rocket (Role B) +
		# 1 Flame Trooper (Role C, falls back to the toxic variant post-Age3).
		ScoutTypes: aot-e1-nod
		ScoutRoleBTypes: aot-e3-nod
		ScoutRoleCTypes: aot-e4-nod-flame, aot-e4-nod-toxic
		DerrickMaxTargets: 2
		EngineerTypes: aot-e6-nod
		RocketInfantryTypes: aot-e3-nod
		MgInfantryTypes: aot-e1-nod


