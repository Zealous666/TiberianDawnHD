			aot-nuk2-age2: 6
			# --- Raffinerie ---
			proc: 10
			aot-proc-gdi: 8
			aot-proc-gdi-age2: 6
			aot-proc-nod: 8
			aot-proc-nod-age2: 6
			# --- Silo (früh wichtig: ORET-Ablieferdock UND Erz-Lager; ohne Silo
