	# =========================================================================
	# EINHEITENBAU — alle Einheiten-Queues inkl. Light/Elite/Jets/Naval/Starport
	# =========================================================================
	UnitBuilderBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		ProductionMinCashRequirement: 300
		# NUR NOCH IBotRequestUnitProduction-KANAL (2026-07-22): Kampfeinheiten produziert das
		# AotOperationsBotModule EXKLUSIV für seine Missionen (User-Entscheidung; verhindert
		# Idle-Stau auf den Bau-Slots). Harvester (HarvesterBotModule@aot) und Ore-Transporter
		# (AotReplacementUnitBotModule@oret) haben eigene dynamische Ersatz-Module und wurden
		# aus UnitLimits/UnitsToBuild unten entfernt, um Doppel-Produktion zu vermeiden — diese
		# Instanz bedient nur noch deren IBotRequestUnitProduction-Anfragen + MCV-Expansion.
		# Luft/Marine ruhen bis Modul 9/13 des Ops-Frameworks.
		UnitQueues: Vehicle.GDI, Starport, LightVehicle.GDI, LightVehicle.Nod
		UnitLimits:
			aot-mcv-age0: 1
			aot-mcv-age1: 1
			# aot-harv/aot-harv-nod and aot-oret-lite REMOVED (User 2026-07-22): both are now handled
			# EXCLUSIVELY by their own dedicated, dynamic replacement modules (HarvesterBotModule@aot for
			# HARV -- ties count to alive Refineries, already correct and was silently duplicated by this
			# static entry; AotReplacementUnitBotModule@oret for ORET -- ties count to alive FACTs, since
			# MCVs are unbounded in this mod so no static number here could ever track that correctly).
			# Both request production through the SAME IBotRequestUnitProduction channel this queue serves,
			# entirely independent of these UnitLimits/UnitsToBuild entries -- leaving them here just let
			# this module ALSO proactively over-build both units on top of the correct dynamic replacement,
			# via a completely separate, refinery/FACT-count-unaware static ceiling.
		UnitsToBuild:

	# =========================================================================
	# EXPANSION (klassische mcv)
	# =========================================================================
	McvExpansionManagerBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		# mcv = Start-MCV (BaseActor in aot-world.yaml StartingUnits, transformiert -> fact).
		# aot-mcv-age0/1 = baubare Expansions-MCVs. ALLE drei müssen hier stehen,
		# sonst wird der Start-MCV nie deployt -> kein Construction Yard -> KI tot.
		McvTypes: mcv, aot-mcv-age0, aot-mcv-age1
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		McvFactoryTypes: aot-lite-gdi, aot-lite-nod
		# Con-Yard NIE wieder einpacken/umziehen (verursachte Folgeprobleme). -1 = aus.
		MoveConyardTick: -1
		MinimumConstructionYardCount: 1
		# 0 (User 2026-07-22): eine zweite FACT wird von AotBasePlannerBotModule/AotBaseBuilderBotModule
		# nicht mitgeplant -- die haben nur EINEN Rhythmus fuer die Start-Yard. Eine unerwartete zweite
		# FACT ausserhalb dieser Planung fuehrte u.a. zu einem Folgebug beim ORET-Ersatzmodul (mehrere
		# Ore Transporter kurz hintereinander). Basis-Expansion ist ein spaeteres, eigenes Thema -- bis
		# dahin bleibt es bei der einen Start-Yard.
		AdditionalConstructionYardCount: 0

