# =============================================================================
# Age of Tiberium — KI-Neuanpassung (Phase A, reines YAML)
# =============================================================================
# Ersetzt die Vanilla-Bot-Module aus engine/mods/cnc/rules/ai.yaml vollständig.
# Muss in mod.yaml NACH cnchd|rules/overrides.yaml + aot-*.yaml geladen werden.
#
# Konzept + Analyse: memory/ai-system.md. Intelligentes Tuning: memory/ai-tuning-todo.md.
#
# Struktur:
#   - Vanilla-Instanzen (@cabal/@watson/@hal9001) werden entfernt.
#   - ModularBot + GrantConditionOnBotOwner bleiben aus ai.yaml erhalten.
#   - Neue geteilte Module (@aot) für alle 3 Persönlichkeiten (RequiresCondition
#     deckt alle drei ab). Difficulty-Differenzierung = Phase C.
#
# WICHTIG — Mod-Muster: baubar sind die aot-*-ageN / aot-*-faction Aktoren.
# Age-Varianten stehen ALLE in den Fractions; nur die aktuell gültige (per
# ~aot-ageN Prerequisite) wird tatsächlich gebaut.
# =============================================================================

Player:
	# --- Vanilla-Module entfernen (aus engine ai.yaml) ---
	-SupportPowerBotModule:
	-HarvesterBotModule:
	-ResourceMapBotModule:
	-BuildingRepairBotModule:
	-BaseBuilderBotModule@cabal:
	-BaseBuilderBotModule@watson:
	-BaseBuilderBotModule@hal9001:
	-SquadManagerBotModule@cabal:
	-SquadManagerBotModule@watson:
	-SquadManagerBotModule@hal9001:
	-UnitBuilderBotModule@cabal:
	-UnitBuilderBotModule@watson:
	-UnitBuilderBotModule@hal9001:
	-McvExpansionManagerBotModule@cabal:
	-McvExpansionManagerBotModule@watson-hal9001:

	# =========================================================================
	# WIRTSCHAFT
	# =========================================================================
	HarvesterBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		HarvesterTypes: aot-harv, aot-harv-nod
		RefineryTypes: proc, aot-proc-gdi, aot-proc-gdi-age2, aot-proc-nod, aot-proc-nod-age2
		InitialHarvesters: 2

	# ORET (Ore Transporter): mirrors HarvesterBotModule's own count-vs-reference-building replacement
	# logic (User 2026-07-22: "genau wie bei HARV, nur zerstoerte nachkaufen, an FACT-Anzahl gekoppelt")
	# -- but ORET has no Harvester trait (OreTransporter/DockClientManager instead), so it can't just be a
	# second HarvesterBotModule instance (that indexes actors by the Harvester trait specifically, would
	# match zero ORET). AotReplacementUnitBotModule is the same pattern generalised: 1 ORET per alive FACT,
	# requested ONLY when the current count drops below that (i.e. one was actually destroyed) -- MCVs are
	# unbounded in this mod (age variants are just a sprite/proxy swap, not a hard cap), so a static
	# UnitLimits number can never track the true FACT count; this ties to it directly instead.
	AotReplacementUnitBotModule@oret:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		UnitTypes: aot-oret-lite
		ReferenceBuildingTypes: fact, fact.gdi, fact.nod

	ResourceMapBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		ResourceCreatorTypes: split2, split3, splitblue
		ValuableResourceTypes: Tiberium, BlueTiberium
		HarvesterTypes: aot-harv, aot-harv-nod
		RefineryTypes: proc, aot-proc-gdi, aot-proc-gdi-age2, aot-proc-nod, aot-proc-nod-age2
		EnemyBaseBuildingTypes: fact, aot-lite-gdi, aot-lite-nod, weap, afld, aot-pyle-age0, aot-pyle-age1, aot-pyle-age2, aot-hand-age0, aot-hand-age1, aot-hand-age2, aot-atec-age0, aot-atec-age1, aot-atec-age2, aot-stec-age0, aot-stec-age1, aot-stec-age2, aot-tmpl-age1, aot-tmpl-age2, aot-shrine, orbc

	BuildingRepairBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai

	# =========================================================================
	# BASE-PLANNER (2026-07-20, User-Masterkonzept): flutet die Base-TASCHE (Yard
	# bis Gates, begrenzt durch Klippen/Wasser/Actors, Pfad-Cap), versiegelt die
	# Gates, packt das KOMPLETTE Base-Layout hinein (eingezäunte Power-Cluster,
	# Paare, Lückenfüller, Stealth-Spread) und speichert Plan + Bau-RHYTHMUS für
	# das ganze Match. Main-Gate = Chokepoint (Squads), alle Gates = Approaches.
	# Varianten-Listen sind AGE-GEORDNET: der Builder nimmt die aktuell baubare.
	# =========================================================================
	AotBasePlannerBotModule@nod:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: nod
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		# Kept in sync with AotOperationsBotModule@nod's ChokeClearRadius below (User 2026-08-01): the
		# gate-defence cluster search stops treating trees within this radius of the primary choke as
		# blocking, since ClearNearbyObstacles bulldozes exactly this radius at runtime.
		TreeClearRadius: 5
		OreMineTypes: aot-ore-mine
		NukeTypes: aot-nuke-age0, aot-nuke-age1, aot-nuke-age2-nod
		Nuk2Types: aot-nuk2-age0, aot-nuk2-age1, aot-nuk2-age2
		SiloTypes: aot-silo-age0, aot-silo-age1, aot-silo-age2
		LiteTypes: aot-lite-nod
		HandTypes: aot-hand-age0, aot-hand-age1, aot-hand-age2
		RadarTypes: aot-nod-radar-age0, aot-nod-radar-age1, aot-nod-radar-age2
		StecTypes: aot-stec-age0, aot-stec-age1, aot-stec-age2
		FixTypes: aot-fix-age0, aot-fix-age1-nod, aot-fix-age2-nod
		HpadTypes: aot-hpad-nod
		ProcTypes: aot-proc-nod, aot-proc-nod-age2
		TmplTypes: aot-tmpl-age1, aot-tmpl-age2
		MsloTypes: aot-mslo-age1, aot-mslo-age2
		ShrineTypes: aot-shrine
		SgenTypes: aot-sgen
		AfldTypes: afld
		FturTypes: aot-ftur-flame, aot-ftur-toxic
		GunTypes: aot-gun-base, aot-gun-laser
		SamTypes: sam
		ObeliskTypes: obli
		WallTypes: aot-wall-nod
		# Blossom-Tree-Actors (Tiberium-Wachstumsquellen, ^TibTree in defaults.yaml) — Plan hält
		# GrowthSourceMargin Zellen Abstand, damit nachwachsendes Erz die Base-Zellen nicht überwuchert.
		GrowthSourceTypes: split2, split3, splitblue
		# Sub Pen: KEIN Rhythmus-Schritt mehr (User-Spec 2026-07-22) — wird jetzt on-demand vom
		# AotBaseBuilderBotModule gebaut, sobald eine Operation sie via RequestNavalProduction()
		# anfordert (siehe NavalPenTypes unten). Funktioniert dadurch auch, wenn die Base-Tasche
		# selbst nicht an Wasser grenzt (Wall-Bridge zur nächsten erreichbaren Küste).

	# GDI bekommt später eine EIGENE Instanz (@gdi) mit eigener Build-Order.
	# Executor: baut den gespeicherten Plan im Rhythmus des Planners — ein Bau zur
	# Zeit, Wall-Bridge entlang des PFADS bei Unerreichbarkeit (danach Verkauf),
	# Age-Gates warten natürlich, zerstörte Plan-Gebäude werden periodisch erkannt
	# und in Rhythmus-Reihenfolge neu gebaut.
	AotBaseBuilderBotModule@nod:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: nod
		BuildingQueues: Building.Nod
		WallType: aot-wall-nod
		MinimumExcessPower: 10
		# On-demand naval production (User-Spec 2026-07-22): NICHT Teil des Rhythmus. Wird nur gebaut,
		# wenn eine Operation sie via Ops.RequestNavalProduction() anfordert (z.B. ein Wave-Ferry ohne
		# Landweg zum Gegner) -- Wall-Bridge zur nächsten erreichbaren Küste, exakt wie jeder andere
		# unerreichbare Rhythmus-Schritt.
		NavalPenTypes: aot-subpen
		# aot-transport's actual Locomotor (aot-units.yaml) -- verifies the dock's adjacent water is
		# really ship-navigable, not just terrain-adjacent to Water (User 2026-07-22: rock-enclosed
		# inlets can pass the naive terrain check but trap a ship a few cells short forever).
		NavalLocomotor: aot-lst
		# Age-upgrade cash priority (User 2026-07-31): fired directly by this module once each tier's
		# Rhythm is complete, bypassing BaseBuilderBotModule@aotupgrades' weighted-random pick for
		# these 3 actors entirely -- see AgeUpgradeFallbackTimeoutTicks default (15000) for the
		# permanently-stuck-core-building escape valve. Removed from that module's own
		# BuildingFractions below so nothing can double-fire them.
		AgeUpgradeTypes: aot-age1-upgrade-nod, aot-age2-upgrade-nod, aot-age3-upgrade-nod

	# CHOKEPOINT-FORTIFIER: für V1 DEAKTIVIERT (baute Streu-Zäune, konkurrierte um
	# die Building-Queue). Kommt als V2 zurück, integriert mit AotBaseBuilder.
	# AotChokeFortifierBotModule@aot:
	#	RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
	#	ConstructionYardTypes: fact, fact.gdi, fact.nod
	#	WallTypes: aot-wall-nod, aot-wall-gdi
	#	RepairTypes: aot-fix-age0, aot-fix-age1, aot-fix-age2, aot-fix-age1-nod, aot-fix-age2-nod

	# =========================================================================
	# BASISBAU (Gebäude + Verteidigung) — Building.GDI/Nod + Support.GDI/Nod
	# =========================================================================
	# Gebäude-Queues ENTZOGEN (2026-07-20): AotBaseBuilderBotModule besitzt Building.GDI/Nod
	# jetzt exklusiv. Diese Instanz bleibt nur für ihre Ökonomie-Dienste (z.B. Pause der
	# Einheitenproduktion bis Raffinerie existiert); Fractions/Delays unten sind damit inert.
	BaseBuilderBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		BuildingQueues:
		DefenseQueues:
		# HAND/PYLE rally points are managed exclusively by AotOperationsBotModule (User 2026-07-21):
		# this module's own AssignRallyPointsInterval logic re-validates every RallyPoint-trait
		# actor via IsCellBuildable, which a rally cell right at the production apron/smudge
		# essentially never passes -- it kept overwriting our rally point every cycle.
		RallyPointExcludeTypes: aot-hand-age0, aot-hand-age1, aot-hand-age2, aot-pyle-age0, aot-pyle-age1, aot-pyle-age2
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		MinimumExcessPower: 20
		MaximumExcessPower: 250
		ExcessPowerIncrement: 40
		ExcessPowerIncreaseThreshold: 2
		MaxBaseRadius: 22
		NewProductionCashThreshold: 3000
		RefineryTypes: proc, aot-proc-gdi, aot-proc-gdi-age2, aot-proc-nod, aot-proc-nod-age2
		PowerTypes: aot-nuke-age0, aot-nuke-age1, aot-nuke-age2, aot-nuke-age2-nod, aot-nuke-turbine, aot-nuke-turbine-age2, aot-nuk2-age0, aot-nuk2-age1, aot-nuk2-age2
		SiloTypes: aot-silo-age0, aot-silo-age1, aot-silo-age2
		# Erz-Ökonomie: garantiere 1 Silo ganz früh (direkt nach Power, vor Raffinerie),
		# platziert an der zum nächsten Ore-Mine-Aktor nächstgelegenen baubaren Zelle
		# (Custom-Engine-Erweiterung BaseBuilderBotModule.SilosNearOreMines). Damit kann
		# der ORET sofort abliefern. Siehe memory/ai-system.md.
		SilosNearOreMines: 1
		ProductionTypes: aot-lite-gdi, aot-lite-nod, weap, afld, aot-pyle-age0, aot-pyle-age1, aot-pyle-age2, aot-hand-age0, aot-hand-age1, aot-hand-age2, aflt, aot-hpad-gdi, aot-hpad-nod, hpad
		NavalProductionTypes: aot-shipyard, aot-subpen
		TechTypes: aot-atec-age0, aot-atec-age1, aot-atec-age2, aot-stec-age0, aot-stec-age1, aot-stec-age2, aot-hq-base, aot-hq-base-age2, aot-hq-ion, aot-hq-ion-age2, aot-nod-radar-age0, aot-nod-radar-age1, aot-nod-radar-age2, aot-tmpl-age1, aot-tmpl-age2, aot-shrine, orbc, aot-slab-age1, aot-slab-age2, aot-mslo-age1, aot-mslo-age2, eye
		# Mauern (aot-wall-gdi/nod, sbag/cycl/brik) NICHT hier — der AotChokeFortifierBotModule verwaltet
		# Mauern exklusiv (Wall-Bridge zum Chokepoint + späteres Umzäunen), sonst Queue-Konflikt.
		DefenseTypes: aot-pillbox-base, aot-pillbox-guard, aot-gun-base, aot-gun-laser, aot-ftur-flame, aot-ftur-toxic, sam, obli, aot-fireposition, atwr, gtwr
		ExpansionTolerate: 0
		ForceExpansionTolerate: 1
		# BuildingDelays = Sperre bis Welt-Tick N (25 Ticks/Sek). Das ist der EINZIGE
		# Phase-A-Hebel für eine echte Reihenfolge: was noch gesperrt ist, verlässt den
		# Zufalls-Topf. Kein Eintrag = ab Tick 0 baubar (Kern-Ökonomie).
		#   Emergente Reihenfolge:
		#   [0s]    Energie, Raffinerie (proc), Light-Factory (lite), Kaserne, Silo, HQ/Radar
		#   [~50s]  Tech-Center (Age-Rush: atec/stec)
		#   [~80s]  schwere Fahrzeugfabrik (weap/afld)
		#   [~100s] Reparatur (fix)
		#   [~120s] Verteidigung (pillbox/gun/ftur/sam/obli/atwr/gtwr)
		#   [~140s] Mauern, Helipad
		#   [~180s] Jets (aflt), Marine (shipyard/subpen), Stealth/Shroud
		#   [~200s+] Superwaffen (eye/tmpl/slab/shrine/orbc/mslo)
		BuildingDelays:
			# Tech-Center: direkt nach HQ (HQ selbst kein Delay -> früh für Age-Rush)
			aot-atec-age0: 1250
			aot-stec-age0: 1250
			# Schwere Fahrzeugfabrik (LITE bleibt früh/ohne Delay)
			weap: 2000
			afld: 2000
			# Reparatur
			aot-fix-age0: 2500
			aot-fix-age1: 2500
			aot-fix-age2: 2500
			aot-fix-age1-nod: 2500
			aot-fix-age2-nod: 2500
			# Verteidigung (~2 min — erst Wirtschaft, dann Türme)
			aot-pillbox-base: 3000
			aot-pillbox-guard: 3000
			aot-gun-base: 3000
			aot-gun-laser: 3000
			aot-ftur-flame: 3000
			aot-ftur-toxic: 3000
			sam: 3000
			obli: 3000
			atwr: 3000
			gtwr: 3000
			# Mauern / Fire Position / Helipad
			aot-fireposition: 3500
			aot-wall-gdi: 3500
			aot-wall-nod: 3500
			aot-hpad-gdi: 3500
			aot-hpad-nod: 3500
			hpad: 3500
			# Jets / Marine / Stealth / Shroud
			aflt: 4500
			aot-shipyard: 4500
			aot-subpen: 4500
			aot-sgen: 5000
			aot-gap: 5000
			# Superwaffen (spät)
			eye: 5000
			aot-tmpl-age1: 5000
			aot-slab-age1: 5500
			aot-shrine: 6000
			orbc: 6500
			aot-mslo-age1: 6500
		BuildingLimits:
			# Produktion: max 1 pro Typ pro Mainbase (Age-Varianten sind eigene Aktoren,
			# koexistieren -> je Variante 1). Verhindert die Barracks-/Factory-Häufung.
			aot-lite-gdi: 1
			aot-lite-nod: 1
			weap: 1
			afld: 1
			aot-pyle-age0: 1
			aot-pyle-age1: 1
			aot-pyle-age2: 1
			aot-hand-age0: 1
			aot-hand-age1: 1
			aot-hand-age2: 1
			# hq / Radar (Fraktions-/Age-Varianten teilen faktisch das Limit via Prereqs)
			aot-hq-base: 1
			aot-hq-base-age2: 1
			aot-hq-ion: 1
			aot-hq-ion-age2: 1
			aot-nod-radar-age0: 1
			aot-nod-radar-age1: 1
			aot-nod-radar-age2: 1
			# Tech-Center / Superwaffen (BuildLimit im Aktor bereits 1)
			aot-atec-age0: 1
			aot-atec-age1: 1
			aot-atec-age2: 1
			aot-stec-age0: 1
			aot-stec-age1: 1
			aot-stec-age2: 1
			orbc: 1
			aot-slab-age1: 1
			aot-slab-age2: 1
			aot-tmpl-age1: 1
			aot-tmpl-age2: 1
			aot-shrine: 1
			aot-mslo-age1: 1
			aot-mslo-age2: 1
			eye: 1
			# Reparatur / Luft / Marine
			aot-fix-age0: 1
			aot-fix-age1: 1
			aot-fix-age2: 1
			aot-fix-age1-nod: 1
			aot-fix-age2-nod: 1
			aot-hpad-gdi: 1
			aot-hpad-nod: 1
			hpad: 1
			aflt: 1
			aot-shipyard: 1
			aot-subpen: 1
			# Stealth / Shroud
			aot-sgen: 1
			aot-gap: 1
			# Silo
			aot-silo-age0: 4
			aot-silo-age1: 4
			aot-silo-age2: 4
		BuildingFractions:
			# --- Energie ---
			aot-nuke-age0: 12
			aot-nuke-age1: 12
			aot-nuke-age2: 12
			aot-nuke-age2-nod: 12
			aot-nuke-turbine: 12
			aot-nuke-turbine-age2: 12
			aot-nuk2-age0: 6
			aot-nuk2-age1: 6
			aot-nuk2-age2: 6
			# --- Raffinerie ---
			proc: 10
			aot-proc-gdi: 8
			aot-proc-gdi-age2: 6
			aot-proc-nod: 8
			aot-proc-nod-age2: 6
			# --- Silo (früh wichtig: ORET-Ablieferdock UND Erz-Lager; ohne Silo
			#     liefert oret nicht ab. Age-0 hoch, damit früh eins steht) ---
			aot-silo-age0: 10
			aot-silo-age1: 5
			aot-silo-age2: 5
			# --- Produktion ---
			aot-lite-gdi: 10
			aot-lite-nod: 10
			weap: 9
			afld: 9
			aot-pyle-age0: 8
			aot-pyle-age1: 8
			aot-pyle-age2: 8
			aot-hand-age0: 8
			aot-hand-age1: 8
			aot-hand-age2: 8
			# --- hq / Radar (Age-1-Rush wichtig) ---
			aot-hq-base: 20
			aot-hq-base-age2: 20
			aot-hq-ion: 20
			aot-hq-ion-age2: 20
			aot-nod-radar-age0: 20
			aot-nod-radar-age1: 20
			aot-nod-radar-age2: 20
			# --- Tech-Center (Gate für Age-Upgrades — hohe Prio) ---
			aot-atec-age0: 30
			aot-atec-age1: 30
			aot-atec-age2: 30
			aot-stec-age0: 30
			aot-stec-age1: 30
			aot-stec-age2: 30
			# --- Superwaffen-Gebäude ---
			orbc: 6
			aot-slab-age1: 6
			aot-slab-age2: 6
			aot-tmpl-age1: 6
			aot-shrine: 5
			aot-mslo-age1: 4
			aot-mslo-age2: 4
			eye: 2
			# --- Reparatur ---
			aot-fix-age0: 5
			aot-fix-age1: 5
			aot-fix-age2: 5
			aot-fix-age1-nod: 5
			aot-fix-age2-nod: 5
			# --- Luft / Marine ---
			aot-hpad-gdi: 4
			aot-hpad-nod: 4
			hpad: 3
			aflt: 4
			aot-shipyard: 3
			aot-subpen: 3
			# --- Stealth / Shroud ---
			aot-sgen: 3
			aot-gap: 3
			# --- Verteidigung (in Building-Queue) ---
			aot-pillbox-base: 6
			aot-pillbox-guard: 6
			aot-gun-base: 6
			aot-gun-laser: 6
			aot-ftur-flame: 5
			aot-ftur-toxic: 5
			sam: 7
			obli: 8
			aot-fireposition: 3
			# aot-wall-gdi/nod + sbag/cycl/brik: vom AotChokeFortifierBotModule verwaltet, nicht hier.
			# --- Verteidigung (in Support-Queue) ---
			atwr: 6
			gtwr: 5

	# =========================================================================
	# AGE-PROGRESSION + UPGRADES  (eigene BaseBuilder-Instanz)
	# Queues: Age.GDI/Age.Nod (Player-Level), Upgrade.GDI/Upgrade.Nod (atec/stec)
	# Upgrades haben KEIN BuildingInfo -> Queue schließt automatisch ab, keine
	# Platzierung (siehe ProductionQueue.cs:552-565).
	# =========================================================================
	BaseBuilderBotModule@aotupgrades:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		BuildingQueues: Age.GDI, Age.Nod, Upgrade.GDI, Upgrade.Nod
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		RefineryTypes: proc, aot-proc-gdi, aot-proc-gdi-age2, aot-proc-nod, aot-proc-nod-age2
		MinimumExcessPower: -9999
		MaximumExcessPower: 999999
		MaxBaseRadius: 22
		# Priority tier below base building (User 2026-07-22): base building has no cash reserve
		# at all (spends immediately), so upgrades only start once at least 500 credits of headroom
		# exist -- base building gets first claim on freshly-earned cash.
		NewProductionCashThreshold: 500
		BuildingLimits:
			aot-age1-upgrade-gdi: 1
			aot-age2-upgrade-gdi: 1
			aot-age3-upgrade-gdi: 1
			aot-age1-upgrade-nod: 1
			aot-age2-upgrade-nod: 1
			aot-age3-upgrade-nod: 1
		BuildingFractions:
			# === AGE-UPGRADES GDI — User 2026-07-22: NIEDRIGSTE Priorität innerhalb dieser Queue (unter
			# jedem anderen Upgrade, Wert < der niedrigste Kampf-Upgrade-Wert unten) — alle sonst
			# verfügbaren Upgrades der aktuellen Age sollen zuerst dran sein, ehe der Age-Sprung
			# selbst gekauft wird. BuildingFractions ist gewichtete Zufallsauswahl, keine strikte
			# Reihenfolge — mit diesem Gewicht wird das Age-Upgrade nur noch selten gezogen,
			# solange andere Kandidaten in der Queue verfügbar sind, aber keine harte Garantie.
			# NOD hat KEINE Einträge mehr hier (User 2026-07-31): AotBaseBuilderBotModule@nod feuert
			# aot-age{1,2,3}-upgrade-nod jetzt direkt selbst (AgeUpgradeTypes), hart an "Rhythm der
			# aktuellen Age fertig" gekoppelt statt an gewichteten Zufall -- siehe dort.
			aot-age1-upgrade-gdi: 3
			aot-age2-upgrade-gdi: 3
