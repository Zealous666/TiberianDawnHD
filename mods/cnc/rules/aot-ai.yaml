			aot-silo-age0: 10
			aot-silo-age1: 5
			aot-silo-age2: 5
			# --- Produktion ---
			aot-lite-gdi: 10
			aot-lite-nod: 10
			weap: 9
			afld: 9
			aot-pyle-age0: 8
			aot-pyle-age1: 8
			aot-pyle-age2: 8
			aot-hand-age0: 8
			aot-hand-age1: 8
			aot-hand-age2: 8
			# --- hq / Radar (Age-1-Rush wichtig) ---
			aot-hq-base: 20
			aot-hq-base-age2: 20
			aot-hq-ion: 20
			aot-hq-ion-age2: 20
			aot-nod-radar-age0: 20
			aot-nod-radar-age1: 20
			aot-nod-radar-age2: 20
			# --- Tech-Center (Gate für Age-Upgrades — hohe Prio) ---
			aot-atec-age0: 30
			aot-atec-age1: 30
			aot-atec-age2: 30
			aot-stec-age0: 30
			aot-stec-age1: 30
			aot-stec-age2: 30
			# --- Superwaffen-Gebäude ---
			orbc: 6
			aot-slab-age1: 6
			aot-slab-age2: 6
			aot-tmpl-age1: 6
			aot-shrine: 5
			aot-mslo-age1: 4
			aot-mslo-age2: 4
			eye: 2
			# --- Reparatur ---
			aot-fix-age0: 5
			aot-fix-age1: 5
			aot-fix-age2: 5
			aot-fix-age1-nod: 5
			aot-fix-age2-nod: 5
			# --- Luft / Marine ---
			aot-hpad-gdi: 4
			aot-hpad-nod: 4
			hpad: 3
			aflt: 4
			aot-shipyard: 3
			aot-subpen: 3
			# --- Stealth / Shroud ---
			aot-sgen: 3
			aot-gap: 3
			# --- Verteidigung (in Building-Queue) ---
			aot-pillbox-base: 6
			aot-pillbox-guard: 6
			aot-gun-base: 6
			aot-gun-laser: 6
			aot-ftur-flame: 5
			aot-ftur-toxic: 5
			sam: 7
			obli: 8
			aot-fireposition: 3
			aot-wall-gdi: 2
			aot-wall-nod: 2
			# --- Verteidigung (in Support-Queue) ---
			atwr: 6
			gtwr: 5
			sbag: 2
			cycl: 2
			brik: 2

	# =========================================================================
