	# =========================================================================
	# AoT OPERATIONS FRAMEWORK (2026-07-21) — Militär/Missionen
	# Modul 1 Starting Units (1:1-Port des ABGENOMMENEN Choke-Verhaltens + ARCO-
	# Raid; Choke bleibt nach Abmarsch LEER — User-Entscheidung), Modul 2 Regular
	# Waves (75% Kern / 25% adaptiv, Budget +25%/Welle, GDI-Rückzug 75% Stückzahl),
	# Modul 3 Scouts (2 leichte Fahrzeuge, 50% Spawn-Abdeckung), Modul 4 Derrick-
	# Engineer-Squads (v19 einnehmen, 10-min-Check, permanente Wache).
	# Varianten-Ketten enthalten ALLE Ausschluss-Zweige (beste zuerst) —
	# die erste AKTUELL BAUBARE Variante gewinnt.
	# =========================================================================
	AotMapIntelBotModule@aot:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		GroundLocomotor: foot
		ArcoTypes: arco
		DerrickTypes: v19
		CrateTypes: oilcrate1000

	AotOperationsBotModule@gdi:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: gdi
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		ExcludeFromOpsTypes: aot-harv, aot-harv-nod, aot-mcv-age0, aot-mcv-age1, aot-surveyor-gdi, aot-surveyor-nod, oret, aot-oret-lite, aot-minelayer, aot-aray, aot-mgap, aot-mstealth, aot-subapc, truck, mcv
		ChokepointReserveSize: 4
		ChokepointHoldRadius: 4
		ChokeClearRadius: 5
		ChokeClearExcludeTypes: aot-ore-mine, arco, v19
		WaveTankTypes: aot-mtnk-titn-rail, aot-mtnk-titn, aot-mtnk-rail, aot-mtnk-pred, aot-mtnk-base
		WaveLightTypes: aot-jeep-wolverine, aot-jeep-humvee, aot-apc-amphibious, aot-jeep-base
		WaveSupportTypes: aot-jugg, aot-msam-hover-mlrs, aot-msam-hover-aa
		WaveTankShare: 60
		WaveLightShare: 25
		WaveSupportShare: 15
		WaveRetreatLossPercent: 75
		AntiInfantryTypes: aot-jeep-wolverine, aot-jeep-humvee, aot-jeep-base
		AntiTankTypes: aot-htnk-laser, aot-htnk-rocket, aot-htnk-base, aot-mtnk-rail, aot-mtnk-pred, aot-mtnk-base
		AntiAirTypes: aot-msam-hover-aa
		# Naval ferry (User 2026-07-21): if there is no ground route to the enemy, a wave builds/
		# reuses 2 Hovercraft once the Shipyard exists, ferries itself across water in batches
		# (1 vehicle per transport), regroups on the far shore, then continues the attack.
		NavalProductionTypes: aot-shipyard
		FerryTypes: aot-transport-hover-proxy
		FerryCount: 3
		FerryMaxTotal: 3
		ScoutTypes: aot-jeep-base, aot-jeep-humvee, aot-jeep-wolverine, aot-apc-amphibious
		# Scouts only start once Radar/HQ exists (User 2026-07-21).
		RadarTypes: aot-hq-base, aot-hq-base-age2, aot-hq-ion, aot-hq-ion-age2
		# PYLE has 2 Exit cells; without a rally point the engine picks one at random per unit,
		# scattering fresh infantry (User 2026-07-21).
		InfantryRallyTypes: aot-pyle-age0, aot-pyle-age1, aot-pyle-age2
		DerrickMaxTargets: 2
		EngineerTypes: aot-e6-gdi
		RocketInfantryTypes: aot-e3-gdi
		MgInfantryTypes: aot-e1-gdi
		# Escalation (User 2026-07-22): after 2 failed waves at the primary choke, the next wave
		# routes via a secondary approach instead (if one exists); after 3 failed waves total (with
		# a Helipad built) 4 helicopters raid the enemy construction yard directly, then the loop
		# resets to ground waves regardless of the raid's outcome.
		HelipadTypes: aot-hpad-gdi
		AirRaidHelicopterTypes: aot-apache-base, aot-orca-upgraded
		# Retreating survivors that are damaged head to the repair bay before rejoining the pool
		# (User 2026-07-22).
		RepairTypes: aot-fix-age0, aot-fix-age1, aot-fix-age2
		# Module 5 Base Defense (User 2026-07-22): standing garrison ~= one regular wave in size,
		# ProtectionMinProduced guaranteed via production, rest opportunistic from the pool.
		ProtectionFloorTypes: aot-jeep-wolverine, aot-jeep-humvee, aot-apc-amphibious, aot-jeep-base
		ProtectionMinProduced: 3
		ProtectionScanRadius: 10
		ProtectionResponseRatio: 2
		ProtectionMinResponse: 2
		# Module 0 OreT Boost + startup priority (User 2026-07-22): one extra ORET ordered directly
		# (bypasses Ops claiming entirely, see ExcludeFromOpsTypes above), purely for early cashflow.
		# The first Regular Attack Wave waits for this + the first Derrick scan + every Scout group
		# before firing -- cashflow and reconnaissance before the first real offensive.
		OreBoostTypes: aot-oret-lite

	AotOperationsBotModule@nod:
		RequiresCondition: enable-cabal-ai || enable-watson-ai || enable-hal9001-ai
		Faction: nod
		# Priority tier below base building AND upgrades (User 2026-07-22, lowered from 1000 same day):
		# army production waits for at least 500 credits of headroom before spending any unit -- below
		# that, no units at all (economy stays cash-starved on some spawns, e.g. no land route to
		# derricks; 500 is the floor, not a target).
		ProductionMinCash: 500
		ConstructionYardTypes: fact, fact.gdi, fact.nod
		ExcludeFromOpsTypes: aot-harv, aot-harv-nod, aot-mcv-age0, aot-mcv-age1, aot-surveyor-gdi, aot-surveyor-nod, oret, aot-oret-lite, aot-minelayer, aot-aray, aot-mgap, aot-mstealth, aot-subapc, truck, mcv
		ChokepointReserveSize: 4
		ChokepointHoldRadius: 4
		ChokeClearRadius: 5
		ChokeClearExcludeTypes: aot-ore-mine, arco, v19
		# Legacy role/share fields (User 2026-07-31): kept only for Module 5 Base Defense's reserve
		# garrison (AotBaseDefenseMission.RequestMixedRoles still reads these) -- Regular Attack Waves
		# themselves now use WaveSlot1-5 below instead, see the comment there.
		WaveTankTypes: aot-ttnk-toxin, aot-ttnk-flame, aot-ltnk-tick, aot-ltnk-laser, aot-ttnk-base, aot-ltnk-base
		WaveLightTypes: aot-bike-laser, aot-bggy-laser, aot-bike-base, aot-bggy-base
		WaveSupportTypes: aot-arty-heavy, aot-arty-howitzer, aot-v2-napalm, aot-v2-toxic, aot-v2-base
		WaveTankShare: 50
		WaveLightShare: 30
		WaveSupportShare: 20
		WaveRetreatLossPercent: 0
		# Smaller, more frequent Age0 waves (User 2026-07-31: "wellen-größe in age-0 reduzieren, lieber
		# öfter aber momentan hat er oft ein geld problem"). WaveVehiclesPerAge only feeds the adaptive
		# share on top of the wave-slot static composition (see below) -- lowering just index 0 shrinks
		# that share for Age0 without touching Age1-3. WaveCooldown is a single global value (no per-tier
		# knob exists), lowered from the 1500 default to fire waves noticeably more often at every tier.
		WaveVehiclesPerAge: 4, 8, 10, 12
		WaveCooldown: 900
		# Wave slots (User 2026-07-31, replaces the role/share split above for Regular Attack Waves):
		# 4 independent, SIMULTANEOUS unit lines per wave instead of one chain always winning the whole
		# "tank" role -- the old chain mixed TTNK (never age-gated, always buildable via `lite` alone)
		# and LTNK (`~aot-age1`-gated) in one slot, so LTNK could structurally never win once unlocked.
		# Per-tier [Age0, Age1, Age2, Age3] Min (floor, always requested if buildable) and Max (ceiling,
		# even with full budget escalation). Age1 target (user spec): 1-2 Bike, 1-2 Buggy, 1-2 TTNK,
		# 2-3 LTNK. Age2/3: same 4 lines, just more of each as budget allows ("ab Age2 einfach mehr von
		# jeder Einheit, wenn Cashflow passt") -- Howitzer/Heavy Arty return later via a SEPARATE
		# operation type, deliberately excluded from Regular Waves from Age1 onward.
		WaveSlot1Types: aot-bike-laser, aot-bike-base
		WaveSlot1Min: 0, 1, 1, 2
		WaveSlot1Max: 0, 2, 3, 4
		WaveSlot2Types: aot-bggy-laser, aot-bggy-base
		WaveSlot2Min: 0, 1, 1, 2
		WaveSlot2Max: 0, 2, 3, 4
		WaveSlot3Types: aot-ttnk-toxin, aot-ttnk-flame, aot-ttnk-base
		WaveSlot3Min: 1, 1, 2, 2
		# Age0 max lowered 2 -> 1 (User 2026-07-31: "wellen-größe in age-0 reduzieren, lieber öfter" --
		# cash was stretched thin). Min stays 1, so Age0 TTNK is pinned at exactly 1, immune to budget
		# escalation too.
		WaveSlot3Max: 1, 2, 4, 5
		WaveSlot4Types: aot-ltnk-tick, aot-ltnk-laser, aot-ltnk-base
		WaveSlot4Min: 0, 2, 2, 3
		WaveSlot4Max: 0, 3, 5, 7
		# V2: Age0-only stand-in for the old Support role (matches prior "TTNK + V2" Age0 behaviour) --
		# excluded from Age1+ like Howitzer/Heavy Arty above, per the user's exhaustive Age1 slot list.
		# Age0 max lowered 2 -> 1, same reasoning as WaveSlot3 above.
		WaveSlot5Types: aot-v2-base
		WaveSlot5Min: 1, 0, 0, 0
		WaveSlot5Max: 1, 0, 0, 0
		AntiInfantryTypes: aot-ttnk-flame, aot-v2-napalm, aot-bggy-laser, aot-bggy-base
		AntiTankTypes: aot-ltnk-tick, aot-ltnk-laser, aot-ltnk-base, aot-ttnk-base
		# Naval ferry (User 2026-07-21): if there is no ground route to the enemy, a wave builds/
		# reuses 2 Transport Vessels once the Sub Pen exists, ferries itself across water in
		# batches (1 vehicle per transport), regroups on the far shore, then continues the attack.
		NavalProductionTypes: aot-subpen
		FerryTypes: aot-transport-base, aot-transport-gun-proxy
		# 3 Vessels fahren als EIN Konvoi (laden -> gemeinsam ueberfahren -> gemeinsam anlanden).
		FerryCount: 3
		FerryMaxTotal: 3
		# Eskorte: pro Vessel 1 U-Boot. Es begleitet NICHT, sondern sichert den Landepunkt und
		# verweilt dort. Ab Age 1 (STEC) kommt zusaetzlich ein Missile Sub dazu.
		FerryEscortTypes: aot-sub-cargo-proxy, aot-sub-base
		FerryEscortPerVessel: 1
		FerryEscortSecondaryTypes: aot-msub-drone-proxy, aot-msub-mine-proxy, aot-msub-base
		FerryEscortSecondaryCount: 1
		# Both variants inherit aot-transport's actual Locomotor (aot-units.yaml) -- verifies the chosen
		# embark/landing cell's adjacent water is really ship-navigable, not just terrain-adjacent to
		# Water (User 2026-07-22: rock-enclosed inlets can pass the naive terrain check but trap a ship
		# a few cells short of the shore forever, boarding never completes).
		FerryLocomotor: aot-lst
		# Bike/Buggy need ~aot-age1 -> not buildable in Age 0. Scout squad is a 5-man
		# infantry mix instead (User 2026-07-21, corrected 2026-07-21b): 3x Gunner (Role A) +
		# 2x Flame Trooper (Role B, falls back to the toxic variant post-Age3). Rocket
		# Infantry (Speed 39) dropped -- Gunner/Flame are both Speed 54 (verified in base
		# infantry.yaml), a mixed-speed squad spread out badly on the move.
		ScoutTypes: aot-e1-nod
		ScoutRoleACount: 3
		ScoutRoleBTypes: aot-e4-nod-flame, aot-e4-nod-toxic
		ScoutRoleBCount: 2
		# Scouts only start once Radar/HQ exists (User 2026-07-21).
		RadarTypes: aot-nod-radar-age0, aot-nod-radar-age1, aot-nod-radar-age2
		# HAND has 2 Exit cells (near-opposite sides); without a rally point the engine picks one
		# at random per unit, scattering fresh infantry (User 2026-07-21).
		InfantryRallyTypes: aot-hand-age0, aot-hand-age1, aot-hand-age2
		DerrickMaxTargets: 2
		EngineerTypes: aot-e6-nod
		RocketInfantryTypes: aot-e3-nod
		MgInfantryTypes: aot-e1-nod
		# Derrick squad composition (User 2026-07-31, corrected same day -- Flame Trooper needs Radar,
		# which would have deadlocked the sequential build): 1 rocketeer, 1 engineer, 1 mg, 1 mg.
		# Escalation (User 2026-07-22): after 2 failed waves at the primary choke, the next wave
		# routes via a secondary approach instead (if one exists); after 3 failed waves total (with
		# a Helipad built) 4 Hinds raid the enemy construction yard directly, then the loop resets
		# to ground waves regardless of the raid's outcome.
		HelipadTypes: aot-hpad-nod
		AirRaidHelicopterTypes: aot-hind-base, aot-harpy-upgraded, aot-harpy-upgraded-laser
		# Retreating survivors that are damaged head to the repair bay before rejoining the pool
		# (User 2026-07-22).
		RepairTypes: aot-fix-age0, aot-fix-age1-nod, aot-fix-age2-nod
		# Module 5 Base Defense (User 2026-07-22): standing garrison ~= one regular wave in size,
		# ProtectionMinProduced guaranteed via production, rest opportunistic from the pool.
		ProtectionFloorTypes: aot-bike-laser, aot-bggy-laser, aot-bike-base, aot-bggy-base
		ProtectionMinProduced: 3
		ProtectionScanRadius: 10
		ProtectionResponseRatio: 2
		ProtectionMinResponse: 2
		# Module 0 OreT Boost + startup priority (User 2026-07-22): one extra ORET ordered directly
		# (bypasses Ops claiming entirely, see ExcludeFromOpsTypes above), purely for early cashflow.
		# The first Regular Attack Wave waits for this + the first Derrick scan + every Scout group
		# before firing -- cashflow and reconnaissance before the first real offensive.
		OreBoostTypes: aot-oret-lite


