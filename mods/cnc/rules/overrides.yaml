# === Age of Tiberium (aotmod) - c17.bulk: Frachtflieger fuer NOD Airstrip Starport ===
# Klon des C17. Kein VTOL/Hover — Fixed-Wing-Landeanflug (Deceleration wie AJET/Firehawk).
# LandableTerrainTypes noetig damit Land-Activity greift.
# Cargo-Trait pflicht fuer DeliverBulkOrder (Ctor-Crash ohne ihn); Einheiten werden per DoProduction gespawnt.
c17.bulk:
	Inherits: C17
	RenderSprites:
		Image: c17
	Tooltip:
		Name: actor-c17-name
	Aircraft:
		TurnSpeed: 20
		Speed: 700
		Repulsable: False
		MaximumPitch: 36
		LandableTerrainTypes: Clear, Rough, Road, Beach, Tiberium, BlueTiberium
	Cargo:
		MaxWeight: 20
		BeforeUnloadDelay: 12
		BetweenUnloadDelay: 15
		AfterUnloadDelay: 8

# === Age of Tiberium (aotmod) - HQ: nur GDI + EYE-Sprite nach Ion Cannon Upgrade ===
# HQ ist jetzt GDI-exklusiv. NOD bekommt eigenen Radar (aot-nod-radar).
# Age-Powers liegen auf FACT. Ion Cannon Upgrade schaltet EYE-Sprites frei.
HQ:
	Buildable:
		Queue: Building.GDI
		Prerequisites: vehicleproduction, barracks, ~techlevel.medium, ~aot-hq-never
	-AirstrikePower:
	-SupportPowerChargeBar:
	ProvidesPrerequisite@gdihq:
		Prerequisite: gdi-hq
	ProvidesPrerequisite@anyhq:
		Prerequisite: anyhq
	GrantConditionOnPrerequisite@age1sprite:
		Condition: aot-hq-advanced
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@hq:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-hq-advanced && !aot-age2-active
	WithSpriteBody@eye:
		Sequence: aot-eye-idle
		Name: body-eye
		RequiresCondition: aot-hq-advanced && !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im Gruen-Hue-Fenster zur Spielerfarbe
		# (siehe silo-system.md). Body ist RGBA/truecolor -> explizit absichern.
		Palette: effect
		IsPlayerPalette: false
	WithIdleOverlay@tsremap:
		Sequence: aot-age2-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@lights:
		Sequence: aot-age2-lights
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@aot:
		BodyNames: body, body-eye
		Condition: build-incomplete
		RequiresCondition: !aot-age2-active
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - EYE: nicht baubar (wird durch HQ+Ion Cannon Upgrade ersetzt) ===
EYE:
	-Buildable:
# === Ende aotmod ===


# === Age of Tiberium (aotmod) - TMPL: erfordert Age 1 ===
# Buildable: erst baubar nach aot-age1.
# Atombombe (NukePower) ist von TMPL entfernt — hängt jetzt am MSLO Nuke Silo
# als Age-3-Upgrade ("Atom Bomb"), siehe aot-structures.yaml (MSLO NukePower@atombomb).
# -Buildable: Bau-Queue wandert auf zwei Proxy-Aktoren (Doppel-Aktor-Pattern für Icon-Wechsel
# Age 1 -> Age 2+), siehe aot-tmpl-age1/aot-tmpl-age2 + Sprite-Switch in aot-structures.yaml.
TMPL:
	-Buildable:
	-NukePower:
	-WithSupportPowerActivationAnimation:
	-WithSupportPowerActivationOverlay:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Age-Queue auf Player-Aktor ===
# Age-Upgrades laufen jetzt als eigene Production-Queue (Age.GDI / Age.Nod) auf dem Player-Aktor.
# Der Player-Aktor existiert ab Spielstart → Widget ist sofort sichtbar (kein Gebäude nötig).
# Faction-Split via Factions: gdi / nod — nur die passende Queue ist Enabled.
# Kosten + 30000-Tick-Bauzeit (20 min) direkt auf den Age-Upgrade-Aktoren in aot-structures.yaml.
# Nach Abschluss: AotAgeActivationNotification sendet globale Chat-Nachricht an alle Spieler.
Player:
	Production@AGEGDI:
		Produces: Age.GDI
		MoveIntoWorld: false
	ProductionQueue@AgeGDI:
		Type: Age.GDI
		Factions: gdi
		Group: Age
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Production@AGENOD:
		Produces: Age.Nod
		MoveIntoWorld: false
	ProductionQueue@AgeNod:
		Type: Age.Nod
		Factions: nod
		Group: Age
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	# === Age of Tiberium (aotmod) - NOD Airstrip Starport (Dune 2000 / TS style bulk delivery) ===
	# Instant-Kauf bis MaxCapacity, dann Purchase-Button -> Frachtflieger liefert alle auf einmal.
	# Player-Level-Queue (Pflicht: BulkProductionQueue ist [TraitLocation(Player)]).
	# Group: Support -> erscheint unter dem SPECIAL VEHICLES-Tab.
	BulkProductionQueue@Starport:
		Type: Starport
		Group: Support
		Factions: nod
		MaxCapacity: 5
		QueueLimit: 5
		PayUpFront: true
		DeliveryDelay: 500
		LowPowerModifier: 150
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - FACT: Support.GDI/Nod-Queue entfernen ===
# Kein AOT-Gebaeude nutzt Queue: Support.GDI/Nod mehr (alle nutzen Building.GDI/Nod).
# Ohne diesen Remove erscheint die leere Support-Queue immer als Sub-Tab #1 im
# Special-Vehicles-Tab und blockiert die Auto-Selektion der Vehicle.GDI-Queue.
FACT:
	ProductionQueue@GDISupport:
		Group: Hidden
	ProductionQueue@NodSupport:
		Group: Hidden
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - WEAP: Prerequisite + eigener aot-weap-String ===
# vehicleproduction wird auch von AFLD (Nod) bereitgestellt.
# aot-weap stellt sicher, dass MTNK-Upgrades nur mit GDI-Waffenfabrik sichtbar sind.
# ProvidesPrerequisite@buildingname: → stellt "weap" bereit (für Tooltip-Lookup in age2-upgrade-gdi).
WEAP:
	Buildable:
		Prerequisites: ~aot-age1, aot-age1, lite
		Queue: Building.GDI
