# === Age of Tiberium (aotmod) - Fahrzeuge capturable für Carjacker ===
^Vehicle:
	GrantConditionOnDamageState@AOTREPAIR:
		Condition: aot-vehicle-damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Targetable@AOTREPAIR:
		RequiresCondition: aot-vehicle-damaged
		TargetTypes: Repair
	CaptureManager:
	Capturable@CARJACK:
		Types: vehicle
		ValidRelationships: Enemy, Neutral
	AotSpawnCarjackerOnCaptureDeath:
		Actor: aot-cark-nod
		CaptureTypes: vehicle
	ExternalCondition@AOTGAS:
		Condition: aot-tiberium-gassed
	AotDamagedByCondition:
		RequiresCondition: aot-tiberium-gassed
		Damage: 50
		DamageInterval: 25
		DamageTypes: TiberiumDeath

