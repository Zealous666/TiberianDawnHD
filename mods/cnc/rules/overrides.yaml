# === Age of Tiberium (aotmod) - PROC: GDI braucht WEAP, NOD braucht AFLD ===
# Gemeinsame Queue-Definition funktioniert nicht mit unterschiedlichen Fraktions-Prerequisites.
# Daher: PROC selbst bekommt keine Queue, zwei Proxy-Aktoren steuern die Sichtbarkeit.
PROC:
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Advanced Guard Tower: fuer alle Fraktionen nicht baubar (User-Wunsch 2026-07-12) ===
# === Age of Tiberium (aotmod) - Ion Storm: Radar faellt aus ===
# Waehrend eines Ion Storms ist bei ALLEN Spielern das Radar tot (User-Wunsch 2026-07-28).
# ProvidesRadar ist ein ConditionalTrait -> RequiresCondition reicht. Der Eintrag kann NICHT
# auf ^Building stehen: dort wuerde er den Trait jedem Gebaeude erst hinzufuegen und damit
# allen Gebaeuden Radar geben. Deshalb einzeln auf den vier Basis-Aktoren, die ihn wirklich
# haben - ihre Proxy-Varianten (aot-hq-base/-ion, aot-nod-radar-age0/-age2, ...) erben das.
# Die Condition verteilt AotIonStormPower an alle Aktoren mit ProvidesRadar.
# !lowpower gehoert IMMER mit in die Bedingung: RequiresCondition ersetzt den geerbten Wert,
# ein blosses "!aot-ion-storm-blackout" wuerde die Stromabhaengigkeit also stillschweigend
# entfernen (genau dieser Bug 2026-07-28).
HQ:
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout

EYE:
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout

ATEC:
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout

aot-nod-radar:
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout

ATWR:
	-Buildable:
	# Nur noch im Karteneditor platzierbar (MapEditorData.Categories: Support bleibt erhalten).
	# User-Wunsch 2026-07-29: statt fest stromunabhaengig, jetzt eine Karteneditor-Checkbox
	# "Requires power" (Standard: an = normales Verhalten wie vor diesem Patch). AotOptionalPower
	# gewaehrt die Condition "aot-power-required" einmalig bei Erzeugung, exakt nach dem Wert der
	# Checkbox. Power und GrantConditionOnPowerState@LOWPOWER haengen beide daran - alles danach
	# (WithColoredOverlay@IDISABLE, AttackTurreted.PauseOnCondition, DetectCloaked !lowpower)
	# bleibt unveraendert auf der PER-AKTOR-Condition "lowpower", die bei deaktivierter Checkbox
	# einfach nie gewaehrt wird. Kein einziger Konsument muss dafuer angefasst werden.
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
# === Ende aotmod ===

