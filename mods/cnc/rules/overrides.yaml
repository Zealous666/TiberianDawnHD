# TiberianDawnHD engine overrides (non-aot)
# Diese Datei überschreibt Basis-Aktoren des cnc-Hauptspiels.
# Alle Age-of-Tiberium-Ergänzungen sind mit # === Age of Tiberium (aotmod) === markiert.

# === Age of Tiberium (aotmod) - JumpjetActorLayer: PFLICHT-World-Trait fuer JumpjetLocomotor ===
# Analog zu AirborneActorLayer/SubterraneanActorLayer. Ohne diesen World-Trait wird der Jumpjet-
# Movement-Layer nie betreten -> GrantConditionOnJumpjetLayer feuert nie -> Hover-Anim fehlt.
# NUR auf World (nicht EditorWorld) erlaubt, deshalb eigener Block statt ^BaseWorld.
World:
	# === Age of Tiberium (aotmod) - Tiberium/BlueTiberium auch auf Clear.Snow platzierbar ===
	# AOT_WINTER hat fuer die aus AOT_SNOW uebernommenen Zellen einen eigenen Terrain-Typ
	# "Clear.Snow" (siehe aot-winter.yaml, Minimap-Farbtrennung). Ohne diese Ergaenzung würde
	# die Engine-Basis (AllowedTerrainTypes: Clear, Road) Tiberium dort nicht mehr zulassen.
	ResourceLayer:
		ResourceTypes:
			Tiberium:
				AllowedTerrainTypes: Clear, Road, Clear.Snow
			BlueTiberium:
				AllowedTerrainTypes: Clear, Road, Clear.Snow
	JumpjetActorLayer:
	# === Age of Tiberium (aotmod) - SubterraneanActorLayer: PFLICHT-World-Trait fuer SubterraneanLocomotor ===
	# Analog zu JumpjetActorLayer. Ohne diesen World-Trait wird der Subterranean-Movement-Layer nie
	# betreten -> GrantConditionOnSubterraneanLayer feuert nie -> Ein-/Ausgraben funktioniert nicht.
	# NUR auf World (nicht EditorWorld) erlaubt, deshalb eigener Block statt ^BaseWorld.
	SubterraneanActorLayer:
	# Eis-System: haelt die Menge aller vereisten Zellen (Hosts + gewachsene Zellen).
	# Die Zellen fragen darueber ihre geteilten Ecken ab -> stetige Kanten.
	AotIceLayer:
	# Tiberian-Veins-System (Klon des Eis-Systems): haelt alle vom Geflecht bedeckten Zellen.
	AotVeinLayer:
	# Foundation-System: haelt die Menge aller platzierten BIB-Boden-Zellen.
	# Die Zellen fragen ihre 4 Nachbarn ab -> stetiger Kantenübergang (face-adjacency).
	AotFoundationLayer:
	LegacyBridgeLayer:
		# Originalaktoren (bridge1-4) + AoT-TEMPERAT-Varianten mit korrekten Template-IDs
		# + zerstörbare Fluss-Brücken (aot-br1/br2/br3, Templates 235-246, AOT_TEMPERAT & AOT_SNOW)
		Bridges: bridge1, bridge2, bridge3, bridge4, aot-tem-bridge1, aot-tem-bridge2, aot-br1, aot-br2, aot-br3

# === Age of Tiberium (aotmod) - Editor-Pendant zur Clear.Snow-Ressourcenfreischaltung oben ===
EditorWorld:
	EditorResourceLayer:
		ResourceTypes:
			Tiberium:
				AllowedTerrainTypes: Clear, Road, Clear.Snow
			BlueTiberium:
				AllowedTerrainTypes: Clear, Road, Clear.Snow
	BuildableTerrainOverlay:
		AllowedTerrainTypes: Clear, Road, Clear.Snow

# === Age of Tiberium (aotmod) - EdibleByLeap + Heal-TargetType für alle Infanterie ===
^Infantry:
	Parachutable:
		FallRate: 26
		KilledOnImpassableTerrain: true
		ParachutingCondition: parachute
		GroundImpactSound: squishy2.aud
		WaterImpactSound: splash9.aud
	WithParachute:
		RequiresCondition: parachute
		ShadowImage: parach-shadow
		ShadowSequence: idle
		Image: parach
		Sequence: idle
		OpeningSequence: open
		Offset: 0,0,200
		Palette: effect
		IsPlayerPalette: false
	EdibleByLeap:
	GrantConditionOnDamageState@AOTHEAL:
		Condition: aot-infantry-damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Targetable@AOTHEAL:
		RequiresCondition: aot-infantry-damaged
		TargetTypes: Heal
	ExternalCondition@AOTGAS:
		Condition: aot-tiberium-gassed
	AotDamagedByCondition:
		RequiresCondition: aot-tiberium-gassed
		Damage: 600
		DamageInterval: 25
		DamageTypes: Prone50Percent, TiberiumDeath
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Infanterie ===
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
	# === aotmod - Shroud Generator: Sicht im Gap-Feld auf 2c0 kappen (siehe ^Vehicle) ===
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	RevealsShroud:
		RequiresCondition: !aot-gap-suppressed
	RevealsShroud@GAPSUPPRESS:
		Range: 2c0
		RequiresCondition: aot-gap-suppressed
	# === Iron Dome - Unzerstoerbarkeit fuer Infanterie ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome
	
