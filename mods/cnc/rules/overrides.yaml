# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Age-Queue auf Player-Aktor ===
# Age-Upgrades laufen jetzt als eigene Production-Queue (Age.GDI / Age.Nod) auf dem Player-Aktor.
# Der Player-Aktor existiert ab Spielstart → Widget ist sofort sichtbar (kein Gebäude nötig).
# Faction-Split via Factions: gdi / nod — nur die passende Queue ist Enabled.
# Kosten + 30000-Tick-Bauzeit (20 min) direkt auf den Age-Upgrade-Aktoren in aot-structures.yaml.
# Nach Abschluss: AotAgeActivationNotification sendet globale Chat-Nachricht an alle Spieler.
Player:
	Production@AGEGDI:
		Produces: Age.GDI
		MoveIntoWorld: false
	ProductionQueue@AgeGDI:
		Type: Age.GDI
		Factions: gdi
		Group: Age
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Production@AGENOD:
		Produces: Age.Nod
		MoveIntoWorld: false
	ProductionQueue@AgeNod:
		Type: Age.Nod
		Factions: nod
		Group: Age
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	# === Age of Tiberium (aotmod) - NOD Airstrip Starport (Dune 2000 / TS style bulk delivery) ===
	# Instant-Kauf bis MaxCapacity, dann Purchase-Button -> Frachtflieger liefert alle auf einmal.
	# Player-Level-Queue (Pflicht: BulkProductionQueue ist [TraitLocation(Player)]).
	# Group: Support -> erscheint unter dem SPECIAL VEHICLES-Tab.
	BulkProductionQueue@Starport:
		Type: Starport
		Group: Support
		Factions: nod
		ShowLockedItems: True
		MaxCapacity: 5
		QueueLimit: 5
		PayUpFront: true
		DeliveryDelay: 500
		LowPowerModifier: 150
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - FACT: Support.GDI/Nod-Queue entfernen ===
# Kein AOT-Gebaeude nutzt Queue: Support.GDI/Nod mehr (alle nutzen Building.GDI/Nod).
# Ohne diesen Remove erscheint die leere Support-Queue immer als Sub-Tab #1 im
# Special-Vehicles-Tab und blockiert die Auto-Selektion der Vehicle.GDI-Queue.
FACT:
	# Engine-Default ist RepairActors:fix - diesen Aktor gibt es durch das
	# FIX-Proxy-Pattern nicht mehr, daher konnte der undeployte MCV nicht
	# zur Reparatur geschickt werden (analog ^Vehicle weiter oben).
	TransformsIntoRepairable:
		RepairActors: aot-fix-age0, aot-fix-age1, aot-fix-age2, aot-fix-age1-nod, aot-fix-age2-nod
	ProductionQueue@GDIBuilding:
		ShowLockedItems: True
	ProductionQueue@NodBuilding:
		ShowLockedItems: True
	ProductionQueue@GDISupport:
		Group: Hidden
	ProductionQueue@NodSupport:
		Group: Hidden
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - PYLE/HAND: ShowLockedItems fuer Infantry-Queues ===
PYLE:
	ProductionQueue:
		ShowLockedItems: True

HAND:
	ProductionQueue:
		ShowLockedItems: True
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - HPAD: ShowLockedItems fuer Aircraft-Queues ===
HPAD:
	ProductionQueue@GDI:
		ShowLockedItems: True
	ProductionQueue@Nod:
		ShowLockedItems: True
