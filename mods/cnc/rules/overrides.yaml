	# Wolverine-Palette: unittem mit dunkelgrau entsättigten Nicht-House-Indizes,
	# House-Color 16-31 bleibt für PlayerColorPalette-Remap (Cyborg-Muster, siehe [[recon-jeep-system]]).
	PaletteFromFile@aot-wolverine-base:
