RMBO:
	Buildable:
		ShowWhenLocked: False
		Prerequisites: ~disabled

^BaseWorld:
	-TerrainRenderer:
	RemasterTerrainRenderer:
	# === Age of Tiberium (aotmod) - Lighting-System (2026-07-26) ===
	# Weltweiter Beleuchtungs-Trait: liefert den globalen Tint (vom Tag/Nacht-Zyklus
	# aot-light-system gesteuert) UND nimmt lokale Lichtquellen (TerrainLightSource) auf.
	# Defaults hier = voll neutral (1/1/1, Intensity 1) -> ohne platziertes aot-light-system
	# sieht eine Karte exakt aus wie vorher, es gibt KEINE stille Verdunkelung.
	# Auf ^BaseWorld (statt World:), damit auch die EditorWorld ihn hat -- TerrainLightSource
	# ruft beim Platzieren im Editor WorldActor.Trait<TerrainLighting>() auf und crasht sonst.
	# Gerendert wird ohne gebackene Assets: RemasterTerrainRenderer schreibt seine Kacheln
	# durch TerrainSpriteLayer (Tint pro Vertex, GPU interpoliert weich ueber die Zelle),
	# Aktoren/Voxel sampeln TintAt live pro Frame (SpriteRenderable/ModelRenderable).
	TerrainLighting:
		Intensity: 1.0
		RedTint: 1.0
		GreenTint: 1.0
		BlueTint: 1.0
		# Bin-Groesse der Lichtquellen-Partitionierung in Zellen (Nachbarschaftssuche).
		BinSize: 10
	# === Age of Tiberium (aotmod) - Mine Cluster Missile: "mine" CrushClass für alle Boden-Loko ===
	# Ohne das kann in diesem (TD-basierten) Mod NIEMAND über eine Mine laufen — die cnc-Loko-Vorlagen
	# kannten "mine" als CrushClass bisher gar nicht (nur RA's eigene Loko-Vorlagen hatten das).
	# Folge: Einheiten wichen Minen als unpassierbares Hindernis aus, statt ahnungslos drüberzulaufen.
	# === Age of Tiberium (aotmod) - Eis (aot-ice-cell, ChangesTerrain: Ice) begehbar/befahrbar ===
	# Wie in TS: dort sind alle Eis-Templates Terrain "Clear" -> automatisch befahrbar. Hier eigener
	# TerrainType "Ice" (aot-snow.yaml), damit spaeter Einbrechen/Rutschen daran haengen kann.
	# Etwas langsamer als Clear (glatt). Ohne diese Eintraege ist Eis fuer alle unpassierbar.
	Locomotor@FOOT:
		Crushes: crate, mine
		TerrainSpeeds:
			Ice: 85
			Veins: 100
			Clear.Snow: 100
	Locomotor@CHEM:
		Crushes: crate, mine
		TerrainSpeeds:
			Ice: 85
			Veins: 100
			Clear.Snow: 100
	Locomotor@WHEELED:
		Crushes: crate, mine
		TerrainSpeeds:
			Ice: 90
			Veins: 100
			Clear.Snow: 100
	Locomotor@HEAVYWHEELED:
		Crushes: crate, infantry, mine
		TerrainSpeeds:
			Ice: 90
			Veins: 100
			Clear.Snow: 100
	Locomotor@TRACKED:
		Crushes: wall, crate, infantry, mine
		TerrainSpeeds:
			Ice: 95
			Veins: 100
			Clear.Snow: 100
	Locomotor@HEAVYTRACKED:
		Crushes: wall, heavywall, crate, infantry, mine
		TerrainSpeeds:
			Ice: 95
			Veins: 100
			Clear.Snow: 100
	Locomotor@LANDINGCRAFT:
		TerrainSpeeds:
			Clear.Snow: 100
	Locomotor@CRITTER:
		TerrainSpeeds:
			Clear.Snow: 100
	Locomotor@VISC:
		TerrainSpeeds:
			Clear.Snow: 100
			Veins: 100
	# Hover gleitet ueber Eis wie ueber Wasser.
	# Land-Malus abgeschwaecht: Engine-Original hat 33 auf Clear/Rough/Road/Tiberium/
	# BlueTiberium/River -> hier auf 75 angehoben (aot-transport-hover, Speed 115:
	# 37 -> 86). Water/Beach/Ice bleiben bei 100 (= 115). Einziger Nutzer des
	# hover-Locomotors ist aot-transport-hover. Siehe [[hover-transport-system]].
	# Giftwolke (aot-gascloud): darf praktisch ueberall hindriften (Wasser, Veins, Tiberium),
	# teilt sich die Zelle mit allen (SharesCell) -- blockiert/kollidiert nicht mit echten
	# Einheiten, ist rein optisch+DoT-Aura. Siehe [[vein-system]].
	Locomotor@AOT_GAS:
		Name: aot-gas
		SharesCell: true
		TerrainSpeeds:
			Clear: 60
			Rough: 60
			Road: 60
			Sand: 60
			Beach: 60
			Water: 60
			Tiberium: 60
			BlueTiberium: 60
			Veins: 60
			Ice: 60
	Locomotor@HOVER:
		Crushes: crate
		TerrainSpeeds:
			Ice: 100
			Veins: 100
			Clear: 75
			Clear.Snow: 75
			Rough: 75
			Road: 75
			Tiberium: 75
			BlueTiberium: 75
			River: 75
	# === Age of Tiberium (aotmod) - HVR Locomotor (schnell Land + Wasser) ===
	Locomotor@AOT_HVR:
		Name: aot-hvr
		Crushes: crate, mine
		TerrainSpeeds:
			Clear: 100
			Clear.Snow: 100
			Rough: 88
			Road: 125
			Bridge: 125
			Tiberium: 88
			BlueTiberium: 88
			Beach: 100
			Water: 100
			River: 100
			Ice: 100
			Veins: 100
	# === Age of Tiberium (aotmod) - Amphibious APC Locomotor ===
	Locomotor@AOT_AMPHIBIOUS:
		Name: aot-amphibious
		Crushes: crate, mine
		TerrainSpeeds:
			Clear: 100
			Clear.Snow: 100
			Rough: 88
			Road: 125
			Bridge: 125
			Tiberium: 88
			BlueTiberium: 88
			Beach: 100
			Water: 80
			# Amphibisch -> darf aufs Eis (wie Hover/LST). Reine Schiffe duerfen das NICHT.
			Ice: 90
			Veins: 100
	# === Age of Tiberium (aotmod) - LST-Locomotor: naval + Eis ===
	# Das LST (aot-transport) ist amphibisch und soll auf zugefrorene Flaechen koennen.
	# Es teilte sich bisher "naval" mit den echten Schiffen (aot-gunboat/-sub/-msub/-cruiser),
	# deshalb ein eigener Locomotor: nur so bleibt "naval" ohne Ice und die Schiffe draussen.
	Locomotor@AOT_LST:
		Name: aot-lst
		Crushes: crate, mine
		TerrainSpeeds:
			Water: 100
			Ice: 80
			Veins: 100
	# === Age of Tiberium (aotmod) - Zone Trooper Jumpjet-Locomotor ===
	# Kann Rock (unpassierbare Klippen/Berge) und River kurz überspringen (JumpjetTransitionTerrainTypes),
	# aber NICHT Water (Ozean) — bewusst kein Hovercraft-Ersatz, siehe [[orbc-system]].
	# Rock/River bleiben WALKABLE in TerrainSpeeds (siehe [[orbc-system]] fuer Pathing-Deadlock-Historie).
	# Hover-Animation via AotGrantConditionOnTerrain@HOVER auf dem Aktor (aot-units.yaml), unabhängig
	# vom Jumpjet-Layer. Geschwindigkeit dabei bewusst leicht ÜBER normaler Lauf-Geschwindigkeit
	# (Clear: 100) — der Jetpack-Hover ist minimal schneller als Laufen.
	JumpjetLocomotor@AOT_ZONETROOPER:
		Name: aot-zonetrooper
		# "aothover" ist KEIN echtes Crushen (kein Schaden/Zerstoerung/Sound) -- reine
		# Wiederverwendung des Passierbarkeits-Hooks, damit Zone Trooper ueber Mauern/
		# Tore hovern kann, genau wie ueber Rock/River. Siehe AotHoverPassable.cs.
		Crushes: crate, mine, aothover
		SharesCell: true
		JumpjetTransitionCost: 100
		JumpjetTransitionTerrainTypes: Rock, River
		TerrainSpeeds:
			Clear: 100
			Clear.Snow: 100
			Rough: 89
			Road: 111
			Bridge: 111
			Tiberium: 78
				PathingCost: 300
			BlueTiberium: 78
				PathingCost: 300
			Beach: 89
			Rock: 106
			River: 106
	# === Age of Tiberium (aotmod) - Subterranean Locomotor (Devil's Tongue + Sub APC) ===
	# SubterraneanTransitionTerrainTypes: nur Clear, Road, Rough, Tiberium, BlueTiberium erlaubt.
	# Beach, Rock (Klippen), Water, River, Bridge geblockt -> kein Ein-/Ausgraben dort.
	# Gebaeude-Footprints/Bibs geblockt via Engine-Patch (SubterraneanActorLayer.ValidTransitionCell
	# + BuildingInfluence-Check). SubterraneanTransitionOnRamps: false (TS-Default).
	# Crasht ohne TerrainType@Subterranean in allen Tilesets.
	SubterraneanLocomotor@AOT_SUBTERRANEAN:
		Name: aot-subterranean
		Crushes: crate, mine
		TerrainSpeeds:
			Clear: 80
			Clear.Snow: 80
			Road: 100
			Rough: 65
			Tiberium: 70
			BlueTiberium: 70
			Subterranean: 120
		SubterraneanTransitionTerrainTypes: Clear, Road, Rough, Tiberium, BlueTiberium, Clear.Snow
		SubterraneanTransitionCost: 100
		SubterraneanTransitionOnRamps: false
		# ~3x schnellere Unsichtbarkeit vs Default -1024 (setzt submerged-Condition früher).
		SubterraneanTransitionDepth: -341
	# === Age of Tiberium (aotmod) - TS-Infanterie-Palette ===
	# unittem.pal (TS Unit-Palette) als Basis + Player-Color-Remap auf House-Color-Indizes 16-31.
