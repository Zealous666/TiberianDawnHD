# === Ende aotmod ===

# === Age of Tiberium (aotmod) - SpyInfiltrate TargetType auf allen Gebäuden ===
^Building:
	# === Ion Storm (aot-ts-ctaray) - Blackout ===
	# Waehrend eines Ion Storms faellt bei ALLEN Spielern die Stromproduktion auf 0.
	# PowerMultiplier greift nur dort, wo ueberhaupt ein Power-Trait sitzt (Kraftwerke),
	# an allen anderen Gebaeuden ist er wirkungslos - deshalb reicht der Eintrag auf ^Building.
	# Die Condition verteilt AotIonStormPower beim Sturmbeginn an alle Gebaeude im Spiel.
	ExternalCondition@AOTIONSTORM:
		Condition: aot-ion-storm-blackout
	PowerMultiplier@AOTIONSTORM:
		RequiresCondition: aot-ion-storm-blackout
		Modifier: 0
	# Fortified Foundation: wird ein Gebaeude direkt an bestehende Foundation gebaut, schiebt sich
	# die Foundation unter sein Footprint -> schliesst die Luecke, Kanten werden buendig.
	AotFoundationUnderfill:
	Targetable:
		TargetTypes: Ground, C4, Structure, SpyInfiltrate
	ExternalCondition@AOTGAS:
		Condition: aot-tiberium-gassed
	AotDamagedByCondition:
		RequiresCondition: aot-tiberium-gassed
		Damage: 40
		DamageInterval: 25
		DamageTypes: TiberiumDeath
	# === Tiberian Veins: Gebaeude nehmen Schaden, wenn Geflecht angrenzt (wie in TS) ===
	# TS-Original (firestrm.ini): `ImmuneToVeins=yes` existiert nur bei einzelnen Einheiten
	# (REAPER, JFISH, DEFENDER, HUEY, Zivilisten, DOGGIE) -> impliziert, dass in TS grundsaetzlich
	# ALLES (auch Gebaeude) Vein-Schaden nimmt, sofern nicht explizit ausgenommen. Vorher hatten
	# NUR Fahrzeuge (^Vehicle) einen Vein-DoT, Gebaeude gar keinen. Anders als beim Fahrzeug-DoT
	# (der auf der EIGENEN Zelle prueft) hier PROXIMITY-basiert: Footprint-Zellen + deren direkte
	# Nachbarn, damit auch angrenzendes (nicht ueberwachsenes) Geflecht zaehlt.
	# ⚠️ Kein TS-Originalwert auffindbar (firestrm.ini = nur Firestorm-Overrides, keine
	# Basis-Werte) -> an die bestehende Gas-Ambient-Schaden-Kalibrierung angelehnt (Damage:40/1s).
	AotDamagedByAdjacentVeins@VEINS:
		Damage: 180
		DamageInterval: 25
		DamageTypes: TiberiumDeath
	# === Nod Stealth Generator (aot-sgen) - Stealth Field ===
	# Jedes Gebaeude kann getarnt werden, solange es im Feld eines aktiven Stealth Generators
	# steht (der die External-Condition aot-stealth-field gewaehrt). Ausserhalb des Feldes ist
	# der Cloak-Trait per RequiresCondition deaktiviert -> keinerlei Effekt im Normalbetrieb.
	# CloakType/UncloakOn: nur beim Feuern (Verteidigungsanlagen) kurz sichtbar, sonst dauerhaft
	# getarnt.
	# WICHTIG: CloakStyle=Alpha (NICHT Palette). Palette-Cloak (wie STNK) wirkt in Cloak.cs NUR auf
	# IPalettedRenderable = indizierte Sprites. STNK nutzt die klassische indizierte stnk.shp -> dort
	# klappt Palette. Gebaeude sind aber Truecolor-Remaster-Sprites (+ mein Two-Layer-Body) -> Palette
	# wuerde NUR das indizierte Player-Color-Overlay tarnen, der Rest bliebe sichtbar. Alpha wirkt via
	# WithAlpha auf ALLE Renderables (Truecolor + indiziert) -> ganzes Gebaeude wird transparent.
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
	# === Iron Dome - Unzerstoerbarkeit fuer Gebaeude ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome

