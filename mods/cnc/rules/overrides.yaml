	# TS-Voxel-Remap-Palette: eigene Graustufen-Rampe 255→0 an Indizes 176-191 (VxlToPng RemapRampStart=176, Count=16).
	PaletteFromFile@aot-vxl-ramp:
		Name: aot-vxl-ramp
		Filename: aot-vxl-ramp.pal
	PlayerColorPalette@aot-vxl:
		BaseName: aot-vxl-player
		BasePalette: aot-vxl-ramp
