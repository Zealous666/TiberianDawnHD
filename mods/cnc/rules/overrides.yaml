# === Age of Tiberium (aotmod) - Garrison-faehige Fahrzeuge (Fire Position) ===
# CargoType ist ein EINZELNER String, kein Set. "transportierbar" und "garnisonsfaehig"
# lassen sich daher nur ueber zwei verschiedene Typen trennen:
#   GroundVehicle   = ^Vehicle-Default, gilt fuer ALLE Bodenfahrzeuge -> Transporter
#   GarrisonVehicle = nur diese Aktoren hier      -> zusaetzlich Fire Position
# Die Transporter (Vessel/Hovercraft/Orca) akzeptieren BEIDE Typen, aot-fireposition NUR
# GarrisonVehicle. Ohne diese Trennung koennte jeder Harvester/V2/Surveyor die Fire Position
# belegen, ohne feuern zu koennen (kein Armament@garrisoned) -> Stellung blockiert.
# Wer hier eintraegt, braucht auch ein Armament@garrisoned.
# Siehe [[vehicle-cargotype-system]] (Architektur) und [[pillbox-garrison-system]] (Fire Position).
JEEP:
