# === Age of Tiberium (aotmod) - Fahrzeuge capturable für Carjacker ===
^Vehicle:
	# === Age of Tiberium (aotmod) - Cargo: ALLE Bodenfahrzeuge sind transportierbar ===
	# Zentral hier statt pro Aktor: der Engine-Default (^Vehicle in cnc|rules/defaults.yaml)
	# ist CargoType: Vehicle / Weight: 1. Diesen Typ akzeptiert KEIN Cargo im Mod
	# (alle Types sind Infantry / GroundVehicle) -> ein Fahrzeug ohne Override kann in gar
	# nichts einsteigen, und es fehlt kommentarlos der Enter-Cursor. Genau so ist es dem V2
	# passiert. Weight: 5 = MaxWeight von Vessel/Hovercraft -> exakt 1 Fahrzeug pro Transport.
	# NICHT pro Aktor duplizieren - sonst faellt jedes neue Fahrzeug wieder auf den Default
	# zurueck. Ausnahme braucht ein explizites Override am Aktor.
	# VOLLSTAENDIGE ARCHITEKTUR + Diagnose: [[vehicle-cargotype-system]] (PFLICHT vor Cargo-Aenderungen).
	Passenger:
		CargoType: GroundVehicle
		Weight: 5
		CustomPipType: green
	Repairable:
		RepairActors: aot-fix-age0, aot-fix-age1, aot-fix-age2, aot-fix-age1-nod, aot-fix-age2-nod
	GrantConditionOnDamageState@AOTREPAIR:
		Condition: aot-vehicle-damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Targetable@AOTREPAIR:
		RequiresCondition: aot-vehicle-damaged
		TargetTypes: Repair
	CaptureManager:
	Capturable@CARJACK:
		Types: vehicle
		ValidRelationships: Enemy, Neutral
	AotSpawnCarjackerOnCaptureDeath:
		Actor: aot-cark-nod
		CaptureTypes: vehicle
	ExternalCondition@AOTGAS:
		Condition: aot-tiberium-gassed
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Fahrzeuge ===
	# Analog zu ^Building: Fahrzeuge im Feld eines aktiven Stealth Generators werden getarnt.
	# Ausserhalb des Feldes per RequiresCondition deaktiviert. CloakStyle Alpha (Truecolor-Sprites,
	# wie ^Building — Palette wuerde nur indizierte Teile tarnen). UncloakOn nur Attack -> bleibt
	# beim Fahren getarnt, taucht nur beim Feuern kurz auf. Eigener CloakType, kollidiert nicht mit
	# STNK-Eigen-Cloak oder Crate-Cloak.
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
	# === aotmod - Shroud Generator: Sicht im Gap-Feld auf 2c0 kappen ===
	# Solange die externe Condition aktiv ist (im CreatesShroud-Radius eines feindlichen
	# Shroud Generators), wird die normale RevealsShroud abgeschaltet und durch eine
	# 2c0-Instanz ersetzt. Merge: die per-Aktor RevealsShroud erbt RequiresCondition.
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	RevealsShroud:
