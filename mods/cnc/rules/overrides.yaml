	# aot-jeep-wolverine, aot-bggy/bike-laser, aot-apc-*) erben es automatisch. Siehe [[ice-growth-system]].
	AotIceUnbreakable:
	# Veins: kein DoT (leicht genug), analog zum Eis-AotIceUnbreakable. Proxies erben es.
	-DamagedByTerrain@VEINS:
