# === Age of Tiberium (aotmod) - Fahrzeuge capturable für Carjacker ===
^Vehicle:
	# === Tiberian Veins: langsamer DoT auf dem Geflecht (wie Tiberium bei Infanterie) ===
	# Analog zum Eis-Einbrechen, aber nicht abrupt: solange das Fahrzeug auf Terrain "Veins"
	# steht, alle 16 Ticks etwas Schaden. Die leichten Fahrzeuge (JEEP/BGGY/BIKE/APC + Proxies)
	# entfernen diesen Trait wieder (-DamagedByTerrain@VEINS) -- dieselbe Ausnahme wie beim Eis.
	DamagedByTerrain@VEINS:
		Terrain: Veins
		Damage: 900
		DamageInterval: 16
		DamageTypes: TiberiumDeath
	# === Age of Tiberium (aotmod) - Cargo: ALLE Bodenfahrzeuge sind transportierbar ===
	# Zentral hier statt pro Aktor: der Engine-Default (^Vehicle in cnc|rules/defaults.yaml)
	# ist CargoType: Vehicle / Weight: 1. Diesen Typ akzeptiert KEIN Cargo im Mod
	# (alle Types sind Infantry / GroundVehicle) -> ein Fahrzeug ohne Override kann in gar
	# nichts einsteigen, und es fehlt kommentarlos der Enter-Cursor. Genau so ist es dem V2
	# passiert. Weight: 5 = MaxWeight von Vessel/Hovercraft -> exakt 1 Fahrzeug pro Transport.
	# NICHT pro Aktor duplizieren - sonst faellt jedes neue Fahrzeug wieder auf den Default
	# zurueck. Ausnahme braucht ein explizites Override am Aktor.
	# VOLLSTAENDIGE ARCHITEKTUR + Diagnose: [[vehicle-cargotype-system]] (PFLICHT vor Cargo-Aenderungen).
	Passenger:
		CargoType: GroundVehicle
		Weight: 5
		CustomPipType: green
	Repairable:
		RepairActors: aot-fix-age0, aot-fix-age1, aot-fix-age2, aot-fix-age1-nod, aot-fix-age2-nod
	GrantConditionOnDamageState@AOTREPAIR:
		Condition: aot-vehicle-damaged
		ValidDamageStates: Light, Medium, Heavy, Critical
	Targetable@AOTREPAIR:
		RequiresCondition: aot-vehicle-damaged
		TargetTypes: Repair
	CaptureManager:
	Capturable@CARJACK:
		Types: vehicle
		ValidRelationships: Enemy, Neutral
	AotSpawnCarjackerOnCaptureDeath:
		Actor: aot-cark-nod
		CaptureTypes: vehicle
	ExternalCondition@AOTGAS:
		Condition: aot-tiberium-gassed
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Fahrzeuge ===
	# Analog zu ^Building: Fahrzeuge im Feld eines aktiven Stealth Generators werden getarnt.
	# Ausserhalb des Feldes per RequiresCondition deaktiviert. CloakStyle Alpha (Truecolor-Sprites,
	# wie ^Building — Palette wuerde nur indizierte Teile tarnen). UncloakOn nur Attack -> bleibt
	# beim Fahren getarnt, taucht nur beim Feuern kurz auf. Eigener CloakType, kollidiert nicht mit
	# STNK-Eigen-Cloak oder Crate-Cloak.
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
	# === aotmod - Shroud Generator: Sicht im Gap-Feld auf 2c0 kappen ===
	# Solange die externe Condition aktiv ist (im CreatesShroud-Radius eines feindlichen
	# Shroud Generators), wird die normale RevealsShroud abgeschaltet und durch eine
	# 2c0-Instanz ersetzt. Merge: die per-Aktor RevealsShroud erbt RequiresCondition.
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	RevealsShroud:
		RequiresCondition: !aot-gap-suppressed
	RevealsShroud@GAPSUPPRESS:
		Range: 2c0
		RequiresCondition: aot-gap-suppressed
	# === Iron Dome - Unzerstoerbarkeit fuer Fahrzeuge ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome
	# Carryable: Fahrzeuge können vom GDI Carryall-TRAN aufgenommen werden (manuelle PickupUnit-Order)
	Carryable:
	# === Ende aotmod ===
	AotDamagedByCondition:
		RequiresCondition: aot-tiberium-gassed
		Damage: 50
		DamageInterval: 25
		DamageTypes: TiberiumDeath

# === Age of Tiberium (aotmod) - Mauern ersetzt durch aot-wall-gdi / aot-wall-nod ===
# GDI baut die Fortified Wall, NOD die Barbwire Fence (beide aot-structures.yaml).
# Alle Vanilla-Mauern (BRIK/SBAG/CYCL) sind aus den Bau-Paletten entfernt.
BRIK:
	-Buildable:

SBAG:
	-Buildable:

CYCL:
	-Buildable:

# === Age of Tiberium (aotmod) - ARTY Howitzer Gate ===
# ARTY hat Buildable in der Engine (Vehicle.Nod) — hier entfernen, Proxy aot-arty-howitzer
# (aot-units.yaml) stellt es nur frei wenn Howitzer-Upgrade gekauft.
ARTY:
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Shroud Generator: Sicht-Kappung für Schiffe/Flieger ===
# Wie bei ^Vehicle/^Infantry: im Gap-Feld eines feindlichen Shroud Generators wird
# die RevealsShroud abgeschaltet und durch eine 2c0-Instanz ersetzt.
^Ship:
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	RevealsShroud:
		RequiresCondition: !aot-gap-suppressed
	RevealsShroud@GAPSUPPRESS:
		Range: 2c0
		RequiresCondition: aot-gap-suppressed
	# === Iron Dome - Unzerstoerbarkeit fuer Schiffe ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Schiffe ===
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud

^Plane:
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	# Type explizit: Flieger haben keine Footprint-Zellen; ohne Type würde die (ggf. neu
	# angelegte) RevealsShroud auf den Footprint-Default fallen und beim Laden crashen.
	RevealsShroud:
		Type: GroundPosition
		RequiresCondition: !aot-gap-suppressed
	RevealsShroud@GAPSUPPRESS:
		Range: 2c0
		Type: GroundPosition
		RequiresCondition: aot-gap-suppressed
	# === Iron Dome - Unzerstoerbarkeit fuer Flieger ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Flieger ===
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud

^Helicopter:
	# === Ion Storm (aot-ts-ctaray) - Zwangslandung statt Absturz ===
	# Helikopter werden im Sturm NICHT zerstoert (nur Flugzeuge), sondern zur Landung gezwungen
	# und bleiben bis Sturmende am Boden. Das nutzt die eingebaute Engine-Mechanik: ein
	# PAUSIERTER Aircraft-Trait queued automatisch eine Land-Aktivitaet (Aircraft.cs Tick:
	# "Add land activity if Aircraft trait is paused") und startet nach dem Entpausen wieder.
	ExternalCondition@AOTIONSTORM:
		Condition: aot-ion-storm-grounded
	Aircraft:
		PauseOnCondition: aot-ion-storm-grounded
	ExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
	RevealsShroud:
		Type: GroundPosition
		RequiresCondition: !aot-gap-suppressed
	RevealsShroud@GAPSUPPRESS:
		Range: 2c0
		Type: GroundPosition
		RequiresCondition: aot-gap-suppressed
	# === Iron Dome - Unzerstoerbarkeit fuer Helikopter ===
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome
	# === Nod Stealth Generator (aot-sgen) - Stealth Field auch fuer Helikopter ===
	ExternalCondition@AOTSTEALTH:
		Condition: aot-stealth-field
	# Mobile Stealth Generator (aot-mstealth): eigenes Feld, tarnt NUR Einheiten (nicht ^Building).
	ExternalCondition@AOTSTEALTHMOBILE:
		Condition: aot-stealth-field-mobile
	Cloak@AOTSTEALTH:
		RequiresCondition: aot-stealth-field || aot-stealth-field-mobile
		CloakType: aot-stealth-field
		InitialDelay: 0
		CloakDelay: 50
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		UncloakOn: Attack
		# Cloak-/Decloak-Sound pro Einheit (wie Stealth Tank STNK): trans1.aud.
		CloakSound: trans1.aud
		UncloakSound: trans1.aud

# Brücken: Force-Fire angreifbar + Explosionseffekte bei Schaden/Zerstörung.
^Bridge:
	Targetable:
		TargetTypes: Ground, Water, Bridge

^ExplosiveBridge:
	ExplosionOnDamageTransition@DAMAGED:
		DamageState: Heavy
		Weapon: BridgeExplode
	ExplosionOnDamageTransition@COLLAPSED:
		DamageState: Dead
		Weapon: BridgeExplode
	SoundOnDamageTransition:
		DestroyedSounds: crumble.aud

BRIDGE1:
	Inherits@EXPLOSIVE: ^ExplosiveBridge
	# Auto-Hütten entfernt: Reparatur NUR über eine im Editor platzierte aot-bridgehut.
	-FreeActor@north:
	-FreeActor@south:
	MapEditorData:
		RequireTilesets: AOT_SNOW, WINTER
		Categories: Terrain

BRIDGE2:
	Inherits@EXPLOSIVE: ^ExplosiveBridge
	-FreeActor@north:
	-FreeActor@south:
	MapEditorData:
