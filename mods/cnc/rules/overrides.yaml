# belegen, ohne feuern zu koennen (kein Armament@garrisoned) -> Stellung blockiert.
# Wer hier eintraegt, braucht auch ein Armament@garrisoned.
# Siehe [[vehicle-cargotype-system]] (Architektur) und [[pillbox-garrison-system]] (Fire Position).
