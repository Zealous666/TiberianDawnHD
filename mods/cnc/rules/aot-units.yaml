# === Age of Tiberium (aotmod) - TTNK Heavy Tank (NOD, Tier 0) ===
# Age-0: RA Remastered 3TNK Sprites, Dual-Kanone (aot-TtnkDual).
# Age-1 Upgrade: Flame Tank (FTNK Sprites, BigFlamer × 2, AttackFrontal).
# Toxic Upgrade (konsolidiert, 2026-07-04): Toxin Tank (Chemspray × 2). Separates
# Stealth-Tank-Upgrade (aot-ttnk-cloak) komplett entfernt.
TTNK:
	Inherits: ^Tank
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Valued:
		Cost: 600
	-Tooltip:
	Tooltip@normal:
		Name: actor-ttnk.name
		RequiresCondition: !aot-ttnk-flame
	Tooltip@flame:
		Name: actor-ttnk-flame.name
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	Tooltip@toxin:
		Name: actor-ttnk-toxin.name
		RequiresCondition: aot-ttnk-toxin
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Mobile:
		Speed: 80
		TurnSpeed: 24
	Health:
		HP: 28000
	Repairable:
		HpPerStep: 1400
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 5c0
	Turreted:
		TurnSpeed: 24
	Armament@PRIMARY:
		Weapon: aot-TtnkDual
		LocalOffset: 768,0,90
		Recoil: 85
		RecoilRecovery: 17
		MuzzleSequence: muzzle
		RequiresCondition: !aot-ttnk-flame
	Armament@flame:
		Weapon: BigFlamer
		LocalOffset: 512,128,42, 512,-128,42
		MuzzleSequence: aot-flame-muzzle
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	Armament@toxin:
		Weapon: aot-TtnkChemspray
		LocalOffset: 512,128,42, 512,-128,42
		MuzzleSequence: aot-toxin-muzzle
		RequiresCondition: aot-ttnk-toxin
	# Fire Position (Phase 3) Garrison-Waffen, gleiche Conditions wie oben.
	Armament@garrisoned:
		Name: garrisoned
		Weapon: aot-TtnkDualGarrisoned
		RequiresCondition: !aot-ttnk-flame
	Armament@garrisonedflame:
		Name: garrisoned
		Weapon: aot-BigFlamerGarrisoned
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	Armament@garrisonedtoxin:
		Name: garrisoned
		Weapon: aot-TtnkChemsprayGarrisoned
		RequiresCondition: aot-ttnk-toxin
	Encyclopedia:
		Description: actor-ttnk.encyclopedia
		Order: 155
		Category: Vehicles
		Scale: 3
		PreviewOwner: Nod
	AttackMove:
		Voice: Attack
	AttackTurreted:
		Voice: Attack
		RequiresCondition: !aot-ttnk-flame
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
		RequiresCondition: aot-ttnk-flame
	WithMuzzleOverlay:
	GrantConditionOnPrerequisite@flame-upgrade:
		Condition: aot-ttnk-flame
		Prerequisites: aot-ttnk-flame-upgrade
	GrantConditionOnPrerequisite@toxin-upgrade:
		Condition: aot-ttnk-toxin
		# Umbenannt (2026-07-04): aot-ttnk-toxin-upgrade -> aot-toxic-upgrade,
		# konsolidiertes Upgrade siehe aot-upgrade-e4-toxic.
		# aot-ttnk-flame-upgrade zusaetzlich Pflicht (2026-07-05): Toxin-Wechsel
		# darf erst greifen, wenn der Flame-Tank-Upgrade bereits gekauft wurde.
		Prerequisites: aot-toxic-upgrade, aot-ttnk-flame-upgrade
	WithSpriteTurret@normal:
		Sequence: turret
		RequiresCondition: !aot-ttnk-flame
	-WithFacingSpriteBody:
	WithFacingSpriteBody@normal:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-ttnk-flame
	WithFacingSpriteBody@flame:
		Sequence: aot-flame-idle
		Name: body-flame
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	WithFacingSpriteBody@toxin:
		Sequence: aot-toxin-idle
		Name: body-toxin
		RequiresCondition: aot-ttnk-toxin
	FireWarheadsOnDeath:
		Weapon: FlametankExplode
		EmptyWeapon: FlametankExplode
		RequiresCondition: aot-ttnk-flame
	SpawnActorOnDeath:
		Actor: LTNK.Husk
		OwnerType: InternalName
		EffectiveOwnerFromOwner: true
	Selectable:
		DecorationBounds: 1194, 1194
	# Feld-Transform zur Devil's Tongue, sobald Subterrain-Upgrade UND Flame-Upgrade aktiv sind.
	# RequiresCondition: aot-ttnk-flame -> Base-Panzer (kein Flammen-Upgrade) verwandeln sich NIE.
	# Der Transform greift auch wenn zus. das Toxic-Upgrade aktiv ist (Condition bleibt aot-ttnk-flame).
	AotTransformOnPrerequisite:
		IntoActor: aot-ttnk-devil-base
		Prerequisites: aot-subterrain-upgrade, aot-ttnk-flame-upgrade
		RequiresCondition: aot-ttnk-flame

aot-ttnk-base:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Buildable:
		ShowWhenLocked: False
		BuildPaletteOrder: 3
		Prerequisites: lite, ~!aot-ttnk-flame-upgrade
		Queue: LightVehicle.Nod
		Description: NOD main battle tank with a dual-fire cannon.

aot-ttnk-flame:
	Inherits: TTNK
	# aotmod (2026-07-29): Varianten-Condition UNBEDINGT granten. Sie kam bisher nur aus dem
	# von TTNK geerbten GrantConditionOnPrerequisite, das den BESITZER auf das Upgrade prueft.
	# Im Karteneditor platzierte Creeps-/Neutral-Instanzen erfuellen das nie -> der Aktor erschien
	# als Basis-Variante (falscher Sprite, falsche Waffe), obwohl der Placer die Variante ist.
	# Der Proxy IST die Variante: das ist konstituierend und darf nicht am Upgrade-Stand haengen.
	GrantCondition@variant:
		Condition: aot-ttnk-flame
	RenderSprites:
		Image: ttnk
	Buildable:
		LockedGroup: aot-grp-ttnk
		BuildPaletteOrder: 30
		Prerequisites: lite, ~aot-ttnk-flame-upgrade, ~!aot-toxic-upgrade, ~!aot-subterrain-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-flame-icon
		Description: Upgraded Heavy Tank armed with dual flamethrowers.
	Tooltip@normal:
		Name: actor-ttnk-flame.name

	# aotmod (2026-07-29): Editor-Vorschau. ConditionalTrait.EnabledByDefault wertet die
	# RequiresCondition mit ALLEN Variablen = false aus; nur dann rendert der Trait im
	# Karteneditor. Deshalb gewann bisher der Basis-Trait ("!variante" ist bei 0 wahr) und
	# der Placer zeigte den Basis-Sprite. Auf diesem Proxy sind die oben unbedingt
	# granteten Conditions IMMER 1 -> Basis-Traits treffen nie zu (entfernt), und bei der
	# Zielvariante werden die stets-wahren Terme gekuerzt. Laufzeit-Semantik bleibt gleich.
	-WithSpriteTurret@normal:
	-WithFacingSpriteBody@normal:
	WithFacingSpriteBody@flame:
		RequiresCondition: !aot-ttnk-toxin

aot-ttnk-toxin:
	Inherits: TTNK
	# aotmod (2026-07-29): Varianten-Condition UNBEDINGT granten. Sie kam bisher nur aus dem
	# von TTNK geerbten GrantConditionOnPrerequisite, das den BESITZER auf das Upgrade prueft.
	# Im Karteneditor platzierte Creeps-/Neutral-Instanzen erfuellen das nie -> der Aktor erschien
	# als Basis-Variante (falscher Sprite, falsche Waffe), obwohl der Placer die Variante ist.
	# Der Proxy IST die Variante: das ist konstituierend und darf nicht am Upgrade-Stand haengen.
	# Beide Conditions noetig -- mit nur 'aot-ttnk-toxin' bliebe die Basis-Variante MIT aktiv
	# (deren RequiresCondition prueft auf !aot-ttnk-flame).
	GrantCondition@variant:
		Condition: aot-ttnk-flame
	GrantCondition@variant2:
		Condition: aot-ttnk-toxin
	RenderSprites:
		Image: ttnk
	Buildable:
		LockedGroup: aot-grp-ttnk
		BuildPaletteOrder: 30
		Prerequisites: lite, ~aot-ttnk-flame-upgrade, ~aot-toxic-upgrade, ~!aot-subterrain-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-toxin-icon
		Description: Flame Tank upgraded with dual toxic tiberian-sprayers.
	Tooltip@normal:
		Name: actor-ttnk-toxin.name

	# aotmod (2026-07-29): Editor-Vorschau. ConditionalTrait.EnabledByDefault wertet die
	# RequiresCondition mit ALLEN Variablen = false aus; nur dann rendert der Trait im
	# Karteneditor. Deshalb gewann bisher der Basis-Trait ("!variante" ist bei 0 wahr) und
	# der Placer zeigte den Basis-Sprite. Auf diesem Proxy sind die oben unbedingt
	# granteten Conditions IMMER 1 -> Basis-Traits treffen nie zu (entfernt), und bei der
	# Zielvariante werden die stets-wahren Terme gekuerzt. Laufzeit-Semantik bleibt gleich.
	-WithSpriteTurret@normal:
	-WithFacingSpriteBody@normal:
	-WithFacingSpriteBody@flame:
	WithFacingSpriteBody@toxin:
		RequiresCondition: aot-ttnk-toxin || !aot-ttnk-toxin

# === Age of Tiberium (aotmod) - Devil's Tongue Subterranean Flame Tank ===
# Erbt TTNK (alle Conditions/Waffen/Turret-Traits) aber ersetzt den Locomotor durch den
# Subterranean-Locomotor und fuegt Dig-In/Dig-Out-Mechanik hinzu.
# Baubar nach aot-subterrain-upgrade + aot-ttnk-flame-upgrade im Starport (analog aot-ttnk-flame).
# Separate Proxies fuer Flame und Toxin (nach Toxic-Upgrade), analog zum TTNK-Muster.
aot-ttnk-devil-base:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Mobile:
		Locomotor: aot-subterranean
	# PFLICHT: AotTransformOnPrerequisite von TTNK erbt auf diesen Aktor mit →
	# nach Transform sind beide Prereqs aktiv und aot-ttnk-flame wird re-granted →
	# endlos-Transform-auf-sich-selbst blockiert Activity-Queue (keine Bewegung).
	-AotTransformOnPrerequisite:
	-WithSpriteTurret@normal:
	-WithFacingSpriteBody@normal:
	-WithFacingSpriteBody@flame:
	-WithFacingSpriteBody@toxin:
	# Subterranean body: normaler Sprite bei !submerged && !digging; Tilt bei Übergangsphase.
	WithFacingSpriteBody@sub:
		Sequence: aot-subtank-idle
		Name: body
		RequiresCondition: !submerged && !digging
	WithFacingSpriteBody@subremap:
		Sequence: aot-subtank-remap
		Name: body-remap
		Palette: aot-vxl-player
		IsPlayerPalette: True
		RequiresCondition: !submerged && !digging
	WithFacingSpriteBody@dig:
		Sequence: aot-subtank-tilt
		Name: body
		RequiresCondition: digging
	WithFacingSpriteBody@digremap:
		Sequence: aot-subtank-tilt-remap
		Name: body-remap
		Palette: aot-vxl-player
		IsPlayerPalette: True
		RequiresCondition: digging
	WithShadow:
		Offset: 0, 48, 0
		ZOffset: -129
	RevealsShroud:
		RequiresCondition: !submerged
	Targetable:
		RequiresCondition: !submerged
	Targetable@UNDERGROUND:
		TargetTypes: Underground
		RequiresCondition: submerged
	GrantConditionOnSubterraneanLayer:
		Condition: submerged
		TransitionCondition: digging
		SubterraneanTransitionImage: aot-dig
		SubterraneanTransitionSequence: idle
		SubterraneanTransitionPalette: effect
		SubterraneanTransitionSound: subdril1.aud
	# Der Devil's Tongue IST per Definition der aufgeruestete Flammenpanzer -- die Flammenwaffe
	# darf deshalb NICHT am Upgrade-Prerequisite des jeweiligen BESITZERS haengen. Der von TTNK
	# geerbte GrantConditionOnPrerequisite feuert nur, wenn der Besitzer "aot-ttnk-flame-upgrade"
	# gekauft hat; eine im Karteneditor platzierte Creeps-/Neutral-Instanz erfuellt das nie, damit
	# blieb aot-ttnk-flame aus -> Armament@PRIMARY (aot-TtnkDual) + AttackTurreted (!aot-ttnk-flame)
	# waren aktiv und der Panzer schoss mit der normalen Kanone statt mit Flammen.
	# aot-ttnk-toxin bleibt bewusst prerequisite-gesteuert: Toxin ist ein echtes Zusatz-Upgrade,
	# Flamme dagegen ist konstituierend fuer diesen Aktor.
	-GrantConditionOnPrerequisite@flame-upgrade:
	GrantCondition@flame:
		Condition: aot-ttnk-flame
	# AttackTurreted erbt RequiresCondition: !aot-ttnk-flame -> feuert nie (devil hat immer flame).
	# AttackFrontal: Waffe via erbte Conditions (flame/toxin), submerged-Pause.
	AttackFrontal:
		PauseOnCondition: submerged || digging
	Cloak@UNDERGROUND:
		InitialDelay: 0
		CloakDelay: 0
		CloakType: Underground
		RequiresCondition: submerged
		UncloakSound:
		CloakSound:
	# === Hinterhalt-Modus (Editor-Checkbox "Underground") ===
	# Im Karteneditor vorplatzierte Devil's Tongue starten wahlweise bereits eingegraben und
	# bleiben liegen, bis ein Gegner in Waffenreichweite kommt -- dann graben sie sich selbst
	# aus und greifen normal an. Verhalten wie ein lauernder Stealth Tank.
	# Zwei Dinge gehen NICHT in YAML und stecken deshalb im Trait (siehe AotSubterraneanAmbush.cs):
	#   1. Start auf dem Subterranean-Layer (es gibt keinen "spawn auf Layer"-ActorInit)
	#   2. Liegenbleiben -- Mobile.OnBecomingIdle taucht Custom-Layer-Einheiten sonst SOFORT auf
	AotSubterraneanAmbush:
		AmbushCondition: aot-ambush
	# Waehrend des Hinterhalts kein AutoTarget: der Trait scannt selbst und entscheidet, wann
	# ausgegraben wird. Ohne diese Sperre wuerde AutoTarget schon unter der Erde eine
	# Angriffs-Activity einreihen (AttackFrontal ist nur PAUSIERT, nicht deaktiviert) -- die
	# Einheit waere nicht mehr idle, hinge in einer folgenlosen Attacke fest und verriete sich.
	AutoTarget:
		RequiresCondition: !aot-ambush

aot-ttnk-devil:
	Inherits: aot-ttnk-devil-base
	Buildable:
