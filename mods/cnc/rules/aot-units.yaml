# === Age of Tiberium (aotmod) - Zone Trooper (GDI, TS JUMPJET-Sprites, MTNK-Railgun, Ghost-Stalker-Voice) ===
# NICHT direkt baubar — kein Buildable-Trait, wird ausschließlich über die Zone Trooper Drop
# Support Power (aot-orbc, Age-3-Upgrade) gespawnt, analog aot-minp/aot-minv (siehe [[nuke-silo-system]]).
# Jumpjet-Locomotor (aot-zonetrooper, siehe overrides.yaml ^BaseWorld) erlaubt kurzes Überspringen
# von Rock/River (NICHT Water) — "airborne"-Condition steuert den Sprite-Wechsel während des Hops,
# via GrantConditionOnJumpjetLayer (Standard-OpenRA-Mechanismus für Jumpjet-Einheiten, kein neuer Trait nötig).
aot-zonetrooper:
	Inherits: E1
	WithShadow:
		Offset: 0, 48, 0
		ZOffset: -129
	RenderSprites:
		Image: aot-zonetrooper
		PlayerPalette: aot-ts-player
	-WithInfantryBody:
	WithInfantryBody@ground:
		RequiresCondition: !airborne
		StandSequences: stand
		IdleSequences: idle1, idle2
		DefaultAttackSequence: attack
		Palette: aot-ts-player
		IsPlayerPalette: true
	WithInfantryBody@flying:
		RequiresCondition: airborne || aot-zonetrooper-descending || aot-zonetrooper-hovering
		StandSequences: flying
		MoveSequence: flying
		DefaultAttackSequence: flying-attack
		Palette: aot-ts-player
		IsPlayerPalette: true
	GrantConditionOnJumpjetLayer:
		Condition: airborne
	# Terrain-basierter Hover: unabhängig vom Jumpjet-Movement-Layer (der wird beim aktuellen
	# Locomotor-Setup praktisch nie betreten, da Rock/River als Boden-Terrain gültig/billiger sind
	# — Einheiten LAUFEN normal drüber). Diese Condition greift rein visuell beim Überqueren von
	# Rock/River, ohne Targetable/DamagedByTerrain (weiterhin normale Boden-Einheit) zu beeinflussen.
	AotGrantConditionOnTerrain@HOVER:
		Condition: aot-zonetrooper-hovering
		TerrainTypes: Rock, River
	# Mauern/Tore sind Aktoren, keine Terrain-Typen -> eigener Actor-basierter Hover-
	# Trigger (identische Condition wie oben, daher gleiche Hovers/WithInfantryBody-
	# Kopplung; siehe AotHoverPassable.cs fuer die Passierbarkeits-Haelfte).
	AotGrantConditionOnActor@HOVERWALL:
		Condition: aot-zonetrooper-hovering
		ActorTypes: aot-wall-gdi, aot-wall-gdi-fs, aot-wall-nod, aot-wall-nod-laser, aot-gate-gdi, aot-gate-nod
	Hovers:
		RequiresCondition: airborne || aot-zonetrooper-descending || aot-zonetrooper-hovering
		# Hoeher als Standard (Default 43) -- muss sichtbar ueber Mauern/Sandsack-Kronen
		# hinwegschweben (siehe AotGrantConditionOnActor@HOVERWALL), nicht nur ueber
		# flaches Rock/River-Terrain. Rein visuell, keine Gameplay-Auswirkung.
		InitialHeight: 250
		BobDistance: -60
		RiseTicks: 8
		FallTicks: 8
	# Kein WithParachute (kein Fallschirm-Sprite) — beim Absprung aus dem Dropship nutzt der
	# Zone Trooper stattdessen die TS-Jetpack-Hover-Animation (siehe WithInfantryBody@flying).
	-WithParachute:
	Parachutable:
		ParachutingCondition: aot-zonetrooper-descending
	-Crushable:
	-TakeCover:
	Targetable:
		RequiresCondition: !airborne
	Targetable@AIRBORNE:
		TargetTypes: Air
		RequiresCondition: airborne
	DamagedByTerrain:
		RequiresCondition: !hazmatsuits && !airborne
	WithDeathAnimation:
		DeathSequence: die
		UseDeathTypeSuffix: false
		DeathSequencePalette: aot-ts-player
		DeathPaletteIsPlayerPalette: true
		CrushedSequence: die-crushed
		CrushedSequencePalette: aot-ts-player
		CrushedPaletteIsPlayerPalette: true
	Voiced:
		VoiceSet: ZoneTrooperVoice
	Tooltip:
		Name: Zone Trooper
	Health:
		HP: 15000
	Armor:
		Type: Light
	Mobile:
		Speed: 60
		Locomotor: aot-zonetrooper
	Valued:
		Cost: 1500
	Armament:
		Weapon: aot-MtnkRailgun
	# Garrison-Waffe (2026-07-05): aot-MtnkRailgun nutzt LaserZap, das per
	# Engine-Default bereits Blockable:false ist - direkt wiederverwendbar.
	Armament@GARRISONED:
		Name: garrisoned
		Weapon: aot-MtnkRailgun
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Gunboat (GDI Naval, PT base -> Destroyer upgrade) ===
# Steuerbares Schiff (Mobile + naval Locomotor). EIN Aktor, konditionaler Sprite/Waffen-
# Tausch via aot-gunboat-upgrade (gewährt von aot-upgrade-gunboat-destroyer) - Muster
# JEEP->HUMVEE. Age 0 = RA PT (Rumpf idle + MG-Turm turret). Upgrade = RA DD (idle-dd +
# Raketen-Turm turret-dd). Beide Boote teilen dieselbe ^Ship-Mechanik (16 Facings + Turm).
aot-gunboat:
	Inherits: ^Ship
	Inherits@SELECTABLE: ^SelectableCombatUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAll
	RenderSprites:
		Image: aot-gunboat
	Valued:
		Cost: 500
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 30000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: naval
		TurnSpeed: 28
		Speed: 92
	RepairableNear:
		RepairActors: aot-shipyard, aot-subpen
	RevealsShroud:
		Range: 7c0
		Type: CenterPosition
	Turreted@pt:
		Turret: pt
		TurnSpeed: 28
		Offset: 512,0,0
		RequiresCondition: !aot-gunboat-upgrade
	# Destroyer: EIN Turm hinten = Raketenwerfer (ssam-Sprite + Raketen am selben Heck-Turm).
	# Keine Kanone. Offset -X = hinten.
	Turreted@dd:
		Turret: dd
		TurnSpeed: 28
		Offset: 469,0,128
		RequiresCondition: aot-gunboat-upgrade
	AttackTurreted:
		Turrets: pt, dd
	GrantConditionOnPrerequisite@frigate:
		Condition: aot-gunboat-frigate-upgrade
		Prerequisites: aot-gunboat-frigate-upgrade
	GrantConditionOnPrerequisite@destroyer:
		Condition: aot-gunboat-upgrade
		Prerequisites: aot-gunboat-upgrade
	-Tooltip:
	Tooltip@base:
		Name: Gunboat
		RequiresCondition: !aot-gunboat-frigate-upgrade
	Tooltip@frigate:
		Name: Frigate
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	Tooltip@dd:
		Name: Destroyer
		RequiresCondition: aot-gunboat-upgrade
	WithFacingSpriteBody@pt:
		Sequence: idle
		RequiresCondition: !aot-gunboat-frigate-upgrade
	WithFacingSpriteBody@frigate:
		Sequence: idle-frigate
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	WithFacingSpriteBody@dd:
		Sequence: idle-dd
		RequiresCondition: aot-gunboat-upgrade
	WithSpriteTurret@pt:
		Turret: pt
		Sequence: turret
		RequiresCondition: !aot-gunboat-frigate-upgrade
	WithSpriteTurret@dd:
		Turret: dd
		Sequence: turret-dd
		RequiresCondition: aot-gunboat-upgrade
	# Turreted@pt bleibt für PT und Frigate aktiv (unsichtbar bei Frigate, aber Armament braucht es).
	Armament@pt:
		Weapon: aot-GunboatGun
		Turret: pt
		LocalOffset: 208,0,48
		RequiresCondition: !aot-gunboat-frigate-upgrade
	# Frigate: 3 Raketen (Land+Wasser), kein Turm-Sprite, Turret pt unsichtbar aktiv.
	Armament@frigate:
		Weapon: aot-FrigateMissiles
		Turret: pt
		LocalOffset: 208,0,48
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	# Destroyer-Waffe: Raketenwerfer (ssam-Heck-Turm), Luft + Land.
	Armament@dd:
		Weapon: aot-DestroyerRockets
		Turret: dd
		LocalOffset: 0,0,48
		RequiresCondition: aot-gunboat-upgrade
	# DepthCharge DD: nur Destroyer hat Wasserbomben.
	Armament@depthdd:
		Weapon: aot-DepthCharge
		Turret: dd
		LocalOffset: -512,-100,0, -512,100,0
		LocalYaw: 80, -80
		RequiresCondition: aot-gunboat-upgrade

# aot-gunboat-base: Gunboat-Icon vor Frigate-Upgrade.
# aot-gunboat-frigate: Frigate-Icon zwischen Frigate- und Destroyer-Upgrade.
# aot-gunboat-destroyer: Destroyer-Icon nach Destroyer-Upgrade.
aot-gunboat-base:
	Inherits: aot-gunboat
