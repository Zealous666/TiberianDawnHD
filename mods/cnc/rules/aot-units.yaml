		BuildPaletteOrder: 30
		Prerequisites: ~afld, ~aot-age2, aot-ttnk-flame-upgrade, aot-subterrain-upgrade, ~aot-toxic-upgrade
		Queue: Starport
		BuildDuration: 0
		Icon: aot-devil-icon
		Description: Toxin Tank upgraded with subterranean movement. Can tunnel underground to ambush enemies.
	Tooltip@normal:
		Name: actor-aot-ttnk-devil-toxin.name

# === Age of Tiberium (aotmod) - Subterranean APC (NOD) ===
# Unbewaffneter Infanterie-Transport mit Subterranean-Mechanik (TS SAPC).
# Baubar im Starport (afld) nach Subterrain-Upgrade + Hand of Nod.
aot-subapc:
	Inherits: ^Vehicle
