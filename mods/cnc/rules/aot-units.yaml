		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-undeploying

	WithMakeAnimation:
		Sequence: deploy
		BodyNames: body
		Condition: build-incomplete

	Selectable:
		Bounds: 1024, 1024
		Priority: 10

	Targetable:
		TargetTypes: Ground, Vehicle

	Health:
