# === Age of Tiberium (aotmod) - aot-ajet-firehawk: Firehawk-Bau-Proxy (Hawk-Icon nach Upgrade) ===
# Inherits AJET; erst nach dem Firehawk-Upgrade sichtbar (statt AJET-A10-Icon). Der gebaute Aktor
# bekommt via GrantConditionOnPrerequisite@firehawk (aus AJET geerbt) die Condition aot-firehawk
# → identisches Aussehen/Waffen wie umgeschaltete Bestands-AJET.
aot-ajet-firehawk:
	Inherits: AJET
	# aotmod (2026-07-29): Varianten-Condition UNBEDINGT granten. Sie kam bisher nur aus dem
	# von AJET geerbten GrantConditionOnPrerequisite, das den BESITZER auf das Upgrade prueft.
	# Im Karteneditor platzierte Creeps-/Neutral-Instanzen erfuellen das nie -> der Aktor erschien
	# als Basis-Variante (falscher Sprite, falsche Waffe), obwohl der Placer die Variante ist.
	# Der Proxy IST die Variante: das ist konstituierend und darf nicht am Upgrade-Stand haengen.
	GrantCondition@variant:
		Condition: aot-firehawk
	-Encyclopedia:
	RenderSprites:
		Image: aot-ajet
	Valued:
		Cost: 3000
	Buildable:
		LockedGroup: aot-grp-ajet
		BuildPaletteOrder: 10
		# Sichtbar ab Age 3 (~aot-age3), baubar erst nach Firehawk-Upgrade (non-tilde = ausgegraut bis gekauft).
		Prerequisites: ~aot-age3, aflt, aot-firehawk-upgrade
		Queue: Aircraft.GDI.AFLT
		Icon: firehawk-icon
		Description: Firehawk strike fighter. Fires triple-double rocket salvos, effective against ground and air targets.
	# aotmod (2026-07-29): Editor-Vorschau. ConditionalTrait.EnabledByDefault wertet die
	# RequiresCondition mit ALLEN Variablen = false aus; nur dann rendert der Trait im
	# Karteneditor. Deshalb gewann bisher der Basis-Trait ("!variante" ist bei 0 wahr) und
	# der Placer zeigte den Basis-Sprite. Auf diesem Proxy sind die oben unbedingt
	# granteten Conditions IMMER 1 -> Basis-Traits treffen nie zu (entfernt), und bei der
	# Zielvariante werden die stets-wahren Terme gekuerzt. Laufzeit-Semantik bleibt gleich.
	-WithFacingSpriteBody@a10:
	WithFacingSpriteBody@hawk:
		RequiresCondition: aot-firehawk || !aot-firehawk
	WithFacingSpriteBody@hawk-remap:
		RequiresCondition: aot-firehawk || !aot-firehawk

# === Ende aotmod ===

# === Age of Tiberium (aotmod) - aot-mig: MiG Attack Jet (NOD Airstrike-Superpower) ===
# Wird von der STEC-AirstrikePower gespawnt (nicht baubar). Basiert auf A10-Traits, aber:
#   - RA-Remastered MIG.ZIP Sprites (16 Facings) statt A10.
#   - AttackBomber feuert 2 Raketen (aot-MigMissile, Burst 2) statt Napalm/Vulcan,
#     modelliert nach der RA-MiG (Maverick-Raketen, zwei Tragflächen-Startpunkte).
aot-mig:
	Inherits: ^Plane
	Interactable:
	Tooltip:
		Name: MiG Attack Jet
	Valued:
		Cost: 2000
	UpdatesPlayerStatistics:
		AddToAssetsValue: false
	RenderSprites:
		Image: aot-mig
	# ^Plane liefert (anders als ^Helicopter) KEIN Health/HitShape/Targetable + kein airborne —
	# daher hier explizit, damit AA/SAM die MiG im Überflug abfangen kann.
	Health:
		HP: 10000
	HitShape:
	Targetable@AIRBORNE:
		TargetTypes: Air
