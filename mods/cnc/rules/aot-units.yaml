# === Age of Tiberium (aotmod) - MCV: RA sprites in Age 0, TD ab Age 1 ===
# Gleiche Logik wie FACT: GrantConditionOnPrerequisite → zwei WithFacingSpriteBody.
# Kein WithMakeAnimation auf Fahrzeugen nötig.
MCV:
	OretSpawnStateCarrier:
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithFacingSpriteBody:
	WithFacingSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body-ra
		RequiresCondition: !aot-age1-active
	WithFacingSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	# Testrender: gebackene TS-Voxel-Sprites ab Age 2 (aot-mcv-test.zip).
	WithFacingSpriteBody@age2:
		Sequence: aot-age2-idle
		Name: body-age2
		RequiresCondition: aot-age2-active
	# Player-Color-Overlay-Layer: indizierte Remap-Region (176-191) → player-Palette (dynamisch).
	# Liegt über @age2; RGBA-Body ignoriert die player-Palette, indiziertes Overlay nutzt sie.
	WithFacingSpriteBody@age2remap:
		Sequence: aot-age2-remap
		Name: body-age2-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-age2-active
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MCV Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mcv-age0: RA-Icon in Age 0; aot-mcv-age1: TD-Icon ab Age 1.
# Beide erben alle MCV-Traits. RenderSprites.Image: mcv explizit gesetzt
# (sonst würde OpenRA den Aktornamen als Image-Name verwenden → fehlende Sequences).
aot-mcv-age0:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		LockedGroup: aot-grp-mcv
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~!aot-age1, lite, fix
		Icon: aot-ra-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle

aot-mcv-age1:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		LockedGroup: aot-grp-mcv
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~aot-age1, lite, fix
		Icon: aot-ages-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Recon Jeep / HUMVEE / Wolverine ===
# Tier 0: Recon Jeep (kein Upgrade)
# Tier 1: HUMVEE (aot-gdi-advtech-upgrade, seit 2026-08-01 unbedingte Folge von GDI Advanced
# Technologies statt eigenem Kauf-Upgrade) — stärkeres MG
# Tier 2: Wolverine (aot-mtnk-titan-upgrade = GDI Mech Armaments, seit 2026-08-01 unbedingte
# Folge statt eigenem Kauf-Upgrade, kein APC-Bezug mehr) — TS-Mech-Sprite, hat Priorität über HUMVEE
# Wolverine-Sprite hat Vorrang: aot-jeep-wolverine überschreibt HUMVEE- und Base-Body.
JEEP:
	GrantConditionOnPrerequisite@HUMVEE:
		Condition: aot-jeep-humvee
		Prerequisites: aot-gdi-advtech-upgrade

	GrantConditionOnPrerequisite@WOLVERINE:
		Condition: aot-jeep-wolverine
		Prerequisites: aot-mtnk-titan-upgrade

	-Tooltip:

	Tooltip@base:
		Name: Recon Jeep
		RequiresCondition: !aot-jeep-humvee && !aot-jeep-wolverine

	Tooltip@humvee:
		Name: GDI HUMVEE
		RequiresCondition: aot-jeep-humvee && !aot-jeep-wolverine

	Tooltip@wolverine:
		Name: Wolverine
		RequiresCondition: aot-jeep-wolverine

	-Buildable:

	-WithFacingSpriteBody:

	WithFacingSpriteBody@base:
		Sequence: aot-ra-idle
		RequiresCondition: !aot-jeep-humvee && !aot-jeep-wolverine

	WithFacingSpriteBody@humvee:
		Sequence: idle
		RequiresCondition: aot-jeep-humvee && !aot-jeep-wolverine

	WithFacingSpriteBody@wolverine:
		Sequence: aot-wolverine-stand
		Name: body-wolverine
		RequiresCondition: aot-jeep-wolverine

	WithFacingSpriteBody@wolverine-remap:
		Sequence: aot-wolverine-stand-remap
		Name: body-wolverine-remap
