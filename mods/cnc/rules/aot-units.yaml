		Sequence: aot-arty-barrel-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-heavy-upgraded && aot-howitzer-deployed
	# Deploy-Mechanik (nur bei Heavy Upgrade aktiv)
