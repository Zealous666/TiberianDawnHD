# === Age of Tiberium (aotmod) - NOD Flamethrower → Toxic Trooper Upgrade (Age 3) ===
# Gleiches Sprite (E4), nur Waffe wechselt auf Chemspray bei Age 3.
# Proxy-Aktoren aot-e4-nod-flame/toxic steuern Sidebar-Icon je nach Age.
aot-e4-nod:
	Inherits: E4
	RenderSprites:
		Image: aot-e4-nod
	GrantConditionOnPrerequisite@TOXIC:
		Condition: aot-e4-toxic
		# Umbenannt (2026-07-04): aot-e4-toxic-upgrade -> aot-toxic-upgrade, da das
		# Upgrade jetzt auch TTNK und FTUR umstellt, siehe aot-upgrade-e4-toxic.
		Prerequisites: aot-toxic-upgrade
	Armament:
		Weapon: Flamethrower
		LocalOffset: 341,0,256
		FireDelay: 3
		MuzzleSequence: muzzle
		RequiresCondition: !aot-e4-toxic
	Armament@TOXIC:
		Weapon: Chemspray
		LocalOffset: 341,0,256
		FireDelay: 3
		MuzzleSequence: muzzle-chem
		RequiresCondition: aot-e4-toxic
	# Garrison-Waffen (2026-07-05, Pillbox-System): folgen demselben Flame/
	# Toxic-Umschalt-Muster wie die Primaerwaffe oben, mit den Blockable:false-
	# Varianten aus aot-weapons.yaml.
	Armament@GARRISONED-FLAME:
		Name: garrisoned
		Weapon: aot-FlamethrowerGarrisoned
		RequiresCondition: !aot-e4-toxic
	Armament@GARRISONED-TOXIC:
		Name: garrisoned
		Weapon: aot-ChemsprayGarrisoned
		RequiresCondition: aot-e4-toxic
	-Buildable:
# === Ende aotmod ===

# Sidebar-Proxy: Flamethrower Icon (verschwindet bei Age 3)
