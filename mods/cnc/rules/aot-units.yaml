# === Age of Tiberium (aotmod) - V2 Rocket Launcher NOD (Age 0, Doppel-Aktor-Pattern) ===
# aot-v2-base: sofort in LITE (NOD) baubar, verschwindet nach Napalm- ODER Howitzer-Upgrade.
# aot-v2-napalm: ersetzt aot-v2-base nach Napalm-Upgrade, TD-MLRS-Icon, 2-Raketen-Burst.
# Beide erben ^Tank (wie ARTY/MSAM) und definieren alles direkt — V2RL existiert nicht im CnC-Mod.
# Weapon-Switch (napalm/toxic) liegt direkt auf den Aktoren via GrantConditionOnPrerequisite.
aot-v2-base:
	Inherits: ^Tank
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Valued:
		Cost: 1000
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		ShowWhenLocked: False
		BuildPaletteOrder: 5
		Prerequisites: lite, anyhq, ~!aot-napalm-upgrade, ~!aot-howitzer-upgrade
		Queue: LightVehicle.Nod
		Icon: icon
		Description: Long-range rocket artillery. Fires a single ballistic missile. Effective vs. all ground targets.
	# User-Wunsch 2026-08-01: bereits gebaute V2/Napalm-V2 sollen sich beim Kauf von Artillery
	# Ballistics automatisch in den Howitzer verwandeln, analog zum JEEP->HUMVEE-Retrofit. Da
	# ARTY (Howitzer) ein komplett anderer Basis-Aktor als V2 ist (anderes Chassis/Waffe/
	# Locomotor), reicht ein Condition-Switch hier NICHT -- braucht einen echten Aktor-Transform
	# (AotTransformOnPrerequisite, siehe TTNK->Devil's Tongue fuer das gleiche Muster). Kein
	# RequiresCondition noetig: soll fuer Base-V2 UND Napalm-V2 gleichermassen greifen. Erbt auf
	# aot-v2-napalm/aot-v2-toxic mit -- IntoActor (aot-arty-howitzer, Inherits: ARTY) erbt NICHT
	# von aot-v2-base zurueck, also kein Endlos-Transform-Risiko wie bei TTNK-Devil.
	AotTransformOnPrerequisite:
		IntoActor: aot-arty-howitzer
		Prerequisites: aot-howitzer-upgrade
	# Tooltip-Reihenfolge wichtig: Welt nimmt den ERSTEN aktiven, Sidebar NUR den bedingungslosen (letzter).
	# -Tooltip: PFLICHT — der von ^Tank GEERBTE Tooltip behielte sonst seine Merge-Position VOR den
	# konditionalen und würde als erster aktiver Trait immer gewinnen (Name bliebe dauerhaft "V2").
	-Tooltip:
	Tooltip@NAPALM:
		Name: actor-aot-v2-napalm.name
		GenericName: meta-tank-generic-name
		RequiresCondition: aot-napalm-active && !aot-v2-toxic
	Tooltip@TOXIC:
		Name: actor-aot-v2-toxic.name
		GenericName: meta-tank-generic-name
		RequiresCondition: aot-napalm-active && aot-v2-toxic
	Tooltip:
		Name: actor-aot-v2-base.name
		GenericName: meta-tank-generic-name
	Health:
		HP: 12000
	Armor:
		Type: Light
	Mobile:
		Speed: 48
		TurnSpeed: 16
	Repairable:
		HpPerStep: 606
	RevealsShroud:
		Range: 6c0
	AttackFrontal:
		FacingTolerance: 0
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
	Armament:
		Weapon: aot-V2Rocket
		ReloadingCondition: reloading
		RequiresCondition: !aot-napalm-active
	Armament@napalm:
		Weapon: aot-V2Napalm
		ReloadingCondition: reloading
		RequiresCondition: aot-napalm-active && !aot-v2-toxic
	Armament@toxic:
		Weapon: aot-V2Toxic
		ReloadingCondition: reloading
		RequiresCondition: aot-napalm-active && aot-v2-toxic
	GrantConditionOnPrerequisite@napalm:
		Condition: aot-napalm-active
		Prerequisites: aot-napalm-upgrade
	# Toxic greift erst wenn AUCH das Napalm-Upgrade da ist (analog TTNK: toxic + flame).
	GrantConditionOnPrerequisite@toxic:
		Condition: aot-v2-toxic
		Prerequisites: aot-toxic-upgrade, aot-napalm-upgrade
	Turreted:
		TurnSpeed: 0
		RealignDelay: -1
	WithSpriteTurret:
		RequiresCondition: aot-napalm-active && !reloading
		Sequence: napalm-turret
	WithFacingSpriteBody:
		RequiresCondition: !reloading && !aot-napalm-active
		Name: loaded
	WithFacingSpriteBody@EMPTY:
		RequiresCondition: reloading && !aot-napalm-active
		Sequence: empty-idle
		Name: reloading
	WithFacingSpriteBody@NAPALM:
		RequiresCondition: aot-napalm-active
		Sequence: napalm-idle
		Name: napalmloaded
	RenderSprites:
		Image: v2rl
	FireWarheadsOnDeath:
		Weapon: UnitExplodeBig
		EmptyWeapon: UnitExplodeBig
	Selectable:
		DecorationBounds: 1194, 1194

aot-v2-napalm:
	Inherits: aot-v2-base
	# Napalm Rocket Launcher: Preis 1250 (User-Freigabe 2026-08-01, Staffelung Basis/+25%/+50%).
	Valued:
		Cost: 1250
	Buildable:
		LockedGroup: aot-grp-v2
		BuildPaletteOrder: 40
		Prerequisites: lite, anyhq, ~aot-napalm-upgrade, ~!aot-toxic-upgrade, ~!aot-howitzer-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-v2-napalm-icon
		Description: Napalm-upgraded V2. Fires two rockets in rapid succession. Highly effective vs. infantry.
	-Tooltip:
	Tooltip@NAPALM:
		Name: actor-aot-v2-napalm.name
		RequiresCondition: !aot-v2-toxic
	Tooltip@TOXIC:
		Name: actor-aot-v2-toxic.name
		RequiresCondition: aot-v2-toxic
	# Bedingungsloser Tooltip NUR für die Sidebar (Welt nimmt die konditionalen oben)
	Tooltip@SIDEBAR:
		Name: actor-aot-v2-napalm.name
	GrantConditionOnPrerequisite@toxic:
		Condition: aot-v2-toxic
		Prerequisites: aot-toxic-upgrade, aot-napalm-upgrade
	-Armament:
	Armament@napalm:
		Weapon: aot-V2Napalm
		ReloadingCondition: reloading
		RequiresCondition: !aot-v2-toxic
	Armament@toxic:
		Weapon: aot-V2Toxic
		ReloadingCondition: reloading
		RequiresCondition: aot-v2-toxic

# aot-v2-toxic: ersetzt aot-v2-napalm im Baumenü nach dem Toxic-Upgrade (eigenes Icon/Name/Beschreibung)
aot-v2-toxic:
	Inherits: aot-v2-napalm
	# Toxic Rocket Launcher: Preis 1500 (User-Freigabe 2026-08-01, Staffelung Basis/+25%/+50%).
	Valued:
		Cost: 1500
