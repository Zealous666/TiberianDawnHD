# === Age of Tiberium (aotmod) - AJET: GDI Fighter Jet (Air Field, ab Age 1) ===
# Basiert auf A10-Traits (Sprites, Waffen) — A10-Aktor selbst bleibt unverändert.
# Landet NUR am AFLT (RearmActors/RepairActors: aflt).
AJET:
	Inherits: ^Plane
	Inherits@selection: ^SelectableCombatUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	# Firehawk-Upgrade: spielerweite Condition auf ALLE AJET (bereits gebaut + neu).
	GrantConditionOnPrerequisite@firehawk:
		Condition: aot-firehawk
		Prerequisites: aot-firehawk-upgrade
	Valued:
		Cost: 2500
	Tooltip:
		Name: GDI Fighter
		RequiresCondition: !aot-firehawk
	Tooltip@firehawk:
		Name: Firehawk
		RequiresCondition: aot-firehawk
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		LockedGroup: aot-grp-ajet
		BuildPaletteOrder: 10
		Prerequisites: ~aot-age1, aflt, ~!aot-firehawk-upgrade
		Queue: Aircraft.GDI.AFLT
		Description: Ground attack jet. Armed with Vulcan cannons and napalm bombs.
	-RejectsOrders:
	Aircraft:
		TurnSpeed: 16
		Speed: 250
		# Mindestabstand ~2 Zellen beim Fliegen (sonst "kuscheln" die Jets).
		Repulsable: true
		IdealSeparation: 2c0
		# ^Plane bringt kein AirborneCondition mit → explizit setzen, damit Targetable@GROUND/@AIRBORNE
		# umschalten (fliegend nur per Anti-Air treffbar, gelandet als Ground).
		AirborneCondition: airborne
		IdleBehavior: None
		TakeOffOnResupply: false
		TakeOffOnCreation: true
	Health:
		HP: 10000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
		RequiresCondition: !aot-firehawk
	# Firehawk-Upgrade: doppelte Sichtweite.
	RevealsShroud@firehawk:
		Range: 20c0
		Type: GroundPosition
		RequiresCondition: aot-firehawk
	AttackAircraft:
		FacingTolerance: 40
		AttackType: Strafe
		Voice: Attack
	# Firehawk-Upgrade: darf auch Gebäude automatisch angreifen (DEFAULT-Prio hat kein Structure).
	# A-10 bleibt unverändert (Default-Prio nur aktiv wenn !aot-firehawk).
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything && !aot-firehawk
	AutoTargetPriority@firehawk:
		RequiresCondition: !stance-attackanything && aot-firehawk
		ValidTargets: Infantry, Vehicle, Creep, Water, Air, Support, Structure
		InvalidTargets: NoAutoTarget
	Armament@PRIMARY:
		Weapon: aot-AjetVulcan
		LocalOffset: 1024,0,-85
		PauseOnCondition: !vulcan-ammo
		RequiresCondition: !aot-firehawk
	WithMuzzleOverlay:
	Armament@SECONDARY:
		Weapon: aot-AjetNapalm
		LocalOffset: 0,-256,-43, 0,256,-43
		PauseOnCondition: !napalm-ammo
		RequiresCondition: !aot-firehawk
	# Firehawk-Raketen: 3x Doppel-Burst, zwei Tragflächen-Startpunkte (wie Napalm).
	Armament@ROCKETS:
		Weapon: aot-FirehawkMissile
		LocalOffset: 0,-256,-43, 0,256,-43
		PauseOnCondition: !rocket-ammo
		RequiresCondition: aot-firehawk
	Contrail@1:
		Offset: -640,171,0
		TrailLength: 15
		StartColorAlpha: 128
	Contrail@2:
		Offset: -640,-171,0
		TrailLength: 15
		StartColorAlpha: 128
	AmmoPool@VULCAN:
		Name: vulcan
		Ammo: 10
		AmmoCondition: vulcan-ammo
		ReloadDelay: 8
	AmmoPool@NAPALM:
		Name: napalm
		Ammo: 20
		AmmoCondition: napalm-ammo
		ReloadDelay: 8
	AmmoPool@ROCKET:
		Name: rocket
		Ammo: 6
		AmmoCondition: rocket-ammo
		ReloadDelay: 8
	Rearmable:
		RearmActors: aflt
		AmmoPools: vulcan, napalm, rocket
	AotReturnWhenEmpty:
	Repairable:
		RepairActors: aflt
	FireWarheadsOnDeath:
		Weapon: HeliExplode
		EmptyWeapon: HeliExplode
	HitShape:
	Huntable:
	Voiced:
		VoiceSet: VehicleVoice
	Guard:
	Guardable:
	Selectable:
		DecorationBounds: 1280, 1024
	Targetable@GROUND:
		TargetTypes: Ground, Vehicle
		RequiresCondition: !airborne
	Targetable@AIRBORNE:
		TargetTypes: Air
		RequiresCondition: airborne
	RenderSprites:
		Image: aot-ajet
	# Firehawk-Upgrade: a10-Body aus, Firehawk-Body + Cockpit-Player-Color-Remap an.
	-WithFacingSpriteBody:
