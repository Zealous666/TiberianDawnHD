		Turret: secondary
		Weapon: aot-8Inch
		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 171
		RecoilRecovery: 34
		MuzzleSequence: muzzle
		RequiresCondition: !aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	Armament@railgun-primary:
		Turret: primary
		Weapon: aot-CruiserRailgun
		LocalOffset: 480,-100,40, 480,100,40
		RequiresCondition: aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	Armament@railgun-secondary:
		Name: secondary
		Turret: secondary
		Weapon: aot-CruiserRailgun
		LocalOffset: 480,-100,40, 480,100,40
		RequiresCondition: aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	WithMuzzleOverlay:
	WithSpriteTurret@primary:
		Turret: primary
		Sequence: turret
		RequiresCondition: !aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	WithSpriteTurret@secondary:
		Turret: secondary
		Sequence: turret
		RequiresCondition: !aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	WithSpriteTurret@railgun-primary:
		Turret: primary
		Sequence: turret-railgun
		RequiresCondition: aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	WithSpriteTurret@railgun-secondary:
