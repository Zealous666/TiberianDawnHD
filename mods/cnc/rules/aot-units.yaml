		LocalOffset: 480,-100,40, 480,100,40
		Recoil: 171
		RecoilRecovery: 34
		MuzzleSequence: muzzle
		RequiresCondition: !aot-cruiser-railgun-upgrade && !aot-cruiser-carrier-upgrade
	Armament@secondary:
