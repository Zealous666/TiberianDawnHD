# === Age of Tiberium (aotmod) - MCV: RA sprites in Age 0, TD ab Age 1 ===
# Gleiche Logik wie FACT: GrantConditionOnPrerequisite → zwei WithFacingSpriteBody.
# Kein WithMakeAnimation auf Fahrzeugen nötig.
MCV:
	OretSpawnStateCarrier:
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithFacingSpriteBody:
	WithFacingSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body-ra
		RequiresCondition: !aot-age1-active
	WithFacingSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	# Testrender: gebackene TS-Voxel-Sprites ab Age 2 (aot-mcv-test.zip).
	WithFacingSpriteBody@age2:
		Sequence: aot-age2-idle
		Name: body-age2
		RequiresCondition: aot-age2-active
	# Player-Color-Overlay-Layer: indizierte Remap-Region (176-191) → player-Palette (dynamisch).
	# Liegt über @age2; RGBA-Body ignoriert die player-Palette, indiziertes Overlay nutzt sie.
	WithFacingSpriteBody@age2remap:
		Sequence: aot-age2-remap
		Name: body-age2-remap
		RequiresCondition: aot-age2-active
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MCV Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mcv-age0: RA-Icon in Age 0; aot-mcv-age1: TD-Icon ab Age 1.
# Beide erben alle MCV-Traits. RenderSprites.Image: mcv explizit gesetzt
# (sonst würde OpenRA den Aktornamen als Image-Name verwenden → fehlende Sequences).
aot-mcv-age0:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~!aot-age1, lite, fix
		Icon: aot-ra-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle

aot-mcv-age1:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~aot-age1, lite, fix
		Icon: aot-ages-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Recon Jeep / HUMVEE ===
JEEP:
	GrantConditionOnPrerequisite@HUMVEE:
		Condition: aot-jeep-humvee
		Prerequisites: aot-humvee-upgrade

	-Tooltip:

	Tooltip@base:
		Name: Recon Jeep
		RequiresCondition: !aot-jeep-humvee

	Tooltip@humvee:
		Name: GDI HUMVEE
		RequiresCondition: aot-jeep-humvee

	-Buildable:

	-WithFacingSpriteBody:

	WithFacingSpriteBody@base:
		Sequence: aot-ra-idle
		RequiresCondition: !aot-jeep-humvee

	WithFacingSpriteBody@humvee:
		Sequence: idle
		RequiresCondition: aot-jeep-humvee

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: aot-ra-turret
		RequiresCondition: !aot-jeep-humvee

	WithSpriteTurret@humvee:
		Sequence: turret
		RequiresCondition: aot-jeep-humvee

	Armament:
		Weapon: MachineGunH
		LocalOffset: 171,0,85
		MuzzleSequence: muzzle
		RequiresCondition: !aot-jeep-humvee

	Armament@humvee:
		Weapon: aot-JeepHumvee
		LocalOffset: 171,0,85
		MuzzleSequence: muzzle
		RequiresCondition: aot-jeep-humvee
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MTNK Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mtnk-base: sichtbar sobald LITE steht, verschwindet wenn Predator-Upgrade aktiv.
# aot-mtnk-pred: sichtbar wenn Predator aktiv, verschwindet wenn Railgun aktiv.
# aot-mtnk-rail: sichtbar wenn Railgun aktiv.
aot-mtnk-base:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~!aot-mtnk-predator-upgrade
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank

aot-mtnk-pred:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~aot-mtnk-predator-upgrade, ~!aot-mtnk-railgun-upgrade
		Icon: aot-mtnk-pred-icon
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank (Predator)

aot-mtnk-rail:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~aot-mtnk-railgun-upgrade
		Icon: aot-mtnk-rail-icon
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank (Railgun)
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MTNK Upgrade-Conditions ===
MTNK:
	GrantConditionOnPrerequisite@PREDATOR:
		Condition: aot-mtnk-predator
		Prerequisites: aot-mtnk-predator-upgrade

	GrantConditionOnPrerequisite@RAILGUN:
		Condition: aot-mtnk-railgun
		Prerequisites: aot-mtnk-railgun-upgrade

	-Tooltip:

	Tooltip@normal:
		Name: Medium Tank
		RequiresCondition: !aot-mtnk-predator

	Tooltip@predator:
		Name: Medium Tank (Predator)
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	Tooltip@railgun:
		Name: Medium Tank (Railgun)
		RequiresCondition: aot-mtnk-railgun

	Armament:
		Weapon: 120mm
		RequiresCondition: !aot-mtnk-predator
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@predator:
		Weapon: aot-MtnkPredator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@railgun:
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-railgun
		LocalOffset: 768,0,90

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: turret
		RequiresCondition: !aot-mtnk-predator

	WithSpriteTurret@predator:
		Sequence: aot-mtnk-turret-predator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	WithSpriteTurret@railgun:
		Sequence: aot-mtnk-turret-railgun
		RequiresCondition: aot-mtnk-railgun
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - HTNK Upgrades ===
# aot-htnk-base:   Age 1, keine Raketen, kein Railgun
# aot-htnk-rocket: Age 2 Rocket-Upgrade aktiv, noch kein Railgun
# aot-htnk-laser:  Age 3 Railgun-Upgrade aktiv
aot-htnk-base:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-weap, ~aot-age1, aot-age1, weap, atec, ~!aot-htnk-rocket-upgrade, ~!aot-htnk-railgun-upgrade
		Description: Heavily armored GDI battle tank with dual 120mm cannons.
	Tooltip:
		Name: Mammoth Tank

aot-htnk-rocket:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age1, aot-age1, ~aot-htnk-rocket-upgrade, ~!aot-htnk-railgun-upgrade
		Icon: aot-htnk-rocket-icon
		Description: Mammoth Tank equipped with dual rocket launchers for additional anti-air and ground firepower.
	Tooltip:
		Name: Mammoth Tank (Rocket)

aot-htnk-laser:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age1, aot-age1, ~aot-htnk-railgun-upgrade
		Icon: aot-htnk-laser-icon
		Description: Mammoth Tank with dual high-powered railguns replacing the 120mm cannons. Devastating against all targets.
	Tooltip:
		Name: Mammoth Tank (Railgun)

HTNK:
	GrantConditionOnPrerequisite@ROCKET:
		Condition: aot-htnk-rocket
		Prerequisites: aot-htnk-rocket-upgrade

	GrantConditionOnPrerequisite@LASER:
		Condition: aot-htnk-laser
		Prerequisites: aot-htnk-railgun-upgrade

	Tooltip@rocket:
		Name: Mammoth Tank
		RequiresCondition: aot-htnk-rocket && !aot-htnk-laser

	Tooltip@laser:
		Name: Mammoth Tank
		RequiresCondition: aot-htnk-laser

	-Armament@PRIMARY:

	Armament@PRIMARY:
		Weapon: 120mmDual
		LocalOffset: 900,180,340, 900,-180,340
		Recoil: 170
		RecoilRecovery: 42
		MuzzleSequence: muzzle
		RequiresCondition: !aot-htnk-laser

	Armament@SECONDARY:
		Name: secondary
		Weapon: MammothMissiles
		LocalOffset: -85,384,340, -85,-384,340
		LocalYaw: -100, 100
		Recoil: 10
		MuzzleSequence: muzzle
		RequiresCondition: aot-htnk-rocket

	Armament@laser:
		Weapon: aot-HtnkLaser
		LocalOffset: 900,180,340, 900,-180,340
		RequiresCondition: aot-htnk-laser

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: aot-htnk-norocket-turret
		RequiresCondition: !aot-htnk-rocket && !aot-htnk-laser

	WithSpriteTurret@rocket:
		Sequence: turret
		RequiresCondition: aot-htnk-rocket && !aot-htnk-laser

	WithSpriteTurret@laser:
		Sequence: aot-htnk-railgun-turret
		RequiresCondition: aot-htnk-laser
# === Ende aotmod ===


# === Age of Tiberium (aotmod) - APC: kein Turret, schießt frontal ===
APC:
	-WithSpriteTurret:
	-WithSpriteTurret@AIR:
	-Turreted:
	-AttackTurreted:

	AttackFrontal:
		FacingTolerance: 0
		Voice: Attack

	Armament@PRIMARY:
		Weapon: aot-JeepHumvee
		LocalOffset: 255,0,189
		MuzzleSequence: muzzle
		RequiresCondition: !aot-amphibious-upgrade

	Armament@SECONDARY:
		RequiresCondition: !aot-amphibious-upgrade

	GrantConditionOnPrerequisite@AMPHIBIOUS:
		Condition: aot-amphibious-upgrade
		Prerequisites: aot-amphibious-upgrade

	-WithFacingSpriteBody:
	WithFacingSpriteBody@base:
		Sequence: idle
		RequiresCondition: !aot-amphibious-upgrade
	WithFacingSpriteBody@amphibious:
		Sequence: aot-amphibious-idle
		Name: body-amphibious
		RequiresCondition: aot-amphibious-upgrade
	AotTransformsOnTerrain@WATER:
		IntoActor: aot-apc-amphibious
		TerrainTypes: Clear, Rough, Road, Bridge, Tiberium, BlueTiberium, Beach, Water, Rock
		RequiresCondition: aot-amphibious-upgrade
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Jeep Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-jeep-base: Recon-Jeep-Icon vor HUMVEE-Upgrade.
# aot-jeep-humvee: HUMVEE-Icon nach HUMVEE-Upgrade.
# Beide verschwinden wenn APC-Upgrade aktiv (~!aot-apc-upgrade).
aot-jeep-base:
	Inherits: JEEP
	RenderSprites:
		Image: jeep
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 3
		Prerequisites: lite, pyle, ~!aot-humvee-upgrade, ~!aot-apc-upgrade
		Description: Fast reconnaissance vehicle. Can carry 1 soldier.
	Tooltip:
		Name: Recon Jeep

aot-jeep-humvee:
	Inherits: JEEP
	RenderSprites:
		Image: jeep
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 3
		Prerequisites: lite, pyle, ~aot-humvee-upgrade, ~!aot-apc-upgrade
		Icon: aot-humvee-icon
		Description: Fast reconnaissance vehicle with HUMVEE armor and stronger machine gun.
	Tooltip:
		Name: GDI HUMVEE
aot-apc-amphibious:
	Inherits: APC
	RenderSprites:
		Image: apc
	Mobile:
		Locomotor: aot-amphibious
	-Armament@PRIMARY:
	-Armament@SECONDARY:
	-WithMuzzleOverlay:
	-GrantConditionOnAttack:
	-AotTransformsOnTerrain@WATER:
	AotGrantConditionOnTerrain:
		Condition: aot-in-water
		TerrainTypes: Water
	-WithFacingSpriteBody@amphibious:
	WithFacingSpriteBody@amphibious:
		Sequence: aot-amphibious-idle
		Name: body-amphibious
		RequiresCondition: !aot-in-water
	WithFacingSpriteBody@amphibious-remap:
		Sequence: aot-amphibious-remap
		Name: body-amphibious-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: !aot-in-water
	WithFacingSpriteBody@amphibious-water:
		Sequence: aot-amphibious-idle-water
		Name: body-amphibious-water
		RequiresCondition: aot-in-water
	WithFacingSpriteBody@amphibious-water-remap:
		Sequence: aot-amphibious-water-remap
		Name: body-amphibious-water-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-in-water
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 4
		Prerequisites: lite, ~aot-apc-upgrade, ~aot-amphibious-upgrade, ~!aot-humvee-upgrade
		Icon: aot-amphibious-icon
		Description: Amphibious APC. Drives on land and through water. Can carry 5 soldiers. Unarmed.
	Tooltip:
		Name: Amphibious APC
	Cargo:
		Types: Infantry
		MaxWeight: 5
		UnloadVoice: Unload
		LoadingCondition: notmobile
	WithCargoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		CustomPipSequences:
			gray: pip-gray
			yellow: pip-yellow
			red: pip-red
# === Ende aotmod ===


# === Age of Tiberium (aotmod) - Ore Transporter ===
# Fährt zur Ore Mine, lädt Erz, fährt zum Construction Yard.
# Doppel-Aktor-Pattern: aot-oret-gdi (Barracks) + aot-oret-nod (Hand of Nod).
ORET:
	Inherits: ^Tank
	Valued:
		Cost: 500
	Tooltip:
		Name: actor-oret.name
		GenericName: actor-oret.generic-name
	Selectable:
		DecorationBounds: 1536, 1536
	Mobile:
		Speed: 50
	Health:
		HP: 50000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 4c0
	Repairable:
		HpPerStep: 2000
	StoresResources:
		Capacity: 1
		Resources: Tiberium
	DockClientManager:
	OreTransporter:
		OreLoadAmount: 100
		OreLoadDelay: 25
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		PipCount: 1
		ResourceSequences:
			Tiberium: pip-green

aot-oret-lite:
	Inherits: ORET
	RenderSprites:
		Image: oret
	Buildable:
		BuildPaletteOrder: 1
		Prerequisites: lite
		Queue: LightVehicle.GDI, LightVehicle.Nod
		Description: Collects ore from mines and delivers it to the refinery.
	Tooltip:
		Name: actor-oret.name
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - LTNK Queue-Proxies (Doppel-Aktor-Pattern) ===
aot-ltnk-base:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~!aot-ltnk-upgrade
		Description: Fast and agile NOD light tank. Available from Age 1.
	Tooltip:
		Name: Light Tank

aot-ltnk-tick:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~aot-ltnk-upgrade, ~!aot-ltnk-upgrade2
		Icon: ltnk-tick-icon
		Description: Light Tank upgraded with Tick Tank chassis. Enables dig-in siege mode. Requires FIX facility.
	Tooltip:
		Name: Light Tank (Tick Chassis)

aot-ltnk-laser:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~aot-ltnk-upgrade2
		Icon: ltnk-laser-icon
		Description: Light Tank (Tick Chassis) with experimental laser turret. Remains deployed after upgrade.
	Tooltip:
		Name: Light Tank (Laser)
# === Ende aotmod ===

LTNK:
	-Buildable:

	-Tooltip:

	Tooltip@normal:
		Name: Light Tank
		RequiresCondition: !aot-ltnk-upgraded

	Tooltip@ttnk:
		Name: Light Tank (Tick Chassis)
		RequiresCondition: aot-ltnk-upgraded && !aot-ltnk-upgraded2

	Tooltip@laser:
		Name: Light Tank (Laser)
		RequiresCondition: aot-ltnk-upgraded2

	GrantConditionOnPrerequisite:
		Condition: aot-ltnk-upgraded
		Prerequisites: aot-ltnk-upgrade

	GrantConditionOnPrerequisite@upgrade2:
		Condition: aot-ltnk-upgraded2
		Prerequisites: aot-ltnk-upgrade2

	-WithFacingSpriteBody:

	WithFacingSpriteBody@normal:
		Sequence: idle
		RequiresCondition: !aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithFacingSpriteBody@ttnk:
		Sequence: aot-tick-idle
		RequiresCondition: aot-ltnk-upgraded || aot-ltnk-upgraded2

	-WithSpriteTurret:

	WithSpriteTurret@normal:
		Sequence: turret
		RequiresCondition: !aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithSpriteTurret@dark:
		Sequence: aot-turret-dark
		RequiresCondition: aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithSpriteTurret@laser:
		Sequence: aot-turret-laser
		RequiresCondition: aot-ltnk-upgraded2

	Armament:
		Weapon: 70mm
		RequiresCondition: !aot-ltnk-upgraded2
		Recoil: 85
		RecoilRecovery: 17
		LocalOffset: 720,0,90
		MuzzleSequence: muzzle

	Armament@upgraded2:
		Weapon: aot-LtnkLaser
		RequiresCondition: aot-ltnk-upgraded2
		LocalOffset: 768,0,90

	Transforms:
		IntoActor: aot-ltnk-deployed
		Facing: 640
		RequiresCondition: aot-ltnk-upgraded
		TransformSounds: cashturn.aud

# aot-ltnk-deployed: Deployed / burrowed state of the Tick Tank upgrade
# Created via Transforms from LTNK, transforms back to LTNK on undeploy.
# Gebäude-Pattern: WithMakeAnimation spielt deploy-Sequence (gatickmk frames 0-23),
# danach zeigt WithSpriteBody den buried-Frame (24) als idle.
aot-ltnk-deployed:
	Inherits: ^Building

	Building:
		Footprint: x
		Dimensions: 1,1
		RequiresBaseProvider: false
		TerrainTypes: Clear,Road,Rough,Dirt,Rock,Water

	-ActorPreviewPlaceBuildingPreview:
	-Demolishable:
	-FrozenUnderFog:
	-CommandBarBlacklist:
	-AcceptsDeliveredCash:
	-Guardable:
	-ShakeOnDeath:

	ActorLostNotification:
		Notification: UnitLost
		TextNotification: notification-unit-lost

	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: UnitExplodeSmall
		EmptyWeapon: UnitExplodeSmall

	GrantConditionOnPrerequisite@laser:
		Condition: aot-ltnk-upgraded2
		Prerequisites: aot-ltnk-upgrade2

	RenderSprites:
		Image: aot-gatick
		PlayerPalette: player

	-WithSpriteBody:
	WithSpriteBody:
		Sequence: idle
		Name: body

	WithMakeAnimation:
		Sequence: deploy
		BodyNames: body
		Condition: build-incomplete

	Selectable:
		Bounds: 1024, 1024
		Priority: 10

	Targetable:
		TargetTypes: Ground, Vehicle

	Health:
		HP: 48000

	Armor:
		Type: Concrete

	Turreted:
		InitialFacing: 640
		TurnSpeed: 28
		Offset: -150, 150, 0

	Armament@PRIMARY:
		Weapon: 70mm
		Turret: primary
		LocalOffset: 720,0,90
		MuzzleSequence: muzzle
		Recoil: 85
		RecoilRecovery: 17
		RequiresCondition: !aot-ltnk-upgraded2

	Armament@LASER:
		Weapon: aot-LtnkLaser
		Turret: primary
		LocalOffset: 720,0,90
		RequiresCondition: aot-ltnk-upgraded2

	AttackTurreted:

	WithSpriteTurret@tick:
		Sequence: turret
		RequiresCondition: !aot-ltnk-upgraded2

	WithSpriteTurret@laser:
		Sequence: turret-laser
		RequiresCondition: aot-ltnk-upgraded2

	WithMuzzleOverlay:

	Transforms:
		IntoActor: ltnk
		Facing: 640
		TransformSounds: text2.aud
		RequiresCondition: !build-incomplete

	TransformsIntoTransforms:

	Tooltip:
		Name: Tick Tank (Burrowed)
		GenericName: meta-tank-generic-name

	Valued:
		Cost: 750

	MustBeDestroyed:

	RevealsShroud:
		Range: 6c0

	Voiced:
		VoiceSet: VehicleVoice

	ActorLostNotification:
		TextNotification: notification-unit-lost

# TRUCK: aus Vehicle-Queue heraus, jetzt in LITE (LightVehicle-Queue), nur lite als Prerequisite
TRUCK:
	-Buildable:
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite
		Queue: LightVehicle.GDI, LightVehicle.Nod
		Description: Transports supplies to friendly structures.

# HARV: ab Age 1 sichtbar (ausgegraut bis PROC gebaut), baubar erst mit PROC
# Proxy-Aktor-Pattern wie MCV/JEEP/MTNK: -Buildable: im Basis-Aktor, Buildable im Proxy.
HARV:
	-Buildable:

aot-harv:
	Inherits: HARV
	RenderSprites:
		Image: harv
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: ~aot-age1, proc
		Queue: Vehicle.GDI, Vehicle.Nod
		Description: Harvests Tiberium and returns it to the refinery.

# === Age of Tiberium (aotmod) - Apache / ORCA Upgrade-System ===
# Doppel-Aktor-Pattern analog zu Jeep/HUMVEE.
# Apache (Tier 0): sofort nach HPAD baubar, RA Longbow Sprites, reduzierter Schaden, nur AG.
# ORCA (Tier 1): sichtbar nach ORCA-Upgrade, volle Stats, ORCA Sprites.

aot-apache-husk:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: Apache
	Aircraft:
		TurnSpeed: 16
		Speed: 186
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
	RenderSprites:
		Image: aot-heli
	WithFacingSpriteBody:
		Sequence: aot-apache-idle

aot-apache-base:
	Inherits: ORCA
	AmmoPool:
		Ammo: 5
	Buildable:
		Queue: Aircraft.GDI
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~!aot-orca-upgrade
		Description: Light attack helicopter. Armed with anti-ground-rockets.
	Tooltip:
		Name: Apache

aot-orca-upgraded:
	Inherits: ORCA
	AmmoPool:
		Ammo: 5
	Buildable:
		Queue: Aircraft.GDI
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~aot-orca-upgrade
		Icon: aot-orca-icon
		Description: Advanced gunship. Carries anti-ground and anti-air missiles. Returns to base when ammo is depleted.
	Tooltip:
		Name: ORCA
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - HIND / Harpy Upgrade-System ===
# Doppel-Aktor-Pattern analog zu Apache/ORCA.
# HIND (Tier 0): sofort nach NOD HPAD baubar, RA Soviet HIND Sprites, begrenzte Mun.
# Harpy (Tier 1, nach Harpy Upgrade): Original CnC NOD Helikopter Sprites, unendliche Mun.

aot-hind-base:
	Inherits: HELI
	AmmoPool:
		Ammo: 6
	ReloadAmmoPool:
		Delay: 100
		Count: 2
	Buildable:
		Queue: Aircraft.Nod
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~!aot-harpy-upgrade
		Description: Soviet attack helicopter. Armed with chain guns. Reloads ammunition automatically while airborne.
	Tooltip:
		Name: HIND

aot-harpy-husk:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: actor-heli-husk-name
	Aircraft:
		TurnSpeed: 16
		Speed: 186
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
	RenderSprites:
		Image: aot-hind
	GrantConditionOnPrerequisite@harpyupgrade:
		Condition: aot-harpy-upgraded
		Prerequisites: aot-harpy-upgrade
	-WithFacingSpriteBody:
	WithFacingSpriteBody@hind:
		Sequence: aot-hind-idle
		Name: body
		RequiresCondition: !aot-harpy-upgraded
	WithFacingSpriteBody@harpy:
		Sequence: aot-harpy-test-idle
		Name: body-harpy
		RequiresCondition: aot-harpy-upgraded
	WithFacingSpriteBody@harpyremap:
		Sequence: aot-harpy-test-remap
		Name: body-harpy-remap
		RequiresCondition: aot-harpy-upgraded
	WithIdleOverlay@hind:
		Offset: 0,0,85
		Sequence: aot-hind-rotor
		RequiresCondition: !aot-harpy-upgraded
	WithIdleOverlay@harpy:
		Offset: 0,0,85
		Sequence: rotor
		RequiresCondition: aot-harpy-upgraded

aot-harpy-upgraded:
	Inherits: HELI
	AmmoPool:
		Ammo: 6
	ReloadAmmoPool:
		Delay: 30
		Count: 2
	Buildable:
		Queue: Aircraft.Nod
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~aot-harpy-upgrade
		Icon: aot-harpy-icon
		Description: Upgraded attack helicopter. Deals increased damage with a higher fire rate. Reloads ammunition automatically while airborne. Cloaks when not engaged.
	Tooltip:
		Name: Harpy
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - AJET: GDI Fighter Jet (Air Field, ab Age 1) ===
# Basiert auf A10-Traits (Sprites, Waffen) — A10-Aktor selbst bleibt unverändert.
# Landet NUR am AFLT (RearmActors/RepairActors: aflt).
AJET:
	Inherits: ^Plane
	Inherits@selection: ^SelectableCombatUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Valued:
		Cost: 1200
	Tooltip:
		Name: GDI Fighter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~aot-age1, aflt
		Queue: Aircraft.GDI.AFLT
		Description: Ground attack jet. Armed with Vulcan cannons and napalm bombs.
	-RejectsOrders:
	Aircraft:
		TurnSpeed: 16
		Speed: 250
		Repulsable: false
		IdleBehavior: None
		TakeOffOnResupply: false
		TakeOffOnCreation: true
	Health:
		HP: 10000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
	AttackAircraft:
		FacingTolerance: 40
		AttackType: Strafe
		Voice: Attack
	Armament@PRIMARY:
		Weapon: aot-AjetVulcan
		LocalOffset: 1024,0,-85
		PauseOnCondition: !vulcan-ammo
	WithMuzzleOverlay:
	Armament@SECONDARY:
		Weapon: aot-AjetNapalm
		LocalOffset: 0,-256,-43, 0,256,-43
		PauseOnCondition: !napalm-ammo
	Contrail@1:
		Offset: -640,171,0
		TrailLength: 15
		StartColorAlpha: 128
	Contrail@2:
		Offset: -640,-171,0
		TrailLength: 15
		StartColorAlpha: 128
	AmmoPool@VULCAN:
		Name: vulcan
		Ammo: 10
		AmmoCondition: vulcan-ammo
		ReloadDelay: 8
	AmmoPool@NAPALM:
		Name: napalm
		Ammo: 20
		AmmoCondition: napalm-ammo
		ReloadDelay: 8
	Rearmable:
		RearmActors: aflt
		AmmoPools: vulcan, napalm
	AotReturnWhenEmpty:
	Repairable:
		RepairActors: aflt
	FireWarheadsOnDeath:
		Weapon: HeliExplode
		EmptyWeapon: HeliExplode
	HitShape:
	Huntable:
	Voiced:
		VoiceSet: VehicleVoice
	Guard:
	Guardable:
	Selectable:
		DecorationBounds: 1280, 1024
	Targetable@GROUND:
		TargetTypes: Ground, Vehicle
	Targetable@AIRBORNE:
		TargetTypes: Air
	RenderSprites:
		Image: aot-ajet
	Encyclopedia:
		Description: GDI ground attack fighter jet.
		Order: 260
		Scale: 3
		Category: Aircraft
		PreviewOwner: GDI
	WithAmmoPipsDecoration:
		AmmoPools: vulcan
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true

# === Age of Tiberium (aotmod) - TTNK Heavy Tank (NOD, Tier 0) ===
# Age-0: RA Remastered 3TNK Sprites, Dual-Kanone (aot-TtnkDual).
# Age-1 Upgrade: Flame Tank (FTNK Sprites, BigFlamer × 2, AttackFrontal).
# Age-3 Upgrade: Toxin Tank (Chemspray × 2, Sprite-Wechsel später).
TTNK:
	Inherits: ^Tank
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Valued:
		Cost: 600
	-Tooltip:
	Tooltip@normal:
		Name: actor-ttnk.name
		RequiresCondition: !aot-ttnk-flame
	Tooltip@flame:
		Name: actor-ttnk-flame.name
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin && !aot-ttnk-cloak
	Tooltip@toxin:
		Name: actor-ttnk-toxin.name
		RequiresCondition: aot-ttnk-toxin
	Tooltip@cloak:
		Name: actor-ttnk-cloak.name
		RequiresCondition: aot-ttnk-cloak
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Mobile:
		Speed: 80
		TurnSpeed: 24
	Health:
		HP: 28000
	Repairable:
		HpPerStep: 1400
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 5c0
	Turreted:
		TurnSpeed: 24
	Armament@PRIMARY:
		Weapon: aot-TtnkDual
		LocalOffset: 768,0,90
		Recoil: 85
		RecoilRecovery: 17
		MuzzleSequence: muzzle
		RequiresCondition: !aot-ttnk-flame
	Armament@flame:
		Weapon: BigFlamer
		LocalOffset: 512,128,42, 512,-128,42
		MuzzleSequence: aot-flame-muzzle
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	Armament@toxin:
		Weapon: aot-TtnkChemspray
		LocalOffset: 512,128,42, 512,-128,42
		MuzzleSequence: aot-toxin-muzzle
		RequiresCondition: aot-ttnk-toxin
	Encyclopedia:
		Description: actor-ttnk.encyclopedia
		Order: 155
		Category: Vehicles
		Scale: 3
		PreviewOwner: Nod
	AttackMove:
		Voice: Attack
	AttackTurreted:
		Voice: Attack
		RequiresCondition: !aot-ttnk-flame
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
		RequiresCondition: aot-ttnk-flame
	WithMuzzleOverlay:
	GrantConditionOnPrerequisite@flame-upgrade:
		Condition: aot-ttnk-flame
		Prerequisites: aot-ttnk-flame-upgrade
	GrantConditionOnPrerequisite@toxin-upgrade:
		Condition: aot-ttnk-toxin
		Prerequisites: aot-ttnk-toxin-upgrade
	GrantConditionOnPrerequisite@cloak-upgrade:
		Condition: aot-ttnk-cloak
		Prerequisites: aot-ttnk-cloak-upgrade
	Cloak:
		InitialDelay: 85
		CloakDelay: 85
		CloakSound: trans1.aud
		UncloakSound: trans1.aud
		CloakStyle: Alpha
		CloakedAlpha: 0.4
		UncloakOn: Attack, Unload, Dock, Damage, Heal
		RequiresCondition: aot-ttnk-cloak
	WithSpriteTurret@normal:
		Sequence: turret
		RequiresCondition: !aot-ttnk-flame
	-WithFacingSpriteBody:
	WithFacingSpriteBody@normal:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-ttnk-flame
	WithFacingSpriteBody@flame:
		Sequence: aot-flame-idle
		Name: body-flame
		RequiresCondition: aot-ttnk-flame && !aot-ttnk-toxin
	WithFacingSpriteBody@toxin:
		Sequence: aot-toxin-idle
		Name: body-toxin
		RequiresCondition: aot-ttnk-toxin
	FireWarheadsOnDeath:
		Weapon: FlametankExplode
		EmptyWeapon: FlametankExplode
		RequiresCondition: aot-ttnk-flame
	SpawnActorOnDeath:
		Actor: LTNK.Husk
		OwnerType: InternalName
		EffectiveOwnerFromOwner: true
	Selectable:
		DecorationBounds: 1194, 1194

aot-ttnk-base:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite, ~!aot-ttnk-flame-upgrade
		Queue: LightVehicle.Nod
		Description: NOD main battle tank with a dual-fire cannon.

aot-ttnk-flame:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite, ~aot-ttnk-flame-upgrade, ~!aot-ttnk-toxin-upgrade, ~!aot-ttnk-cloak-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-flame-icon
		Description: Upgraded Heavy Tank armed with dual flamethrowers.
	Tooltip@normal:
		Name: actor-ttnk-flame.name

aot-ttnk-toxin:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite, ~aot-ttnk-toxin-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-toxin-icon
		Description: Flame Tank upgraded with dual toxic tiberian-sprayers.
	Tooltip@normal:
		Name: actor-ttnk-toxin.name

aot-ttnk-cloak:
	Inherits: TTNK
	RenderSprites:
		Image: ttnk
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite, ~aot-ttnk-cloak-upgrade
		Queue: LightVehicle.Nod
		Icon: aot-cloak-icon
		Description: Flame Tank equipped with a stealth field. Cloaks when not engaged.
	Tooltip@normal:
		Name: actor-ttnk-cloak.name

# FTNK aus NOD Buildlist entfernen (Heavy Tank übernimmt diese Rolle)
FTNK:
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Cyborg (TS-Infanterie-Import) ===
# Direkt-SHP-Workflow: cyborg.shp + aot-ts-player-Palette (House-Color 16-31 → Spielerfarbe).
# Crippled-Mechanik: ab Critical-HP → Condition "critical" → TakeCover ProneSequencePrefix "crippled-"
aot-cyborg:
	Inherits: E1
	RenderSprites:
		Image: cyborg
		PlayerPalette: aot-ts-player
	WithInfantryBody:
		StandSequences: stand
		IdleSequences: idle1, idle2
		DefaultAttackSequence: attack
		Palette: aot-ts-player
		IsPlayerPalette: true
	TakeCover:
		RequiresCondition: critical
		Duration: -1
		DamageTriggers:
		ProneOffset: 300,0,0
		ProneSequencePrefix: crippled-
	GrantConditionOnDamageState@CRITICAL:
		Condition: critical
		ValidDamageStates: Critical
		GrantPermanently: true
	ExplosionOnDamageTransition:
		Weapon: aot-CyborgCrippleEffect
		DamageState: Critical
		TriggerOnlyOnce: true
	WithDeathAnimation:
		DeathSequence: die
		UseDeathTypeSuffix: false
		DeathSequencePalette: aot-ts-player
		DeathPaletteIsPlayerPalette: true
		CrushedSequence: die-crushed
		CrushedSequencePalette: aot-ts-player
		CrushedPaletteIsPlayerPalette: true
	Voiced:
		VoiceSet: CyborgVoice
	Tooltip:
		Name: NOD Cyborg
	Health:
		HP: 30000
	Mobile:
		Speed: 56
	Valued:
		Cost: 300
	Armament:
		Weapon: aot-CyborgChainGun
	Buildable:
		Queue: Infantry.Nod
		BuildPaletteOrder: 70
		Prerequisites: ~hand, ~aot-age2
		Icon: icon
		Description: Cybernetic NOD soldier. Enters crippled mode at critical HP.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Gunboat (GDI Naval, PT base -> Destroyer upgrade) ===
# Steuerbares Schiff (Mobile + naval Locomotor). EIN Aktor, konditionaler Sprite/Waffen-
# Tausch via aot-gunboat-upgrade (gewährt von aot-upgrade-gunboat-destroyer) - Muster
# JEEP->HUMVEE. Age 0 = RA PT (Rumpf idle + MG-Turm turret). Upgrade = RA DD (idle-dd +
# Raketen-Turm turret-dd). Beide Boote teilen dieselbe ^Ship-Mechanik (16 Facings + Turm).
aot-gunboat:
	Inherits: ^Ship
	Inherits@SELECTABLE: ^SelectableCombatUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAll
	RenderSprites:
		Image: aot-gunboat
	Valued:
		Cost: 500
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 30000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: naval
		TurnSpeed: 28
		Speed: 92
	RepairableNear:
		RepairActors: aot-shipyard, aot-subpen
	RevealsShroud:
		Range: 7c0
		Type: CenterPosition
	Turreted@pt:
		Turret: pt
		TurnSpeed: 28
		Offset: 512,0,0
		RequiresCondition: !aot-gunboat-upgrade
	# Destroyer: EIN Turm hinten = Raketenwerfer (ssam-Sprite + Raketen am selben Heck-Turm).
	# Keine Kanone. Offset -X = hinten.
	Turreted@dd:
		Turret: dd
		TurnSpeed: 28
		Offset: 469,0,128
		RequiresCondition: aot-gunboat-upgrade
	AttackTurreted:
		Turrets: pt, dd
	GrantConditionOnPrerequisite@frigate:
		Condition: aot-gunboat-frigate-upgrade
		Prerequisites: aot-gunboat-frigate-upgrade
	GrantConditionOnPrerequisite@destroyer:
		Condition: aot-gunboat-upgrade
		Prerequisites: aot-gunboat-upgrade
	-Tooltip:
	Tooltip@base:
		Name: Gunboat
		RequiresCondition: !aot-gunboat-frigate-upgrade
	Tooltip@frigate:
		Name: Frigate
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	Tooltip@dd:
		Name: Destroyer
		RequiresCondition: aot-gunboat-upgrade
	WithFacingSpriteBody@pt:
		Sequence: idle
		RequiresCondition: !aot-gunboat-frigate-upgrade
	WithFacingSpriteBody@frigate:
		Sequence: idle-frigate
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	WithFacingSpriteBody@dd:
		Sequence: idle-dd
		RequiresCondition: aot-gunboat-upgrade
	WithSpriteTurret@pt:
		Turret: pt
		Sequence: turret
		RequiresCondition: !aot-gunboat-frigate-upgrade
	WithSpriteTurret@dd:
		Turret: dd
		Sequence: turret-dd
		RequiresCondition: aot-gunboat-upgrade
	# Turreted@pt bleibt für PT und Frigate aktiv (unsichtbar bei Frigate, aber Armament braucht es).
	Armament@pt:
		Weapon: aot-GunboatGun
		Turret: pt
		LocalOffset: 208,0,48
		RequiresCondition: !aot-gunboat-frigate-upgrade
	# Frigate: 3 Raketen (Land+Wasser), kein Turm-Sprite, Turret pt unsichtbar aktiv.
	Armament@frigate:
		Weapon: aot-FrigateMissiles
		Turret: pt
		LocalOffset: 208,0,48
		RequiresCondition: aot-gunboat-frigate-upgrade && !aot-gunboat-upgrade
	# Destroyer-Waffe: Raketenwerfer (ssam-Heck-Turm), Luft + Land.
	Armament@dd:
		Weapon: aot-DestroyerRockets
		Turret: dd
		LocalOffset: 0,0,48
		RequiresCondition: aot-gunboat-upgrade
	# DepthCharge DD: nur Destroyer hat Wasserbomben.
	Armament@depthdd:
		Weapon: aot-DepthCharge
		Turret: dd
		LocalOffset: -512,-100,0, -512,100,0
		LocalYaw: 80, -80
		RequiresCondition: aot-gunboat-upgrade

# aot-gunboat-base: Gunboat-Icon vor Frigate-Upgrade.
# aot-gunboat-frigate: Frigate-Icon zwischen Frigate- und Destroyer-Upgrade.
# aot-gunboat-destroyer: Destroyer-Icon nach Destroyer-Upgrade.
aot-gunboat-base:
	Inherits: aot-gunboat
	Buildable:
		Queue: Naval.GDI
		BuildPaletteOrder: 10
		Prerequisites: lite, aot-shipyard, ~!aot-gunboat-frigate-upgrade
		Icon: icon
		Description: Naval combat vessel. Upgradeable to a Frigate.

aot-gunboat-frigate:
	Inherits: aot-gunboat
	Buildable:
		Queue: Naval.GDI
		BuildPaletteOrder: 10
		Prerequisites: lite, aot-shipyard, ~aot-gunboat-frigate-upgrade, ~!aot-gunboat-upgrade
		Icon: icon-frigate
		Description: Upgraded naval vessel. Attacks land and sea targets. Upgradeable to a Destroyer.

aot-gunboat-destroyer:
	Inherits: aot-gunboat
	Tooltip@base:
		Name: Destroyer
		RequiresCondition: !aot-gunboat-upgrade
	Buildable:
		Queue: Naval.GDI
		BuildPaletteOrder: 10
		Prerequisites: lite, aot-shipyard, ~aot-gunboat-upgrade
		Icon: icon-dd
		Description: Naval combat vessel with rockets and depth charges. Can attack air.

# === Age of Tiberium (aotmod) - See-Mine (aot-seamine) ===
# Wird vom Missile Sub nach Mine Layer Upgrade gelegt (Minelayer-Trait).
# CloakStyle: None = für Feind unsichtbar (DetectionTypes: Mine), für Eigner sichtbar.
# Mine: CrushClasses: mine → Schiffe (Crushes: mine) lösen sie aus.
# BlockFriendly: true = eigene Schiffe können die Zelle nicht betreten → umfahren automatisch.
aot-seamine:
	RenderSprites:
		Image: aot-seamine
	WithSpriteBody:
	Tooltip:
		Name: actor-aot-seamine.name
	Interactable:
		Bounds: 1024, 1024
	HiddenUnderFog:
	Cloak:
		CloakStyle: Alpha
		CloakedAlpha: 0.3
		DetectionTypes: Mine
		InitialDelay: 25
		CloakSound: subshow1.wav
		UncloakSound: subshow1.wav
		PauseOnCondition: mine-triggered
	Mine:
		CrushClasses: mine
		DetonateClasses: mine
		AvoidFriendly: false
		BlockFriendly: true
		DetonateDelay: 25
		TriggeredCondition: mine-triggered
	Health:
		HP: 1500
		NotifyAppliedDamage: false
	BodyOrientation:
		QuantizedFacings: 1
	HitShape:
	Armor:
		Type: Light
	FireWarheadsOnDeath:
		Weapon: aot-SeaMineExplosion
		DamageSource: Parent
	AppearsOnRadar:
	Immobile:
		OccupiesSpace: true
	Targetable:
		TargetTypes: Water, Mine

# === Age of Tiberium (aotmod) - NOD Submarine (aot-sub) ===
# Auto-Tauch-Mechanik analog STNK: Cloak mit CloakedCondition → TargetType-Switch.
# CloakedCondition: aot-sub-cloaked → Targetable@sub (Underwater, Submarine) aktiv.
# Kritisch beschädigt (DamageState.Critical): PauseOnCondition → Cloak pausiert,
# Sub bleibt sichtbar bis HP wieder steigt. UncloakOn: Damage (kein Attack → feuert getarnt).
aot-sub:
	Inherits: ^Ship
	Inherits@SELECTABLE: ^SelectableCombatUnit
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAll
	RenderSprites:
		Image: aot-sub
	Valued:
		Cost: 800
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Tooltip:
		Name: actor-aot-sub.name
	GrantConditionOnPrerequisite@cargo:
		Condition: aot-sub-cargo-upgrade
		Prerequisites: aot-sub-cargo-upgrade
	Cargo:
		Types: Infantry
		MaxWeight: 5
		UnloadVoice: Unload
		LoadingCondition: aot-sub-loading
		RequiresCondition: aot-sub-cargo-upgrade
	WithCargoPipsDecoration@cargo:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		RequiresCondition: aot-sub-cargo-upgrade
	Health:
		HP: 20000
	Armor:
		Type: Heavy
	Mobile:
		Locomotor: naval
		TurnSpeed: 20
		Speed: 70
	RepairableNear:
		RepairActors: aot-shipyard, aot-subpen
	RevealsShroud:
		Range: 6c0
		Type: CenterPosition
	AttackFrontal:
		FacingTolerance: 15
	# Auto-Tauch-Mechanik: kein UncloakOn: Attack → Sub feuert Torpedos getarnt.
	Cloak:
		InitialDelay: 85
		CloakDelay: 85
		CloakStyle: Alpha
		CloakedAlpha: 0.35
		CloakSound: subshow1.wav
		UncloakSound: subshow1.wav
		UncloakOn: Damage, Attack, Unload, Load
		CloakedCondition: aot-sub-cloaked
		PauseOnCondition: aot-sub-critical || aot-sub-loading
	# Bei kritischen HP (≈20% verbleibend): Cloak pausiert → Sub bleibt sichtbar.
	GrantConditionOnDamageState@critical:
		Condition: aot-sub-critical
		ValidDamageStates: Critical
	# TargetType: getaucht → nur Fassbomben treffen (Underwater, Submarine).
	-Targetable:
