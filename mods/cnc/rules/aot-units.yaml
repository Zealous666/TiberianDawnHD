# === Age of Tiberium (aotmod) - MTNK Upgrade-Conditions ===
MTNK:
	GrantConditionOnPrerequisite@PREDATOR:
		Condition: aot-mtnk-predator
		Prerequisites: aot-mtnk-predator-upgrade

	GrantConditionOnPrerequisite@RAILGUN:
		Condition: aot-mtnk-railgun
		Prerequisites: aot-mtnk-railgun-upgrade

	GrantConditionOnPrerequisite@TITAN:
		Condition: aot-mtnk-titan
		Prerequisites: aot-mtnk-titan-upgrade

	GrantConditionOnPrerequisite@TITAN-RAIL:
		Condition: aot-mtnk-titan-railgun
		Prerequisites: aot-mtnk-titan-railgun-upgrade

	-Tooltip:

	Tooltip@normal:
		Name: Medium Tank
		RequiresCondition: !aot-mtnk-predator && !aot-mtnk-titan

	Tooltip@predator:
		Name: Medium Tank (Predator)
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	Tooltip@railgun:
		Name: Medium Tank (Railgun)
		RequiresCondition: aot-mtnk-railgun

	Tooltip@titan:
		Name: Titan Mech
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun

	Tooltip@titan-railgun:
		Name: Titan Mech (Railgun)
		RequiresCondition: aot-mtnk-titan-railgun

	Armament:
		Weapon: 120mm
		RequiresCondition: !aot-mtnk-predator && !aot-mtnk-titan
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@predator:
		Weapon: aot-MtnkPredator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@railgun:
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-railgun
		LocalOffset: 768,0,90

	Armament@titan:
		Weapon: aot-MtnkPredator
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 1720,0,90
		MuzzleSequence: muzzle

	Armament@titan-railgun:
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-titan-railgun
		LocalOffset: 1720,0,90

	# Fire Position (Phase 3) Garrison-Waffen - eigene "garrisoned"-Variante je
	# Upgrade-Stufe, gleiche Conditions wie die normalen Armaments oben.
	Armament@garrisoned:
		Name: garrisoned
		Weapon: aot-120mmGarrisoned
		RequiresCondition: !aot-mtnk-predator && !aot-mtnk-titan

	Armament@garrisonedpredator:
		Name: garrisoned
		Weapon: aot-MtnkPredatorGarrisoned
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	Armament@garrisonedrailgun:
		Name: garrisoned
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-railgun

	Armament@garrisonedtitan:
		Name: garrisoned
		Weapon: aot-MtnkPredatorGarrisoned
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun

	Armament@garrisonedtitanrailgun:
		Name: garrisoned
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-titan-railgun

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: turret
		RequiresCondition: !aot-mtnk-predator && !aot-mtnk-titan

	WithSpriteTurret@predator:
		Sequence: aot-mtnk-turret-predator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	WithSpriteTurret@railgun:
		Sequence: aot-mtnk-turret-railgun
		RequiresCondition: aot-mtnk-railgun

	# Titan Barrel zuerst (unter Housing): Housing verdeckt Barrel bei Rückwärts-Facings
	WithSpriteTurret@titan-barrel:
		Sequence: aot-titan-barrel-black
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun

	WithSpriteTurret@titan-barrel-railgun:
		Sequence: aot-titan-barrel-white
		RequiresCondition: aot-mtnk-titan-railgun

	# Titan Turret Housing (32 Facings, Zwei-Layer Player-Color) — über Barrel
	WithSpriteTurret@titan:
		Sequence: aot-titan-turret
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun

	WithSpriteTurret@titan-remap:
		Sequence: aot-titan-turret-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-mtnk-titan && !aot-mtnk-titan-railgun

	WithSpriteTurret@titan-railgun:
		Sequence: aot-titan-turret-railgun
		RequiresCondition: aot-mtnk-titan-railgun

	WithSpriteTurret@titan-railgun-remap:
		Sequence: aot-titan-turret-railgun-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-mtnk-titan-railgun

	# Titan Body Sprite-Swap (8 Facings, Zwei-Layer Player-Color)
	-WithFacingSpriteBody:

	WithFacingSpriteBody@base:
		Sequence: idle
		RequiresCondition: !aot-mtnk-titan

	WithFacingSpriteBody@titan:
		Sequence: aot-titan-stand
		Name: body-titan
		RequiresCondition: aot-mtnk-titan

	WithFacingSpriteBody@titan-remap:
		Sequence: aot-titan-stand-remap
		Name: body-titan-remap
		Palette: aot-vxl-player
		IsPlayerPalette: true
		RequiresCondition: aot-mtnk-titan

	WithMoveAnimation@titan:
		MoveSequence: aot-titan-run
		Body: body-titan
		RequiresCondition: aot-mtnk-titan

	WithMoveAnimation@titan-remap:
		MoveSequence: aot-titan-run-remap
		Body: body-titan-remap
		RequiresCondition: aot-mtnk-titan

	WithShadow@titan:
		Offset: 0, 48, 0
		ZOffset: -129
		RequiresCondition: aot-mtnk-titan
# === Ende aotmod ===

