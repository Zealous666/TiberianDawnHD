# aot-ltnk-deployed: Deployed / burrowed state of the Tick Tank upgrade
# Created via Transforms from LTNK, transforms back to LTNK on undeploy.
# Gebäude-Pattern: WithMakeAnimation spielt deploy-Sequence (gatickmk frames 0-23),
# danach zeigt WithSpriteBody den buried-Frame (24) als idle.
aot-ltnk-deployed:
	Inherits: ^Building
	# Fehlte bisher (User-Fund 2026-07-26): GUN erbt ^AutoTargetGround (structures.yaml)
	# und feuert dadurch automatisch auf Feinde in Reichweite. aot-ltnk-deployed hatte nur
	# ^Building -> Turreted/AttackTurreted/Armament sind zwar vorhanden und funktionieren bei
	# manuellen Befehlen, aber ohne AutoTarget dreht sich der Turm nie von selbst und es wird
	# nie automatisch geschossen. Faellt bei spielergebauten Einheiten kaum auf (Spieler gibt
	# Befehle), macht aber JEDE map-platzierte Instanz mit KI-losem Owner (z.B. "Creeps" auf
	# Hammerfest) komplett passiv.
	Inherits@AUTOTARGET: ^AutoTargetGround

	Building:
		Footprint: x
		Dimensions: 1,1
		RequiresBaseProvider: false
		TerrainTypes: Clear,Road,Rough,Dirt,Rock,Water,Clear.Snow

