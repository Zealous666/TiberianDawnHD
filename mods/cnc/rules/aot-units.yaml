# === Age of Tiberium (aotmod) - MCV: RA sprites in Age 0, TD ab Age 1 ===
# Gleiche Logik wie FACT: GrantConditionOnPrerequisite → zwei WithFacingSpriteBody.
# Kein WithMakeAnimation auf Fahrzeugen nötig.
MCV:
	OretSpawnStateCarrier:
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithFacingSpriteBody:
	WithFacingSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body-ra
		RequiresCondition: !aot-age1-active
	WithFacingSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	# Testrender: gebackene TS-Voxel-Sprites ab Age 2 (aot-mcv-test.zip).
	WithFacingSpriteBody@age2:
		Sequence: aot-age2-idle
		Name: body-age2
		RequiresCondition: aot-age2-active
	# Player-Color-Overlay-Layer: indizierte Remap-Region (176-191) → player-Palette (dynamisch).
	# Liegt über @age2; RGBA-Body ignoriert die player-Palette, indiziertes Overlay nutzt sie.
	WithFacingSpriteBody@age2remap:
		Sequence: aot-age2-remap
		Name: body-age2-remap
		RequiresCondition: aot-age2-active
	-Buildable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MCV Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mcv-age0: RA-Icon in Age 0; aot-mcv-age1: TD-Icon ab Age 1.
# Beide erben alle MCV-Traits. RenderSprites.Image: mcv explizit gesetzt
# (sonst würde OpenRA den Aktornamen als Image-Name verwenden → fehlende Sequences).
aot-mcv-age0:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~!aot-age1, lite, fix
		Icon: aot-ra-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle

aot-mcv-age1:
	Inherits: MCV
	RenderSprites:
		Image: mcv
	Buildable:
		Queue: LightVehicle.GDI, LightVehicle.Nod
		BuildPaletteOrder: 6
		Prerequisites: ~aot-age1, lite, fix
		Icon: aot-ages-icon
		Description: Mobile Construction Vehicle. Deploy to establish a base.
	Tooltip:
		Name: Mobile Construction Vehicle
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Recon Jeep / HUMVEE ===
JEEP:
	GrantConditionOnPrerequisite@HUMVEE:
		Condition: aot-jeep-humvee
		Prerequisites: aot-humvee-upgrade

	-Tooltip:

	Tooltip@base:
		Name: Recon Jeep
		RequiresCondition: !aot-jeep-humvee

	Tooltip@humvee:
		Name: GDI HUMVEE
		RequiresCondition: aot-jeep-humvee

	-Buildable:

	Cargo:
		Types: Infantry
		MaxWeight: 1
		UnloadVoice: Unload
		LoadingCondition: notmobile

	WithCargoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		CustomPipSequences:
			gray: pip-gray
			yellow: pip-yellow
			red: pip-red

	-WithFacingSpriteBody:

	WithFacingSpriteBody@base:
		Sequence: aot-ra-idle
		RequiresCondition: !aot-jeep-humvee

	WithFacingSpriteBody@humvee:
		Sequence: idle
		RequiresCondition: aot-jeep-humvee

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: aot-ra-turret
		RequiresCondition: !aot-jeep-humvee

	WithSpriteTurret@humvee:
		Sequence: turret
		RequiresCondition: aot-jeep-humvee

	Armament:
		Weapon: MachineGunH
		LocalOffset: 171,0,85
		MuzzleSequence: muzzle
		RequiresCondition: !aot-jeep-humvee

	Armament@humvee:
		Weapon: aot-JeepHumvee
		LocalOffset: 171,0,85
		MuzzleSequence: muzzle
		RequiresCondition: aot-jeep-humvee
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MTNK Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mtnk-base: sichtbar sobald LITE steht, verschwindet wenn Predator-Upgrade aktiv.
# aot-mtnk-pred: sichtbar wenn Predator aktiv, verschwindet wenn Railgun aktiv.
# aot-mtnk-rail: sichtbar wenn Railgun aktiv.
aot-mtnk-base:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~!aot-mtnk-predator-upgrade
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank

aot-mtnk-pred:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~aot-mtnk-predator-upgrade, ~!aot-mtnk-railgun-upgrade
		Icon: aot-mtnk-pred-icon
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank (Predator)

aot-mtnk-rail:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~aot-mtnk-railgun-upgrade
		Icon: aot-mtnk-rail-icon
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank (Railgun)
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MTNK Upgrade-Conditions ===
MTNK:
	GrantConditionOnPrerequisite@PREDATOR:
		Condition: aot-mtnk-predator
		Prerequisites: aot-mtnk-predator-upgrade

	GrantConditionOnPrerequisite@RAILGUN:
		Condition: aot-mtnk-railgun
		Prerequisites: aot-mtnk-railgun-upgrade

	-Tooltip:

	Tooltip@normal:
		Name: Medium Tank
		RequiresCondition: !aot-mtnk-predator

	Tooltip@predator:
		Name: Medium Tank (Predator)
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	Tooltip@railgun:
		Name: Medium Tank (Railgun)
		RequiresCondition: aot-mtnk-railgun

	Armament:
		Weapon: 120mm
		RequiresCondition: !aot-mtnk-predator
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@predator:
		Weapon: aot-MtnkPredator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun
		Recoil: 128
		RecoilRecovery: 26
		LocalOffset: 768,0,90
		MuzzleSequence: muzzle

	Armament@railgun:
		Weapon: aot-MtnkRailgun
		RequiresCondition: aot-mtnk-railgun
		LocalOffset: 768,0,90

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: turret
		RequiresCondition: !aot-mtnk-predator

	WithSpriteTurret@predator:
		Sequence: aot-mtnk-turret-predator
		RequiresCondition: aot-mtnk-predator && !aot-mtnk-railgun

	WithSpriteTurret@railgun:
		Sequence: aot-mtnk-turret-railgun
		RequiresCondition: aot-mtnk-railgun
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - HTNK Upgrades ===
# aot-htnk-base:   Age 1, keine Raketen, kein Railgun
# aot-htnk-rocket: Age 2 Rocket-Upgrade aktiv, noch kein Railgun
# aot-htnk-laser:  Age 3 Railgun-Upgrade aktiv
aot-htnk-base:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-weap, ~aot-age1, aot-age1, weap, atec, ~!aot-htnk-rocket-upgrade, ~!aot-htnk-railgun-upgrade
		Description: Heavily armored GDI battle tank with dual 120mm cannons.
	Tooltip:
		Name: Mammoth Tank

aot-htnk-rocket:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age1, aot-age1, ~aot-htnk-rocket-upgrade, ~!aot-htnk-railgun-upgrade
		Icon: aot-htnk-rocket-icon
		Description: Mammoth Tank equipped with dual rocket launchers for additional anti-air and ground firepower.
	Tooltip:
		Name: Mammoth Tank (Rocket)

aot-htnk-laser:
	Inherits: HTNK
	RenderSprites:
		Image: htnk
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age1, aot-age1, ~aot-htnk-railgun-upgrade
		Icon: aot-htnk-laser-icon
		Description: Mammoth Tank with dual high-powered railguns replacing the 120mm cannons. Devastating against all targets.
	Tooltip:
		Name: Mammoth Tank (Railgun)

HTNK:
	GrantConditionOnPrerequisite@ROCKET:
		Condition: aot-htnk-rocket
		Prerequisites: aot-htnk-rocket-upgrade

	GrantConditionOnPrerequisite@LASER:
		Condition: aot-htnk-laser
		Prerequisites: aot-htnk-railgun-upgrade

	Tooltip@rocket:
		Name: Mammoth Tank
		RequiresCondition: aot-htnk-rocket && !aot-htnk-laser

	Tooltip@laser:
		Name: Mammoth Tank
		RequiresCondition: aot-htnk-laser

	-Armament@PRIMARY:

	Armament@PRIMARY:
		Weapon: 120mmDual
		LocalOffset: 900,180,340, 900,-180,340
		Recoil: 170
		RecoilRecovery: 42
		MuzzleSequence: muzzle
		RequiresCondition: !aot-htnk-laser

	Armament@SECONDARY:
		Name: secondary
		Weapon: MammothMissiles
		LocalOffset: -85,384,340, -85,-384,340
		LocalYaw: -100, 100
		Recoil: 10
		MuzzleSequence: muzzle
		RequiresCondition: aot-htnk-rocket

	Armament@laser:
		Weapon: aot-HtnkLaser
		LocalOffset: 900,180,340, 900,-180,340
		RequiresCondition: aot-htnk-laser

	-WithSpriteTurret:

	WithSpriteTurret@base:
		Sequence: aot-htnk-norocket-turret
		RequiresCondition: !aot-htnk-rocket && !aot-htnk-laser

	WithSpriteTurret@rocket:
		Sequence: turret
		RequiresCondition: aot-htnk-rocket && !aot-htnk-laser

	WithSpriteTurret@laser:
		Sequence: aot-htnk-railgun-turret
		RequiresCondition: aot-htnk-laser
# === Ende aotmod ===


# === Age of Tiberium (aotmod) - APC: kein Turret, schießt frontal ===
APC:
	-WithSpriteTurret:
	-WithSpriteTurret@AIR:
	-Turreted:
	-AttackTurreted:

	AttackFrontal:
		FacingTolerance: 0
		Voice: Attack

	Armament@PRIMARY:
		Weapon: aot-JeepHumvee
		LocalOffset: 255,0,189
		MuzzleSequence: muzzle
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Jeep Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-jeep-base: Recon-Jeep-Icon vor HUMVEE-Upgrade.
# aot-jeep-humvee: HUMVEE-Icon nach HUMVEE-Upgrade.
# Beide verschwinden wenn APC-Upgrade aktiv (~!aot-apc-upgrade).
aot-jeep-base:
	Inherits: JEEP
	RenderSprites:
		Image: jeep
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 3
		Prerequisites: lite, pyle, ~!aot-humvee-upgrade, ~!aot-apc-upgrade
		Description: Fast reconnaissance vehicle. Can carry 1 soldier.
	Tooltip:
		Name: Recon Jeep

aot-jeep-humvee:
	Inherits: JEEP
	RenderSprites:
		Image: jeep
	Buildable:
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 3
		Prerequisites: lite, pyle, ~aot-humvee-upgrade, ~!aot-apc-upgrade
		Icon: aot-humvee-icon
		Description: Fast reconnaissance vehicle with HUMVEE armor. Can carry 1 soldier.
	Tooltip:
		Name: GDI HUMVEE
# === Ende aotmod ===


# === Age of Tiberium (aotmod) - Ore Transporter ===
# Fährt zur Ore Mine, lädt Erz, fährt zum Construction Yard.
# Doppel-Aktor-Pattern: aot-oret-gdi (Barracks) + aot-oret-nod (Hand of Nod).
ORET:
	Inherits: ^Tank
	Valued:
		Cost: 500
	Tooltip:
		Name: actor-oret.name
		GenericName: actor-oret.generic-name
	Selectable:
		DecorationBounds: 1536, 1536
	Mobile:
		Speed: 50
	Health:
		HP: 50000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 4c0
	Repairable:
		HpPerStep: 2000
	StoresResources:
		Capacity: 1
		Resources: Tiberium
	DockClientManager:
	OreTransporter:
		OreLoadAmount: 100
		OreLoadDelay: 25
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		PipCount: 1
		ResourceSequences:
			Tiberium: pip-green

aot-oret-lite:
	Inherits: ORET
	RenderSprites:
		Image: oret
	Buildable:
		BuildPaletteOrder: 1
		Prerequisites: lite
		Queue: LightVehicle.GDI, LightVehicle.Nod
		Description: Collects ore from mines and delivers it to the refinery.
	Tooltip:
		Name: actor-oret.name
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - LTNK Queue-Proxies (Doppel-Aktor-Pattern) ===
aot-ltnk-base:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~!aot-ltnk-upgrade
		Description: Fast and agile NOD light tank. Available from Age 1.
	Tooltip:
		Name: Light Tank

aot-ltnk-tick:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~aot-ltnk-upgrade, ~!aot-ltnk-upgrade2
		Icon: ltnk-tick-icon
		Description: Light Tank upgraded with Tick Tank chassis. Enables dig-in siege mode. Requires FIX facility.
	Tooltip:
		Name: Light Tank (Tick Chassis)

aot-ltnk-laser:
	Inherits: LTNK
	RenderSprites:
		Image: ltnk
	Buildable:
		Queue: Vehicle.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, aot-age1, afld, ~aot-ltnk-upgrade2
		Icon: ltnk-laser-icon
		Description: Light Tank (Tick Chassis) with experimental laser turret. Remains deployed after upgrade.
	Tooltip:
		Name: Light Tank (Laser)
# === Ende aotmod ===

LTNK:
	-Buildable:

	-Tooltip:

	Tooltip@normal:
		Name: Light Tank
		RequiresCondition: !aot-ltnk-upgraded

	Tooltip@ttnk:
		Name: Light Tank (Tick Chassis)
		RequiresCondition: aot-ltnk-upgraded && !aot-ltnk-upgraded2

	Tooltip@laser:
		Name: Light Tank (Laser)
		RequiresCondition: aot-ltnk-upgraded2

	GrantConditionOnPrerequisite:
		Condition: aot-ltnk-upgraded
		Prerequisites: aot-ltnk-upgrade

	GrantConditionOnPrerequisite@upgrade2:
		Condition: aot-ltnk-upgraded2
		Prerequisites: aot-ltnk-upgrade2

	-WithFacingSpriteBody:

	WithFacingSpriteBody@normal:
		Sequence: idle
		RequiresCondition: !aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithFacingSpriteBody@ttnk:
		Sequence: aot-tick-idle
		RequiresCondition: aot-ltnk-upgraded || aot-ltnk-upgraded2

	-WithSpriteTurret:

	WithSpriteTurret@normal:
		Sequence: turret
		RequiresCondition: !aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithSpriteTurret@dark:
		Sequence: aot-turret-dark
		RequiresCondition: aot-ltnk-upgraded && !aot-ltnk-upgraded2

	WithSpriteTurret@laser:
		Sequence: aot-turret-laser
		RequiresCondition: aot-ltnk-upgraded2

	Armament:
		Weapon: 70mm
		RequiresCondition: !aot-ltnk-upgraded2
		Recoil: 85
		RecoilRecovery: 17
		LocalOffset: 720,0,90
		MuzzleSequence: muzzle

	Armament@upgraded2:
		Weapon: aot-LtnkLaser
		RequiresCondition: aot-ltnk-upgraded2
		LocalOffset: 768,0,90

	Transforms:
		IntoActor: aot-ltnk-deployed
		Facing: 640
		RequiresCondition: aot-ltnk-upgraded
		TransformSounds: cashturn.aud

# aot-ltnk-deployed: Deployed / burrowed state of the Tick Tank upgrade
# Created via Transforms from LTNK, transforms back to LTNK on undeploy.
# Gebäude-Pattern: WithMakeAnimation spielt deploy-Sequence (gatickmk frames 0-23),
# danach zeigt WithSpriteBody den buried-Frame (24) als idle.
aot-ltnk-deployed:
	Inherits: ^Building

	Building:
		Footprint: x
		Dimensions: 1,1
		RequiresBaseProvider: false
		TerrainTypes: Clear,Road,Rough,Dirt,Rock,Water

	-ActorPreviewPlaceBuildingPreview:
	-Demolishable:
	-FrozenUnderFog:
	-CommandBarBlacklist:
	-AcceptsDeliveredCash:
	-Guardable:
	-ShakeOnDeath:

	ActorLostNotification:
		Notification: UnitLost
		TextNotification: notification-unit-lost

	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: UnitExplodeSmall
		EmptyWeapon: UnitExplodeSmall

	GrantConditionOnPrerequisite@laser:
		Condition: aot-ltnk-upgraded2
		Prerequisites: aot-ltnk-upgrade2

	RenderSprites:
		Image: aot-gatick
		PlayerPalette: player

	-WithSpriteBody:
	WithSpriteBody:
		Sequence: idle
		Name: body

	WithMakeAnimation:
		Sequence: deploy
		BodyNames: body
		Condition: build-incomplete

	Selectable:
		Bounds: 1024, 1024
		Priority: 10

	Targetable:
		TargetTypes: Ground, Vehicle

	Health:
		HP: 48000

	Armor:
		Type: Concrete

	Turreted:
		InitialFacing: 640
		TurnSpeed: 28
		Offset: -150, 150, 0

	Armament@PRIMARY:
		Weapon: 70mm
		Turret: primary
		LocalOffset: 720,0,90
		MuzzleSequence: muzzle
		Recoil: 85
		RecoilRecovery: 17
		RequiresCondition: !aot-ltnk-upgraded2

	Armament@LASER:
		Weapon: aot-LtnkLaser
		Turret: primary
		LocalOffset: 720,0,90
		RequiresCondition: aot-ltnk-upgraded2

	AttackTurreted:

	WithSpriteTurret@tick:
		Sequence: turret
		RequiresCondition: !aot-ltnk-upgraded2

	WithSpriteTurret@laser:
		Sequence: turret-laser
		RequiresCondition: aot-ltnk-upgraded2

	WithMuzzleOverlay:

	Transforms:
		IntoActor: ltnk
		Facing: 640
		TransformSounds: text2.aud
		RequiresCondition: !build-incomplete

	TransformsIntoTransforms:

	Tooltip:
		Name: Tick Tank (Burrowed)
		GenericName: meta-tank-generic-name

	Valued:
		Cost: 750

	MustBeDestroyed:

	RevealsShroud:
		Range: 6c0

	Voiced:
		VoiceSet: VehicleVoice

	ActorLostNotification:
		TextNotification: notification-unit-lost

# TRUCK: aus Vehicle-Queue heraus, jetzt in LITE (LightVehicle-Queue), nur lite als Prerequisite
TRUCK:
	-Buildable:
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: lite
		Queue: LightVehicle.GDI, LightVehicle.Nod
		Description: Transports supplies to friendly structures.

# HARV: ab Age 1 sichtbar (ausgegraut bis PROC gebaut), baubar erst mit PROC
# Proxy-Aktor-Pattern wie MCV/JEEP/MTNK: -Buildable: im Basis-Aktor, Buildable im Proxy.
HARV:
	-Buildable:

aot-harv:
	Inherits: HARV
	RenderSprites:
		Image: harv
	Buildable:
		BuildPaletteOrder: 2
		Prerequisites: ~aot-age1, proc
		Queue: Vehicle.GDI, Vehicle.Nod
		Description: Harvests Tiberium and returns it to the refinery.

# === Age of Tiberium (aotmod) - Apache / ORCA Upgrade-System ===
# Doppel-Aktor-Pattern analog zu Jeep/HUMVEE.
# Apache (Tier 0): sofort nach HPAD baubar, RA Longbow Sprites, reduzierter Schaden, nur AG.
# ORCA (Tier 1): sichtbar nach ORCA-Upgrade, volle Stats, ORCA Sprites.

aot-apache-base:
	Inherits: ORCA
	AmmoPool:
		Ammo: 5
	Buildable:
		Queue: Aircraft.GDI
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~!aot-orca-upgrade
		Description: Light attack helicopter. Armed with anti-ground-rockets.
	Tooltip:
		Name: Apache

aot-orca-upgraded:
	Inherits: ORCA
	AmmoPool:
		Ammo: 5
	Buildable:
		Queue: Aircraft.GDI
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~aot-orca-upgrade
		Icon: aot-orca-icon
		Description: Advanced gunship. Carries anti-ground and anti-air missiles. Returns to base when ammo is depleted.
	Tooltip:
		Name: ORCA
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - HIND / Harpy Upgrade-System ===
# Doppel-Aktor-Pattern analog zu Apache/ORCA.
# HIND (Tier 0): sofort nach NOD HPAD baubar, RA Soviet HIND Sprites, begrenzte Mun.
# Harpy (Tier 1, nach Harpy Upgrade): Original CnC NOD Helikopter Sprites, unendliche Mun.

aot-hind-base:
	Inherits: HELI
	AmmoPool:
		Ammo: 6
	ReloadAmmoPool:
		Delay: 100
		Count: 2
	Buildable:
		Queue: Aircraft.Nod
		BuildPaletteOrder: 20
		Prerequisites: anyhq, ~!aot-harpy-upgrade
		Description: Soviet attack helicopter. Armed with chain guns. Reloads ammunition automatically while airborne.
	Tooltip:
		Name: HIND

aot-harpy-husk:
	Inherits: ^HelicopterHusk
	Tooltip:
		Name: actor-heli-husk-name
	Aircraft:
		TurnSpeed: 16
		Speed: 186
	RevealsShroud:
		Range: 10c0
		Type: GroundPosition
	RenderSprites:
		Image: aot-hind
	GrantConditionOnPrerequisite@harpyupgrade:
		Condition: aot-harpy-upgraded
		Prerequisites: aot-harpy-upgrade
	-WithFacingSpriteBody:
	WithFacingSpriteBody@hind:
		Sequence: aot-hind-idle
		Name: body
		RequiresCondition: !aot-harpy-upgraded
	WithFacingSpriteBody@harpy:
		Sequence: aot-harpy-test-idle
		Name: body-harpy
		RequiresCondition: aot-harpy-upgraded
	WithFacingSpriteBody@harpyremap:
		Sequence: aot-harpy-test-remap
