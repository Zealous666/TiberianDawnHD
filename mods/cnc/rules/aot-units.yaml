# === Age of Tiberium (aotmod) - NOD Dog ===
aot-dog-nod:
	Inherits: ^Soldier
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	RenderSprites:
		Image: aot-dog-nod
	Selectable:
		Bounds: 512, 725, -42, -170
		DecorationBounds: 512, 725, -42, -170
	Valued:
		Cost: 200
	Tooltip:
		Name: Dog
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: aot-kennel-nod
		Queue: Dog.Nod
		Description: Fast anti-infantry unit. Instantly kills enemy soldiers.
	Health:
		HP: 1800
	Armor:
		Type: None
	Mobile:
		Speed: 100
		Voice: Move
		PauseOnCondition: attack-cooldown || eating
	Voiced:
		VoiceSet: DogVoice
	RevealsShroud:
		Range: 5c512
	Armament:
		Weapon: aot-DogJaw
		ReloadingCondition: attack-cooldown
		ForceTargetRelationships: Enemy, Ally, Neutral
	-AttackFrontal:
	AttackLeap:
		Voice: Attack
		PauseOnCondition: attacking || attack-cooldown
	AttackMove:
		Voice: Move
	GrantConditionOnAttack:
		Condition: eating
		RevokeDelay: 20
	GrantConditionWhileAiming:
		Condition: run
	AutoTarget:
		InitialStance: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry
	Targetable:
		TargetTypes: GroundActor, Infantry
	WithInfantryBody:
		MoveSequence: walk
		StandSequences: stand
		DefaultAttackSequence: eat
		RequiresCondition: !run
	WithInfantryBody@RUN:
		MoveSequence: run
		RequiresCondition: run
	IgnoresDisguise:
	DetectCloaked:
	WithDeathAnimation:
		DeathSequences: die1, die2, die3, die4, die5
		UseDeathTypeSuffix: false
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Chameleon Spy (ab Age 1) ===
aot-spy-nod:
	Inherits: ^Soldier
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	WithShadow:
		Offset: 0, 48, 0
		ZOffset: -129
	RenderSprites:
		Image: aot-spy-nod
		PlayerPalette: aot-ts-player
	Selectable:
		Bounds: 512, 725, -42, -170
		DecorationBounds: 512, 725, -42, -170
	Valued:
		Cost: 700
	Tooltip:
		Name: Chameleon Spy
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	-Guard:
	Mobile:
		Speed: 85
		Voice: Move
	RevealsShroud:
		Range: 5c0
	Passenger:
		CustomPipType: blue
		Voice: Move
	Buildable:
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age2, aot-nod-forbidden-upgrade, hand, anyhq
		Queue: Infantry.Nod
		Description: Cloaked infiltrator. Infiltrates enemy structures to steal credits, reveal their vision, reset support powers, or cut power.
	Health:
		HP: 3000
	Armor:
		Type: None
	Cloak:
		CloakStyle: Alpha
		InitialDelay: 25
		CloakDelay: 25
		UncloakOn: Attack, Unload, Infiltrate, Demolish, Damage
		CloakSound: cloak5.aud
		UncloakSound: cloak5.aud
	Infiltrates:
		Types: SpyInfiltrate
		Notification: BuildingInfiltrated
		TextNotification: notification-building-infiltrated
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: HoldFire
		ScanRadius: 5
	WithInfantryBody:
		IdleSequences: idle1, idle2
		StandSequences: stand
		RequiresCondition: !parachute
	Voiced:
		VoiceSet: ChameleonSpyVoice
	WithDeathAnimation:
		DeathSequences: die1, die2
		UseDeathTypeSuffix: false
		DeathSequencePalette: aot-ts-player
		DeathPaletteIsPlayerPalette: true
		CrushedSequence: die-crushed
		CrushedSequencePalette: aot-ts-player
		CrushedPaletteIsPlayerPalette: true

