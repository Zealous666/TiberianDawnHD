# === Age of Tiberium (aotmod) - MTNK Queue-Proxies (Doppel-Aktor-Pattern) ===
# aot-mtnk-base: sichtbar sobald LITE steht, verschwindet wenn Predator-Upgrade aktiv.
# aot-mtnk-pred: sichtbar wenn Predator aktiv, verschwindet wenn Railgun aktiv.
# aot-mtnk-rail: sichtbar wenn Railgun aktiv.
aot-mtnk-base:
	Inherits: MTNK
	RenderSprites:
		Image: mtnk
	Buildable:
		ShowWhenLocked: False
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~!aot-mtnk-predator-upgrade, ~!aot-mtnk-titan-upgrade
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank

aot-mtnk-pred:
	Inherits: MTNK
	# aotmod (2026-07-29): Varianten-Condition UNBEDINGT granten. Sie kam bisher nur aus dem
	# von MTNK geerbten GrantConditionOnPrerequisite, das den BESITZER auf das Upgrade prueft.
	# Im Karteneditor platzierte Creeps-/Neutral-Instanzen erfuellen das nie -> der Aktor erschien
	# als Basis-Variante (falscher Sprite, falsche Waffe), obwohl der Placer die Variante ist.
	# Der Proxy IST die Variante: das ist konstituierend und darf nicht am Upgrade-Stand haengen.
	GrantCondition@variant:
		Condition: aot-mtnk-predator
	RenderSprites:
		Image: mtnk
	Buildable:
		ShowWhenLocked: False
		Queue: LightVehicle.GDI
		BuildPaletteOrder: 5
		Prerequisites: ~lite, gdi-hq, ~aot-mtnk-predator-upgrade, ~!aot-mtnk-railgun-upgrade, ~!aot-mtnk-titan-upgrade
		Icon: aot-mtnk-pred-icon
		Description: GDI medium battle tank.
	Tooltip:
		Name: Medium Tank (Predator)

	# aotmod (2026-08-01): Bau-Menue-Tooltip. ProductionTooltipLogic wertet KEINE Conditions
	# aus, sondern nimmt TraitInfos<TooltipInfo>().FirstOrDefault(info => info.EnabledByDefault)
	# -- und EnabledByDefault ist bei allen Variablen = false wahr, also auch fuer den geerbten
	# Tooltip@normal ("Medium Tank", Bedingung "!predator && !titan"). Welcher der beiden
	# gewinnt, haengt damit allein an der Trait-Reihenfolge: hier schlug der Basis-Tooltip den
	# proxy-eigenen, das Baumenue zeigte trotz Predator-Icon weiter "Medium Tank". Am fertig
	# gebauten Aktor stimmt es, weil dort die Conditions echt ausgewertet werden. Basis-Tooltip
	# entfernen macht den proxy-eigenen zum einzigen EnabledByDefault-Kandidaten.
	-Tooltip@normal:

	# aotmod (2026-07-29): Editor-Vorschau. ConditionalTrait.EnabledByDefault wertet die
	# RequiresCondition mit ALLEN Variablen = false aus; nur dann rendert der Trait im
	# Karteneditor. Deshalb gewann bisher der Basis-Trait ("!variante" ist bei 0 wahr) und
	# der Placer zeigte den Basis-Sprite. Auf diesem Proxy sind die oben unbedingt
	# granteten Conditions IMMER 1 -> Basis-Traits treffen nie zu (entfernt), und bei der
	# Zielvariante werden die stets-wahren Terme gekuerzt. Laufzeit-Semantik bleibt gleich.
	-WithSpriteTurret@base:
	WithSpriteTurret@predator:
		RequiresCondition: !aot-mtnk-railgun

aot-mtnk-rail:
	Inherits: MTNK
	# aotmod (2026-07-29): Varianten-Condition UNBEDINGT granten. Sie kam bisher nur aus dem
	# von MTNK geerbten GrantConditionOnPrerequisite, das den BESITZER auf das Upgrade prueft.
	# Im Karteneditor platzierte Creeps-/Neutral-Instanzen erfuellen das nie -> der Aktor erschien
	# als Basis-Variante (falscher Sprite, falsche Waffe), obwohl der Placer die Variante ist.
	# Der Proxy IST die Variante: das ist konstituierend und darf nicht am Upgrade-Stand haengen.
	# Beide Conditions noetig -- mit nur 'aot-mtnk-railgun' bliebe die Basis-Variante MIT aktiv
	# (deren RequiresCondition prueft auf !aot-mtnk-predator).
	GrantCondition@variant:
		Condition: aot-mtnk-predator
