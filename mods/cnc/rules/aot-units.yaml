# === Age of Tiberium (aotmod) - Dropship (GDI, spawned only via Zone Trooper Drop) ===
# Fliegt vom Kartenrand zum Zielpunkt (wie RA's BADR), fliegt dort aber NICHT weiter:
# in der Luft über dem Ziel wird es sofort per FireWarheadsOnDeath gesprengt (Mid-Air-
# Explosion statt Abflug). Der Zone Trooper gleitet parallel per Parachutable (kein
# Fallschirm-Sprite, siehe aot-zonetrooper) von der Explosionshöhe herab.
aot-dropship:
	Inherits: ^Plane
	# Kein Unit-Lost-Notification bei Zerstörung — die Mid-Air-Explosion ist beabsichtigt (kein Verlust).
	-ActorLostNotification:
	-WithFacingSpriteBody:
	RenderSprites:
		Image: aot-dropship-test
	WithFacingSpriteBody@BODY:
		Sequence: idle
	WithFacingSpriteBody@REMAP:
		Name: body-remap
		Sequence: idle-remap
		Palette: player
		IsPlayerPalette: True
	Tooltip:
		Name: Dropship
	Health:
		HP: 5000
	Armor:
		Type: Light
	Interactable:
	HitShape:
	Aircraft:
		CruiseAltitude: 2560
		Speed: 300
		TurnSpeed: 20
		Repulsable: False
		MaximumPitch: 56
	FireWarheadsOnDeath:
		Weapon: aot-DropshipExplode
	RevealsShroud:
		Range: 4c0
		Type: GroundPosition
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Orca Transport (GDI, spawned only via Orca Transport Power) ===
# TS ORCATRAN: fliegt an, landet echt (VTOL/Hover), setzt 2 Fahrzeuge + 2 Panzer ab, fliegt wieder ab.
# Bezugsdaten aus engine/mods/ts/rules/aircraft.yaml (Sounds, Cargo-Konvention).
aot-orcatran:
	Inherits: ^Helicopter
	# User-Fund 2026-07-30: war selectable und liess sich vom Spieler umlenken -- ^Helicopter
	# bringt via Inherits@selection: ^SelectableCombatUnit volle Steuerbarkeit mit, gedacht fuer
	# echte, kaufbare Einheiten. Dieser Aktor existiert nur als Lieferflieger der Orca-Transport-
	# Superpower und darf wie aot-dropship (Zone Trooper Drop) nicht anklickbar/umlenkbar sein.
	# ^Plane (dropships Basis) faellt hier aus: kein VTOL/Hover, aber genau das braucht dieser
	# Aktor fuer die echte Landung (siehe Kommentar unten). Deshalb ^Helicopter behalten, aber
	# Selectable entfernt und Befehle per RejectsOrders komplett blockiert.
	# ^Helicopter bringt Selectable ueber ^SelectableCombatUnit -> ^Selectable, das ZUSAETZLICH
	# SelectionDecorations/WithSpriteControlGroupDecoration/DrawLineToTarget buendelt -- alle
	# drei haengen an Interactable und crashen ("failed to initialize"), wenn nur Selectable
	# alleine entfernt wird. Interactable: explizit ergaenzt, exakt wie bei aot-dropship (Zone
	# Trooper Drop) -- macht den Aktor weiterhin von Flak treffbar, aber nicht anklickbar.
	-Selectable:
	-SelectionDecorations:
	-WithSpriteControlGroupDecoration:
	-DrawLineToTarget:
	Interactable:
	RejectsOrders:
	-WithFacingSpriteBody:
	RenderSprites:
		Image: aot-orcatran-test
	WithFacingSpriteBody@BODY:
		Sequence: idle
	WithFacingSpriteBody@REMAP:
		Name: body-remap
		Sequence: idle-remap
		Palette: player
		IsPlayerPalette: True
	Tooltip:
		Name: Orca Transport
	Health:
		HP: 20000
	Armor:
		Type: Light
	Aircraft:
		CruiseAltitude: 2560
		Speed: 180
		TurnSpeed: 20
		LandableTerrainTypes: Clear, Road, Rough, Beach, Tiberium, BlueTiberium, Clear.Snow
		TakeoffSounds: orcaup1.aud
		LandingSounds: orcadwn1.aud
	Cargo:
		Types: GroundVehicle, GarrisonVehicle
		MaxWeight: 20
		BeforeUnloadDelay: 15
		AfterUnloadDelay: 40
	# Von Flak abschießbar: stürzt dann ab (SpawnActorOnDeath -> Husk mit FallsToEarth,
	# TS-Stil taumelnd statt gerade runter). EjectOnDeath auf Cargo bewusst NICHT gesetzt
	# (Default: false) — geladene Fahrzeuge gehen mit unter, kommen nie am Ziel an.
	SpawnActorOnDeath:
		Actor: aot-orcatran-husk
	RevealsShroud:
		Range: 4c0
		Type: GroundPosition
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Orca Transport Husk (Absturz-Wrack, TS-Stil taumelnd) ===
aot-orcatran-husk:
	Inherits: ^CommonHuskDefaults
	-WithFacingSpriteBody:
	RenderSprites:
		Image: aot-orcatran-test
	WithFacingSpriteBody@BODY:
		Sequence: idle
	WithFacingSpriteBody@REMAP:
		Name: body-remap
		Sequence: idle-remap
		Palette: player
		IsPlayerPalette: True
	Tooltip:
		Name: Orca Transport (Crashing)
	Aircraft:
		CanHover: True
		VTOL: true
		CanSlide: True
	# Moves: True + Velocity/MaximumSpinSpeed = TS-typischer taumelnder Absturz statt
	# geradem Herunterfallen (Unterschied zu ^HelicopterHusk, das nur senkrecht fällt).
	FallsToEarth:
		Moves: True
		Velocity: 112
		MaximumSpinSpeed: 40
		Explosion: aot-DropshipExplode
	-MapEditorData:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - GDI Mobile Gap Generator (aot-mgap) ===
# Mobile Variante des GDI Shroud Generators (aot-gap). Sprites: RA MGG (Frames 0-31 Fahr-Facings,
# 32-39 Dish-Overlay). Faehrt langsam (Speed 60 = MCV). Deploy-Mechanik wie aot-arty-heavy:
# Solange DEPLOYED steht die Einheit still und erzeugt einen Shroud-Vorhang (CreatesShroud Range 8c0)
# und kappt feindliche Sicht im Feld auf 2c0 (ProximityExternalCondition@GAPSUPPRESS ->
# aot-gap-suppressed, identisch zum stationaeren aot-gap, KEINE overrides-Aenderung noetig).
# Sichtbar ab Age 3 (~aot-age3), baubar ab Age 3 + WEAP + Science Lab (aot-slab).
# Queue: Vehicle.GDI (Advanced War Factory). UNDEPLOYED: kein Effekt, normale Einheit.
aot-mgap:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Valued:
		Cost: 1500
	Tooltip:
		Name: Mobile Gap Generator
		RequiresCondition: !aot-mgap-deployed
	Tooltip@deployed:
		Name: Mobile Gap Generator (Deployed)
		RequiresCondition: aot-mgap-deployed
	Health:
		HP: 30000
	Armor:
		Type: Light
	# Langsam wie der MCV (Speed 60, heavywheeled). Immobil + pausiert solange deployed.
	Mobile:
		Speed: 60
		Locomotor: heavywheeled
		ImmovableCondition: aot-mgap-deployed
		PauseOnCondition: aot-mgap-deployed
	# Bewegungs-Orders verweigern solange deployed (wie aot-arty-heavy).
	RejectsOrders:
		Reject: Move, ForceMove, Stop, AttackMove
		RemoveOrders: true
		RequiresCondition: aot-mgap-deployed
	# Undeployed: normale Fahrzeugsicht. Deployed: Gap-Gen-Sicht (RevealsShroud-Dup wie aot-gap:
	# Hauptsicht zeigt eigenen Shroud NICHT, separate Instanz fuer Besitzer-Innensicht).
	RevealsShroud:
		Range: 5c0
		RequiresCondition: !aot-mgap-deployed
	RevealsShroud@GAPGEN_OWN:
		Range: 5c0
		RequiresCondition: aot-mgap-deployed
	RevealsShroud@GAPGEN_MAIN:
		MinRange: 5c0
		Range: 6c0
		RevealGeneratedShroud: False
		RequiresCondition: aot-mgap-deployed
	RenderSprites:
		Image: aot-mgap
	# Fahr-Body (Facing-basiert). Bleibt auch deployed sichtbar (Fahrzeug bleibt stehen,
	# Facing eingefroren auf 384 durch GrantConditionOnDeploy). Dish-Overlay legt sich drueber.
	WithFacingSpriteBody:
		Sequence: idle
	WithShadow:
		Offset: 0,48,0
		ZOffset: -129
	# Schuessel (Frames 32-39): immer sichtbar, dreht sich NUR wenn deployed.
	# Offset -299,0,171 aus dem RA MGG-Aktor (engine/mods/ra/rules/vehicles.yaml).
	# PauseOnCondition: !aot-mgap-deployed -> eingefroren auf Frame 0 wenn fahrend.
	WithIdleOverlay@SPINNER:
		Sequence: spinner
		Offset: -201,0,171
		PauseOnCondition: !aot-mgap-deployed
	# Deploy-Mechanik: Immobil + Facing 384 (Sued) auf Deploy. Startet undeployed (kein Effekt).
	GrantConditionOnDeploy:
		DeployedCondition: aot-mgap-deployed
		UndeployedCondition: aot-mgap-undeployed
		Facing: 384
		DeploySounds: place2.aud
		UndeploySounds: clicky1.aud
	# Kernfunktion: Shroud-Vorhang NUR solange deployed. Identisch aot-gap (Range 8c0).
	CreatesShroud:
		Range: 8c0
		RequiresCondition: aot-mgap-deployed
	# Feindliche Einheiten im Feld -> Sicht auf 2c0 kappen. SELBE Condition (aot-gap-suppressed)
	# wie stationaerer aot-gap -> overrides.yaml bereits fertig verdrahtet, KEINE Aenderung noetig.
	ProximityExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
		Range: 8c0
		ValidRelationships: Enemy, Neutral
		RequiresCondition: aot-mgap-deployed
	# Shroud-Radius-Kreis (bei Selektion). Zeigt immer wenn selektiert (kein ConditionalTrait).
	RenderShroudCircle:
	Buildable:
		Queue: Vehicle.GDI
		BuildPaletteOrder: 70
		Prerequisites: ~aot-age2, aot-weap, aot-slab
		Icon: icon
		Description: Mobile shroud field. Deploy to hide nearby friendly forces from enemies and blind enemy units in the area.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Mobile Stealth Generator (aot-mstealth) ===
# Mobile Variante des Nod Stealth Generators (aot-sgen). Sprites: TD Mobile HQ (MHQ), siehe
# aot-sequences.yaml. Faehrt langsam (Speed 60 = MCV). Deploy-Mechanik wie aot-arty-heavy:
# solange DEPLOYED steht die Einheit still (Immovable + PauseOnCondition + RejectsOrders) und
# vergibt das Tarnfeld aot-stealth-field an sich + alle verbuendeten Einheiten/Gebaeude im
# Umkreis (ProximityExternalCondition). Der eigentliche Cloak haengt an ^Vehicle/^Building/...
# (overrides.yaml) und reagiert auf aot-stealth-field - identisch zum stationaeren aot-sgen.
# Sichtbar ab Age 3 (~aot-age3), baubar ab Age 3 + Secret Shrine (aot-shrine) + Airstrip (afld),
# Queue Vehicle.Nod (Airstrip). Undeployed hat es keinerlei Effekt.
aot-mstealth:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Valued:
		Cost: 2000
	Tooltip:
		Name: Mobile Stealth Generator
		RequiresCondition: !aot-mstealth-deployed
	Tooltip@deployed:
		Name: Mobile Stealth Generator (Deployed - cloaking units)
		RequiresCondition: aot-mstealth-deployed
	Health:
		HP: 30000
	Armor:
		Type: Light
	# Langsam wie der MCV (Speed 60, heavywheeled). Immobil + pausiert solange deployed.
	Mobile:
		Speed: 60
		Locomotor: heavywheeled
		ImmovableCondition: aot-mstealth-deployed
		PauseOnCondition: aot-mstealth-deployed
	# Bewegungs-Orders verweigern solange deployed (wie aot-arty-heavy).
	RejectsOrders:
		Reject: Move, ForceMove, Stop, AttackMove
		RemoveOrders: true
		RequiresCondition: aot-mstealth-deployed
	RevealsShroud:
		Range: 5c0
	RenderSprites:
		Image: aot-mstealth
	# Rotierender Radar-Spinner (MHQ Frames 32-63), immer laufend.
	WithIdleOverlay@SPINNER:
		Sequence: spinner
		Offset: -256,0,256
	# Deploy schaltet das Tarnfeld an; Undeploy aus. Startet undeployed (mobil, kein Effekt).
	GrantConditionOnDeploy:
		DeployedCondition: aot-mstealth-deployed
		UndeployedCondition: aot-mstealth-undeployed
		Facing: 384
		DeploySounds: place2.aud
		UndeploySounds: clicky1.aud
	# Kernfunktion: Tarnfeld aot-stealth-field-mobile NUR solange deployed. AffectsParent: true =
	# tarnt sich selbst mit. ValidRelationships Ally = Besitzer + Verbuendete. EIGENE Condition
	# (nicht aot-stealth-field wie aot-sgen), auf die nur die Einheiten-Templates reagieren
	# (^Vehicle/^Infantry/^Ship/^Plane/^Helicopter), NICHT ^Building -> tarnt nur Einheiten.
	ProximityExternalCondition@STEALTH:
		Condition: aot-stealth-field-mobile
		Range: 8c341
		ValidRelationships: Ally
		AffectsParent: true
		RequiresCondition: aot-mstealth-deployed
		EnableSound: cloak5.aud
		DisableSound: cloak5.aud
	# Tarn-Radius einzeichnen (bei Selektion), Range MUSS mit ProximityExternalCondition uebereinstimmen.
	WithRangeCircle:
		Type: cloakgenerator
		Range: 8c341
		Color: 8844FFB4
		BorderColor: 20102080
	Buildable:
		Queue: Starport
		BuildDuration: 0
		BuildPaletteOrder: 60
		Prerequisites: ~aot-age2, aot-shrine, afld
		Icon: icon
		Description: Mobile stealth field. Deploy to cloak itself and all nearby friendly units (not structures).

# === GDI/NOD Mobile Sensor Array (aot-aray / aot-gadpsa) ===
