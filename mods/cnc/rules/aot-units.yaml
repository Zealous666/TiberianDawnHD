		Description: Toxic-upgraded V2. Fires two toxic rockets that leave a lingering tiberium gas field at the impact site.
	# Immer toxic (nur nach Toxic-Upgrade baubar, irreversibel): geerbte konditionale
	# Tooltips entfernen und EINEN sauberen, bedingungslosen Toxic-Tooltip neu anlegen.
	# Vermeidet die Merge-Positions-Falle (Sidebar zeigte sonst weiter "Napalm").
	-Tooltip@NAPALM:
	-Tooltip@TOXIC:
	-Tooltip@SIDEBAR:
	Tooltip:
		Name: actor-aot-v2-toxic.name
		GenericName: meta-tank-generic-name
# === Ende aotmod ===

