# === Age of Tiberium (aotmod) - TS Civilian Buildings Import ===
# Editor-only Zivilgebaeude aus TS civilian-structures.yaml (kein Buildable),
# analog aot-snow-decor.yaml: Normal/Snow als eigene Aktor-Instanzen mit
# MapEditorData.RequireTilesets statt per-Tileset-Sprite-Switch.

# WICHTIG: TS-Gebaeude-SHPs sind mit TS's eigener isotem.pal/isosno.pal indiziert.
# Ohne expliziten Palette-Override faellt RenderSprites auf dieses Mods "player"-Palette
# zurueck (dynamischer Owner-Remap, gebaut aus einer voellig anderen CNC-eigenen Datei) ->
# falsche/verwaschene Farben (gelbstichig), da TS- und CNC-Palettenindizes NICHT kompatibel
# sind. Fix: statische eigene Palette je Aktor referenzieren (kein Player-Color-Remap noetig,
# das Original hat auch keinen).
^BaseWorld:
	# ShadowIndex: 1 fehlte (Bug, User-Fund 2026-07-27) -> Palette-Index 1 (TS-Schattenmaske-
	# Konvention, siehe ShadowStart-Fix oben) wurde als normale Farbe aus der .pal-Datei gerendert
	# (blauer Platzhalter-Wert) statt als transluzentes Schwarz. TS registriert seine eigenen
	# isotem/isosno-Paletten ("terraindecoration"/"player" in engine/mods/ts/rules/palettes.yaml)
	# ebenfalls mit ShadowIndex: 1 - exakt uebernommen.
	PaletteFromFile@aot-ts-isotem:
		Name: aot-ts-isotem
		Filename: aot-ts-isotem.pal
		ShadowIndex: 1
	PaletteFromFile@aot-ts-isosno:
		Name: aot-ts-isosno
		Filename: aot-ts-isosno.pal
		ShadowIndex: 1

# WICHTIG: engine/mods/cnc/rules/palettes.yaml registriert `RotationPaletteEffect@water` OHNE
# `Palettes:`-Filter -> wirkt per Default auf ALLE geladenen Paletten ausser `ExcludePalettes`
# (aktuell nur "effect, chrome"). Der Trait rotiert Index 32-38 kontinuierlich (klassischer
# TD/RA-Wasser-Schimmer) - ohne Ausschluss faerbt das jeden Pixel unserer neuen aot-ts-isotem/
# aot-ts-isosno-Paletten in diesem Indexbereich staendig um. TS-Gebaeude-SHPs nutzen genau
# diesen Bereich fuer Schattierungen/Fenster -> sah wie ein Sequenz-Loop aus, war aber reine
# Palette-Rotation (Sprite-Frame bleibt korrekt statisch bei Length: 1). Fix: unsere beiden
# Paletten zur ExcludePalettes-Liste hinzufuegen (komplette Liste, da Override ersetzt statt
# mergt).
^Palettes:
	RotationPaletteEffect@water:
		ExcludePalettes: effect, chrome, aot-ts-isotem, aot-ts-isosno
		RotationBase: 32
	# Weisser Vollbild-Blitz bei jedem Ion-Storm-Einschlag. Eigener Type, damit der
	# unbenannte Standard-Flash (Nuke o.ae.) unberuehrt bleibt. Ausgeloest per
	# FlashEffectWarhead in der Waffe IonStormBolt - kein C# noetig.
	FlashPostProcessEffect@aot-ionstorm:
		Type: aot-ionstorm
		Length: 12
		Color: FFFFFF

