# === Age of Tiberium (aotmod) - Light Posts (nur Import, fuer spaetere Verwendung) ===
# REDLAMP/GRENLAMP/BLUELAMP/YELWLAMP/PURPLAMP nutzen identisches Sprite wie GALITE,
# unterscheiden sich in TS nur durch die Farbe der TerrainLightSource zur Laufzeit.
# TerrainLightSource ist HIER NOCH NICHT aktiv: der Trait erfordert einen World-weiten
# "TerrainLighting"-Trait, den dieser Mod bisher nicht registriert hat (Engine-Crash beim
# Laden ohne ihn). Vorerst rein dekorativ importiert, farbige Lichtquelle als offener Punkt.

aot-ts-galite:
	Inherits: ^CivBuilding
	Building:
		Footprint: x
		Dimensions: 1,1
	Selectable:
		Bounds: 1024, 1024
	Health:
		HP: 60000
	Armor:
		Type: Wood
	RenderSprites:
		Image: aot-ts-galite
		Palette: aot-ts-isotem
	Tooltip:
		Name: Light Post

aot-ts-redlamp:
	Inherits: aot-ts-galite
	Tooltip:
		Name: Red Light Post

aot-ts-grenlamp:
	Inherits: aot-ts-galite
	Tooltip:
		Name: Green Light Post

aot-ts-bluelamp:
	Inherits: aot-ts-galite
	Tooltip:
		Name: Blue Light Post

aot-ts-yelwlamp:
	Inherits: aot-ts-galite
	Tooltip:
		Name: Yellow Light Post

aot-ts-purplamp:
	Inherits: aot-ts-galite
	Tooltip:
		Name: Purple Light Post

