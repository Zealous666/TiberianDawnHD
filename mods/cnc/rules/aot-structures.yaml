	# Eigener Baumenue-Name + Icon (User 2026-09-02): der SAM-Eintrag soll nach dem Bunkered-
	# Upgrade auch im Menue als Variante erkennbar sein. Tooltip = einfacher Feld-Override (SAM
	# hat nur EINEN unbedingten Tooltip, daher kein production-tooltip-condition-trap). Icon =
	# Sequenzname im geerbten "sam"-Image (Buildable.Icon), siehe structures-overrides.yaml.
