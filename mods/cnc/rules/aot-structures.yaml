# === Age of Tiberium (aotmod) - Temple of Nod (TMPL): Age 1 Icon + Age 2+ TS NATMPL Sprite-Switch ===
# Age 1 (ab ~aot-age1 sichtbar): unveraendertes TD TMPL.ZIP-Sprite, nur neues Build-Icon (tmpl_base.png).
# Ab Age 2: TS NATMPL ("Temple of NOD", rules.ini Zeile 5377 -- NICHT NTPYRA, siehe [[nod-shrine-system]]
# Namensverwechslungsgefahr) ersetzt das Sprite, neues Icon (tmpl_ages.png).
# Zwei-Layer-Compositing (Body silbergrau + House-Color-Overlay 176-191) wie STEC/MSLO/ORBC/Nod-Radar.
# Echtes TS-Buildup vorhanden (natmplmk.shp, Frames 0-16 = 17 echte Aufbau-Frames, Rest Schatten-Reste
# verworfen) -> aot-age2-make. Footprint bleibt unveraendert (3x3 + Bib), nur Sprite/Icon wechseln.
# ProvidesPrerequisite@buildingname: erhaelt den lowercase-Prerequisite-String "tmpl" (von aot-shrine +
# NOD-Age-3-Gate referenziert), da -Buildable: die implizite Buildable-BuildLimit-Ableitung entfernt.
TMPL:
	# 2000 -> 5000 (User 2026-08-04, Balance).
	Valued:
		Cost: 5000
	ProvidesPrerequisite@buildingname:
		Prerequisite: tmpl
	ProvidesPrerequisite@aottmpl:
		Prerequisite: aot-tmpl
	# Healthbar saß ohne explizite Selectable.Bounds weit ueber dem Gebaeude (Engine-Default
	# fuer ^3x2Shape offenbar zu hoch berechnet). Gleicher Fix wie bei ORBC/ATEC/STEC (identisches
	# 3x3-Footprint xxx xxx ===).
	Selectable:
		Bounds: 3072, 2048
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@base:
		Sequence: idle
		Name: body
		PauseOnCondition: lowpower
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		PauseOnCondition: lowpower
		RequiresCondition: aot-age2-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
	WithSpriteBody@tsremap:
		Sequence: aot-age2-remap
		Name: body-ts-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@tslight:
		Sequence: aot-age2-light
		PauseOnCondition: lowpower
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@base:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

