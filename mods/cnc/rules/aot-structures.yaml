		SequenceAlpha: 0.65


# === Age of Tiberium (aotmod) - Sub Passenger Upgrade ===
# Normale U-Boot erhält 5 Infanterie-Passagier-Slots.
# Voraussetzung: Sub Pen + Hand of NOD. Sichtbar ab Age 1.
aot-upgrade-sub-cargo:
	Tooltip:
		Name: actor-aot-upgrade-sub-cargo.name

	Buildable:
		BuildPaletteOrder: 45
		Prerequisites: aot-subpen, hand, ~aot-age2, ~!aot-sub-cargo-upgrade
		Queue: Upgrade.Nod
		BuildLimit: 1
		MoveIntoWorld: false
		Icon: icon
		Description: actor-aot-upgrade-sub-cargo.description

	Valued:
		Cost: 400

	RenderSprites:
		Image: aot-upgrade-sub-cargo

	ProvidesPrerequisite:
		Prerequisite: aot-sub-cargo-upgrade

	Interactable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Vessel Gun Upgrade (NOD-exklusiv) ===
# Transport Vessel erhält Gunboat-MG-Turret (MGUN). Ab Age 1 + FIX + SubPen.
