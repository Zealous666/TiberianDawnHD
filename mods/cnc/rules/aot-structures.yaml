# === Age of Tiberium (aotmod) - FIX: RA Repair Facility Sprites in Age 0, TD ab Age 1 ===
# Doppel-Aktor-Pattern analog PYLE. FIX muss das Prerequisite "fix" explizit bereitstellen.
FIX:
	-Buildable:
	# User-Wunsch 2026-08-05: 500 -> 1500. Hier am Basis-Aktor, nicht an den Varianten: alle fuenf
	# (aot-fix-age0/1/2 GDI und aot-fix-age1/2-nod) erben von FIX, ein Eintrag deckt also beide
	# Fraktionen ab.
	Valued:
		Cost: 1250
	# User-Wunsch 2026-08-01: repariertes Fahrzeug bleibt nach Abschluss noch ~2 Sekunden stehen
	# (50 Ticks bei Standard-Timestep 40ms), statt im selben Tick loszufahren. Gibt u.a. das
	# Zeitfenster, es dort noch zu verkaufen. RepairsUnits selbst wird von der Engine geerbt,
	# hier nur das neue Feld ergaenzt (Feld-Merge, kein "-Trait:" noetig).
	RepairsUnits:
		LingerAfterRepair: 50
	# Engine-Default ist HasMinibib:true -> WithBuildingBib rendert nur rows=1, also
	# ausschliesslich die Frames 0-2 des 6-Frame-Bibs (BIB2 = 3 breit x 2 Zeilen).
	# Die untere Bib-Zeile wurde dadurch nie gezeichnet ("unten abgeschnitten").
	# false => rows=2, bibOffset = Dimensions.Y-2 = 1 -> exakt dasselbe Layout wie FACT.
	# Leerer Wert wuerde den geerbten true NICHT loeschen, daher explizit false.
	WithBuildingBib:
		HasMinibib: false
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	# Age-2: beide Fraktionen wechseln auf TS GADEPT-Sprite
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-fix-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-fix-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-nod-idle
		Name: body-ts
		RequiresCondition: aot-fix-age2-active
	WithIdleOverlay@tsremap:
		Sequence: aot-age2-nod-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-fix-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-nod-make
		RequiresCondition: aot-fix-age2-active
	WithBuildingPlacedAnimation@ra:
		Body: body
		Sequence: aot-ra-build
		RequiresCondition: !aot-age1-active
	WithBuildingPlacedAnimation@td:
		Body: body-td
		Sequence: make
		RequiresCondition: aot-age1-active && !aot-fix-age2-active

aot-fix-age0:
	Inherits: FIX
	RenderSprites:
