		AreaTypes: building
		Adjacent: 8
	-GivesBuildableArea:
	-SpawnActorsOnSell:
	ProvidesPrerequisite:
		Prerequisite: aot-subpen
	RevealsShroud:
		Range: 4c0
	RallyPoint:
	CommandBarBlacklist:
