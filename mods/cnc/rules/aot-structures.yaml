# === Age of Tiberium (aotmod) - NOD Radar (aot-nod-radar) ===
# NOD-exklusives Radar-Gebäude auf Basis des RA DOME-Sprites.
# Stellt anyhq bereit (gleiche Funktion wie GDI HQ).
aot-nod-radar:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen.
	-WithDeathAnimation:
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 630,-384,0, 630,384,0, -700,-512,0, -700,512,0
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-aot-nod-radar.name
	ProvidesPrerequisite:
		Prerequisite: anyhq
	# KRITISCH (Bugfix 2026-07-05, User-Fund: SAM trotz gebauter Radar Dome nicht
	# freigeschaltet): ProvidesPrerequisite ohne expliziten Wert defaultet auf
	# den NAMEN DES TATSAECHLICH GEBAUTEN AKTORS (init.Self.Info.Name) - nicht
	# auf den Namen dieser Basis-Vorlage. Da "aot-nod-radar" selbst nie direkt
	# gebaut wird (nur die drei Alters-Proxies aot-nod-radar-age0/age1/age2, die
	# jeweils IHREN EIGENEN Namen liefern wuerden), kam "aot-nod-radar" als
	# Prerequisite-String nie zustande. Explizite Wert-Angabe noetig - exakt
	# dasselbe Muster wie bei TMPL/hpad/silo in dieser Datei.
	ProvidesPrerequisite@buildingname:
		Prerequisite: aot-nod-radar
	# Nicht direkt baubar — zwei Proxy-Aktoren (Doppel-Aktor-Pattern) für Icon-Wechsel ab Age 2.
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Selectable:
		Bounds: 2048, 2048
	# Sprite-Switch: RA DOME (Age 0) → TS DOME+Dish composite (Age 1) → TS NOD Radar (Age 2).
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@dome:
		Sequence: idle
		Name: body
		PauseOnCondition: lowpower
		RequiresCondition: !aot-age1-active
	WithSpriteBody@age1:
		Sequence: aot-age1-idle
		Name: body-age1
		PauseOnCondition: lowpower
		RequiresCondition: aot-age1-active && !aot-age2-active
	# Basis = EINZIGES fixes Frame (aus dem Kombi-Sprite bei Linie 17 abgeschnitten) -> kann
	# strukturell nicht zwischen Frames springen. Dish = separate 24-Frame-Overlay-Animation
	# (oberer Teil desselben Kombi-Sprites), liegt immer VOR der Basis (wie im echten TS-Original,
	# das ebenfalls nie dynamisch verdeckt hat - siehe radar-system.md).
	WithSpriteBody@age2:
		Sequence: aot-age2-idle
		Name: body-age2
		PauseOnCondition: lowpower
		RequiresCondition: aot-age2-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im Gruen-Hue-Fenster (0.29-0.37) zur
		# Spielerfarbe (siehe silo-system.md). Body ist RGBA/truecolor -> explizit absichern.
		Palette: effect
		IsPlayerPalette: false
	# Player-Color-Overlay (Emblem sitzt auf der fixen Basis -> ein statisches Frame reicht).
	# Indiziertes Sprite, Player-Fallback hier korrekt/gewollt (direkter Index-Remap, kein ColorShift).
	WithSpriteBody@age2remap:
		Sequence: aot-age2-remap
		Name: body-age2-remap
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@dish:
		Sequence: aot-age2-dish
		PauseOnCondition: lowpower
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@dome:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@age1:
		BodyNames: body-age1
		Condition: build-incomplete
		Sequence: aot-age1-make
	WithMakeAnimation@age2:
		BodyNames: body-age2
		Condition: build-incomplete
		Sequence: aot-age2-make
	Health:
		HP: 80000
	RevealsShroud:
		Range: 10c0
	WithBuildingBib:
	# !aot-ion-storm-blackout: waehrend eines Ion Storms faellt das Radar aus (siehe overrides.yaml).
	# Muss HIER stehen, nicht in overrides.yaml - diese Datei laedt spaeter und wuerde den dortigen
	# Wert sonst wieder ueberschreiben.
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout
	RenderDetectionCircle:
	DetectCloaked:
		Range: 5c0
		RequiresCondition: !lowpower
	AotInfiltrateForScan:
		Types: SpyInfiltrate
		Duration: 250
		PlayerExperience: 10
		InfiltratedNotification: BuildingInfiltrated
		InfiltratedTextNotification: notification-building-infiltrated
	Power:
		Amount: -50
	RenderSprites:
		Image: aot-nod-radar

