	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	# === Age of Tiberium (aotmod) - NOD Airstrike-Superpower ===
	# Ab STEC (Age 0) verfügbar, aber erst freigeschaltet durch das gleichnamige
	# "Airstrike"-Upgrade (aot-upgrade-nod-airstrike liefert aot-nod-airstrike-upgrade).
	# Gating-Pattern analog ORBC IonCannonPower / ZoneTrooperDrop: GrantConditionOnPrerequisite
	# schaltet die Condition frei, AirstrikePower + Charge-Bar hängen an RequiresCondition.
	# 2 MiGs fliegen 2× an (wie der A10-Airstrike ursprünglich) und feuern je Anflug
	# 2 Raketen aufs Ziel statt Napalm/MG (aot-mig + aot-MigMissile, nach der RA-MiG
	# modelliert). Mehrfach-Anflug via custom AotAirstrikePower (Passes) — die stock
	# AirstrikePower kann nur einen Überflug (SendAirstrike ist fest verdrahtet).
	GrantConditionOnPrerequisite@airstrike:
		Condition: aot-nod-airstrike-active
		Prerequisites: aot-nod-airstrike-upgrade
	AotAirstrikePower:
		# Eindeutiger OrderName — sonst kollidiert der Support-Power-Key (Default = TraitName+"Order")
		# mit anderen Powers gleichen Typs und die Palette zeigt Icon/Tooltip der falschen Power.
		OrderName: AotMigAirstrikeOrder
		# Verschwindet, sobald das Banshee-Airstrike-Upgrade gekauft ist — Banshee ERSETZT den MiG-Airstrike.
		RequiresCondition: aot-nod-airstrike-active && !aot-nod-banshee-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-airstrike
		ChargeInterval: 7500
		SquadSize: 2
		Passes: 2
		QuantizedFacings: 8
		Name: Airstrike
		Description: Two MiG jets make two attack passes, each firing two guided rockets at the target area.
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: EnemyPlanesApproaching
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		IncomingTextNotification: notification-enemy-planes-approaching
		UnitType: aot-mig
