		Facing: 384
		ExitCell: -1,2
	Exit@2:
		SpawnOffset: 0,-213,0
		Facing: 640
		ExitCell: 3,2
	Exit@3:
		SpawnOffset: 0,0,0
		Facing: 128
		ExitCell: 0,0
	Exit@4:
		SpawnOffset: 0,0,0
		Facing: 896
		ExitCell: 2,0
	RepairsUnits:
		HpPerStep: 1000
		Interval: 15
		PlayerExperience: 5
		StartRepairingNotification: Repairing
		StartRepairingTextNotification: notification-repairing
	Production:
		Produces: Naval.Nod
	ProductionQueue:
		Type: Naval.Nod
		Group: Naval
		DisplayOrder: 5
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar:
		ProductionType: Naval.Nod
	RenderSprites:
		Image: aot-subpen
	WithSpriteBody:
		Sequence: idle
		Name: body
	WithMakeAnimation:
		Condition: build-incomplete
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
