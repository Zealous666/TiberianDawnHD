# GDI Tier-2-Gebäude. Sichtbar + baubar ab Age 2 (~aot-age2).
# Stellt aot-atec bereit → schaltet HTNK Dual-Railgun Upgrade sichtbar; stellt atec (Tech-Gate) für ORBC/Ion Cannon Strike bereit.
ATEC:
	Inherits: ^BaseBuilding
	# HITSHAPE-FIX (2026-08-03): wie STEC -- nur ^1x1Shape geerbt bei 3x2-Rumpf. ^3x2Shape deckt ihn.
	Inherits@shape: ^3x2Shape
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `atec` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Tech Center
	Production@UPGRADEGDI:
		Produces: Upgrade.GDI
	# Baufortschritts-Balken unter der Healthbar (User-Wunsch 2026-08-02): zeigt den Fortschritt
	# des laufenden Upgrades -- u.a. der Age-Aufstiege, die ueber genau diese Queue laufen.
	# ProductionBar verlangt ein Production-Trait am Aktor (Requires<ProductionInfo>), das hier
	# direkt darueber steht; die Queue findet es ueber ProductionType == ProductionQueue.Type.
	ProductionBar@UPGRADEGDI:
		ProductionType: Upgrade.GDI
	AotOpensProductionTabOnSelection:
		Group: Upgrade
	ProductionQueue@UpgradeGDI:
		Type: Upgrade.GDI
		ShowUpgradedOverlay: True
		Factions: gdi
		Group: Upgrade
		ShowLockedItems: True
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Valued:
		Cost: 2000
	Health:
		HP: 60000
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-atec
	ProvidesPrerequisite@techname:
		Prerequisite: atec
	# !aot-ion-storm-blackout: waehrend eines Ion Storms faellt das Radar aus (siehe overrides.yaml).
	# Muss HIER stehen, nicht in overrides.yaml - diese Datei laedt spaeter und wuerde den dortigen
	# Wert sonst wieder ueberschreiben.
	ProvidesRadar:
		RequiresCondition: !lowpower && !aot-ion-storm-blackout
	RevealsShroud:
		Range: 5c0
	WithBuildingBib:
	# GDI-Tech: eigene Verkaufs-Liste (kein Engineer, dafuer ein ziviler Wissenschaftler).
	# Auf aot-Infanterie umgestellt (User-Wunsch 2026-08-02); Factions: gdi wird von der
	# unbenannten ^BaseBuilding-Instanz geerbt. ATEC ist GDI-exklusiv -> NOD-Instanz raus.
