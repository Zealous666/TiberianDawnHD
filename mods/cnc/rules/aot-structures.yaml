		Queue: Building.GDI, Building.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~aot-age1, ~!aot-age2, ~!aot-nuke-turbine-upgrade, fact
		Icon: aot-td-icon
		Description: Generates power.
	Tooltip:
		Name: actor-nuke.name
	# Fix (2026-07-26): Age-1 ist fuer DIESEN Proxy garantiert (map-platziert oder ueber
	# die Queue gebaut, beides setzt Age-1 voraus). Der Age-1-Term wird aus der geerbten
	# Sprite-Condition entfernt -> Editor-Vorschau + vorplatzierte Aktoren zeigen sofort
	# den TD-Sprite. Age-2/Turbine bleiben live-gekoppelt (echtes Nachruesten der SELBEN
	# Instanz funktioniert weiterhin unveraendert).
	-WithSpriteBody@ra:
	-WithMakeAnimation@ra:
	WithSpriteBody@td:
