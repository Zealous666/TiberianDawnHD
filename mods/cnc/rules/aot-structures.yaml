# === Age of Tiberium (aotmod) - LITE Editor-Platzierer fuer die Age-2-Optik (2026-07-26) ===
# aot-lite-gdi/-nod selbst zeigen im Karteneditor bereits korrekt die Age-0/1-Optik (das ist
# der Default-Zustand ohne Spieler-Techtree, siehe locked-icon-system.md "Age-Proxy Sprite-
# Guarantee-Fix"). Fuer die Age-2-Optik gab es aber GAR KEINEN eigenen Platzierer -- diese
# beiden Aktoren schliessen die Luecke. KEIN Buildable: erscheinen NIE in einer Bau-Queue,
# rein zum gezielten Vorplatzieren im Karteneditor (bleiben aber voll funktionsfaehig, falls
# ein Mapper sie tatsaechlich auf eine Karte setzt).
aot-lite-gdi-editor-age2:
	Inherits: aot-lite-gdi
	-Buildable:
	RenderSprites:
		Image: lite-gdi
	-WithSpriteBody@base:
	-WithIdleOverlay@ROOF:
	-WithMakeAnimation@base:
	WithSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tsremap:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsroof:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsroofremap:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsblink:
		RequiresCondition: !build-incomplete
	WithMakeAnimation@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active

aot-lite-nod-editor-age2:
	Inherits: aot-lite-nod
	-Buildable:
	RenderSprites:
		Image: lite-nod
	-WithSpriteBody@base:
	-WithIdleOverlay@ROOF:
	-WithMakeAnimation@base:
	WithSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tsremap:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsroof:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsroofremap:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsblink:
		RequiresCondition: !build-incomplete
	WithMakeAnimation@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Ore Mine ===
# Neutrales Gebäude, via Map-Editor platziert. Kein Buildable-Trait.
# DockHost Typ "OreLoad" — ORET-Fahrzeug dockt hier an um Erz zu laden.
# Hohe HP = praktisch unzerstörbar (kann später finite Ressourcen erhalten).
aot-ore-mine:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Tooltip:
		Name: actor-aot-ore-mine.name
		GenericName: actor-aot-ore-mine.generic-name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		LocalCenterOffset: 0,0,0
		TerrainTypes: Clear,Rough,Road,Rock,Clear.Snow
	Health:
		HP: 99999
	DamageMultiplier:
		Modifier: 0
	StoresResources:
		# Capacity ist hier kein Erz-Vorrat, sondern die Anzahl Fuhren, die die Mine uebersteht
		# (OreMineDurability.OnTrip zieht pro Fuhre 1 ab, unabhaengig von ORET.OreLoadAmount) --
		# User-Wunsch 2026-08-01: 250 -> 500 Erz pro Fuhre (aot-units.yaml, ORET.OreLoadAmount).
		# User-Wunsch 2026-08-03: Einkommen pro Zeit runter UND Mine frueher erschoepft. Beides
		# zusammen: OreLoadAmount 500 -> 400 (Rate -20%, aot-units.yaml) und Fuhren 50 -> 40
		# (Laufzeit -20%). Multipliziert sich zu 40 x 400 = 16000 statt bisher 25000.
		# User 2026-08-05: 40 -> 50 Fuhren. Zusammen mit OreLoadAmount 400 -> 200 ergibt das
		# 50 x 200 = 10000 pro Mine (vorher 40 x 400 = 16000): Rate halbiert, Laufzeit +25 %.
		Capacity: 50
		Resources: Tiberium
	OreMineDurability:
		ResourceType: Tiberium
	DockHost:
		Type: OreLoad
		DockAngle: 0
		DockOffset: 0,-1c512,0
	WithBuildingBib:
	# Vergroesserte Nicht-bebaubar-Zone: spawnt bei Spielstart einen unsichtbaren Begleit-Aktor
	# (aot-ore-mine-keepout, 8x8) zentriert auf die 2x2-Mine (Offset -3,-3 = 3-Zellen-Ring rundherum).
	# Bewusst ueber einen SEPARATEN Aktor statt groesserer Building.Dimensions: sonst wuerden Bib
	# (WithBuildingBib leitet Breite/Zeilen aus Dimensions ab) und Render-Zentrum mitwandern.
	SpawnCompanionActor:
		Actor: aot-ore-mine-keepout
		Offset: -3,-3
	MapEditorData:
		Categories: Neutral
# === Ende aotmod ===

# aot-ore-mine-keepout: unsichtbarer, passierbarer Sperr-Footprint fuer die Ore Mine.
# Reiner 8x8-'='-Footprint (OccupiedPassable): registriert in BuildingInfluence -> blockiert
# jede Bauplatzierung im Ring, ist aber NICHT in OccupiedTiles -> Einheiten/Sammler fahren durch.
# Kein Sprite/Bib/Health/Selection -> aendert Optik, Bib und Zentrierung der Mine nicht.
# Wird von SpawnCompanionActor (auf der Mine) zur Laufzeit erzeugt, nie im Editor platziert.
aot-ore-mine-keepout:
	Building:
		Footprint: ======== ======== ======== ======== ======== ======== ======== ========
		Dimensions: 8,8
		AllowInvalidPlacement: true
	Interactable:
# === Ende aotmod ===



# === Age of Tiberium (aotmod) - FACT: ORET Spawn ===
FACT:
	OretSpawnStateCarrier:
		SpawnActor: ORET
		SpawnOffset: 0,1
		Facing: 384
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - FACT: RA sprites in Age 0, TD ab Age 1 ===
# Zwei WithSpriteBody (body/body-td) gegenseitig exklusiv via aot-age1-active.
# RA idle = Frame 0 (eingefroren). WithBuildingPlacedAnimation@ra/@td weiter unten spielt
# beim MCV-Deploy die echten FACT.ZIP-Frames 1-25 ab (siehe fact-mcv-sprites.md) — Kommentar
# war stale, widersprach dem tatsächlichen Trait-Setup.
FACT:
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	GrantConditionOnPrerequisite@aotage3:
		Condition: aot-age3-active
		Prerequisites: aot-age3
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
	WithIdleOverlay@tsremap:
		Sequence: aot-age2-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@lights:
		Sequence: aot-age2-lights
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make
	-WithBuildingPlacedAnimation:
	WithBuildingPlacedAnimation@ra:
		Body: body
		Sequence: aot-ra-build
		RequiresCondition: !aot-age1-active
	WithBuildingPlacedAnimation@td:
		Body: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active

