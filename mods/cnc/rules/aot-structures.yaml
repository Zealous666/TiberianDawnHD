		PlayerExperience: 10
		Types: SpyInfiltrate
		InfiltratedNotification: BuildingInfiltrated
		InfiltratedTextNotification: notification-building-infiltrated
	-WithResourceLevelOverlay:
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@base:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
	WithIdleOverlay@tsanim:
		Sequence: aot-age2-anim
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@base:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

WEAP:
	# === Age-2-Sprite-Wechsel (Gemini-Import, zweiteilig Body+Tor) — Muster wie PROC/PYLE ===
	# aot-age2-active kommt vom Gatekeeper-Upgrade. WEAP bleibt der Age-1-Bau-Eintrag; der
	# Age-2-Bau-Proxy (aot-weap-age2, unten) liefert nur die Age-2-Platzier-Vorschau.
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	# KEINE RenderSprites.Palette-Sperre hier! Die wuerde auch fuer Age 1 gelten und dort die
	# normale Spielerfarbe des TD-WEAP-Sprites abschalten (User-Report 2026-08-30: "age 1 hat
	# keine player color"). Alle Ebenen behalten die Default-"player"-Palette, das Gruen wird
	# also — in beiden Ages gleich — per PlayerColorShift zur Spielerfarbe. Einzige Ausnahme:
	# die Zahnrad-Animation (grau, explizit "effect").
	# Age-1-Bau nur solange NICHT Age-2 (danach uebernimmt aot-weap-age2 den Menue-Eintrag).
	Buildable:
		LockedGroup: aot-grp-weap
		Prerequisites: ~aot-age1, aot-age1, lite, aot-gdi-advtech-upgrade, ~!aot-age2
	# Age-1: TD-Produktionstor. Eigene Sequenz aot-age1-top statt der geerbten build-top --
	# nur unter eigenem Namen laesst sich der Remaster-Pfad abschalten (siehe aot-sequences.yaml).
	WithProductionDoorOverlay:
		Sequence: aot-age1-top
		RequiresCondition: !build-incomplete && !aot-age2-active
	-WithSpriteBody:
	WithSpriteBody@base:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	# KOMPLETTES Gebaeude, liegt UNTER den Fahrzeugen (an der Torstelle eine dunkle Hoehle).
	# KEINE Palette-Sperre: das Gruen traegt das Sprite selbst und wird — wie beim Age-1-Sprite —
	# ueber die Default-"player"-Palette eingefaerbt. Body und Tor laufen so ueber denselben
	# Farbpfad (kein Farbversatz, und das bewegte Tor bekommt dieselbe Spielerfarbe).
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
	# Die zwei kreisrund ausgeschnittenen Zahnraeder drehen sich in sich (volle 360° = nahtloser
	# Loop). Grau/ohne Farbton -> Palette egal; explizit "effect", damit der PlayerColorShift sie
	# garantiert nicht anfasst. In Body UND Tor-Overlay sind sie wegretuschiert.
	WithIdleOverlay@tsgears:
		Sequence: aot-age2-gears
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && !build-incomplete
	# NUR das Torpanel — es gleitet nach oben ins Gebaeude (Frame 0 = geschlossen).
	# WithProductionDoorOverlay rendert mit konstantem zOffset (CenterOffset.Y + 512), liegt also
	# pauschal ueber allen Einheiten der Umgebung. Deshalb gehoert hier NUR die Torflaeche rein:
	# ein groesseres Overlay (Dach/Maschinerie) laesst Einheiten verschwinden, die davor stehen.
	# Fahrzeuge fahren erst eine Zelle weiter nach Sueden (Vanilla 0,1 -> 0,2; 0,2 ist im
	# Footprint "xxx +++ ===" die '='-Reihe = OccupiedPassable, dort darf angehalten werden;
	# 0,1 ist '+' = TransitOnly). Laengere ReturnToCellActivity -> das Tor bleibt laenger offen,
	# sonst schliesst es dem noch ausfahrenden Fahrzeug ins Bild (WithProductionDoorOverlay
	# schliesst, sobald diese Activity endet).
	Exit@1:
		ExitCell: 0,2
	WithProductionDoorOverlay@ts:
		Sequence: aot-age2-door
		RequiresCondition: !build-incomplete && aot-age2-active
	-WithMakeAnimation:
	WithMakeAnimation@base:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

# Age-2-Bau-Proxy: eigener Aktor NUR fuer die Platzier-Vorschau ab Age 2 (SequencePlaceBuildingPreview
# zeigt das Age-2-Vollgebaeude als Ghost). WEAP selbst ist der Age-1-Menue-Eintrag; beide teilen
# LockedGroup + BuildLimit, und "!weap" verhindert einen zweiten (ein bereits ge-upgradeter WEAP
# stellt "weap" bereit). Muster wie aot-atec-age2, aber nur 2-stufig (kein Age-0).
aot-weap-age2:
	Inherits: WEAP
	# Image explizit auf weap (sonst faellt es auf den Aktornamen aot-weap-age2 ohne Sequenzen zurueck).
	# KEINE Palette-Sperre — die Default-"player"-Palette wird fuer Tor/Spielerfarbe gebraucht.
	RenderSprites:
		Image: weap
	# behaelt "weap" als bereitgestelltes Prerequisite (MTNK-Upgrades/Techtree), nicht den
	# eigenen Aktornamen (ProvidesPrerequisite@buildingname ohne Prerequisite = Aktorname).
	ProvidesPrerequisite@buildingname:
		Prerequisite: weap
	# WEAP ersetzt ActorPreviewPlaceBuildingPreview bereits durch SequencePlaceBuildingPreview
	# (structures.yaml, Sequence "place") — hier nur die Ghost-Sequenz auf das Age-2-Vollbild umbiegen.
	SequencePlaceBuildingPreview:
		Sequence: aot-age2-full
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-weap
		Queue: Building.GDI
		BuildPaletteOrder: 150
		BuildLimit: 1
		Prerequisites: ~aot-age2, aot-age2, lite, aot-gdi-advtech-upgrade, !weap
		# reale Sequenz unter image weap (traegt weap_base.png); WEAPs "weap_base" ist keine Sequenz.
		Icon: icon
		Description: actor-weap.description
	Tooltip:
		Name: actor-weap.name

SILO:
	InfiltrateForCash:
		Percentage: 50
		PlayerExperience: 10
		Types: SpyInfiltrate
		InfiltratedNotification: BuildingInfiltrated
		InfiltratedTextNotification: notification-building-infiltrated

# === Age of Tiberium (aotmod) - SILO: OreDeliver Dock + Age-Sprite-Wechsel (Muster wie PYLE/HAND) ===
# ORET liefert Erz am Silo ab (Südseite). Silo immer baubar (nur anypower, kein Age-Gate).
# WithSpriteBody@ra (statisches RA-Doppel-Sprite, links voll/rechts halbvoll) bis Age-1,
# WithResourceLevelSpriteBody@td (klassische TD-Füllstands-Animation) Age-1 bis Age-2,
# WithSpriteBody@ts (statisches TS-Doppel-Sprite, links voll/rechts halbvoll) ab Age-2.
# Einheitliches Image (silo) für alle drei Proxies — Sprite-Wechsel via Condition, nicht via Image-Swap.
SILO:
	-Buildable:
	# Vanilla-SILO entfernt bereits die unbenannte Verkaufs-Infanterie
	# (engine/mods/cnc/rules/structures.yaml); das NOD-Gegenstueck aus ^BaseBuilding
	# muss hier mit entfernt werden (siehe Kommentar ganz oben in dieser Datei).
	-SpawnActorsOnSell@nod:
	# 2x2-Footprint: die smudge-freie Nordreihe des alten 2x3 (xx xx ==) entfernt,
	# analog zum Gate-Fix (siehe ts-gates-system.md). WithBuildingBib deckt nur die
	# unteren 2 Reihen ab -> alte Nordreihe "xx" war ohnehin ohne Bib. LocalCenterOffset
	# um -512 (eine Zeilen-Reduktion) nachgezogen, damit Silo+Smudge an derselben
	# Stelle bleiben wie zuvor (100 -> -412).
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,-412,0
	DockHost:
		Type: OreDeliver
		# aotmod: = OreTransporter.UnloadFacing (256 = Ost). Der ORET dockt damit gleich in der
		# Entlade-Ausrichtung an; frueher (0=Nord) drehte er beim Anfahren erst auf Nord und OnDockTick
		# musste dann noch auf Ost nachdrehen -> sichtbares doppeltes Eindrehen.
		DockAngle: 256
		# Dock muss auf der passierbaren Smudge-Reihe (Footprint-Zeile "==", Fussprint-lokal
		# y=1024..2048) liegen, nicht dahinter. CenterPosition.Y liegt (nach LocalCenterOffset
		# -412) bei 612 -- der alte Offset 1c512 (=1536) landete bei 2148, eine ganze Zelle
		# HINTER dem 2x2-Footprint/Smudge (User-Report: "Dockingpoint unterhalb des Smudge").
		# 924 zentriert den Dock-Punkt in der Zeile (612+924=1536 = Zeilenmitte 1024..2048).
		DockOffset: 0,924,0
	# Silo erweitert die Bauzone wie ein normales Gebaeude (Basis-SILO hatte -GivesBuildableArea).
	GivesBuildableArea:
		AreaTypes: building
	-WithBuildingBib:
	WithBuildingBib:
	AotGrantConditionOnPrerequisiteLatched@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithResourceLevelSpriteBody:
	WithResourceLevelSpriteBody@ra:
		Sequence: aot-ra-stages
		Name: body
		# Dynamischer Fuellstand (empty->full) wie klassisches TD-Silo. Frame-Index folgt
		# StoresPlayerResources/Capacity ueber alle Depots. 5 Frames im Sheet.
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: !aot-age1-active
	WithIdleOverlay@raremap:
		Sequence: aot-ra-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: !aot-age1-active && !build-incomplete
	WithResourceLevelSpriteBody@td:
		Sequence: stages
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithResourceLevelSpriteBody@ts:
		Sequence: aot-ts-stages
		Name: body-ts
		RequiresCondition: aot-age2-active
		# Dynamischer Fuellstand (5 Frames leer->voll): das gruene Tiberium-Leuchten in
		# der Kuppel dunkelt bei niedrigem Stand ab. Index folgt Resources/Capacity.
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player"
		# zurueck -> PlayerColorShift (combined.frag ColorShift(), MinHue 0.29 /
		# MaxHue 0.37) verschiebt JEDEN Pixel im Gruen-Farbton zur Spielerfarbe.
		# 71,7% des Tiberium-Gruens (Hue ~0.343) liegen drin -> Tiberium wurde blau.
		# Gleiches Muster wie bei den Gates, siehe ts-gates-system.md.
		Palette: effect
		IsPlayerPalette: false
	# Player-Color kommt ausschliesslich ueber dieses indizierte Remap-Overlay
	# (Indizes 187-190 -> PlayerColorPalette RemapIndex 176-191): Streben + Fin.
	WithIdleOverlay@tsremap:
		Sequence: aot-ts-idle-remap
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-ts-make
	# Kapazitaet verdoppelt (User-Wunsch 2026-08-01): Vanilla-SILO liefert 3000
	# (engine/mods/cnc/rules/structures.yaml). Hier zentral ueberschrieben, damit alle drei
	# Age-Proxies (aot-silo-age0/-age1/-age2) es erben.
	StoresPlayerResources:
		Capacity: 6000

aot-silo-age0:
	Inherits: SILO
	RenderSprites:
		Image: silo
	ProvidesPrerequisite@buildingname:
		Prerequisite: silo
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-ra-idle
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-silo
		BuildPaletteOrder: 30
		Prerequisites: fact, ~!aot-age1
		Queue: Building.GDI, Building.Nod
		Description: actor-silo.description
		Icon: aot-icon-age0

aot-silo-age1:
	Inherits: SILO
	RenderSprites:
		Image: silo
	ProvidesPrerequisite@buildingname:
		Prerequisite: silo
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: idle
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-silo
		BuildPaletteOrder: 30
		Prerequisites: fact, ~aot-age1, ~!aot-age2
		Queue: Building.GDI, Building.Nod
		Description: actor-silo.description
		Icon: aot-icon-age1
	-WithResourceLevelSpriteBody@ra:
	-WithIdleOverlay@raremap:
	-WithMakeAnimation@ra:
	WithResourceLevelSpriteBody@td:
		RequiresCondition: !aot-age2-active

aot-silo-age2:
	Inherits: SILO
	RenderSprites:
		Image: silo
	ProvidesPrerequisite@buildingname:
		Prerequisite: silo
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-ts-idle
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-silo
		BuildPaletteOrder: 30
		Prerequisites: fact, ~aot-age2
		Queue: Building.GDI, Building.Nod
		Description: actor-silo.description
		Icon: aot-icon-age2
	-WithResourceLevelSpriteBody@ra:
	-WithIdleOverlay@raremap:
	-WithResourceLevelSpriteBody@td:
	-WithMakeAnimation@ra:
	-WithMakeAnimation@td:
	WithResourceLevelSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tsremap:
		RequiresCondition: !build-incomplete
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - ORBC: Orbital Command (GDI, ab Age 2) ===
# TS GDI Upgrade Center (GAPLUG) Sprites. Nur Age 2 — keine RA-Vorstufe mehr
# (Chronosphere/PDOX-Sprites werden anderweitig verwendet, siehe [[firestorm-system]]).
# Kein Proxy-Pattern noetig - nur ein Erscheinungsbild, kein Age-abhaengiger Icon-/Sprite-Wechsel (wie aot-shrine).
# Support-Powers: Ion Cannon Strike (Age-2-Upgrade), Zone Trooper Drop (Age-3-Upgrade).
# Satellite Surveillance ist entkoppelt, laeuft jetzt auf SLAB (Science Lab, ab Age 1).
ORBC:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `orbc` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Orbital Command
	Valued:
		Cost: 5000
	Health:
		HP: 60000
	Selectable:
		Bounds: 3072, 2048
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-orbc
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -150
	WithBuildingBib:
	RenderSprites:
		Image: orbc
	# Je eine Ladeleiste PRO Power, an ihren OrderName gebunden (2026-08-28) -- sonst zeigen
	# alle Balken denselben Fortschritt (Engine-Bugfix SupportPowerChargeBar.Power). Reihenfolge
	# = Stapelreihenfolge der Balken unter dem Gebaeude.
	SupportPowerChargeBar@satellite:
		Power: AotSatellitePowerInfoOrder
	SupportPowerChargeBar@orca:
		Power: AotOrcaTransportPowerInfoOrder
		RequiresCondition: aot-orca-transport-active
	InfiltrateForSupportPowerReset:
		Types: SpyInfiltrate
		PlayerExperience: 10
	# ORBC/SLAB-Tier-Tausch (2026-08-28): Satellite Surveillance von SLAB hierher verlegt
	# (ab Age 1 verfuegbar). Prerequisites von aot-slab -> aot-orbc; sonst 1:1 uebernommen.
	AotSatellitePower:
		Prerequisites: aot-orbc
		ChargeInterval: 30000
		RequiresCondition: !satellite-used
		PauseOnCondition: lowpower
		Icon: aot-satellite
		Name: Satellite Surveillance
		Description: Uncovers the entire map and lifts the fog of war for 10 seconds, exposing all enemy units. Afterwards the fog returns, but the terrain stays revealed.
		SupportPowerPaletteOrder: 55
	# Orca Transport ist jetzt ein Age-2-Upgrade (2026-08-28): die Power erscheint erst, wenn
	# aot-upgrade-orca-transport gekauft wurde (Condition aot-orca-transport-active).
	GrantConditionOnPrerequisite@orcatransport:
		Condition: aot-orca-transport-active
		Prerequisites: aot-orca-transport-upgrade
	AotOrcaTransportPower:
		RequiresCondition: aot-orca-transport-active
		Prerequisites: aot-orbc
		ChargeInterval: 15000
		IconImage: icon
		Icon: aot-orcatransport
		Name: Orca Transport
		Description: Delivers a squad of vehicles via Orca Transport at the target location.
		ReinforcementsArrivedSpeechNotification: Reinforce
		ReinforcementsArrivedTextNotification: notification-reinforcements-have-arrived
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		DisplayBeacon: True
		BeaconPoster: aot-poster-orcatransport
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 40
	GrantConditionOnPrerequisite@ioncannon:
		Condition: aot-ion-cannon-active
		Prerequisites: aot-ion-cannon-upgrade
	IonCannonPower:
		# Superwaffen-Timer links unten fuer ALLE Spieler sichtbar (User-Wunsch 2026-08-01,
		# klassisches C&C-Feature). Default waere None = kein Timer. Bewusst NUR hier und bei
		# der Atom Bomb gesetzt -- alle anderen Powers bleiben ungetimed.
		DisplayTimerRelationships: Ally, Neutral, Enemy
		RequiresCondition: aot-ion-cannon-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		IconImage: icon
		Icon: aot-ion-strike
		Cursor: ioncannon
		ChargeInterval: 22500
		Name: Ion Cannon Strike
		Description: Calls in a devastating ion cannon strike on the target location.
		BeginChargeSpeechNotification: IonCannonCharging
		EndChargeSpeechNotification: IonCannonReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		BeginChargeTextNotification: notification-ion-cannon-charging
		EndChargeTextNotification: notification-ion-cannon-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		OnFireSound: ion1.aud
		DisplayRadarPing: True
		CameraActor: camera.small
		SupportPowerPaletteOrder: 20
	SupportPowerChargeBar@ion:
		Power: IonCannonPowerInfoOrder
		RequiresCondition: aot-ion-cannon-active
	GrantConditionOnPrerequisite@zonetrooperdrop:
		Condition: aot-zonetrooper-drop-active
		Prerequisites: aot-zonetrooper-drop-upgrade
	AotZoneTrooperDropPower@zonetrooperdrop:
		RequiresCondition: aot-zonetrooper-drop-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		IconImage: icon
		Icon: aot-zone-drop
		ChargeInterval: 15000
		Name: Zone Trooper Drop
		Description: Deploys a squad of Zone Troopers via dropship at the target location.
		Dropship: aot-dropship
		Trooper: aot-zonetrooper
		Count: 5
		Radius: 3c0
		SquadOffset: -1536,1536,0
		QuantizedFacings: 8
		Cordon: 5c0
		ReinforcementsArrivedSpeechNotification: Reinforce
		ReinforcementsArrivedTextNotification: notification-reinforcements-have-arrived
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		DisplayBeacon: True
		BeaconPoster: aot-poster-zone-drop
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 30
	SupportPowerChargeBar@zonetrooperdrop:
		Power: AotZoneTrooperDropPowerInfoOrder
		RequiresCondition: aot-zonetrooper-drop-active
	# ORBC/SLAB-Tier-Tausch (2026-08-28): Age-Sprite-Switch. Age 1 = altes TD EYE-Sprite
	# (eye-idle), ab Age 2 = Gemini-Body (idle). Umschaltung ueber aot-age2-active. Die
	# Addon-Overlays (active/ioncannon/zonetrooperdrop) gehoeren zum Gemini-Body und werden
	# daher zusaetzlich an aot-age2-active gebunden, damit sie nicht ueber dem EYE-Sprite liegen.
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@eye:
		Sequence: eye-idle
		Name: body-eye
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: idle
		Name: body
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		RequiresCondition: aot-age2-active
	# @active (rotierende GAPLUG-Antenne aot-orbc-active.png): auf User-Wunsch wieder aktiv,
	# per Sequenz-Offset nach rechts-unten unter das rote Blinklicht gesetzt.
	WithIdleOverlay@active:
		Sequence: active
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@ioncannon:
		Sequence: ioncannon-addon
		RequiresCondition: aot-ion-cannon-active && !build-incomplete
	WithIdleOverlay@zonetrooperdrop:
		Sequence: zonetrooperdrop-addon
		RequiresCondition: aot-zonetrooper-drop-active && !build-incomplete
	WithIdleOverlay@zonetrooperdropremap:
		Sequence: zonetrooperdrop-addon-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-zonetrooper-drop-active && !build-incomplete
	# 3. Sockel (vorne links): Orca-Transport-Overlay -- erscheint mit dem Age-2-Upgrade.
	# Palette: effect -> kein Player-Color-Shift (Sprite ist dunkles Gunmetal, nicht gold).
	WithIdleOverlay@orcatransport:
		Sequence: orcatransport-addon
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-orca-transport-active && !build-incomplete
	# WithMakeAnimation ist KEIN ConditionalTrait -> kein RequiresCondition. Die Age-Trennung
	# passiert ueber die BodyNames: @eye animiert den EYE-Body (nur !aot-age2-active sichtbar),
	# @ts den Gemini-Body (nur aot-age2-active sichtbar). Der jeweils unsichtbare Body zeigt
	# seine Make-Anim schlicht nicht (identisches Muster wie SLAB @ra/@ts).
	-WithMakeAnimation:
	WithMakeAnimation@eye:
		BodyNames: body-eye
		Condition: build-incomplete
		Sequence: eye-make
	WithMakeAnimation@ts:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		# ORBC/SLAB-Tier-Tausch (2026-08-28): Vorschau zeigt das Age-1-EYE-Sprite statt des
		# Gemini-Umrisses -- ORBC wird (BuildLimit 1) im Regelfall in Age 1 platziert.
		Sequence: eye-place
		SequenceAlpha: 0.65
	Buildable:
		Queue: Building.GDI
		BuildPaletteOrder: 180
		# ORBC/SLAB-Tier-Tausch (2026-08-28): ORBC ist jetzt das Age-1-Tech-Gebaeude
		# (vormals Age 2). Baugate = altes SLAB-Age-1-Gate (War Factory + GDI-Refinery).
		# Das Orbital Command liefert aot-orbc -> schaltet Age 2 frei (overrides.yaml).
		Prerequisites: ~aot-age1, aot-weap, aot-proc-gdi
		BuildLimit: 1
		Icon: icon
		Description: GDI uplink facility. Unlocks advanced support powers as your tech level increases.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - SLAB: Science Lab (GDI, ab Age 1) ===
# Age 1: RA Chronosphere (PDOX) Sprite. Age 2: TS Firestorm Generator (gtfire) Sprite, automatischer Wechsel bei aot-age2.
# Reine Prerequisite-Gate-Funktion (kein Support Power) - liefert aot-slab fuer kuenftige GDI-Techs/Upgrades.
SLAB:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `slab` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Science Lab
	Valued:
		Cost: 5000
	Health:
		HP: 100000
	Selectable:
		Bounds: 3072, 2048
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-slab
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -100
	Power@fspurchased:
		Amount: -1000
		RequiresCondition: aot-fs-purchased
	GrantConditionOnPrerequisite@fspurchased:
		Condition: aot-fs-purchased
		Prerequisites: aot-firestorm-defense-upgrade
	WithBuildingBib:
	RenderSprites:
		Image: slab
	SupportPowerChargeBar:
	# ORBC/SLAB-Tier-Tausch (2026-08-28): Satellite Surveillance ist ans Orbital Command
	# (jetzt Age-1-Gebaeude) gewandert -- die Aufklaerung soll ab Age 1 verfuegbar sein, und
	# SLAB ist jetzt ein Age-2/3-Gebaeude. SLAB behaelt nur die Firestorm Defense Matrix.
	AotFirestormMatrixPower:
		OrderName: AotFirestormMatrix
		Prerequisites: aot-firestorm-defense-upgrade
		ChargeInterval: 7500
		ActiveDuration: 750
		PauseOnCondition: lowpower
		Icon: aot-fs-matrix
		Name: Firestorm Defense Matrix
		Description: Activates the Firestorm barrier on all GDI walls for 30 seconds - destroys all aerial objects crossing the wall, including aircraft, missiles and clusters.
		SupportPowerPaletteOrder: 56
	AmbientSound@fsmatrix:
		SoundFiles: firstrm1.aud
		Interval: 90
		RequiresCondition: aot-fs-matrix-active
	InfiltrateForSupportPowerReset:
		Types: SpyInfiltrate
		PlayerExperience: 10
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-ts-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		# Siehe silo-system.md / powerplant-system.md fuer das gleiche Muster.
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-ts-make
	# Unabhängig flackerndes Licht am Energiekern — NACH der Basis, aber VOR dem Arm-Overlay
	# deklariert, damit der Greifarm es an der Überlappungszone (Klaue vor der Kuppel) korrekt
	# verdeckt (Sprite-Add-Reihenfolge = Painter's-Algorithm-Schicht).
	WithIdleOverlay@tslights:
		Sequence: aot-ts-lights
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@tstower:
		Sequence: aot-ts-tower
		RequiresCondition: aot-age2-active && !build-incomplete
	# Flame-Overlay NACH den Tower-Overlays deklariert, damit es ueber ihnen
	# rendert (Sprite-Add-Reihenfolge = Painter's-Algorithm-Schicht bei
	# gleichem Z) -- vorher lag es DAVOR und wurde vom Tower-Grafik komplett
	# verdeckt, sobald Age-2 aktiv wurde (Bug: Flame nur auf Age-1-Sprite
	# sichtbar). Nur auf dem Age-2-TS-Sprite UND waehrend Ready oder Aktiv.
	WithIdleOverlay@fsflameready:
		Sequence: aot-ts-flame
		RequiresCondition: aot-age2-active && aot-fs-matrix-ready && !build-incomplete
	WithIdleOverlay@fsflameactive:
		Sequence: aot-ts-flame
		RequiresCondition: aot-age2-active && aot-fs-matrix-active && !build-incomplete
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - SLAB Build-Menu Icons (Proxy-Aktoren) ===
# Zwei Proxy-Aktoren steuern das Icon im Baumenue, analog ATEC/STEC/MSLO/NOD-Radar:
# aot-slab-age1: sichtbar Age 1 bis vor Age 2 (RA-Icon). aot-slab-age2: sichtbar ab Age 2 (TS-Icon).
# ORBC/SLAB-Tier-Tausch (2026-08-28): SLAB ist jetzt ein Age-2/3-Gebaeude. Der fruehere
# Age-1-Proxy (RA-Chronosphere-Sprite) hat keine Baubarkeit mehr -- er bleibt nur als
# definierter Aktor bestehen, weil aot-ai.yaml ihn noch namentlich referenziert (Bereinigung
# in der KI-Nachziehphase). Ohne Buildable erscheint er nie im Baumenue.
aot-slab-age1:
	Inherits: SLAB
	RenderSprites:
		Image: slab
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65

aot-slab-age2:
	Inherits: SLAB
	RenderSprites:
		Image: slab
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-ts-place
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-slab
		Queue: Building.GDI
		BuildPaletteOrder: 200
		# ORBC/SLAB-Tier-Tausch (2026-08-28): SLAB ist jetzt das Age-2/3-Gebaeude und
		# der einzige baubare SLAB-Proxy. Baugate = Age-2-Gatekeeper (aot-gdi-ordnance-
		# upgrade, vormals an ORBC). SLAB liefert aot-slab -> schaltet Age 3 frei.
		Prerequisites: ~aot-age2, aot-gdi-ordnance-upgrade, !aot-slab
		BuildLimit: 1
		Icon: aot-age2-icon
		Description: GDI research facility. Provides a prerequisite for future GDI technologies.
	-WithSpriteBody@ra:
	-WithMakeAnimation@ra:
	WithSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tslights:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tstower:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@fsflameready:
		RequiresCondition: aot-fs-matrix-ready && !build-incomplete
	WithIdleOverlay@fsflameactive:
		RequiresCondition: aot-fs-matrix-active && !build-incomplete
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Forbidden Knowledge (Age-2-Gatekeeper) ===
# User-Briefing 2026-08-01: schaltet Cyborg, Chameleon Spy und (zusammen mit aot-shrine)
# Cyborg Commando frei. Icon: wiederverwendet aot-shrine's eigenes Icon (Image: aot-shrine,
# Sequenz "icon").
aot-upgrade-nod-forbidden:
	Tooltip:
		Name: NOD Forbidden Knowledge

	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~aot-age2
		Queue: Upgrade.Nod
		# Feste 2:00 fuer ALLE Gatekeeper (User 2026-08-05), unabhaengig vom Preis. Ohne
		# BuildDuration leitet ProductionQueue.GetBuildTime die Zeit aus den Kosten ab -- die
		# Age-1-Gatekeeper lagen dadurch bei 24s, die Age-2-Gatekeeper nur deshalb bei 2:00,
		# weil sie auf 5000 angehoben wurden. Jede kuenftige Preisaenderung haette die Dauer
		# wieder mitverschoben. 5000 x BuildDurationModifier 60% = 3000 Ticks = 120s.
		# Laser Technologies bleibt bewusst aussen vor (User: separat anschauen).
		BuildDuration: 5000
		BuildLimit: 1
		Description: Unlocks Chameleon Spy, Cyborgs and the Secret Shrine.

	Valued:
		Cost: 5000

	RenderSprites:
		Image: aot-shrine

	ProvidesPrerequisite:
		Prerequisite: aot-nod-forbidden-upgrade

	Interactable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Nod Shrine (aot-shrine) ===
# NOD-exklusives Prestige-Gebaeude, sichtbar erst ab Age 2 (~aot-age2), baubar sobald STEC + TMPL stehen.
# TS NTPYRA ("NOD Pyramid") Sprite-Import, Zwei-Layer-Compositing wie STEC/MSLO/ORBC (siehe [[ts-assets]]).
# Kein Proxy-Pattern noetig - nur ein Erscheinungsbild, kein Age-abhaengiger Icon-/Sprite-Wechsel.
# Tooltip verweist auf NODs maechtigste Kampfsysteme und Superwaffen.
aot-shrine:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen.
	-WithDeathAnimation:
	Tooltip:
		Name: Secret Shrine
	Valued:
		Cost: 5000
	Health:
		HP: 80000
	Selectable:
		Bounds: 4096, 2048
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -1024
			BottomRight: 2048, 1024
	Building:
		Footprint: xxxx xxxx ====
		Dimensions: 4,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-shrine
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -250
	RallyPoint:
	CommandBarBlacklist:
		DisableStop: false
	Exit@1:
		Priority: 2
		SpawnOffset: 512, 1024, 0
		ExitCell: 2, 2
	Exit@fallback1:
		SpawnOffset: -1024, 256, 0
		ExitCell: -1, 1
	WithBuildingBib:
	RenderSprites:
		Image: aot-shrine
	WithSpriteBody:
		Sequence: idle
		Name: body
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
	# Blaue Spitze: eigene pulsierende Player-Color-Sequenz (16 Helligkeitsstufen, Cosinus-
	# Puls über 24 Frames) statt der bisherigen fixen blauen Farbe.
	WithIdleOverlay@tippulse:
		Sequence: tip-pulse
		RequiresCondition: !build-incomplete
	WithIdleOverlay@active:
		Sequence: active
		RequiresCondition: !build-incomplete
	WithMakeAnimation:
		Sequence: make
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65
	Buildable:
		Queue: Building.Nod
		BuildPaletteOrder: 200
		Prerequisites: ~aot-age2, aot-nod-forbidden-upgrade
		BuildLimit: 1
		Icon: icon
		Description: Ancient Nod relic. Unlocks NOD's most powerful combat systems and superweapons.
	# Eigene Production-Queue nur fuer Nod Avatar + Cyborg Commando (User-Wunsch
	# 2026-07-06): "Group: Infantry" merged sie visuell in denselben Sidebar-Tab
	# wie HAND's Infantry.Nod-Queue, aber es ist ein eigener Queue-Typ, den nur
	# die Shrine produziert (nicht HAND).
	Production:
		Produces: Infantry.NodElite
	ProductionQueue:
		Type: Infantry.NodElite
		DisplayOrder: 3
		Group: Infantry
		ShowLockedItems: True
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: notification-unable-to-comply-building-in-progress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar:
		ProductionType: Infantry.NodElite
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Nod Stealth Generator (aot-sgen) ===
# TS NASTLH-Import (Sprites in aot-sequences.yaml). Sichtbar ab Age 2 (~aot-age2), baubar ab
# Age 2 + Secret Shrine (aot-shrine). Funktion (TS-Nachbau): tarnt sich selbst und alle
# verbuendeten Gebaeude im Umkreis, SOLANGE das Gebaeude gebaut, mit Strom versorgt (PowerState
# Normal) UND ueber 50% Health ist.
#
# Mechanik:
#  - GrantConditionOnPowerState@POWERED  -> aot-sgen-powered  (nur bei voller Stromversorgung)
#  - GrantConditionOnHealth@HEALTHY      -> aot-sgen-healthy   (HP >= 50% = 20000/40000)
#  - ProximityExternalCondition@STEALTH gewaehrt das Feld aot-stealth-field an verbuendete
#    Gebaeude im Umkreis (AffectsParent: true = auch an sich selbst), aber nur solange BEIDE
#    Bedingungen erfuellt sind (RequiresCondition). Faellt Strom ODER Health unter 50%, wird
#    das Feld sofort entzogen -> alle Gebaeude tauchen wieder auf.
#  - Der eigentliche Cloak-Trait (Cloak@AOTSTEALTH) + ExternalCondition@AOTSTEALTH haengen an
#    ^Building (overrides.yaml), damit JEDES Gebaeude im Feld tarnbar wird.
aot-sgen:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
	GrantConditionOnPowerState@POWERED:
		RequiresCondition: aot-power-required
	# Checkbox aus: Generator gilt dauerhaft als "powered" (sonst liefe der Effekt ohne
	# Kraftwerk nie an, da aot-sgen-powered nur bei Normal-Power gewaehrt wuerde).
	GrantCondition@nopower:
		Condition: aot-sgen-powered
		RequiresCondition: !aot-power-required
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	Inherits@shape: ^3x2Shape
	# Custom TS-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding geerbt)
	# wuerde beim Zerstoeren crashen (siehe building-dead-sequence-crash).
	-WithDeathAnimation:
	Tooltip:
		Name: Stealth Generator
	Valued:
		Cost: 2000
	Health:
		HP: 40000
	# Footprint + Smudge-Bib exakt wie LITE (3x2 solide + Bib-Reihe, bib2 = 3-breit/6 Frames).
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	RevealsShroud:
		Range: 4c0
	# Strom nur wenn NICHT per Deploy abgeschaltet (aot-sgen-powerdown).
	Power:
		Amount: -150
		RequiresCondition: aot-power-required && !aot-sgen-powerdown
	WithBuildingBib:
	RenderSprites:
		Image: aot-sgen
	WithSpriteBody:
		Sequence: idle
		Name: body
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
	WithIdleOverlay@remap:
		Sequence: idle-remap
	# Elektro-Arc: nur sichtbar solange das Generatorfeld tatsaechlich laeuft (Strom + Health + nicht abgeschaltet).
	WithIdleOverlay@active:
		Sequence: active
		RequiresCondition: aot-sgen-powered && aot-sgen-healthy && !aot-sgen-powerdown && !build-incomplete
	WithMakeAnimation:
		Sequence: make
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65
	GrantConditionOnPowerState@POWERED:
		Condition: aot-sgen-powered
		ValidPowerStates: Normal
	GrantConditionOnHealth@HEALTHY:
		Condition: aot-sgen-healthy
		MinHP: 20000
	# Deploy-Toggle (wie ein Gate): Generator an/aus schalten. Startet AKTIV (undeployed); ein
	# Deploy-Befehl schaltet ab -> Condition aot-sgen-powerdown -> Power-Trait deaktiviert (0 Strom)
	# + Tarnfeld aus + Arc aus. Erneuter Deploy reaktiviert. SkipMakeAnimation: kein Bauanim-Replay
	# beim Umschalten. Enttarn-/Tarn-Sound laeuft ueber die Feld-Enable/DisableSound (cloak5.aud).
	GrantConditionOnDeploy:
		DeployedCondition: aot-sgen-powerdown
		SkipMakeAnimation: true
	ProximityExternalCondition@STEALTH:
		Condition: aot-stealth-field
		# Radius-Historie: 5c0 -> 8c341 -> 10c0 (Staffelung Generator/Outpost/mobil, 2026-08-04)
		# -> 11c0 (+10%) -> 12c665 (+15%, User 2026-08-05). Groesstes der drei Tarnfelder; Outpost liegt bei
		# 8c341, der mobile Generator bei 7c0.
		Range: 12c665
		ValidRelationships: Ally
		AffectsParent: true
		RequiresCondition: aot-sgen-powered && aot-sgen-healthy && !aot-sgen-powerdown
		# TS-Stealth-Sound (cloak5.aud) beim Ein-/Ausschalten des Tarnfeldes (1:1 aus TS NASTLH).
		EnableSound: cloak5.aud
		DisableSound: cloak5.aud
	# Tarn-Radius einzeichnen (bei Selektion + Platzierung), wie Bau-/Sensorbereiche. Range MUSS
	# mit dem ProximityExternalCondition-Range oben uebereinstimmen. Analog TS NASTLH (Type
	# cloakgenerator) + Shroud Generator (aot-gap).
	WithRangeCircle:
		Type: cloakgenerator
		Range: 12c665
		Color: 8844FFB4
		BorderColor: 20102080
	# Spionage: ein infiltrierender Spy deckt genau die vom Stealth-Generator getarnte Zone
	# (Feld-Radius 12c665) auf -> Schleier weg UND die getarnten Gebaeude/Einheiten sichtbar
	# (Spy-Kamera mit DetectCloaked). Bleibt bestehen, solange dieser Generator steht.
	AotInfiltrateForAreaReveal:
		Types: SpyInfiltrate
		CameraActor: aot-camera-sgen-scan
		PlayerExperience: 10
		InfiltratedNotification: BuildingInfiltrated
		InfiltratedTextNotification: notification-building-infiltrated
	ProvidesPrerequisite:
		Prerequisite: aot-sgen
	Buildable:
		Queue: Building.Nod
		BuildPaletteOrder: 210
		Prerequisites: ~aot-age2, aot-shrine
		Icon: icon
		Description: Cloaks itself and all nearby friendly structures while powered and above 50% health.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Obelisk of Light (OBLI) ===
# User-Wunsch 2026-07-05: sichtbar ab Age 3, baubar erst mit Shrine (aot-shrine)
# UND Age 3 UND Laser Defense Systems Upgrade (aot-laser-fence-upgrade) -
# ersetzt das native "tmpl, ~techlevel.high"-Gate. Normale Building.Nod-Queue
# statt Support.Nod (User-Wunsch, wie GUN/FTUR). Custom-Icon siehe
# structures-overrides.yaml (aot-obli-icon.png, User-Icon).
OBLI:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
	Buildable:
		BuildPaletteOrder: 230
		Prerequisites: ~aot-age3, aot-shrine, aot-laser-fence-upgrade
		Queue: Building.Nod
	# User-Wunsch (2026-07-26): nicht durch Engineer/Saboteur einnehmbar.
	-Capturable:
	# Vanilla-OBLI entfernt bereits die unbenannte Verkaufs-Infanterie
	# (engine/mods/cnc/rules/structures.yaml); das NOD-Gegenstueck aus ^BaseBuilding
	# muss hier mit entfernt werden (siehe Kommentar ganz oben in dieser Datei).
	-SpawnActorsOnSell@nod:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD SAM Site (RA-Import, 2026-07-05) ===
# User-Wunsch: Verschoben von Support.Nod in die normale Baumenue-Queue.
# RA-Remastered-Sprite (rotierender Turm, "ra-idle"/"ra-turret"/
# "damaged-ra-turret" im geteilten "sam"-Image, siehe structures-overrides.
# yaml) ist jetzt der STANDARD-Look, ersetzt die bisherige TD-Pop-up-Silo-
# Optik als Default. Die TD-Frames/-Mechanik (WithEmbeddedTurretSpriteBody +
# AttackPopupTurreted, native in structures.yaml) bleiben komplett erhalten,
# sind aber jetzt nur noch ueber das "Bunkered SAM"-Upgrade (Age 1) aktiv.
# "Cloaked SAM"-Upgrade (Age 2) ergaenzt Stealth-Tarnung analog zum U-Boot
# (siehe sub-system.md), pausiert bei Angriff/Beschaedigung/Low-Power.
SAM:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
	# Bau-Vorschau (User-Fund 2026-08-02: "SAM ist in Age 0 definitiv das bunkered/cloaked
	# Preview statt des RA-Sprites", Icon war korrekt).
	# Ursache: SAM nutzt schon in der Vanilla-Definition KEINE Aktor-Vorschau, sondern
	# SequencePlaceBuildingPreview mit der festen Sequenz "place"
	# (engine/mods/cnc/rules/structures.yaml) -- und "place" ist dort Frame 0 von SAM.SHP,
	# also das geschlossene TD-Pop-up-Silo. Als der RA-Look 2026-07-05 zum Age-0-Default
	# wurde, blieb diese Vorschau-Sequenz unveraendert auf der alten TD-Optik stehen.
	# Deshalb hier NUR die Sequenz umgebogen (kein -ActorPreviewPlaceBuildingPreview: --
	# das entfernt Vanilla bereits selbst, ein zweites Entfernen ist ein harter YAML-Fehler:
	# "There are no elements with key ... to remove").
	# "ra-turret" statt "ra-idle": letzteres ist laut Sequenzdatei nur ein Platzhalter-Frame
	# aus der RA-Bau-Animation, der sichtbare RA-SAM steckt im Turret-Sprite.
	# ⚠️ Bekannte Grenze: SAM ist EIN Aktor mit Laufzeit-Conditions (kein Proxy-Split pro Age),
	# eine feste Sequenz kann daher nur EINEN Zustand zeigen -- nach dem Bunkered-Upgrade bleibt
	# die Vorschau beim RA-Look. Fuer einen zustandsabhaengigen Bau-Ghost braeuchte es einen
	# Proxy-Split wie bei aot-nuke-age0/-age1/-age2.
	# Bau-Ghost der PLAIN-Variante (kein Upgrade erforscht) = RA-Turret. Sobald Bunkered
	# oder Cloaked erforscht ist, uebernehmen die Proxy-Varianten aot-sam-build-bunkered /
	# aot-sam-build-cloak (weiter unten) mit ihrem eigenen Ghost -- so zeigt der Cursor-
	# Ghost immer den Look, den ein FRISCH gebautes SAM sofort annimmt (die Upgrades sind
	# mod-weit, greifen also auch bei Neubauten sofort). Proxy-Split-Muster wie aot-nuke.
	SequencePlaceBuildingPreview:
		Sequence: ra-turret
	Buildable:
		BuildPaletteOrder: 110
		Queue: Building.Nod
		# Voraussetzung von "hand" (Hand of Nod) auf Energieversorgung + Radar
		# Dome geaendert (User-Wunsch 2026-07-05). "anypower" = generischer
		# Prereq-String, den jedes NOD-Kraftwerk bereitstellt (Konvention im
		# gesamten Mod, siehe z.B. GUN/NUK2). "aot-nod-radar" = NOD Radar Dome.
		# User 2026-08-04: Helipad statt anypower -- SAMs kommen jetzt erst mit der Luftwaffe.
		# ~!…-upgrade blenden die Plain-Variante aus, sobald ein SAM-Upgrade erforscht ist
		# (dann greift der jeweilige Proxy). Die KI waehlt automatisch die baubare Variante
		# (AotBaseBuilderBotModule.BuildableVariant: erste mit CanBuild), sofern die Proxys in
		# SamTypes/ExpansionSamTypes stehen (aot-ai.yaml).
		Prerequisites: hpad, aot-nod-radar, ~!aot-sam-bunkered-upgrade, ~!aot-sam-cloak-upgrade

	# User-Wunsch (2026-07-26): nicht durch Engineer/Saboteur einnehmbar (gilt fuer beide
	# Upgrade-Zustaende, Bunkered/Cloaked sind Conditions auf demselben Aktor, kein Proxy-Split).
	-Capturable:

	# KRITISCH (Crash-Historie 2026-07-05, User-Funde: "sam hat mehrere Traits
	# vom Typ AttackBase" / "Turreted: Sequence contains more than one matching
	# element" / "sam hat mehrere Traits vom Typ AttackFollow"): ZWEI parallele,
	# nur per RequiresCondition ein/ausgeblendete Attack-Traits (AttackTurreted +
	# AttackPopupTurreted) sind in dieser Engine-Version NICHT moeglich -
	# RequiresCondition blendet nur das VERHALTEN aus, nicht die Trait-INSTANZ
	# selbst. Gleich DREI verschiedene Engine-Stellen verlangen Eindeutigkeit
	# ueber die abstrakte Basisklasse AttackBase/AttackFollow (RenderRangeCircle,
	# Turreted.Created(), AttackFollow.AttackActivity-Konstruktor) - Whack-a-Mole
	# ohne Ende. Endgueltige Loesung: EIGENER C#-Trait `AotAttackPopupOrTurreted`
	# (engine/OpenRA.Mods.Cnc/Traits/Attack/AotAttackPopupOrTurreted.cs) vereint
	# BEIDE Verhalten in EINER Instanz - der Bunkered-Zustand wird per
	# BooleanExpression (IObservesVariables) gelesen, nicht per RequiresCondition,
	# es gibt also immer nur EIN AttackBase-Trait auf diesem Aktor.
	-AttackPopupTurreted:
	AotAttackPopupOrTurreted:
		BunkeredCondition: aot-sam-bunkered
		PauseOnCondition: lowpower || build-incomplete

	GrantConditionOnPrerequisite@BUNKERED:
		Condition: aot-sam-bunkered
		Prerequisites: aot-sam-bunkered-upgrade

	GrantConditionOnPrerequisite@CLOAK:
		Condition: aot-sam-cloak-active
		Prerequisites: aot-sam-cloak-upgrade

	# RA-Render-Pfad (Default, 2026-07-05): neue WithSpriteBody/WithSpriteTurret-
	# Instanzen fuer den rotierenden Turm. "Name: body-ra" bewusst NICHT "body" -
	# AotAttackPopupOrTurreted sucht (wie das Original AttackPopupTurreted) per
	# .Single() nach GENAU einer WithSpriteBody-Instanz mit Name=="body"
	# (Default, matcht die native WithEmbeddedTurretSpriteBody). Mit zwei
	# WithSpriteBody-Instanzen namens "body" waere das derselbe .Single()-
	# Kollisions-Crash wie bei GUN/FTUR (siehe gun-turret-system.md) - hier
	# vorab vermieden durch einen eindeutig ANDEREN Namen.
	WithSpriteBody@ra:
		Sequence: ra-idle
		Name: body-ra
		RequiresCondition: !aot-sam-bunkered

	WithSpriteTurret@ra:
		Sequence: ra-turret
		RequiresCondition: !build-incomplete && !aot-sam-bunkered && !aot-sam-cloak-active
		Recoils: false

	# Cloaked-SAM-Render-Pfad (2026-09-02): dunkel-metallischer Turret auf dreieckiger
	# Bodenplatte (Gemini-Remaster, gebacken aus asset wip/sam/sam_cloaked_interpolated.png
	# via bake-sam-cloaked.py -> bits/aot-sam-cloaked.png, 8 Facings). Ersetzt den RA-Turret
	# NUR wenn das Cloaked-Upgrade aktiv ist. Der body-ra-Sockel darunter bleibt (vom Turret
	# verdeckt). Player-Color liegt in den Warnstreifen der Platte (Shader-Pfad).
	WithSpriteTurret@cloak:
		Sequence: ra-cloaked-turret
		RequiresCondition: !build-incomplete && !aot-sam-bunkered && aot-sam-cloak-active
		Recoils: false

	# Bau-Animation fuer den RA-Pfad. Die von ^BaseBuilding geerbte
	# WithMakeAnimation zeigt per Default nur auf BodyNames:"body" - das ist hier
	# ausschliesslich die WithEmbeddedTurretSpriteBody (Bunkered). Im RA-Zustand
	# (Name:"body-ra") fand sie also keinen aktiven Body und returnte sofort ->
	# SAM erschien ohne jede Aufbau-Animation. Zweite Instanz analog zum
	# Pillbox-Muster (dort body/body-guard/body-camo).
	WithMakeAnimation@ra:
		BodyNames: body-ra
		Condition: build-incomplete
		Sequence: ra-make

	# TD-Render-Pfad (Bunkered SAM-Upgrade): bereits nativ vorhandene
	# WithEmbeddedTurretSpriteBody bleibt inhaltlich unveraendert - nur
	# RequiresCondition ergaenzt (reiner Feld-Merge, kein "-Trait:" noetig).
	WithEmbeddedTurretSpriteBody:
		RequiresCondition: aot-sam-bunkered

	# Hoehere Panzerung im Bunkered-Zustand (User-Wunsch). "-Armor:" ist hier
	# legitim, da Concrete-Armor NUR in der nativen structures.yaml (frueher
	# geladene Datei) direkt gesetzt ist, nicht in dieser Datei selbst.
	-Armor:
	Armor@base:
		Type: Concrete
		RequiresCondition: !aot-sam-bunkered
	Armor@bunkered:
		Type: Heavy
		RequiresCondition: aot-sam-bunkered

	# Cloaked SAM-Upgrade: getarnt solange nicht feuernd (UncloakOn: Attack),
	# ueber 50% HP und nicht Low-Power. GrantConditionOnDamageState liefert die
	# HP-Bedingung (Heavy/Critical = <=50% HP in diesem Mod, siehe Damage-
	# States-Konvention), PauseOnCondition erzwingt sichtbaren Zustand in
	# beiden Faellen (Cloak.Cloaked ist false solange IsTraitPaused true ist).
	GrantConditionOnDamageState@damaged:
		Condition: aot-sam-damaged
		ValidDamageStates: Heavy, Critical

	Cloak:
		RequiresCondition: aot-sam-cloak-active
		CloakStyle: Alpha
		# 0.3 statt des Defaults 0.55 (User 2026-08-05: "kaum von nicht-cloaked zu
		# unterscheiden"). Betrifft nur die Darstellung fuer Verbuendete und Detektoren --
		# fuer alle anderen ist das SAM ohnehin komplett unsichtbar. Gleicher Wert wie
		# bei den Seeminen, U-Boote liegen mit 0.35 knapp darueber.
		CloakedAlpha: 0.3
		InitialDelay: 25
		# CloakDelay erhoeht (User-Wunsch 2026-07-05): vorher 25 Ticks (~1s ab dem
		# Angriffs-Trigger) - das SAM begann bereits zu tarnen, waehrend der Turm
		# (im Bunkered-Zustand) noch sichtbar am Einfahren war. Neuer Wert deckt
		# CloseDelay (125 Ticks Leerlauf bis Einfahr-Beginn, siehe
		# AotAttackPopupOrTurreted) PLUS ca. 1 weitere Sekunde (25 Ticks) danach ab,
		# bis der Turm sicher komplett eingefahren ist. Kein Effekt auf Decloak -
		# UncloakOn: Attack/Damage triggert weiterhin sofort, ganz ohne Delay.
		CloakDelay: 150
		UncloakOn: Attack, Damage
		CloakSound: cloak5.aud
		UncloakSound: cloak5.aud
		PauseOnCondition: aot-sam-damaged || lowpower

# === Age of Tiberium (aotmod) - SAM Bau-Varianten fuer zustandsabhaengigen Platzier-Ghost ===
# Proxy-Split wie aot-nuke-age0/1/2 (2026-09-02, User-Wunsch): das SAM ist EIN Aktor, sein
# SequencePlaceBuildingPreview ist aber eine FESTE Sequenz und kann nicht je nach erforschtem
# Upgrade wechseln. Da Bunkered/Cloaked mod-weite Upgrades sind, nimmt jedes frisch gebaute SAM
# sofort den jeweiligen Look an -- der Cursor-Ghost soll das vorwegnehmen. Loesung: je eine
# Bau-Variante mit eigenem Ghost, die nur sichtbar/baubar ist wenn ihr Upgrade erforscht wurde
# (dann ist die Plain-SAM-Variante per ~!…-upgrade ausgeblendet). Alle drei teilen denselben
# Palette-Slot (BuildPaletteOrder 110) und dieselbe Footprint/Stats (Inherits: SAM); es ist
# immer genau EINE sichtbar. Die KI baut automatisch die passende (BuildableVariant = erste mit
# CanBuild), sobald sie in SamTypes/ExpansionSamTypes stehen.
aot-sam-build-bunkered:
	Inherits: SAM
	RenderSprites:
		Image: sam
	# Bunkered-Ghost = eingefahrenes TD-Silo (closed-idle, Frame 0 von SAM.SHP) -- der
	# charakteristische "bunkered/unter Tage"-Look, klar unterscheidbar vom RA-Turret.
	SequencePlaceBuildingPreview:
