	# Beide Terme raus aus der geerbten Sprite-Condition -> sofort korrekter TD-Turbine-
	# Sprite in Editor + vorplatziert. Age-2 bleibt live-gekoppelt (Nachruesten weiterhin ok).
	-WithSpriteBody@ra:
	-WithSpriteBody@td:
	-WithMakeAnimation@ra:
	-WithMakeAnimation@td:
	WithSpriteBody@turbine:
