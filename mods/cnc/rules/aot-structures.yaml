		Condition: aot-mine-cluster-enhanced
		Prerequisites: aot-mine-cluster-enhancement
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-ts-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
	WithSpriteBody@tsremap:
		Sequence: aot-ts-idle-remap
		Name: body-tsremap
		RequiresCondition: aot-age2-active && !build-incomplete
	WithSpriteBody@tsdoor:
		Sequence: aot-blank
		Name: body-tsdoor
		RequiresCondition: aot-age2-active && !build-incomplete
	WithSpriteBody@tsdoorremap:
		Sequence: aot-blank
		Name: body-tsdoorremap
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-ts-make
	WithIdleOverlay@tsblink:
		Sequence: aot-ts-blink
		RequiresCondition: aot-age2-active && !build-incomplete
	# --- Superpower-Struktur (Stand 2026-07-02) ---
	# Age 1 Basis (kein Upgrade): Mine Cluster Missile — automatisch verfügbar sobald MSLO steht.
	# 10 aot-minp Anti-Personen-Minen im selben Streukreis wie Tiberium Missile, kein Sofortschaden.
	# Age 2 Upgrade (aot-upgrade-tiberium-missile): schaltet Tiberium Missile frei.
	# Age 3 Upgrade (aot-upgrade-atom-bomb): schaltet ZUSÄTZLICH Atom Bomb frei (vormals TMPL).
	SupportPowerChargeBar@minecluster:
	SupportPowerChargeBar@tiberium:
