# Sprite-Switch: Age 0 → RA POWR.ZIP, Age 1+ → TD NUKE.ZIP, Turbine → RA POWR.ZIP (Platzhalter)
# Turbine Technology Upgrade (Age 2, GDI): erhöht Energieproduktion 100 → 200.
# Turbine-Sprite ist RA POWR als optischer Platzhalter bis dedizierter Sprite vorliegt.
NUKE:
	-Buildable:
	ProvidesPrerequisite@nukename:
		Prerequisite: nuke
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@turbine:
		Condition: aot-turbine-active
		Prerequisites: aot-nuke-turbine-upgrade
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-turbine-active
	WithSpriteBody@turbine:
		Sequence: aot-turbine-idle
		Name: body-turbine
		RequiresCondition: aot-turbine-active
	# Player-Color-Overlay-Layer (indizierte Maske 176-191 → player-Palette, dynamisch).
	WithSpriteBody@turbineremap:
		Sequence: aot-turbine-remap
		Name: body-turbine-remap
		RequiresCondition: aot-turbine-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@turbine:
		BodyNames: body-turbine
		Condition: build-incomplete
		Sequence: aot-turbine-make
	-Power:
	Power@base:
		Amount: 100
		RequiresCondition: !aot-turbine-active
	Power@turbine:
		Amount: 200
		RequiresCondition: aot-turbine-active
	ScalePowerWithHealth:

