# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Tiberian Veins (Klon des Eis-Systems) ===
# Heart = Host (breitet Geflecht ueber Clear/Rough/Desert aus), Zellen = aot-vein-cell.
# Mechanik-Analogie siehe [[ice-growth-system]]. Gruenes Tiberium-Mesh-Overlay.

# --- Geflecht-Zelle: wie aot-ice-cell, aber ChangesTerrain: Veins, KEIN Einbrechen/HP ---
aot-vein-cell:
	# OccupiesSpace: false (sonst blockiert die Zelle Einheiten) + HiddenUnderShroud: CenterPosition
	# (Pflicht bei leerem Footprint, sonst rendert nichts) -- beide Fallen aus dem Eis-System.
	Immobile:
		OccupiesSpace: false
	RenderSprites:
	AotVeinCellBody:
		Period: 4
	ChangesTerrain:
		TerrainType: Veins
	HiddenUnderShroud:
		Type: CenterPosition
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

# --- Das Heart (TS Veinhole): sehr zaeh, Host, stoesst bei Angriff Gas aus, zerstoerbar ---
aot-vein-heart:
	# Building statt Immobile: braucht einen ECHTEN 3x3-Footprint, sonst ist nur die
	# TopLeft-Zelle klickbar/angreifbar, obwohl das Sprite (2x Scale) den ganzen 3x3-Bereich
	# einnimmt -- das war der Grund fuer den fehlenden Angriffscursor. Bare Building-Trait
	# (nicht ^Building), sonst kommen ungewollte Buildable/Sellable/Huntable-Traits mit.
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3, 3
		TerrainTypes: Clear, Rough, Road, Sand, Beach, Clear.Snow
	# Selectable (nicht bloss Interactable) fuer Healthbar/Selection-Ring via SelectionDecorations.
	Selectable:
		Bounds: 3072, 3072
	SelectionDecorations:
	AotVeinGrowth:
		# REGLER (Map-Editor-Slider): Ausbreitung (Zellen) + Wachstums-Tempo (%).
		MaxRadius: 14
		GrowthSpeed: 100
		# Building.TopLeft (= self.Location) ist die OBERE LINKE Ecke des 3x3-Footprints,
		# nicht die Mitte. Ohne diesen Offset waechst das Geflecht schief zum Sprite versetzt.
		CenterOffset: 1, 1
	RenderSprites:
	# idle = ruhiger Einzelframe, gas = 12-Frame-Reaktion (siehe Sequenzen + AotEmitWeaponWhenAttacked).
	WithSpriteBody:
	BodyOrientation:
		QuantizedFacings: 1
	# ⚠️ GEMESSEN: Armor:Concrete brachte NICHTS. DamageWarhead.DamageVersus() filtert
	# Ruestungstypen komplett heraus, die in der Waffen-Versus-Tabelle FEHLEN (die normale
	# 120mm-Panzerwaffe kennt nur None/Wood/Light/Heavy, kein Concrete) -> voller Schaden.
	# Deshalb hier stattdessen ein UNBEDINGTER DamageMultiplier (wirkt unabhaengig vom
	# Waffen-Versus-Table, gleiches Prinzip wie Iron Dome). HP 250000 + 70% Reduktion + Heal
	# ergeben zusammen eine deutlich laengere Belagerung als vorher (~13s bei 3 Panzern).
	# TS-Original-HP war NICHT ermittelbar (firestrm.ini enthaelt nur Overrides, keine
	# Basis-rules.ini mit [VEINHOLE]) -> das ist eine Design-Schaetzung, kein TS-Originalwert.
	Health:
		HP: 250000
	DamageMultiplier@AOTVEINHEART:
		Modifier: 30
	HitShape:
	Targetable:
		TargetTypes: Ground, Structure
	# Aggressive Selbstheilung: heilt auch WAEHREND es beschossen wird (DamageCooldown: 0),
	# nicht erst nach einer Feuerpause. 1% der Max-HP alle 5 Sekunden = 2500 HP/5s.
	ChangesHealth:
		StartIfBelow: 100
		PercentageStep: 1
		Delay: 125
		DamageCooldown: 0
	# Beim Tod zieht sich das Geflecht langsam zurueck, statt fuer immer stehen zu bleiben.
	AotVeinRecedesOnDeath:
	# aotmod (2026-08-21): Visceroid-Spawner WIEDER direkt am Heart (User-Wunsch), zusaetzlich
	# zum aot-critter-spawner-Editorobjekt. Nutzt jetzt den vereinheitlichten AotCritterSpawner
	# (der eigene AotVisceroidSpawner-Trait war am 2026-07-29 geloescht worden) mit fest
	# eingestelltem Visceroid-Typ, sonst gleiche Default-Settings wie das Editorobjekt.
	# Spawnt dank Footprint-Escape (AotFootprintUtils) ausserhalb des 3x3-Footprints -- sonst
	# saesse der Visceroid im soliden Heart fest. Der Editor-Slider "Max Critters"/"Patrol Radius"
	# erscheint dadurch auch am Heart.
	AotCritterSpawner:
		DefaultCritterType: aot-visceroid
		DefaultMaxCritters: 3
		DefaultPatrolRadius: 5
		SpawnInterval: 150
	# Bei jedem Treffer eine Toxic-Gaswolke (Cooldown gegen Spam). Ignoriert das eigene
	# Gaswolken-Damage (TiberiumDeath), damit keine Rueckkopplung entsteht.
	AotEmitWeaponWhenAttacked:
		Weapon: aot-VeinGas
		Cooldown: 75
		IgnoreDamageTypes: TiberiumDeath
		# Die vollen 12 Frames (Wachstums-/Spuck-Animation) nur EINMAL beim Ausstoss, danach
		# zurueck zu idle (Frame 0). War vorher Dauerschleife -> sah zeitweise grau statt gruen aus.
		ReactionSequence: gas
	HiddenUnderShroud:
	MapEditorData:
		Categories: Resource spawn
		RequireTilesets: AOT_TEMPERAT, AOT_DESERT
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

# --- Unsichtbarer Controller: zieht das Geflecht nach dem Heart-Tod zurueck ---
aot-vein-recession:
	# Muss deutlich schneller sichtbar sein als das Wachstum (Growth-Pass alle ~300 Ticks bei
	# GrowthSpeed 100). Interval:2/CellsPerPass:6 = 3 Zellen/Tick -> mind. doppelt so schnelles
	# Zurueckziehen wie das Wachstum, klar erkennbar statt unmerklich langsam.
	AotVeinRecession:
		Interval: 2
		CellsPerPass: 6
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Lightpost (aot-lightpost), 2026-07-28 ===
# Baubare Variante der Editor-Light-Posts (aot-ts-galite & Co, aot-ts-civilian.yaml):
#   - in SPIELERFARBE statt neutralem Graumetall (indiziertes Remap-Overlay, s. Sequenzen)
#   - SCHWAECHERES Licht als der Editor-Post (Werte in aot-lighting.yaml)
#   - dazu ein kleiner Tarnungs-Erkennungsradius mit sichtbarem Radius-Marker
#   - braucht Strom: bei Low Power gehen Licht UND Erkennung aus
# Beide Fraktionen (Queue: Building.GDI, Building.Nod), sichtbar+baubar ab Age 3 (~aot-age3).
aot-lightpost:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# Das TS-Sprite hat keinen "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding)
	# wuerde beim Zerstoeren crashen (siehe building-dead-sequence-crash Memory).
	-WithDeathAnimation:
	Tooltip:
		Name: Lightpost
	Valued:
		Cost: 500
	Building:
		Footprint: x
		Dimensions: 1,1
	Selectable:
		Bounds: 1024, 1024
	Health:
		HP: 15000
	Armor:
		Type: Wood
	# --- Sprite: exakt wie die Editor-Light-Posts, KEINE Spielerfarbe auf dem Sprite ---
	# (User 2026-07-28: der Post soll aussehen wie die anderen; die Spielerfarbe steckt
	# ausschliesslich im LICHT, siehe TerrainLightSource in aot-lighting.yaml.)
	# Palette/IsPlayerPalette MUSS am Body-Trait explizit stehen: ohne Wert faellt RenderSprites
	# intern auf "player" zurueck und PlayerColorShift verschiebt jeden gruenlichen Pixel
	# (siehe gemini-building-import.md) -- genau das hat den Post gruen eingefaerbt.
	RenderSprites:
		Image: aot-lightpost
		Palette: effect
	WithSpriteBody:
		Palette: effect
		IsPlayerPalette: false
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: idle
		SequenceAlpha: 0.65
	# --- Strom: ohne Energie kein Licht und keine Erkennung ---
	# Manuell abgeschaltet (aot-lightpost-off) zieht der Post auch keinen Strom mehr -- gleiches
	# Verhalten wie Shroud-/Stealth-Generator (aot-gap, aot-sgen).
	Power:
		Amount: -10
		RequiresCondition: !aot-lightpost-off
	# --- Deploy-Toggle: Lampe von Hand an/aus ---
	# Startet AN; ein Deploy-Befehl (Button oder Rechtsklick) schaltet ab -> aot-lightpost-off
	# -> Licht aus, Sensor aus, Stromverbrauch 0. Erneuter Deploy schaltet wieder an.
	# SkipMakeAnimation: kein Replay der Bau-Animation beim Umschalten.
	GrantConditionOnDeploy:
		DeployedCondition: aot-lightpost-off
		SkipMakeAnimation: true
	# --- Kleiner Tarnungs-Erkennungsradius ---
	# 4c0 = knapp unter dem Radar/Pillbox-Wert (5c0), also klar "klein".
	# Faellt mit dem Licht zusammen aus: kein Strom, Ion Storm oder von Hand abgeschaltet.
	# !lowpower gehoert IMMER mit in die Bedingung -- RequiresCondition ERSETZT den geerbten
	# Wert, ein blosses "!aot-ion-storm-blackout" wuerde die Stromabhaengigkeit stillschweigend
	# entfernen (dieser Bug ist 2026-07-28 beim Radar real passiert, siehe overrides.yaml).
	DetectCloaked:
		Range: 4c0
		RequiresCondition: !lowpower && !aot-ion-storm-blackout && !aot-lightpost-off && !build-incomplete
	# Zwei Marker, weil sie unterschiedliche Momente abdecken:
	#   RenderDetectionCircle = der rotierende Scanner-Kreis bei Selektion (liest die Range
	#     direkt aus DetectCloaked, braucht daher keinen eigenen Wert).
	#   WithRangeCircle = IPlaceBuildingDecorationInfo, zeichnet den Radius schon WAEHREND der
	#     Platzierung (und bei Selektion). Range MUSS mit DetectCloaked uebereinstimmen.
	RenderDetectionCircle:
	WithRangeCircle:
		Type: detection
		Range: 4c0
		Color: 44FF88B4
		BorderColor: 10201080
	# Kleiner Sichtradius, passend zum Erkennungsbereich (kein Ersatz-Radar).
	RevealsShroud:
		Range: 5c0
	ProvidesPrerequisite@buildingname:
		Prerequisite: aot-lightpost
	# Kein Buildable auf dem Basis-Aktor: die Bau-Position soll pro Fraktion unterschiedlich sein
	# (User 2026-07-28: GDI direkt vor Orbital Command, NOD direkt vor Obelisk), und
	# BuildPaletteOrder gilt fuer ALLE Queues eines Buildable gleichzeitig. Deshalb zwei
	# Fraktions-Proxies unten -- gleiches Muster wie aot-lite-gdi/-nod.

# --- Fraktions-Proxies, nur fuer die unterschiedliche Position im Baumenue ---
# Beide bauen denselben Post; die LockedGroup haelt sie im Platzhalter-System zusammen.
# ⚠️ RenderSprites: Image: MUSS auf jedem Proxy explizit stehen, auch wenn der Basis-Aktor es
# schon setzt -- ohne das faellt der Image-Name auf den AKTORNAMEN zurueck und der Proxy
# verschwindet aus dem Editor-Browser (siehe locked-icon-system.md, 9 Placer betroffen).
aot-lightpost-gdi:
	Inherits: aot-lightpost
	RenderSprites:
		Image: aot-lightpost
	Buildable:
		Queue: Building.GDI
		# GDI: direkt vor ORBC (200), das damit letztes Icon der Queue bleibt.
		BuildPaletteOrder: 195
		Prerequisites: ~aot-age2
		Icon: icon
		# LockedGroup explizit: der Post ist vor Age 2 komplett versteckt und faellt damit unter
		# das Platzhalter-Icon-System (ShowWhenLocked ist Default true). Beide Proxies teilen sich
		# die Gruppe, damit nicht zwei Platzhalter-Slots entstehen (siehe locked-icon-system.md).
		LockedGroup: aot-grp-lightpost
		Description: Lights the surrounding area at night and detects nearby cloaked units. Requires power to operate.

aot-lightpost-nod:
	Inherits: aot-lightpost
	RenderSprites:
		Image: aot-lightpost
	Buildable:
		Queue: Building.Nod
		# NOD: direkt vor OBLI (230), das damit letztes Icon der Queue bleibt.
		BuildPaletteOrder: 225
		Prerequisites: ~aot-age2
		Icon: icon
		LockedGroup: aot-grp-lightpost
		Description: Lights the surrounding area at night and detects nearby cloaked units. Requires power to operate.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Tesla Coil (RA-Import, neutrales Verteidigungsgebaeude) ===
# User-Wunsch 2026-07-29: zivile/neutrale Verteidigungsstruktur, nicht baubar (kein Icon
# noetig), nur ueber den Karteneditor platzierbar. Stats 1:1 von RA's TSLA (engine/mods/ra/
# rules/structures.yaml), Sprites+Sounds aus dem RA-Remaster-Client extrahiert (siehe
# ra-remastered-assets.md): TSLA.ZIP fuer die Sprites (aot-sequences.yaml), tesla1.aud/
# tslachg2.aud aus sounds.mix (~/Library/Application Support/OpenRA/Content/ra/v2/, per
# --aot-mix extrahiert -> mods/cnc/bits/aot-tesla-fire.aud/aot-tesla-charge.aud). Der Blitz
# selbst nutzt das bereits importierte aot-litning-Bild (LITNING.ZIP) - siehe aot-weapons.yaml.
#
# Neutral/Creeps + AttackAnything: RequiresSpecificOwners haelt den Aktor bei einem der beiden
# nicht-spielbaren Besitzer - bewusst KEIN ^TechBuilding, dieser Turm soll (anders als
# aot-ts-ctaray) nicht einnehmbar sein. AutoTarget.InitialStance/-AI = AttackAnything ist
# PFLICHT, damit der Turm ueberhaupt feuert (derselbe Trick wie bei ^AotAnt in
# aot-critters.yaml) - das regelt aber NUR, dass der Turm selbst schiesst.
# ⚠️ Bug 2026-07-29 (User-Fund, Polar Panic getestet): "meine Einheiten greifen es nicht an,
# obwohl es uns angreift" + kein Angriffscursor. Ursache war die Owner-Wahl: unter "Neutral"
# platziert ist die Relationship zwischen Spieler und Turm in BEIDE Richtungen "Neutral", nicht
# "Enemy". Der Turm feuert trotzdem (AutoTargetPriority erlaubt per Default auch Neutral-
# Relationships als Ziel), aber Spieler-Einheiten scannen per Default NUR nach "Enemy"
# (AutoTarget.ChooseTarget: `attackStances == PlayerRelationship.Enemy && !AppearsHostileTo`
# bricht sonst sofort ab) - und auch der normale Angriffscursor braucht "Enemy". Fix: den Aktor
# im Karteneditor als "Creeps" statt "Neutral" platzieren. AotCreepsSetup (Engine-Trait, World-
# Ebene) setzt NUR den Creeps-Spieler beim World-Load automatisch feindlich zu allen spielbaren
# Spielern (siehe engine/OpenRA.Mods.Cnc/Traits/AotCreepsSetup.cs) - "Neutral" bekommt dieses
# Enemy-Flag nie. ValidOwnerNames laesst deshalb jetzt beide zu (wie bei ^AotAnt), aber nur
# "Creeps" ergibt tatsaechlich Gegenwehr.
#
# Power-Checkbox (User-Wunsch, identisches AotOptionalPower-Pattern wie ATWR in overrides.yaml):
# Standard = an (RA-Original zieht -80 Power), ABER der Neutral-Spieler hat in aller Regel KEIN
# eigenes Kraftwerk -> mit aktivierter Checkbox waere der Turm auf den meisten Karten dauerhaft
# "Low Power" und wuerde nie feuern. Kartenersteller, die ihn als funktionierende Gefahr statt
# als reines Ruinen-/Deko-Gebaeude einsetzen wollen, muessen die Checkbox bewusst ausschalten.
aot-tesla:
	Inherits: ^CivBuilding
	Building:
		Footprint: x
		Dimensions: 1,1
	Selectable:
		Bounds: 1024, 1024
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral, Creeps
	# Muss mindestens der Waffenreichweite entsprechen (7c0), sonst sieht AutoTarget seine
	# eigenen Ziele nicht (derselbe Bug wie bei aot-ftur, siehe ftur-system.md).
	RevealsShroud:
		Range: 7c0
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry, Vehicle, Structure
		InvalidTargets: NoAutoTarget
	WithTeslaChargeAnimation:
	Armament:
		Weapon: aot-TeslaZap
		LocalOffset: 0,0,896
	AttackTesla:
		PauseOnCondition: lowpower
		ChargeAudio: aot-tesla-charge.aud
		MaxCharges: 3
		ReloadDelay: 120
	DetectCloaked:
		Range: 6c0
		RequiresCondition: !lowpower
	# Fehlt bei ^CivBuilding (anders als bei ^Support/^DisabledOverlay) komplett -> muss hier
	# selbst granted werden, damit AttackTesla/DetectCloaked oben ueberhaupt etwas zum Konsumieren
	# haben. Gleiches Gating wie Power selbst: nur aktiv, wenn die Checkbox unten "an" ist.
	GrantConditionOnPowerState@LOWPOWER:
		Condition: lowpower
		ValidPowerStates: Low, Critical
		RequiresCondition: aot-power-required
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		Amount: -80
		RequiresCondition: aot-power-required
	Tooltip:
		Name: actor-aot-tesla.name
	MapEditorData:
		Categories: Civilians
# === Ende aotmod ===

# === Age of Tiberium (aotmod 2026-08-29) - Allied Flak (RA AA Gun) - Editor-only, Neutral ===
# Wie aot-tesla: neutrales, nur im Editor platzierbares Gebaeude mit Power-Checkbox. Zusaetzlich
# turretiert (32 Facings, RA-Remaster AGUN) + AA-Waffe (aot-FlakAA). Body = 1x1-Transparent,
# der Turret zeigt das ganze Geschuetz (Basis inklusive).
aot-flak:
	Inherits: ^CivBuilding
	RenderSprites:
		Image: aot-flak
	Building:
		Footprint: x
		Dimensions: 1,1
	Selectable:
		Bounds: 1024, 1024
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral, Creeps
	RevealsShroud:
		Range: 10c0
	-BodyOrientation:
	ClassicFacingBodyOrientation:
	Turreted:
		TurnSpeed: 60
		InitialFacing: 832
		RealignDelay: -1
	WithSpriteBody:
		Sequence: idle
	WithSpriteTurret:
		Sequence: turret
		Recoils: false
	Armament:
		Weapon: aot-FlakAA
		LocalOffset: 520,100,450, 520,-150,450
	AttackTurreted:
		PauseOnCondition: lowpower
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
	AutoTargetPriority@DEFAULT:
		ValidTargets: Air
		InvalidTargets: NoAutoTarget
	# Power-Checkbox wie aot-tesla/ATWR (Default an). Aus = feuert ohne Kraftwerk.
	# GrantConditionOnPowerState fehlt bei ^CivBuilding -> hier selbst granten.
	GrantConditionOnPowerState@LOWPOWER:
		Condition: lowpower
		ValidPowerStates: Low, Critical
		RequiresCondition: aot-power-required
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		Amount: -50
		RequiresCondition: aot-power-required
	Tooltip:
		Name: actor-aot-flak.name
	MapEditorData:
		Categories: Civilians
# === Ende aotmod ===
