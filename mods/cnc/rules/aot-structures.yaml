# === Age of Tiberium (aotmod) - Display-Name-Shims fuer Prerequisite-Strings ===
# ProductionTooltipLogic.ActorName() loest einen Prerequisite-String auf, indem es einen AKTOR
# mit exakt diesem Namen sucht und dessen Tooltip.Name zurueckgibt. Findet es keinen, zeigt der
# "Requires:"-Tooltip den nackten Rohstring ("aot-slab" statt "Science Lab"). Nur Klartext-
# Prereqs landen dort -- '~'/'~!'-Eintraege werden herausgefiltert.
# Seit der Umstellung auf "Gebaeude-Prereqs nur ausgrauen statt verstecken" (2026-08-01) sind
# deutlich mehr Prereqs klartext und damit sichtbar -> diese Shims sind jetzt Pflicht.
# 'Interactable:' ist NOETIG: TooltipInfo verlangt IMouseBoundsInfo, sonst ist der Shim
# "not constructible" und erzeugt einen check-yaml-Fehler PRO KARTE (34x je Shim).
# Die Shims sind nicht baubar und werden nie gespawnt -- reine Namens-Nachschlagetabelle.
# Siehe [[openra-prerequisite-tooltip]].
aot-slab:
	Tooltip:
		Name: Science Lab
	Interactable:

aot-orbc:
	Tooltip:
		Name: Orbital Command
	Interactable:

aot-mslo:
	Tooltip:
		Name: Missile Silo
	Interactable:

aot-weap:
	Tooltip:
		Name: Advanced Factory
	Interactable:

# KEIN Shim fuer aot-proc-gdi / aot-proc-nod: das sind ECHTE Aktoren (Refinery-Proxies in
