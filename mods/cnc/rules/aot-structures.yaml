# === Age of Tiberium (aotmod) - STEC (Soviet Tech Centre, NOD) ===
# NOD-exklusives Tech-Gebäude. Sprite: RA Soviet Tech Centre (STEKMAKE-Frames).
# Schaltet NOD-Tier-2-Upgrades frei (aot-stec Prerequisite).
STEC:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `stec` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Tech Center
	Production@UPGRADENOD:
		Produces: Upgrade.Nod
		MoveIntoWorld: false
	# Siehe ATEC: Baufortschritts-Balken fuer die Upgrade-Queue (inkl. Age-Aufstiege).
	ProductionBar@UPGRADENOD:
		ProductionType: Upgrade.Nod
	AotOpensProductionTabOnSelection:
		Group: Upgrade
	ProductionQueue@UpgradeNod:
		Type: Upgrade.Nod
		ShowUpgradedOverlay: True
		Factions: nod
		Group: Upgrade
		ShowLockedItems: True
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Valued:
		Cost: 2000
	Health:
		HP: 60000
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-stec
	ProvidesPrerequisite@techname:
		Prerequisite: stec
	RevealsShroud:
		Range: 5c0
	WithBuildingBib:
	# NOD-Tech: eigene Verkaufs-Liste OHNE Saboteur (bewusst nur Infanterie, analog ATEC).
	# Die unbenannte Instanz ist GDI-gefiltert und greift auf diesem NOD-Gebaeude nie --
	# daher die NOD-Instanz ueberschreiben statt der unbenannten (User-Wunsch 2026-08-02).
	-SpawnActorsOnSell:
	SpawnActorsOnSell@nod:
		ActorTypes: aot-e1-nod, aot-e1-nod, aot-e1-nod
		GuaranteedActorTypes: aot-e1-nod
	Power:
		Amount: -200
	InfiltrateForSupportPowerReset:
		Types: SpyInfiltrate
		PlayerExperience: 10
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	# === Age of Tiberium (aotmod) - NOD Airstrike-Superpower ===
	# Ab STEC (Age 0) verfügbar, aber erst freigeschaltet durch das gleichnamige
	# "Airstrike"-Upgrade (aot-upgrade-nod-airstrike liefert aot-nod-airstrike-upgrade).
	# Gating-Pattern analog ORBC IonCannonPower / ZoneTrooperDrop: GrantConditionOnPrerequisite
	# schaltet die Condition frei, AirstrikePower + Charge-Bar hängen an RequiresCondition.
	# 2 MiGs fliegen 2× an (wie der A10-Airstrike ursprünglich) und feuern je Anflug
	# 2 Raketen aufs Ziel statt Napalm/MG (aot-mig + aot-MigMissile, nach der RA-MiG
	# modelliert). Mehrfach-Anflug via custom AotAirstrikePower (Passes) — die stock
	# AirstrikePower kann nur einen Überflug (SendAirstrike ist fest verdrahtet).
	GrantConditionOnPrerequisite@airstrike:
		Condition: aot-nod-airstrike-active
		Prerequisites: aot-nod-airstrike-upgrade
	AotAirstrikePower:
		# Eindeutiger OrderName — sonst kollidiert der Support-Power-Key (Default = TraitName+"Order")
		# mit anderen Powers gleichen Typs und die Palette zeigt Icon/Tooltip der falschen Power.
		OrderName: AotMigAirstrikeOrder
		# Verschwindet, sobald das Banshee-Airstrike-Upgrade gekauft ist — Banshee ERSETZT den MiG-Airstrike.
		RequiresCondition: aot-nod-airstrike-active && !aot-nod-banshee-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-airstrike
		ChargeInterval: 7500
		SquadSize: 2
		Passes: 2
		QuantizedFacings: 8
		Name: Airstrike
		Description: Two MiG jets make two attack passes, each firing two guided rockets at the target area.
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: EnemyPlanesApproaching
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		IncomingTextNotification: notification-enemy-planes-approaching
		UnitType: aot-mig
		DisplayBeacon: True
		BeaconPoster: airstrike
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		CameraActor: camera
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: airstrikedirection
		SupportPowerPaletteOrder: 10
	SupportPowerChargeBar:
		RequiresCondition: aot-nod-airstrike-active && !aot-nod-banshee-active
	# === Age of Tiberium (aotmod) - NOD Banshee-Airstrike-Superpower (Age-3-Folge des MiG-Airstrike) ===
	# Ersetzt den MiG-Airstrike (siehe !aot-nod-banshee-active oben). Custom AotAirstrikePower
	# (Multi-Pass) wie beim MiG, aber 3 Banshees (SquadSize 3) statt 2 MiGs, je 2 Anflüge.
	# Freigeschaltet durch das Banshee-Airstrike-Upgrade (nur auf dem MiG-Pfad, Age 3 + Temple).
	GrantConditionOnPrerequisite@banshee:
		Condition: aot-nod-banshee-active
		Prerequisites: aot-nod-banshee-upgrade
	AotAirstrikePower@banshee:
		OrderName: AotBansheeAirstrikeOrder
		RequiresCondition: aot-nod-banshee-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-banshee
		ChargeInterval: 7500
		SquadSize: 3
		Passes: 2
		QuantizedFacings: 8
		Name: Banshee Airstrike
		Description: Three Banshee fighters make two attack passes, each firing three plasma salvos that leave toxic gas clouds.
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: EnemyPlanesApproaching
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		IncomingTextNotification: notification-enemy-planes-approaching
		UnitType: aot-banshee
		DisplayBeacon: True
		BeaconPoster: airstrike
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		CameraActor: camera
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
