# === Age of Tiberium (aotmod) - Shroud Generator (GDI, RA Gap Generator) ===
# GDI-Support-Gebäude ab Age 1. Erzeugt Hüllschatten (Shroud) im Umkreis, unter dem
# die eigene Basis für Gegner unsichtbar wird. Mechanik/Sprites/Stats aus OpenRA
# Red Alert (GAP-Aktor): CreatesShroud 6c0, eigene Sicht via RevealsShroud@GAPGEN,
# stoppt bei Energiemangel. Voraussetzung: FIX (Repair Facility) + WEAP (Advanced
# War Factory, liefert aot-weap).
# Footprint 2x2 wie das SILO-Store (xx ==, untere Reihe nur Bib-Smudge), gleicher
# mbSILO-Bib. RA-Sprite-Frame ist 128x256 (1 Zelle breit, 2 Zellen hoch, Anker in
# Frame-Mitte); LocalCenterOffset schiebt den Body über dem fixen Footprint/Bib nach
# oben, damit er mittig sitzt (Y in World-Units: 1024 = 1 Zelle, negativ = nach oben).
aot-gap:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding geerbt)
	# würde beim Zerstören crashen. Siehe building-dead-sequence-crash Memory.
	-WithDeathAnimation:
	RenderSprites:
		Image: aot-gap
	Tooltip:
		Name: Shroud Generator
	Valued:
		Cost: 800
	Health:
		HP: 50000
	Armor:
		Type: Heavy
	# Strom nur wenn NICHT per Deploy abgeschaltet (aot-gap-powerdown) - wie Stealth Generator.
	Power:
		Amount: -60
		RequiresCondition: aot-power-required && !aot-gap-powerdown
	# Deploy-Toggle: Generator an/aus schalten (wie aot-sgen). Startet AKTIV; ein Deploy-Befehl
	# schaltet ab -> aot-gap-powerdown -> Power aus (0 Strom), Shroud + Sicht-Kappung + Dish aus.
	# Erneuter Deploy reaktiviert. SkipMakeAnimation: kein Bauanim-Replay beim Umschalten.
	GrantConditionOnDeploy:
		DeployedCondition: aot-gap-powerdown
		SkipMakeAnimation: true
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,-512,0
	WithBuildingBib:
	Buildable:
		Queue: Building.GDI
		BuildPaletteOrder: 170
		# Sichtbar ab Age 1 (~aot-age1), baubar ab Age 1 + Science Lab (aot-slab von SLAB).
		Prerequisites: ~aot-age1, aot-orbc
		Icon: icon
		Description: Generates shroud over the surrounding area, hiding your base from the enemy. Enemy units caught inside can only see 2 cells. Requires power to operate.
	ProvidesPrerequisite@buildingname:
		Prerequisite: aot-gap
	# Blendet feindliche Einheiten im Shroud: solange sie im CreatesShroud-Radius (8c0)
	# sind, kappt eine externe Condition (aot-gap-suppressed) ihre RevealsShroud auf 2c0
	# (Umsetzung in overrides.yaml an ^Vehicle/^Infantry/^Ship/^Plane/^Helicopter).
	# ValidRelationships MUSS zu CreatesShroud passen (Neutral|Enemy). Ein per Editor/Spawn
	# platzierter Test-Generator ist oft NEUTRAL -> mit nur "Enemy" wird die Condition nie
	# vergeben (Shroud entsteht trotzdem, aber keine Sicht-Kappung). Wie RA Radar Jammer.
	ProximityExternalCondition@GAPSUPPRESS:
		Condition: aot-gap-suppressed
		Range: 8c0
		ValidRelationships: Enemy, Neutral
		RequiresCondition: !lowpower && !aot-gap-powerdown
	# --- Shroud-Mechanik (identisch zu OpenRA RA GAP) ---
	# Haupt-RevealsShroud deckt NICHT den selbst erzeugten Shroud auf (RevealGeneratedShroud:
	# False); dafür sorgt der separate @GAPGEN-Instance, damit der Besitzer die eigene Zone
	# sieht, Gegner aber nicht.
	# Radien +1/3 ggü. RA-GAP (x4/3): Shroud 6c0->8c0, Reveal-Ranges 5c0->6c683.
	RevealsShroud:
		MinRange: 6c683
		Range: 8c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 6c683
	CreatesShroud:
		Range: 8c0
		RequiresCondition: !lowpower && !aot-gap-powerdown
	# --- Eigen-FoW-Feld (kosmetisch, nur Besitzer + Verbuendete) ---
	# GDI-Gegenstueck zum NOD-Stealth-Generator: statt Gebaeude transparent zu machen, legt das
	# Feld den ECHTEN Fog-of-War-Look ueber die gesamte Zone. Zwei Abweichungen von normalem FoW:
	# (1) Besitzer + Allies sehen es IMMER, auch mit eigenen Einheiten drin; (2) eigene Einheiten
	# und Gebaeude werden DARUNTER voll gezeichnet (nur leicht verdeckt), weil im
	# IRenderAboveWorld-Pass gezeichnet wird -- nach den Aktoren, vor dem echten Shroud. Gegner
	# sehen unveraendert den CreatesShroud (schwarz), der bei ihnen ueber diesem Overlay liegt.
	# Range MUSS mit CreatesShroud uebereinstimmen; Aktiv-Bedingung ebenso (Strom + nicht abgeschaltet).
	AotFogField:
		Range: 8c0
		RequiresCondition: !lowpower && !aot-gap-powerdown
	# Spionage: ein infiltrierender Spy deckt genau die vom Shroud-Generator versteckte Zone
	# (Feld-Radius 8c0) auf -> Schleier weg UND getarnte Gebaeude/Einheiten sichtbar (Spy-Kamera mit
	# DetectCloaked). Bleibt bestehen, solange dieser Generator steht.
	AotInfiltrateForAreaReveal:
		Types: SpyInfiltrate
		CameraActor: aot-camera-gap-scan
		PlayerExperience: 10
		InfiltratedNotification: BuildingInfiltrated
		InfiltratedTextNotification: notification-building-infiltrated
	RenderShroudCircle:
	# --- Sprite/Animation (RA GAP.ZIP Spin, PauseOnCondition stoppt bei Energiemangel) ---
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: idle
		SequenceAlpha: 0.65
	# Fundament statisch (idle/damaged-idle), rotierende Dish als eigener Overlay -> der
	# Sockel/Mast hüpft nicht mehr, nur die Gabel dreht. PauseOnCondition stoppt bei Strommangel.
	WithSpriteBody:
		PauseOnCondition: lowpower || aot-gap-powerdown
	WithIdleOverlay@DISH:
		Sequence: dish
		RequiresCondition: !build-incomplete
		PauseOnCondition: lowpower || aot-gap-powerdown
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NUKE: RA POWR vor Age 1, TD danach, GDI-only ===
# Sprite-Switch: Age 0 → RA POWR.ZIP, Age 1+ → TD NUKE.ZIP, Turbine → RA POWR.ZIP (Platzhalter)
# Turbine Technology Upgrade (Age 2, GDI): erhöht Energieproduktion 100 → 200.
# Turbine-Sprite ist RA POWR als optischer Platzhalter bis dedizierter Sprite vorliegt.
NUKE:
	-Buildable:
	ProvidesPrerequisite@nukename:
		Prerequisite: nuke
	AotGrantConditionOnPrerequisiteLatched@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@turbine:
		Condition: aot-turbine-active
		Prerequisites: aot-nuke-turbine-upgrade
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active && !aot-turbine-active
	# Age 2 = erreichtes Zeitalter (der aot-age2-Marker ist permanent/unverwundbar). Die Fraktions-
	# Optik wird NICHT mehr ueber die ZERSTOERBAREN Gebaeude aot-weap/afld diskriminiert -- deren
	# Verlust liess den Sprite faelschlich auf Age 1 zurueckfallen. Stattdessen GrantConditionOnFaction:
	# aot-nuke-fac-gdi/-nod bleiben an die urspruengliche Fraktion gebunden (ResetOnOwnerChange default
	# false -> das Gebaeude behaelt seine Age-2-Optik auch nach einer Uebernahme).
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	GrantConditionOnFaction@facgdi:
		Condition: aot-nuke-fac-gdi
		Factions: gdi
	GrantConditionOnFaction@facnod:
		Condition: aot-nuke-fac-nod
		Factions: nod
	# Age-2 GDI, kein Turbinen-Upgrade → GDI TS GTPOWR ohne Turbinen (Gemini-Render 2026-07-08)
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active && aot-nuke-fac-gdi && !aot-turbine-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im Blau-Farbton zur Spielerfarbe. Siehe
		# silo-system.md / ts-gates-system.md fuer das gleiche Muster.
	# Age-2 GDI + Turbinen-Upgrade → GDI TS GTPOWR mit Turbinen (Gemini-Render 2026-07-08)
	WithSpriteBody@tsturbine:
		Sequence: aot-age2-turbine-idle
		Name: body-tsturbine
		RequiresCondition: aot-age2-active && aot-nuke-fac-gdi && aot-turbine-active
	# Drei unabhängig langsam auf-/abdimmende gelbrötliche Lichtscheine an den offenen
	# Schloten der Turbinen-Kuppeln (Gaussian-Puls-Technik wie GDI-HQ-Radar aot-age2-lights).
	WithIdleOverlay@tsturbinelights:
		Sequence: aot-age2-turbine-lights
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && aot-nuke-fac-gdi && aot-turbine-active && !build-incomplete
	# Age-2 NOD → NOD TS NTPOWR (Gemini-Render 2026-07-08)
	WithSpriteBody@tsnod:
		Sequence: aot-age2-nod-idle
		Name: body-tsnod
		RequiresCondition: aot-age2-active && aot-nuke-fac-nod
	# Einzelne unabhängig flackernde Lichtpunkte an Rohr-/Ventil-Details (wie GDI-HQ-Radar).
	WithIdleOverlay@tsnodlights:
		Sequence: aot-age2-nod-lights
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active && aot-nuke-fac-nod && !build-incomplete
	# Age-1, Turbinen-Upgrade → TD NUKE + Turbinen (unverändert)
	WithSpriteBody@turbine:
		Sequence: aot-turbine-idle
		Name: body-turbine
		RequiresCondition: !(aot-age2-active && aot-nuke-fac-gdi) && aot-turbine-active
	WithSpriteBody@turbineremap:
		Sequence: aot-turbine-remap
		Name: body-turbine-remap
		RequiresCondition: !(aot-age2-active && aot-nuke-fac-gdi) && aot-turbine-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make
	WithMakeAnimation@tsnod:
		BodyNames: body-tsnod
		Condition: build-incomplete
		Sequence: aot-age2-nod-make
	WithMakeAnimation@turbine:
		BodyNames: body-turbine
		Condition: build-incomplete
		Sequence: aot-turbine-make
	# Age-2-GDI MIT Turbinen-Upgrade: body-tsturbine hatte bisher als einziger
	# Body ueberhaupt keine Make-Animation -> wurde nach dem Upgrade jedes neu
	# gebaute Kraftwerk ohne Aufbau eingeblendet. Bedingung spiegelt
	# WithSpriteBody@tsturbine (aot-age2-gdi && aot-turbine-active), sonst wuerde
	# sie mit @ts kollidieren, das den turbinenlosen Fall abdeckt.
	WithMakeAnimation@tsturbine:
		BodyNames: body-tsturbine
		Condition: build-incomplete
		Sequence: aot-age2-turbine-make
	-Power:
	# Faction-abhaengige Power (User 2026-07-19): NOD Nuke 150, GDI Nuke 200, GDI Turbine-Upgrade 300.
	# Der geteilte age0/age1-Nuke wird von BEIDEN Fraktionen gebaut -> per Faction-Condition getrennt.
	GrantConditionOnFaction@nod:
		Condition: aot-nod-faction
		Factions: nod
	Power@nod:
		Amount: 150
		RequiresCondition: aot-nod-faction
	Power@gdi:
		Amount: 200
		RequiresCondition: !aot-nod-faction && !aot-turbine-active
	Power@turbine:
		Amount: 300
		RequiresCondition: !aot-nod-faction && aot-turbine-active
	ScalePowerWithHealth:

aot-nuke-age0:
	Inherits: NUKE
	RenderSprites:
		Image: nuke
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-ra-idle
		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-nuke
		Queue: Building.GDI, Building.Nod
		BuildPaletteOrder: 40
		Prerequisites: ~!aot-age1, fact
		Icon: aot-ra-icon
