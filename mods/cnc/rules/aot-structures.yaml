# === Age of Tiberium (aotmod) - Nod Stealth Generator (aot-sgen) ===
# TS NASTLH-Import (Sprites in aot-sequences.yaml). Sichtbar ab Age 2 (~aot-age2), baubar ab
# Age 2 + Secret Shrine (aot-shrine). Funktion (TS-Nachbau): tarnt sich selbst und alle
# verbuendeten Gebaeude im Umkreis, SOLANGE das Gebaeude gebaut, mit Strom versorgt (PowerState
# Normal) UND ueber 50% Health ist.
#
# Mechanik:
#  - GrantConditionOnPowerState@POWERED  -> aot-sgen-powered  (nur bei voller Stromversorgung)
#  - GrantConditionOnHealth@HEALTHY      -> aot-sgen-healthy   (HP >= 50% = 20000/40000)
#  - ProximityExternalCondition@STEALTH gewaehrt das Feld aot-stealth-field an verbuendete
#    Gebaeude im Umkreis (AffectsParent: true = auch an sich selbst), aber nur solange BEIDE
#    Bedingungen erfuellt sind (RequiresCondition). Faellt Strom ODER Health unter 50%, wird
#    das Feld sofort entzogen -> alle Gebaeude tauchen wieder auf.
#  - Der eigentliche Cloak-Trait (Cloak@AOTSTEALTH) + ExternalCondition@AOTSTEALTH haengen an
#    ^Building (overrides.yaml), damit JEDES Gebaeude im Feld tarnbar wird.
aot-sgen:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	Inherits@shape: ^3x2Shape
	# Custom TS-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding geerbt)
	# wuerde beim Zerstoeren crashen (siehe building-dead-sequence-crash).
	-WithDeathAnimation:
	Tooltip:
		Name: Stealth Generator
	Valued:
		Cost: 2000
	Health:
		HP: 40000
	# Footprint + Smudge-Bib exakt wie LITE (3x2 solide + Bib-Reihe, bib2 = 3-breit/6 Frames).
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	RevealsShroud:
		Range: 4c0
	# Strom nur wenn NICHT per Deploy abgeschaltet (aot-sgen-powerdown).
	Power:
		Amount: -150
		RequiresCondition: !aot-sgen-powerdown
	WithBuildingBib:
	RenderSprites:
		Image: aot-sgen
	WithSpriteBody:
		Sequence: idle
		Name: body
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
	WithIdleOverlay@remap:
		Sequence: idle-remap
		Palette: player
		IsPlayerPalette: True
	# Elektro-Arc: nur sichtbar solange das Generatorfeld tatsaechlich laeuft (Strom + Health + nicht abgeschaltet).
	WithIdleOverlay@active:
		Sequence: active
		RequiresCondition: aot-sgen-powered && aot-sgen-healthy && !aot-sgen-powerdown && !build-incomplete
	WithMakeAnimation:
		Sequence: make
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65
	GrantConditionOnPowerState@POWERED:
		Condition: aot-sgen-powered
		ValidPowerStates: Normal
	GrantConditionOnHealth@HEALTHY:
		Condition: aot-sgen-healthy
		MinHP: 20000
	# Deploy-Toggle (wie ein Gate): Generator an/aus schalten. Startet AKTIV (undeployed); ein
	# Deploy-Befehl schaltet ab -> Condition aot-sgen-powerdown -> Power-Trait deaktiviert (0 Strom)
	# + Tarnfeld aus + Arc aus. Erneuter Deploy reaktiviert. SkipMakeAnimation: kein Bauanim-Replay
	# beim Umschalten. Enttarn-/Tarn-Sound laeuft ueber die Feld-Enable/DisableSound (cloak5.aud).
	GrantConditionOnDeploy:
		DeployedCondition: aot-sgen-powerdown
		SkipMakeAnimation: true
	ProximityExternalCondition@STEALTH:
		Condition: aot-stealth-field
		# Radius um 2/3 vergroessert (5c0 -> 8c341 = 8,33 Zellen).
		Range: 10c0
		ValidRelationships: Ally
		AffectsParent: true
		RequiresCondition: aot-sgen-powered && aot-sgen-healthy && !aot-sgen-powerdown
		# TS-Stealth-Sound (cloak5.aud) beim Ein-/Ausschalten des Tarnfeldes (1:1 aus TS NASTLH).
		EnableSound: cloak5.aud
		DisableSound: cloak5.aud
	# Tarn-Radius einzeichnen (bei Selektion + Platzierung), wie Bau-/Sensorbereiche. Range MUSS
	# mit dem ProximityExternalCondition-Range oben uebereinstimmen. Analog TS NASTLH (Type
	# cloakgenerator) + Shroud Generator (aot-gap).
	WithRangeCircle:
		Type: cloakgenerator
		Range: 10c0
		Color: 8844FFB4
		BorderColor: 20102080
	ProvidesPrerequisite:
		Prerequisite: aot-sgen
	Buildable:
		Queue: Building.Nod
		BuildPaletteOrder: 210
		Prerequisites: ~aot-age2, aot-shrine
		Icon: icon
		Description: Cloaks itself and all nearby friendly structures while powered and above 50% health.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Obelisk of Light (OBLI) ===
# User-Wunsch 2026-07-05: sichtbar ab Age 3, baubar erst mit Shrine (aot-shrine)
# UND Age 3 UND Laser Defense Systems Upgrade (aot-laser-fence-upgrade) -
# ersetzt das native "tmpl, ~techlevel.high"-Gate. Normale Building.Nod-Queue
