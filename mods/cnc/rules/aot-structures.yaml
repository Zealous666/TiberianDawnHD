		Sequence: aot-blank
		Name: body-tsdoor
		RequiresCondition: aot-age2-active && !build-incomplete
	WithSpriteBody@tsdoorremap:
		Sequence: aot-blank
		Name: body-tsdoorremap
		RequiresCondition: aot-age2-active && !build-incomplete
