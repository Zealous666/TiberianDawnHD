# User-Briefing 2026-08-01: ersetzt das bisherige Upgrade aot-upgrade-guard-dog-kennel. Guard
# Dogs werden jetzt in einem eigenen Gebaeude mit eigener Produktions-Queue gebaut, nicht mehr
# in der normalen Infantry-Queue. RA-Remaster-Sprite importiert (RA Soviet KENN.ZIP/
# KENNMAKE.ZIP, MEG-Pfad verifiziert), Stats 1:1 vom RA-Original (200 Cost, 30000 HP, Wood,
# 2x1-Footprint). Baumenue-Icon: eigenes Custom-Icon (kenl_base.png, User-geliefert
# 2026-08-01). Bauordnung nach Helipad, vor STEC (BuildPaletteOrder 135).
aot-kennel-nod:
	# User-Fund 2026-08-01: ^Building allein (im Gegensatz zu ^BaseBuilding) hat kein
	# Building.TerrainTypes, kein RequiresBuildableArea und kein RequiresBaseProvider -> auf
	# KEINEM Tileset platzierbar (die Building-Terraintyp-Liste ist implizit leer). ^BaseBuilding
	# liefert `TerrainTypes: Clear,Road,Clear.Snow` (inkl. AOT_WINTER-Sonderfall, siehe Kommentar
	# dort in engine/mods/cnc/rules/defaults.yaml) + die Bauzonen-Pruefung -- PFLICHT fuer jedes
	# platzierbare Gebaeude in diesem Mod, nicht nur ^Building.
	Inherits: ^BaseBuilding
	# Kein "dead"-Rubble-Frame im RA-KENN-Remaster-Sprite (nur idle/damaged-idle/make) ->
	# WithDeathAnimation (von ^BaseBuilding geerbt) wuerde beim Zerstoeren crashen.
	-WithDeathAnimation:
	# Vanilla-RA-Konvention: Kennel erweitert die Bauzone nicht.
	-GivesBuildableArea:
	# Von ^BaseBuilding geerbtes SpawnActorsOnSell spawnt Standard-Infanterie -- fuer den
	# Dog-Producer soll beim Verkauf stattdessen ein Dog rauskommen (User-Wunsch 2026-08-01).
	# Die unbenannte (GDI-)Instanz wird hier ueberschrieben, die NOD-Instanz muss zusaetzlich
	# entfernt werden -- sonst kaeme beim NOD-Kennel Dog UND Saboteur+Infanterie raus.
	SpawnActorsOnSell:
		ActorTypes: aot-dog-nod
		GuaranteedActorTypes: aot-dog-nod
		Factions: gdi, nod
	-SpawnActorsOnSell@nod:
	# User-Fund 2026-08-01: PrimaryBuilding (vom Vanilla-RA-KENN uebernommen) erzeugt einen
	# "PrimaryProducer"-Befehl mit Cursor: deploy -- das war der gruene "Deploy"-Mauszeiger.
	# PYLE/HAND (die anderen Infanterie-Producer in diesem Mod) haben diese Trait NICHT, sie
	# ist hier nicht noetig (nur EIN Kennel-Typ, kein Mehrfach-Gebaeude-Disambiguierungsbedarf
	# wie bei AFLD/Starport). Entfernt.
	RenderSprites:
		Image: aot-kennel-nod
