		SequenceAlpha: 0.65
	Buildable:
		LockedGroup: aot-grp-silo
		BuildPaletteOrder: 30
		Prerequisites: fact, ~aot-age2
		Queue: Building.GDI, Building.Nod
		Description: actor-silo.description
		Icon: aot-icon-age2
	-WithSpriteBody@ra:
	-WithIdleOverlay@raremap:
	-WithResourceLevelSpriteBody@td:
	-WithMakeAnimation@ra:
