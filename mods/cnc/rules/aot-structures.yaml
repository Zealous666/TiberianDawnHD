# === Age of Tiberium (aotmod) - GUN NOD-exklusiv, GTWR bleibt GDI ===
# GUN umgedreht (2026-07-04, User-Wunsch): war "GDI-exklusiv", jetzt NOD-exklusiv,
# ab Age 1 (Age 0 uebernimmt stattdessen der importierte RA Flame Tower, siehe
# ftur-system.md). Original-Waffe (Maschinengewehr) unveraendert.
# Ab "Laser Defense Systems"-Upgrade (aot-laser-fence-upgrade) wechseln Waffe UND
# Turm-Sprite auf Laser (rot recolored, siehe gun-turret-system.md fuer die
# Recolor-Pipeline-Referenz von HTNK-Railgun/LTNK-Laser). Proxy-Pattern
# (aot-gun-base/aot-gun-laser) fuer Bau-Icon-Wechsel, Condition-Switch direkt auf
# GUN fuer bereits gebaute Tuerme (1:1 das HTNK/LTNK-Muster).
GUN:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	GrantConditionOnPowerState@LOWPOWER:
		RequiresCondition: aot-power-required
	# User-Fund 2026-07-30: "lowpower" in AttackTurreted.PauseOnCondition unten war zunaechst
	# wirkungslos -- GUN erbt nur ^Support, das im Gegensatz zu SAM/OBLI/STEC etc. KEIN
	# ^DisabledOverlay einbindet. Ohne diesen Trait wird "lowpower" auf GUN nie gewaehrt (check-yaml:
	# "consumes conditions that are not granted"), die Pause-Bedingung konnte also nie zutreffen.
	# Bringt als Nebeneffekt auch die erwartete Abdunklung bei Stromausfall (wie bei SAM/STEC).
	Inherits@IDISABLE: ^DisabledOverlay
	-Buildable:
	# User-Wunsch (2026-07-26): Verteidigungsgebaeude nicht durch Engineer/Saboteur einnehmbar.
	# -Capturable: entfernt den von ^BaseBuilding geerbten Trait komplett -> gilt fuer BEIDE
	# Proxy-Varianten (aot-gun-base/aot-gun-laser), da Capturable nicht pro Proxy gesetzt ist.
	-Capturable:

	GrantConditionOnPrerequisite@LASER:
		Condition: aot-gun-laser-active
		Prerequisites: aot-laser-fence-upgrade

	# KRITISCH (Crash-Fix Runde 4, 2026-07-05): braucht eine ZWEITE, physisch
	# identische Turreted-Instanz "laser" - siehe Begruendung unten bei
	# WithSpriteTurret@laser. Exakte Werte 1:1 von der geerbten Basis (structures.
	# yaml) uebernommen, damit beide Tuerme immer synchron rotieren.
	Turreted@laser:
		Turret: laser
		TurnSpeed: 48
		InitialFacing: 192
		RealignDelay: -1
		RequiresCondition: !build-incomplete

	# AttackTurreted muss BEIDE Tuerme kennen, sonst dreht sich der "laser"-Turm
	# nie zum Ziel (er wuerde sonst dauerhaft auf InitialFacing stehen bleiben,
	# obwohl seine Sprite-Sequenz gerade aktiv gerendert wird).
	# KRITISCH (Crash-Fix Runde 5, 2026-07-05, User-Fund "Laser Turret kann nicht
	# angreifen"): AttackBaseInfo.Armaments (Whitelist der genutzten Armament-
	# NAMEN) defaultet auf ["primary","secondary"] (AttackBase.cs:28). Da
	# Armament@laser den Namen "laser" traegt (nicht "primary"/"secondary"),
	# ignorierte AttackTurreted es KOMPLETT, sobald der Laser aktiv war - das
	# Geschuetz griff schlicht nie an, ohne Crash/Fehlermeldung (stiller Bug, von
	# check-yaml nicht erkennbar). Muss explizit in die Armaments-Liste.
	# User-Fund 2026-07-30: GUN schoss bei Low Power ungebremst weiter (SAM/OBLI/Pillbox
	# pausieren dort korrekt, siehe aot-sam-*/AotAttackPopupOrTurreted und OBLI in
	# structures.yaml). PauseOnCondition ersetzt den geerbten Wert komplett statt ihn zu
	# ergaenzen -- "lowpower" muss deshalb hier explizit rein, nicht nur build-incomplete.
	AttackTurreted:
		PauseOnCondition: lowpower || build-incomplete
		Turrets: primary, laser
		Armaments: primary, laser

	# Explizite Namen noetig (Crash-Fix 2026-07-04): WithTurretAttackAnimation
	# (geerbt aus der Engine-Basis, sucht per .Single() nach Armament.Name=="primary")
	# fand sonst ZWEI Treffer, sobald ein zweites unbenanntes Armament (Default-
	# Name ebenfalls "primary") dazukam -> InvalidOperationException beim Platzieren.
	-Armament:

	Armament@base:
		Name: primary
		Weapon: TurretGun
		LocalOffset: 512,0,112
		MuzzleSequence: muzzle
		RequiresCondition: !aot-gun-laser-active

	Armament@laser:
		Name: laser
		Weapon: aot-GunLaser
		LocalOffset: 512,0,112
		RequiresCondition: aot-gun-laser-active

	# Nur fuer die Basis-Waffe aktiv (Original-Verhalten unveraendert). Fuer die
	# Laser-Variante noch KEINE eigene recolorte "recoil"-Sequenz gebacken -> Trait
	# dort deaktiviert statt versehentlich auf die alte graue Sequenz umzuschalten.
	-WithTurretAttackAnimation:

	WithTurretAttackAnimation@base:
		Armament: primary
		Turret: primary
		Sequence: recoil
		RequiresCondition: !aot-gun-laser-active

	# Zweiter Teil desselben Crash-Fixes (2026-07-04, Runde 2): WithTurretAttackAnimation
	# macht ZWEI .Single()-Lookups - Armament.Name (siehe oben) UND WithSpriteTurret.Turret
	# (WithSpriteTurretInfo.Turret defaultet ebenfalls auf "primary"). Mit zwei
	# unbenannten WithSpriteTurret-Instanzen fand die zweite .Single()-Abfrage
	# ebenfalls zwei Treffer -> derselbe Crash beim Platzieren, nur an anderer Stelle
	# im selben Konstruktor. Explizite Turret-Namen jetzt auch hier noetig.
	-WithSpriteTurret:

	WithSpriteTurret@base:
		Turret: primary
		RequiresCondition: !build-incomplete && !aot-gun-laser-active
		Recoils: false

	# KRITISCH (Crash-Fix Runde 3+4, 2026-07-05): "Turret:" bei WithSpriteTurret
	# referenziert den NAMEN einer Turreted-Instanz (WithSpriteTurret..ctor macht
	# .First(tt => tt.Name == info.Turret) - KEIN neuer physischer Turm wird
	# dadurch erzeugt). Runde 3 setzte hier faelschlich "Turret: primary" (weil
	# es urspruenglich nur EINE Turreted-Instanz gab) - das behob zwar den
	# WithSpriteTurret-Crash, verursachte aber SOFORT den naechsten: mit ZWEI
	# WithSpriteTurret-Instanzen die beide "Turret: primary" melden, findet
	# WithTurretAttackAnimation..ctor's eigener .Single(st => st.Info.Turret ==
	# info.Turret)-Lookup ZWEI Treffer statt einem -> derselbe Crash-Typ, nur an
	# einer dritten Stelle. Echte Loesung (Runde 4): "Turret: laser" beibehalten,
	# aber dafuer eine ECHTE zweite Turreted-Instanz "laser" anlegen (siehe oben,
	# physisch identisch zur Basis, damit beide Tuerme synchron rotieren).
	WithSpriteTurret@laser:
		Turret: laser
		Sequence: aot-gun-laser-turret
		RequiresCondition: !build-incomplete && aot-gun-laser-active
		Recoils: false

# Guard Tower: fuer alle Fraktionen nicht baubar (User-Wunsch 2026-07-12).
# -Buildable muss hier stehen (aot-structures laedt nach overrides.yaml).
GTWR:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	-Buildable:

# === Age of Tiberium (aotmod) - GUN Proxy-Aktoren (Bau-Icon-Wechsel) ===
# Sichtbar/baubar ab Age 1 (User-Wunsch 2026-07-04: Age 0 uebernimmt stattdessen
# der Flame Tower, siehe ftur-system.md).
aot-gun-base:
	Inherits: GUN
	RenderSprites:
		Image: gun
	Buildable:
		# User-Fund 2026-08-01: ShowWhenLocked ist per Default TRUE (BuildableInfo.cs) -- ohne
		# expliziten False-Wert zeigt das LockedGroup-Slot ein permanentes Platzhalter-Icon,
		# auch wenn aot-turret-upgrade fuer diese Partie NIE erreichbar ist (schliesst sich mit
		# Nitro Napalm/aot-nitro-napalm-upgrade gegenseitig aus, siehe aot-upgrade-turret unten).
		ShowWhenLocked: False
		LockedGroup: aot-grp-gun
		BuildPaletteOrder: 170
		# Voraussetzung von "barracks" (Infanterie-Produktion) auf "lite"
		# (Fahrzeug-Produktion) geaendert (User-Wunsch 2026-07-05).
		Prerequisites: ~aot-turret-upgrade, aot-turret-upgrade, lite, ~!aot-laser-fence-upgrade
		Queue: Building.Nod
		BuildDuration: 960
		Description: actor-gun.description

aot-gun-laser:
	Inherits: GUN
	RenderSprites:
		Image: gun
	Buildable:
		ShowWhenLocked: False
		LockedGroup: aot-grp-gun
		BuildPaletteOrder: 170
		Prerequisites: ~aot-turret-upgrade, aot-turret-upgrade, lite, ~aot-laser-fence-upgrade
		Queue: Building.Nod
		BuildDuration: 960
		Icon: gun-laser-icon
		Description: actor-gun.description
	-Armament@base:
	-WithTurretAttackAnimation@base:
	-WithSpriteTurret@base:
	Armament@laser:
		RequiresCondition: aot-gun-laser-active || !aot-gun-laser-active
	WithSpriteTurret@laser:
		RequiresCondition: !build-incomplete

# === Age of Tiberium (aotmod) - Shipyard (aot-shipyard) ===
# Wasser-Gebäude (TerrainTypes: Water). Basis ^BaseBuilding (CnC-Standard),
# überschrieben für Wasserplatzierung: AreaTypes building bleibt, Adjacent 8
# damit das nahe Wasser von Land-Buildable-Area aus erreicht wird.
# GivesBuildableArea entfernt → erweitert die Bauzone nicht aufs Wasser.
aot-shipyard:
	Inherits: ^BaseBuilding
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen.
	-WithDeathAnimation:
	Tooltip:
		Name: Shipyard
	Valued:
		Cost: 1000
	Health:
		HP: 80000
	# Basis bleibt in Age 0/1 baubar (Age-0-Icon) und behaelt ihren Namen "aot-shipyard" -> alle
	# Referenzen (RepairActors, AI, Prereqs) gelten weiter. Ab Age 2 uebernimmt der Proxy
	# aot-shipyard-age2 (~aot-age2) mit dem Age-2-Icon. Der Sprite-Switch liegt ohnehin am Aktor.
	Buildable:
		BuildPaletteOrder: 120
		LockedGroup: aot-grp-shipyard
		Prerequisites: lite, ~!aot-age2
		Queue: Building.GDI
		Icon: aot-shipyard-icon
		Description: Naval production facility.
	Targetable:
		TargetTypes: Ground, Water, C4, Structure
	# HITSHAPE-FIX (2026-08-03): Ohne eigene HitShape erbt dieses Wasser-Gebaeude ueber ^Building
	# nur ^1x1Shape (1024x1024 = eine Zelle). Bei 3x3-Footprint war damit nur die Mittelzelle
	# treffbar; Geschosse auf die aeusseren 8 Zellen detonierten ausserhalb der HitShape -> Falloff
	# -> praktisch 0 Schaden (User-Test: "kein Schaden an der Werft", je nach Seite unterschiedlich).
	# Es gibt keinen ^3x3Shape -> explizites 3x3-Rechteck (+-1536), das den ganzen Footprint deckt.
