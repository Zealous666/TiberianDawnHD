# === Ende aotmod ===

# === Age of Tiberium (aotmod) - GDI Gate ===
# Buendigkeits-Test gegen die Fortified Wall. Bewusst OHNE LineBuildNode:
# Wall-Nachbarn sollen ihre End-Frames rendern (siehe ts-gates-system.md).
aot-gate-gdi:
	Inherits: ^BaseBuilding
	# Custom-Sprite ohne "dead"-Rubble-Frame -> geerbtes WithDeathAnimation crasht beim Tod.
	-WithDeathAnimation:
	# Kein Infanterie-Spawn beim Verkaufen (User-Wunsch: niemand soll rauskommen).
	-SpawnActorsOnSell:
	# NOD-Gegenstueck der Verkaufs-Infanterie ebenfalls entfernen (siehe ^BaseBuilding oben):
	# ohne diese Zeile wuerde dieses Gebaeude bei NOD-Besitz doch Infanterie ausspucken.
	-SpawnActorsOnSell@nod:
	# WithMakeAnimation bleibt geerbt (grantet build-incomplete fuer Sellable/
	# Capturable); make-Sequenz = 1-Frame-Dummy mit derselben PNG.
	# Nativer Gate-Trait (Engine) uebernimmt Auto-Open/-Close fuer Verbuendete +
	# TS-Sounds. WithGateSpriteBody ersetzt WithSpriteBody: waehlt automatisch den
	# passenden Frame aus "idle" (11 Frames) je nach Gate.Position, OpenSequence
	# "open" fuer den Ruhezustand komplett offen.
	-WithSpriteBody:
	WithGateSpriteBody:
		OpenSequence: open
		# Kein Remap: WithSpriteBody/WithGateSpriteBody haben EIGENE Palette/
		# IsPlayerPalette-Felder (NICHT die der Sequenz-YAML - die werden vom
		# Koerper-Renderer ueberhaupt nicht gelesen, nur vom Icon-Renderer!). Ohne
		# expliziten Wert faellt RenderSprites.Add() intern auf "player" zurueck ->
		# der Fragment-Shader (combined.frag ColorShift()) verschiebt dann JEDEN
		# Pixel, dessen HSV-Farbton in den remapbaren Bereich faellt, Richtung
		# Spielerfarbe. Betraf hier die Beton/Metall-Toene teils sichtbar unter
		# bestimmten Spielerfarben - siehe ts-gates-system.md.
		Palette: effect
		IsPlayerPalette: false
	Gate:
		# LockedCondition (Custom-Erweiterung unseres Engine-Forks, siehe Gate.cs):
		# erzwingt SOFORT Position 0 (zu) und blockt neue Oeffnungsversuche, solange
		# eine der drei Bedingungen aktiv ist. Anders als PauseOnCondition (das nur
		# einfriert, wo immer die Position gerade ist) - siehe ts-gates-system.md.
		LockedCondition: aot-gate-locked || aot-gate-damage-lockout || aot-gate-lowpower
		OpeningSound: gateup1.aud
		ClosingSound: gatedwn1.aud
		BlocksProjectilesHeight: 768
		# Schneller wieder zu (Default waere 150 Ticks = 6s) - 2026-07-03 User-Wunsch.
		CloseDelay: 40
	# Deploy-Toggle (wie Deploy-Button): verriegelt/entriegelt das Tor manuell.
	# text2.aud = kurzer UI-Bestaetigungs-Bip (bereits an anderer Stelle im Mod als
	# Deploy-Sound verwendet, siehe aot-units.yaml Cruiser-Carrier).
	GrantConditionOnDeploy:
		DeployedCondition: aot-gate-locked
		SkipMakeAnimation: true
		Voice: Action
		DeploySounds: text2.aud
		UndeploySounds: text2.aud
	# >50% Schaden (Heavy/Critical DamageState) sperrt das Tor.
	GrantConditionOnDamageState:
		Condition: aot-gate-damage-lockout
		ValidDamageStates: Heavy, Critical
	# Low Power sperrt das Tor.
	GrantConditionOnPowerState:
		Condition: aot-gate-lowpower
		ValidPowerStates: Low, Critical
	Tooltip:
		Name: GDI Automatic Gate
	Valued:
		Cost: 500
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	Buildable:
		BuildPaletteOrder: 190
		# Sichtbar ab Age 1 (~aot-age1), baubar sobald das Science Lab steht
		# (User-Wunsch 2026-08-01) - aot-slab bleibt klartext, graut also nur aus.
		Prerequisites: ~aot-age1, aot-slab
		Queue: Building.GDI
		Description: Automated gate for walls, opening and closing on friend-or-foe identification.
	# Footprint/Dimensions unangetastet (siehe REVERT-Historie in ts-gates-system.md,
	# der breitere Smudge steckt direkt in der Sprite-Grafik, kein WithBuildingBib mehr).
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,0,0
	# BlocksProjectiles entfaellt: Gate liefert sein eigenes IBlocksProjectiles
	# (skaliert mit Oeffnungsgrad ueber BlocksProjectilesHeight).
	# Zone Trooper hovern hier drueber wie ueber Rock/River (kein echtes Crushen,
	# kein Schaden/Zerstoerung) -- siehe AotHoverPassable.cs.
	AotHoverPassable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Gate (Laser-Barriere statt Fluegel-Tor) ===
# Baseplate + 2 Laser-Saeulen (siehe ts-gates-system.md). Kein Gitter-Mesh: die 3
# roten Laserlinien selbst SIND die Barriere (idle/damaged-idle = je 2 Frames,
# 0=zu/Laser an, 1=offen/Laser aus). Sonst 1:1 dieselbe Gate/WithGateSpriteBody-
# Mechanik wie aot-gate-gdi (Auto-Open fuer Verbuendete, Deploy-Lock, Damage-Lock,
# Low-Power-Lock). Bei Heavy/Critical-Schaden flackert der Laser zusaetzlich
# unregelmaessig (WithGateSpriteBody.FlickerIntervalMin/Max) - das Tor bleibt dabei
# ueber LockedCondition ohnehin fest zu, das Flackern ist rein optisch.
aot-gate-nod:
	Inherits: ^BaseBuilding
	-WithDeathAnimation:
	# Kein Infanterie-Spawn beim Verkaufen (User-Wunsch: niemand soll rauskommen).
	-SpawnActorsOnSell:
	# NOD-Gegenstueck der Verkaufs-Infanterie ebenfalls entfernen (siehe ^BaseBuilding oben):
	# ohne diese Zeile wuerde dieses Gebaeude bei NOD-Besitz doch Infanterie ausspucken.
	-SpawnActorsOnSell@nod:
	-WithSpriteBody:
	WithGateSpriteBody:
		# Irregulares Flackern (5-35 Ticks = 0.2-1.4s zwischen Umschaltungen) waehrend
		# Heavy/Critical-Schaden. Tor bleibt ueber LockedCondition ohnehin fest zu.
		FlickerInterval: 5, 35
		# Ambientes Schimmern im Ruhezustand (geschlossen, unbeschaedigt) - subtiler
		# Pulse wie bei der echten Laser-Fence (AotWithWallPulseBody), aber eigener
		# Mechanismus da ein Gate keine Nachbarschafts-Frames hat. FESTES statt
		# zufaelliges Intervall (User-Feedback 2026-07-04: zufaellige Abstaende
		# wirkten "ruckartig", die echte Fence pulsiert mit konstantem Takt -
		# PulseInterval:4 in AotWithWallPulseBody - das hier 1:1 uebernommen).
		ShimmerSequence: idle-shimmer
		ShimmerInterval: 4, 5
		# Kein Remap - der eigentliche Grund fuer den "Laser wird manchmal gruen/
		# orange"-Bug war NICHT die Sequenz-YAML (die von WithSpriteBody ueberhaupt
		# nicht gelesen wird), sondern der Fallback auf "player" HIER auf Trait-
		# Ebene. Siehe ts-gates-system.md fuer die volle Herleitung ueber
		# combined.frag ColorShift().
		Palette: effect
		IsPlayerPalette: false
	Gate:
		LockedCondition: aot-gate-locked || aot-gate-damage-lockout || aot-gate-lowpower
		# Laser-Turret-Schuss (NALASR/lastur1.aud aus TS, siehe ts-audio-extraction.md) -
		# eigenes NOD-Gebaeude, NICHT der Obelisk. Fuer beide Richtungen genutzt (Laser
		# "zuendet"/"erlischt"), passt thematisch besser als die GDI-Turmotor-Sounds.
		OpeningSound: lastur1.aud
		ClosingSound: lastur1.aud
		# Praktisch instantaner Wechsel (User-Wunsch 2026-07-04): anders als beim
		# GDI-Fluegeltor gibt es hier keine mehrstufige Animation, nur den 2-Frame-
		# Toggle Laser-an/aus - der Default (33 Ticks, aus der langsamen GDI-Tuer
		# geerbt) liess das Umschalten wie ein "Absenken" wirken. Mit
		# TransitionDelay:1 wird OpenPosition=1: GetGateFrame()'s Lerp(0,1,Pos,1)
		# springt in einem einzigen Tick von Frame0 auf Frame1, exakt synchron mit
		# OpeningSound/ClosingSound (die auf demselben Tick-Uebergang feuern).
		TransitionDelay: 1
		BlocksProjectilesHeight: 768
		# Deutlich schnelleres Wiederschliessen (User-Wunsch 2026-07-04): 40 -> 6 Ticks.
