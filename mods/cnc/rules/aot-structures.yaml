# === Age of Tiberium (aotmod) - SILO: OreDeliver Dock + Age-Sprite-Wechsel (Muster wie PYLE/HAND) ===
# ORET liefert Erz am Silo ab (Südseite). Silo immer baubar (nur anypower, kein Age-Gate).
# WithSpriteBody@ra (statisches RA-Doppel-Sprite, links voll/rechts halbvoll) bis Age-1,
# WithResourceLevelSpriteBody@td (klassische TD-Füllstands-Animation) Age-1 bis Age-2,
# WithSpriteBody@ts (statisches TS-Doppel-Sprite, links voll/rechts halbvoll) ab Age-2.
# Einheitliches Image (silo) für alle drei Proxies — Sprite-Wechsel via Condition, nicht via Image-Swap.
SILO:
	-Buildable:
	# 2x2-Footprint: die smudge-freie Nordreihe des alten 2x3 (xx xx ==) entfernt,
	# analog zum Gate-Fix (siehe ts-gates-system.md). WithBuildingBib deckt nur die
	# unteren 2 Reihen ab -> alte Nordreihe "xx" war ohnehin ohne Bib. LocalCenterOffset
	# um -512 (eine Zeilen-Reduktion) nachgezogen, damit Silo+Smudge an derselben
	# Stelle bleiben wie zuvor (100 -> -412).
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,-412,0
	DockHost:
		Type: OreDeliver
		DockAngle: 0
		DockOffset: 0,1c512,0
	# Silo erweitert die Bauzone wie ein normales Gebaeude (Basis-SILO hatte -GivesBuildableArea).
	GivesBuildableArea:
		AreaTypes: building
	-WithBuildingBib:
	WithBuildingBib:
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithResourceLevelSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: !aot-age1-active
	WithIdleOverlay@raremap:
		Sequence: aot-ra-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: !aot-age1-active && !build-incomplete
	WithResourceLevelSpriteBody@td:
		Sequence: stages
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-ts-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player"
		# zurueck -> PlayerColorShift (combined.frag ColorShift(), MinHue 0.29 /
		# MaxHue 0.37) verschiebt JEDEN Pixel im Gruen-Farbton zur Spielerfarbe.
		# 71,7% des Tiberium-Gruens (Hue ~0.343) liegen drin -> Tiberium wurde blau.
		# Gleiches Muster wie bei den Gates, siehe ts-gates-system.md.
		Palette: effect
		IsPlayerPalette: false
	# Player-Color kommt ausschliesslich ueber dieses indizierte Remap-Overlay
	# (Indizes 187-190 -> PlayerColorPalette RemapIndex 176-191): Streben + Fin.
	WithIdleOverlay@tsremap:
		Sequence: aot-ts-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-ts-make

aot-silo-age0:
	Inherits: SILO
	RenderSprites:
		Image: silo
	ProvidesPrerequisite@buildingname:
		Prerequisite: silo
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-ra-idle
		SequenceAlpha: 0.65
	Buildable:
		BuildPaletteOrder: 35
		Prerequisites: anypower, ~!aot-age1
