# aot-ltnk-upgrade2 als Prerequisite-String komplett entfernt, LTNK/
# aot-ltnk-deployed/aot-ltnk-laser-Proxy hoeren jetzt direkt auf
# aot-laser-fence-upgrade.
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Subterranean Upgrade (NOD, Age 2) ===
# Sichtbar ab Age 2 (kein Flame-Tank-Prereq!). Transform im Feld via AotTransformOnPrerequisite
# (auf TTNK-Aktor) nur wenn BEIDE Upgrades aktiv sind (aot-subterrain-upgrade +
# aot-ttnk-flame-upgrade) -> Base-Panzer ohne Flammen verwandeln sich NIE.
aot-upgrade-ttnk-subterrain:
	Tooltip:
		Name: Subterranean Upgrade

	Buildable:
		BuildPaletteOrder: 240
		Prerequisites: ~aot-age2, stec
		Queue: Upgrade.Nod
		BuildLimit: 1
		MoveIntoWorld: false
		Description: Upgrades the Flame Tank and Toxin Tank to subterranean variants that can tunnel underground. Also unlocks the Subterranean Infantry Transport.

	Valued:
		Cost: 4300

	RenderSprites:
		Image: aot-upgrade-ttnk-subterrain

	ProvidesPrerequisite:
		Prerequisite: aot-subterrain-upgrade

	Interactable:

# === Age of Tiberium (aotmod) - Toxic Upgrade (konsolidiert, 2026-07-04) ===
# Ersetzt die vorherigen 3 Einzel-Upgrades (Toxic Trooper / Toxin Tank / Stealth
# Tank) durch EIN gemeinsames Upgrade, das alle Flammen-Einheiten gleichzeitig auf
# Toxin umstellt: Flamethrower->Toxic Trooper (E4, bereits bestehend), Flame
# Tank->Toxic Tank (TTNK, vorher separates aot-upgrade-ttnk-toxin), Flame
# Tower->Toxic Tower (FTUR, NEU). Separates Stealth-Tank-Upgrade (aot-upgrade-
# ttnk-cloak) komplett entfernt, nicht migriert. ProvidesPrerequisite umbenannt von
# aot-e4-toxic-upgrade -> aot-toxic-upgrade (alle 3 Einheiten hoeren jetzt auf
# dieselbe Condition).
aot-upgrade-e4-toxic:
	Tooltip:
		Name: Toxic Weapons Upgrade

	Buildable:
		BuildPaletteOrder: 300
		# ~!aot-howitzer-upgrade ENTFERNT (User-Fund 2026-08-04): das versteckte nach dem Kauf von
		# Artillery Ballistics das komplette Toxic-Upgrade, obwohl der Ausschluss nur den RAKETEN-
		# WERFER betreffen soll. Toxic Trooper, Toxin Tank, Toxic Tower und Avatar bleiben davon
		# unberuehrt und muessen weiter kaufbar sein. Der Ausschluss beim Werfer greift ohnehin
		# schon auf Einheiten-Ebene: die Toxic-V2-Variante traegt selbst ~!aot-howitzer-upgrade
		# (aot-units.yaml), erscheint also nicht, wenn der Howitzer-Pfad gewaehlt wurde.
		Prerequisites: ~aot-age3, tmpl, stec, aot-shrine
		Queue: Upgrade.Nod
		BuildLimit: 1
		MoveIntoWorld: false
		Description: Upgrades all Flamethrowers, Flame Tanks, Flame Towers, Napalm Rocket Launchers, and the Nod Avatar with toxic weaponry for improved damage vs. all ground targets. Toxic rockets leave a lingering tiberium gas field on impact.

	Valued:
		Cost: 2050

	RenderSprites:
		Image: aot-upgrade-e4-toxic

	ProvidesPrerequisite:
		Prerequisite: aot-toxic-upgrade

	Interactable:
# === Ende aotmod ===

