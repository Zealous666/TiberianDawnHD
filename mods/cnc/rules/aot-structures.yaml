# === Age of Tiberium (aotmod) - Fortified Foundation ===
# Varianten-Kette (LockedGroup aot-grp-foundation, genau EIN Palette-Slot):
#   aot-foundation-2x2: Standard ab FACT (2×2), versteckt sich nach dem Upgrade.
#   aot-foundation:     3×3-Variante, sichtbar erst mit aot-foundation-upgrade (gleicher Preis).
# Beide spawnen via AotPlaceFoundation eine aot-foundation-cell pro Footprint-Zelle und
# disposen sich selbst. Zellen mit Foundation/ungueltigem Terrain werden uebersprungen.
# aot-foundation-cell: sichtbare BIB-Boden-Zelle (kein Building, unverstörbar).
#   16 Frames aus bake-foundation.py, corner-based Dual-Grid (nw|ne<<1|sw<<2|se<<3).
#   Besitzer: Neutral (unzerstoerbar, keiner kann angreifen).
aot-foundation:
	# Erbt ^Building fuer die komplette Platzierungs-Maschinerie (ActorPreviewPlaceBuildingPreview,
	# WithSpriteBody, Placement-Cursor). 3×3-Footprint -> weisses 3×3-Preview-Raster.
	# AotPlaceFoundation spawnt danach eine aot-foundation-cell auf jeder Footprint-Zelle.
	Inherits: ^Building
	Inherits@shape: ^3x3Shape
	Building:
		# 3×3 Footprint: Preview zeigt 3×3 weiss/rot. TerrainTypes noetig sonst ist NICHTS baubar
		# (^Building-Default TerrainTypes = leer -> IsCellBuildable immer false -> ueberall rot).
		Footprint: xxx xxx xxx
		Dimensions: 3, 3
		TerrainTypes: Clear, Road, Clear.Snow
		BuildSounds: constru2.aud, hvydoor1.aud
		# Teil-Platzierung: erlaubt Bauen auch wenn nicht alle 9 Zellen frei sind. Belegte Zellen
		# werden rot angezeigt, freie weiss; CanPlaceBuilding gibt trotzdem true. IsCloseEnoughToBase
		# (Basis-Naehe) bleibt aktiv. AotPlaceFoundation ueberspringt danach die belegten Zellen.
		AllowInvalidPlacement: true
	# Gleiche Bauzone wie andere Gebaeude (2 Zellen Naehe zu GivesBuildableArea). Ohne diesen
	# Trait waere es zwar ueberall baubar, aber der User will Basis-Naehe wie normale Gebaeude.
	RequiresBuildableArea:
		AreaTypes: building
		Adjacent: 2
	Buildable:
		LockedGroup: aot-grp-foundation
		BuildPaletteOrder: 10
		# ~aot-foundation-upgrade: versteckt bis das Foundation-Upgrade (ATEC/STEC-Upgrade-Tab,
		# 1000 Cr.) gekauft wurde -- bis dahin ist die 2×2-Standard-Variante sichtbar.
		Prerequisites: fact, ~aot-foundation-upgrade
		Queue: Building.GDI, Building.Nod
		BuildDuration: 80
		Description: actor-aot-foundation.description
	Valued:
		Cost: 75
	Tooltip:
		Name: actor-aot-foundation.name
	RenderSprites:
		Image: aot-foundation
	# Kein Todes-Effekt: der Placer disposed sich sofort nach dem Spawnen der Zellen (kein Kill).
	-FireWarheadsOnDeath:
	-SoundOnDamageTransition:
	-ShakeOnDeath:
	AotPlaceFoundation:

# Standard-Variante ab FACT: 2×2, kein Upgrade noetig. Verschwindet mit dem Upgrade
# (~!aot-foundation-upgrade), dann uebernimmt die geerbte 3×3-Variante den Slot.
aot-foundation-2x2:
	Inherits: aot-foundation
	Building:
		Footprint: xx xx
		Dimensions: 2, 2
	Buildable:
		Prerequisites: fact, ~!aot-foundation-upgrade
	# Preview-Sprite: 2×2-Composite (256×256) statt des geerbten 3×3-idle.
	WithSpriteBody:
		Sequence: idle2x2

aot-foundation-cell:
	# OccupiesSpace: false = blockiert keine Bewegung (Bib ist reiner Boden-Overlay).
	Immobile:
		OccupiesSpace: false
	# User-Wunsch 2026-07-30: Fortified Foundation (klein wie gross -- beide Groessen
	# spawnen denselben aot-foundation-cell, siehe AotPlaceFoundation.CellActor) soll
	# denselben Strassen-Geschwindigkeitsbonus geben wie echte Road-Zellen.
	# ChangesTerrain setzt map.CustomTerrain[cell] auf den angegebenen Typ, solange
	# dieser Aktor existiert (Requires<ImmobileInfo> -- bereits erfuellt) und macht die
	# Zelle damit fuer JEDE terrain-abhaengige Abfrage (Locomotor.TerrainSpeeds,
	# Buildable.TerrainTypes, Minimap-Farbe...) ununterscheidbar von echter Strasse.
	# Bereits vorher TerrainTypes-kompatibel (Clear, Road, Clear.Snow ueberall erlaubt),
	# daher keine Regression bei Bebaubarkeit oder Subterranean-Blockade (die laeuft
	# ohnehin separat ueber AotFoundationLayer.Contains(cell), nicht ueber den Terraintyp).
	ChangesTerrain:
		TerrainType: Road
	RenderSprites:
		Palette: staticterrain
	AotFoundationCellBody:
	# HiddenUnderShroud: CenterPosition weil OccupiesSpace false (Footprint-Liste waere leer
	# -> AnyExplored false -> Zelle bleibt unsichtbar). CenterPosition nutzt Immobile.CenterPosition.
	HiddenUnderShroud:
		Type: CenterPosition
	BodyOrientation:
		QuantizedFacings: 1
	HitShape:
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
