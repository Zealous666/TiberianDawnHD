	# spawnte den VANILLA-HARV. Der Mod ersetzt HARV aber durch aot-harv/aot-harv-nod (HARV hat
	# hier nur noch -Buildable:), und HarvesterBotModule zaehlt AUSSCHLIESSLICH die in
	# HarvesterTypes gelisteten Aktoren. Der Gratis-Harvester jeder Raffinerie war damit fuer die
	# KI unsichtbar -> harvsNum lag dauerhaft unter der Raffinerie-Zahl -> sie forderte endlos
	# "Ersatz" an, obwohl nie einer verloren ging. NOD-Proxies ueberschreiben das unten nochmal
