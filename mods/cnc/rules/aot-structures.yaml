# === Age of Tiberium (aotmod) - Verkaufs-Infanterie pro Fraktion (2026-08-02, User-Wunsch) ===
# Vanilla ^BaseBuilding (engine/mods/cnc/rules/defaults.yaml) spuckt beim Verkauf die
# GENERISCHEN Aktoren e6,e1,e1,e1 aus -- in diesem Mod existieren dafuer aber eigene
# Fraktions-Versionen (aot-e1-gdi/-nod, aot-e6-gdi = Engineer, aot-e6-nod = SABOTEUR).
# SpawnActorsOnSellInfo.Factions filtert nach der Fraktion des VERKAUFENDEN Spielers
# (SpawnActorsOnSell.cs: correctFaction = Factions.Contains(self.Owner.Faction.InternalName)),
# daher zwei Instanzen statt Dutzender Einzel-Overrides -- greift damit auch fuer die
# fraktionsneutral gebauten Gebaeude (Silo, Powerplant, FIX, Foundation ...).
#
# ⚠️ WICHTIG fuer kuenftige Gebaeude: die UNBENANNTE Instanz bleibt bewusst die GDI-Variante,
# damit alle bestehenden "-SpawnActorsOnSell:"-Entfernungen (SILO, OBLI, Shipyard, Sub Pen,
# beide Gates) weiterhin greifen. Wer das Verkaufs-Spawnen unterdrueckt, muss ZUSAETZLICH
# "-SpawnActorsOnSell@nod:" setzen -- sonst spuckt das Gebaeude bei NOD-Besitz doch Infanterie aus.
# === Age of Tiberium (aotmod) - fehlende HitShape-Shape-Templates (2026-08-03) ===
# Die Engine (engine/mods/cnc/rules/defaults.yaml) liefert nur ^1x1/2x1/2x2/3x2Shape. Groessere
# Gebaeude ohne passendes Template blieben auf ^1x1Shape haengen -> Schadens-HitShape war nur
# eine Zelle (DistanceFromEdge nutzt NUR dieses eine Rechteck, nicht die targetbaren Zellen).
# Bounds = +-(Zellen*512), analog zu den Engine-Templates.
^2x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1024, -1536
			BottomRight: 1024, 1536
^3x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536
^4x2Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -1024
			BottomRight: 2048, 1024
^4x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -1536
			BottomRight: 2048, 1536
^4x4Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -2048
			BottomRight: 2048, 2048
^5x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2560, -1536
			BottomRight: 2560, 1536
^2x5Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1024, -2560
			BottomRight: 1024, 2560
^2x6Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1024, -3072
			BottomRight: 1024, 3072
^3x5Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -2560
			BottomRight: 1536, 2560

^BaseBuilding:
	SpawnActorsOnSell:
		ActorTypes: aot-e6-gdi, aot-e1-gdi, aot-e1-gdi, aot-e1-gdi
		GuaranteedActorTypes: aot-e1-gdi
		Factions: gdi
	SpawnActorsOnSell@nod:
		ActorTypes: aot-e6-nod, aot-e1-nod, aot-e1-nod, aot-e1-nod
		GuaranteedActorTypes: aot-e1-nod
		Factions: nod
	# aotmod 2026-08-22: Capturable-Types auf "building" statt geerbtem "building-sabotage"
	# umstellen. Engine-E6 hat ZWEI Captures-Traits: @SABOTAGE (building-sabotage) und @CAPTURES
	# (building). Mit dem geerbten Vanilla-Typ "building-sabotage" griff IMMER die @SABOTAGE-
	# Variante -> ein einzelner Engineer sabotierte nur (Uebernahme erst bei <=55% HP). Mit
	# "building" greift @CAPTURES -> ein Engineer reicht, um das Gebaeude direkt einzunehmen.
	Capturable:
		Types: building

# === Age of Tiberium (aotmod) - Vehicle Factory (LITE) ===
# Günstigere Fahrzeugfabrik. Nur Powerplant nötig (kein Refinery).
# Sprite: RA War Factory (WEAP.ZIP), Age 0/1 IDENTISCH für beide Fraktionen.
# Ab Age 2 pro Fraktion eigenes Sprite -> Faction-Split in aot-lite-gdi/aot-lite-nod,
# LITE ist nur noch die gemeinsame Basis (kein Buildable/Production mehr direkt drauf).
LITE:
	Inherits: ^BaseBuilding
	Inherits@shape: ^3x2Shape
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `lite-gdi`/`lite-nod` does not have a
	# sequence named `dead`").
	-WithDeathAnimation:
	# LITE ist nur Basis-Template; die konkreten Fabriken aot-lite-gdi/-nod ueberschreiben das
	# Image. Ohne eigenes Image faellt der nie platzierte Basis-Aktor `lite` auf den nicht
	# existierenden Image-Namen `lite` zurueck (check-yaml: "Image `lite` does not have any
	# sequences defined"). Ein gueltiges Default-Image genuegt; Inheritors setzen ihr eigenes.
	RenderSprites:
		Image: lite-gdi
	Tooltip:
		Name: actor-lite.name
	Valued:
		Cost: 500
	Health:
		HP: 60000
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	RallyPoint:
	CommandBarBlacklist:
		DisableStop: false
	WithBuildingBib:
	WithMakeAnimation:
		Condition: build-incomplete
	RevealsShroud:
		Range: 4c0
	# Fahrzeuge fahren erst eine Zelle weiter nach Sueden (1,2 -> 1,3), bevor sie anhalten oder
	# zum Wegpunkt weiterfahren. LITE hat KEIN Tor — hier geht es nur um die Ziel-/Halte-Zelle.
	# Gilt automatisch fuer BEIDE Fraktionen: aot-lite-gdi und aot-lite-nod erben Exit@1 von
	# hier und ueberschreiben nur Production.
	# ACHTUNG: 1,3 liegt AUSSERHALB des Footprints ("xxx xxx ===" endet bei Reihe 2), also auf
	# normalem Gelaende. Steht dort ein Gebaeude/Hindernis, blockiert der Exit die Produktion.
	# Innerhalb des Footprints ging es nicht: 1,2 war bereits die letzte (Bib-)Reihe.
	Exit@1:
		SpawnOffset: 0,512,0
		ExitCell: 1,3
		ExitDelay: 3
	Power:
		Amount: -20
	# aot-age1-active am Gebaeude (eingerastet) -- Voraussetzung fuer die producer-gebundene
	# Baubarkeit der Age-1-Einheiten (Bike/Buggy) an DIESER LITE, auch nach Uebernahme.
	AotGrantConditionOnPrerequisiteLatched@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@base:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithIdleOverlay@ROOF:
		Sequence: roof
		RequiresCondition: !aot-age2-active
	-WithMakeAnimation:
	WithMakeAnimation@base:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65

aot-lite-gdi:
	Inherits: LITE
	RenderSprites:
		Image: lite-gdi
	Buildable:
		BuildPaletteOrder: 60
		Prerequisites: anypower
		Queue: Building.GDI
		Description: Basic vehicle production facility. Requires only a Power Plant.
	ProvidesPrerequisite:
		Prerequisite: vehicleproduction
	ProvidesPrerequisite@lite:
		Prerequisite: lite
	ProvidesPrerequisite@buildingname:
	Production:
		Produces: LightVehicle.GDI
	ProductionQueue:
		Type: LightVehicle.GDI
		DisplayOrder: 3
		Factions: gdi
		Group: Vehicle
		ShowLockedItems: True
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: notification-unable-to-comply-building-in-progress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar:
		ProductionType: LightVehicle.GDI
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		RequiresCondition: aot-age2-active
	# Zwei-Layer-System wie Age 0/1 (body unterhalb, roof oberhalb der Einheit) -
	# ROOF-Overlay ersetzt fuer Age 2 die alte Einzel-Sprite-Loesung.
	WithIdleOverlay@tsroof:
		Sequence: aot-age2-roof
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@tsblink:
		Sequence: aot-age2-blink
		RequiresCondition: aot-age2-active && !build-incomplete
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

aot-lite-nod:
	Inherits: LITE
	RenderSprites:
		Image: lite-nod
	Buildable:
		BuildPaletteOrder: 60
		Prerequisites: anypower
		Queue: Building.Nod
		Description: Basic vehicle production facility. Requires only a Power Plant.
	ProvidesPrerequisite:
		Prerequisite: vehicleproduction
	ProvidesPrerequisite@lite:
		Prerequisite: lite
	ProvidesPrerequisite@buildingname:
	Production:
		Produces: LightVehicle.Nod
	ProductionQueue:
		Type: LightVehicle.Nod
		DisplayOrder: 3
		Factions: nod
		Group: Vehicle
		ShowLockedItems: True
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: notification-unable-to-comply-building-in-progress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar:
		ProductionType: LightVehicle.Nod
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		RequiresCondition: aot-age2-active
	# Zwei-Layer-System wie Age 0/1 (body unterhalb, roof oberhalb der Einheit) -
	# ROOF-Overlay ersetzt fuer Age 2 die alte Einzel-Sprite-Loesung.
	WithIdleOverlay@tsroof:
		Sequence: aot-age2-roof
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@tsblink:
		Sequence: aot-age2-blink
		RequiresCondition: aot-age2-active && !build-incomplete
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

# === Age of Tiberium (aotmod) - LITE Editor-Platzierer fuer die Age-2-Optik (2026-07-26) ===
# aot-lite-gdi/-nod selbst zeigen im Karteneditor bereits korrekt die Age-0/1-Optik (das ist
# der Default-Zustand ohne Spieler-Techtree, siehe locked-icon-system.md "Age-Proxy Sprite-
# Guarantee-Fix"). Fuer die Age-2-Optik gab es aber GAR KEINEN eigenen Platzierer -- diese
# beiden Aktoren schliessen die Luecke. KEIN Buildable: erscheinen NIE in einer Bau-Queue,
# rein zum gezielten Vorplatzieren im Karteneditor (bleiben aber voll funktionsfaehig, falls
# ein Mapper sie tatsaechlich auf eine Karte setzt).
aot-lite-gdi-editor-age2:
	Inherits: aot-lite-gdi
	-Buildable:
	RenderSprites:
		Image: lite-gdi
	-WithSpriteBody@base:
	-WithIdleOverlay@ROOF:
	-WithMakeAnimation@base:
	WithSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tsroof:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsblink:
		RequiresCondition: !build-incomplete
	WithMakeAnimation@ts:

aot-lite-nod-editor-age2:
	Inherits: aot-lite-nod
	-Buildable:
	RenderSprites:
		Image: lite-nod
	-WithSpriteBody@base:
	-WithIdleOverlay@ROOF:
	-WithMakeAnimation@base:
	WithSpriteBody@ts:
		RequiresCondition: aot-age2-active || !aot-age2-active
	WithIdleOverlay@tsroof:
		RequiresCondition: !build-incomplete
	WithIdleOverlay@tsblink:
		RequiresCondition: !build-incomplete
	WithMakeAnimation@ts:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Ore Mine ===
# Neutrales Gebäude, via Map-Editor platziert. Kein Buildable-Trait.
# DockHost Typ "OreLoad" — ORET-Fahrzeug dockt hier an um Erz zu laden.
# Hohe HP = praktisch unzerstörbar (kann später finite Ressourcen erhalten).
aot-ore-mine:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Tooltip:
		Name: actor-aot-ore-mine.name
		GenericName: actor-aot-ore-mine.generic-name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		LocalCenterOffset: 0,0,0
		TerrainTypes: Clear,Rough,Road,Rock,Clear.Snow
	Health:
		HP: 99999
	DamageMultiplier:
		Modifier: 0
	StoresResources:
		# Capacity ist hier kein Erz-Vorrat, sondern die Anzahl Fuhren, die die Mine uebersteht
		# (OreMineDurability.OnTrip zieht pro Fuhre 1 ab, unabhaengig von ORET.OreLoadAmount) --
		# User-Wunsch 2026-08-01: 250 -> 500 Erz pro Fuhre (aot-units.yaml, ORET.OreLoadAmount).
		# User-Wunsch 2026-08-03: Einkommen pro Zeit runter UND Mine frueher erschoepft. Beides
		# zusammen: OreLoadAmount 500 -> 400 (Rate -20%, aot-units.yaml) und Fuhren 50 -> 40
		# (Laufzeit -20%). Multipliziert sich zu 40 x 400 = 16000 statt bisher 25000.
		# User 2026-08-10: 50 -> 35 Fuhren. Die Rate von 500/Fuhre passt, aber die Mine trug damit zu
		# lange -- sie ist als BRUECKE bis Refinery/Expansion gedacht, nicht als Dauerquelle.
		# 35 x 500 = 17500 pro Mine (vorher 50 x 500 = 25000), Laufzeit -30 % bei gleicher Rate.
		Capacity: 35
		Resources: Tiberium
	OreMineDurability:
		ResourceType: Tiberium
	DockHost:
		Type: OreLoad
		# aotmod 2026-09-03: Andockpunkt an die SUEDKANTE (unten-mitte), ausserhalb des Footprints,
		# damit der Sammler ihn ueberhaupt erreichen kann (vorher noerdlich/auf dem Footprint -> ORET
		# blieb haengen, siehe User-Screenshot). DockAngle 0 = Nord -> ORET steht suedlich und zeigt zur
		# Mine hoch (S->N, "nach oben ausgerichtet"); Harvest-Anim/Schaufel Richtung Norden.
		# 1c512 = 1,5 Zellen sued vom 2x2-Zentrum = eine Zelle unter der Suedkante. Gilt fuer beide
		# 2x2-Minen (aot-ore-mine + aot-ore-mine-rich); aot-ore-depot (3x3) ueberschreibt den Offset.
		DockAngle: 0
		DockOffset: 0,1c512,0
	WithBuildingBib:
	# Explosion beim Erschoepfen ohne Krater-Smudge (User-Wunsch 2026-08-28): ^Building feuert
	# beim Tod BuildingExplode, dessen LeaveSmudge(Crater)-Warhead den Krater hinterliesse.
	# aot-mine-explode-nocrater (aot-weapons.yaml) ist dieselbe Explosion OHNE Smudge.
	FireWarheadsOnDeath:
		Weapon: aot-mine-explode-nocrater
		EmptyWeapon: aot-mine-explode-nocrater
	# Locker verstreutes RA-Erz rund um die Mine (User-Wunsch 2026-08-28). Unsichtbar-gekoppelte,
	# nicht-blockierende Deko-Aktoren, die mit der Mine wieder verschwinden. Pro Zelle terrain-
	# abhaengig: Clear.Snow -> Snow-Sprite, sonst Temperate (AOT_ARCTIC mischt pro Zelle).
	ScatterDecorationActors:
		TemperateActor: aot-ore-scatter-temp
		SnowActor: aot-ore-scatter-snow
	# Vergroesserte Nicht-bebaubar-Zone: spawnt bei Spielstart einen unsichtbaren Begleit-Aktor
	# (aot-ore-mine-keepout, 8x8) zentriert auf die 2x2-Mine (Offset -3,-3 = 3-Zellen-Ring rundherum).
	# Bewusst ueber einen SEPARATEN Aktor statt groesserer Building.Dimensions: sonst wuerden Bib
	# (WithBuildingBib leitet Breite/Zeilen aus Dimensions ab) und Render-Zentrum mitwandern.
	SpawnCompanionActor:
		Actor: aot-ore-mine-keepout
		Offset: -3,-3
	# Rote Bau-Sperrzone im Editor: deckt die 8x8-Keepout-Zone (aot-ore-mine-keepout, Offset -3,-3)
	# rund um die 2x2-Mine ab -> Zellen -3..+4 relativ zur Minen-Zelle. Gezeichnet von
	# AotEditorBoundsOverlay (EditorWorld).
	AotEditorBounds:
		MinX: -3
		MinY: -3
		MaxX: 4
		MaxY: 4
		Color: E03030A0
	MapEditorData:
		Categories: Neutral
# === Ende aotmod ===

# aot-ore-mine-keepout: unsichtbarer, passierbarer Sperr-Footprint fuer die Ore Mine.
# Reiner 8x8-'='-Footprint (OccupiedPassable): registriert in BuildingInfluence -> blockiert
# jede Bauplatzierung im Ring, ist aber NICHT in OccupiedTiles -> Einheiten/Sammler fahren durch.
# Kein Sprite/Bib/Health/Selection -> aendert Optik, Bib und Zentrierung der Mine nicht.
# Wird von SpawnCompanionActor (auf der Mine) zur Laufzeit erzeugt, nie im Editor platziert.
aot-ore-mine-keepout:
	Building:
		Footprint: ======== ======== ======== ======== ======== ======== ======== ========
		Dimensions: 8,8
		AllowInvalidPlacement: true
	Interactable:
	SnapshotTransient:
# === Ende aotmod ===

# Scatter-Deko-Aktoren fuer die Ore Mines (RA GOLD/GEM Terrain-Tiles). Nicht-blockierend
# (Immobile OccupiesSpace:false), nicht anklickbar, kein Health/Targetable -> rein visuell.
# WithRandomSpriteBody waehlt pro Aktor deterministisch eine der 8 Cluster-Sequenzen (c0..c7)
# aus seiner Zellposition -> Varianz ohne RNG (sync/replay-sicher). Werden von
# ScatterDecorationActors auf der jeweiligen Mine zur Laufzeit erzeugt und mit ihr entfernt,
# nie im Editor platziert (kein MapEditorData).
aot-ore-scatter-temp:
	Inherits: ^SpriteActor
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Image: aot-ore-scatter-temp
	SnapshotTransient:
	WithRandomGroundSprite:
		Sequences: idle, c1, c2, c3, c4, c5, c6, c7
aot-ore-scatter-snow:
	Inherits: ^SpriteActor
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Image: aot-ore-scatter-snow
	SnapshotTransient:
	WithRandomGroundSprite:
		Sequences: idle, c1, c2, c3, c4, c5, c6, c7
aot-gem-scatter-temp:
	Inherits: ^SpriteActor
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Image: aot-gem-scatter-temp
	SnapshotTransient:
	WithRandomGroundSprite:
		Sequences: idle, c1, c2, c3, c4, c5, c6, c7
aot-gem-scatter-snow:
	Inherits: ^SpriteActor
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Image: aot-gem-scatter-snow
	SnapshotTransient:
	WithRandomGroundSprite:
		Sequences: idle, c1, c2, c3, c4, c5, c6, c7
# === Ende aotmod ===

# Rich Ore Mine: doppelter Inhalt (70 statt 35 Fuhren), gem-Streuung statt Erz. Erbt Sprite,
# Bib, Keep-out-Zone, No-Crater-Explosion und Dock von aot-ore-mine. RenderSprites.Image muss
# explizit auf aot-ore-mine zeigen (sonst Default = Aktorname 'aot-ore-mine-rich' ohne Sequenz).
aot-ore-mine-rich:
	Inherits: aot-ore-mine
	RenderSprites:
		Image: aot-ore-mine
	Tooltip:
		Name: actor-aot-ore-mine-rich.name
		GenericName: actor-aot-ore-mine-rich.generic-name
	StoresResources:
		Capacity: 70
	ScatterDecorationActors:
		TemperateActor: aot-gem-scatter-temp
		SnowActor: aot-gem-scatter-snow
	AotEditorBounds:
		Color: A030E0A0
# === Ende aotmod ===

# Ore Depot: dritte Ore-Mine-Variante mit eigenem, groesserem Gemini-Sprite (RA-Kompound-Render)
# statt der kleinen OREMINE-Kachel. KEIN verstreutes Erz/Gem rundherum -- nur das Sprite plus der
# ORIGINAL-Smudge-Bib wie bei LITE (WithBuildingBib + bib2, nicht vorgebacken). Groesse grob wie
# eine LITE (3x3-Footprint). Erbt alle Oekonomie-Traits (StoresResources/DockHost/OreMine-
# Durability/No-Crater-Explosion/Keep-out) von aot-ore-mine.
# Player-Color: das Gemini-Sprite ist truecolor und enthaelt gruene Tiberium-Haufen -> WithSpriteBody
# explizit Palette: effect / IsPlayerPalette: false, sonst wuerde PlayerColorShift die gruenen Pixel
# einfaerben (siehe gemini-building-import / silo-system). Neutrales Map-Gebaeude, kein Remap.
aot-ore-depot:
	Inherits: aot-ore-mine
	Inherits@shape: ^3x2Shape
	RenderSprites:
		Image: aot-ore-depot
	Tooltip:
		Name: actor-aot-ore-depot.name
		GenericName: actor-aot-ore-depot.generic-name
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		# Body eine halbe Zelle nach Sueden verschoben (User 2026-09-03). LocalCenterOffset bewegt nur
		# das Sprite: WithBuildingBib rechnet den CenterOffset wieder heraus, Bib+Footprint bleiben fix.
		LocalCenterOffset: 0,0,0
		TerrainTypes: Clear,Rough,Road,Rock,Clear.Snow
	WithSpriteBody:
		Palette: effect
		IsPlayerPalette: false
	WithBuildingBib:
	# So ergiebig wie die Rich Ore Mine (User 2026-09-03): doppelter Inhalt = 70 Fuhren.
	StoresResources:
		Capacity: 70
	# Kein verstreutes Erz/Gem (User-Wunsch): nur das Sprite.
	-ScatterDecorationActors:
	# ORET faehrt bis auf den Smudge an die Gebaeudekante (User 2026-09-03): Dockzelle = die BIB-Reihe
	# direkt suedlich des massiven 3x3-Koerpers (passierbar, ORET darf drauf stehen). 3x3-Zentrum bei
	# 1,5c -> +1c = Bib-Reihe (Zeile 2). Ausrichtung Nord.
	DockHost:
		Type: OreLoad
		DockAngle: 0
		DockOffset: 0,1c0,0
	AotEditorBounds:
		Color: E0A030A0
# === Ende aotmod ===

# Ore Depot (Pre-War): vierte Ore-Mine-Variante, identisches Prinzip wie aot-ore-depot (3x3-Footprint,
