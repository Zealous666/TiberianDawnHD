# === Age of Tiberium (aotmod) - MSLO (Nuke Silo, NOD) ===
# NOD-exklusives Superweapon-Gebäude (RA Nuclear Missile Silo, RA MSLO-Sprites).
# Sichtbar ab Age 1, baubar sobald STEC + Radar Dome (anyhq) stehen.
# Sprite-Wechsel ab Age 2 zu TS NAMISL (Nod Missile Silo) — siehe [[nuke-silo-system]], gleiches
# Zwei-Layer-Schema (Body silbergrau + House-Color-Overlay 176-191) wie beim NUKE-Turbinen-Upgrade.
# Superpower "Tiberium Strike" = Duplikat von TMPLs NukePower (structures.yaml), Warhead ersetzt
# durch aot-TiberiumStrike (toxisch statt nuklear, siehe aot-weapons.yaml).
# Cooldowns final abgestimmt (User 2026-07-30): Mine Cluster 10min, Enhanced 15min,
# Tiberium Missile 15min, Atom Bomb 20min (vorher 250/250/250/11250 = 10s/10s/10s/7,5min TESTWERTe).
MSLO:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `mslo` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Missile Silo
	Valued:
		Cost: 2500
	Health:
		HP: 100000
	Selectable:
		Bounds: 2048, 2048
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-mslo
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -150
	WithBuildingBib:
	RenderSprites:
		Image: mslo
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
