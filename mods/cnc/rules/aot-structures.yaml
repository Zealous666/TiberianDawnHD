# === Age of Tiberium (aotmod) - GUN NOD-exklusiv, GTWR bleibt GDI ===
# GUN umgedreht (2026-07-04, User-Wunsch): war "GDI-exklusiv", jetzt NOD-exklusiv,
# ab Age 1 (Age 0 uebernimmt stattdessen der importierte RA Flame Tower, siehe
# ftur-system.md). Original-Waffe (Maschinengewehr) unveraendert.
# Ab "Laser Defense Systems"-Upgrade (aot-laser-fence-upgrade) wechseln Waffe UND
# Turm-Sprite auf Laser (rot recolored, siehe gun-turret-system.md fuer die
# Recolor-Pipeline-Referenz von HTNK-Railgun/LTNK-Laser). Proxy-Pattern
# (aot-gun-base/aot-gun-laser) fuer Bau-Icon-Wechsel, Condition-Switch direkt auf
# GUN fuer bereits gebaute Tuerme (1:1 das HTNK/LTNK-Muster).
GUN:
	-Buildable:

	GrantConditionOnPrerequisite@LASER:
		Condition: aot-gun-laser-active
		Prerequisites: aot-laser-fence-upgrade

	# KRITISCH (Crash-Fix Runde 4, 2026-07-05): braucht eine ZWEITE, physisch
	# identische Turreted-Instanz "laser" - siehe Begruendung unten bei
	# WithSpriteTurret@laser. Exakte Werte 1:1 von der geerbten Basis (structures.
	# yaml) uebernommen, damit beide Tuerme immer synchron rotieren.
	Turreted@laser:
		Turret: laser
		TurnSpeed: 48
		InitialFacing: 192
		RealignDelay: -1
		RequiresCondition: !build-incomplete

	# AttackTurreted muss BEIDE Tuerme kennen, sonst dreht sich der "laser"-Turm
	# nie zum Ziel (er wuerde sonst dauerhaft auf InitialFacing stehen bleiben,
	# obwohl seine Sprite-Sequenz gerade aktiv gerendert wird).
	# KRITISCH (Crash-Fix Runde 5, 2026-07-05, User-Fund "Laser Turret kann nicht
	# angreifen"): AttackBaseInfo.Armaments (Whitelist der genutzten Armament-
	# NAMEN) defaultet auf ["primary","secondary"] (AttackBase.cs:28). Da
	# Armament@laser den Namen "laser" traegt (nicht "primary"/"secondary"),
	# ignorierte AttackTurreted es KOMPLETT, sobald der Laser aktiv war - das
	# Geschuetz griff schlicht nie an, ohne Crash/Fehlermeldung (stiller Bug, von
	# check-yaml nicht erkennbar). Muss explizit in die Armaments-Liste.
	AttackTurreted:
		PauseOnCondition: build-incomplete
		Turrets: primary, laser
		Armaments: primary, laser

	# Explizite Namen noetig (Crash-Fix 2026-07-04): WithTurretAttackAnimation
	# (geerbt aus der Engine-Basis, sucht per .Single() nach Armament.Name=="primary")
	# fand sonst ZWEI Treffer, sobald ein zweites unbenanntes Armament (Default-
	# Name ebenfalls "primary") dazukam -> InvalidOperationException beim Platzieren.
	-Armament:

	Armament@base:
		Name: primary
		Weapon: TurretGun
		LocalOffset: 512,0,112
		MuzzleSequence: muzzle
		RequiresCondition: !aot-gun-laser-active

	Armament@laser:
		Name: laser
		Weapon: aot-GunLaser
		LocalOffset: 512,0,112
		RequiresCondition: aot-gun-laser-active

	# Nur fuer die Basis-Waffe aktiv (Original-Verhalten unveraendert). Fuer die
	# Laser-Variante noch KEINE eigene recolorte "recoil"-Sequenz gebacken -> Trait
	# dort deaktiviert statt versehentlich auf die alte graue Sequenz umzuschalten.
	-WithTurretAttackAnimation:

	WithTurretAttackAnimation@base:
		Armament: primary
		Turret: primary
		Sequence: recoil
		RequiresCondition: !aot-gun-laser-active

	# Zweiter Teil desselben Crash-Fixes (2026-07-04, Runde 2): WithTurretAttackAnimation
	# macht ZWEI .Single()-Lookups - Armament.Name (siehe oben) UND WithSpriteTurret.Turret
	# (WithSpriteTurretInfo.Turret defaultet ebenfalls auf "primary"). Mit zwei
	# unbenannten WithSpriteTurret-Instanzen fand die zweite .Single()-Abfrage
	# ebenfalls zwei Treffer -> derselbe Crash beim Platzieren, nur an anderer Stelle
	# im selben Konstruktor. Explizite Turret-Namen jetzt auch hier noetig.
	-WithSpriteTurret:

	WithSpriteTurret@base:
		Turret: primary
		RequiresCondition: !build-incomplete && !aot-gun-laser-active
		Recoils: false

	# KRITISCH (Crash-Fix Runde 3+4, 2026-07-05): "Turret:" bei WithSpriteTurret
	# referenziert den NAMEN einer Turreted-Instanz (WithSpriteTurret..ctor macht
	# .First(tt => tt.Name == info.Turret) - KEIN neuer physischer Turm wird
	# dadurch erzeugt). Runde 3 setzte hier faelschlich "Turret: primary" (weil
	# es urspruenglich nur EINE Turreted-Instanz gab) - das behob zwar den
	# WithSpriteTurret-Crash, verursachte aber SOFORT den naechsten: mit ZWEI
	# WithSpriteTurret-Instanzen die beide "Turret: primary" melden, findet
	# WithTurretAttackAnimation..ctor's eigener .Single(st => st.Info.Turret ==
	# info.Turret)-Lookup ZWEI Treffer statt einem -> derselbe Crash-Typ, nur an
	# einer dritten Stelle. Echte Loesung (Runde 4): "Turret: laser" beibehalten,
	# aber dafuer eine ECHTE zweite Turreted-Instanz "laser" anlegen (siehe oben,
	# physisch identisch zur Basis, damit beide Tuerme synchron rotieren).
	WithSpriteTurret@laser:
		Turret: laser
		Sequence: aot-gun-laser-turret
		RequiresCondition: !build-incomplete && aot-gun-laser-active
		Recoils: false

