# === Age of Tiberium (aotmod) - GDI Pillbox (Garrison-Verteidigung, 2026-07-05) ===
# RA-Remastered-Import (PBOX/PBOXMAKE). Keine eigene Waffe - komplett abhaengig
# von Garrison-Infanterie (5 Slots), 1:1 das Muster von RAs eigenem PBOX
# (Cargo + AttackGarrisoned mit 6 Fire-Ports, siehe engine/mods/ra/rules/
# structures.yaml). "Armaments: garrisoned" filtert auf die neue
# Armament@GARRISONED-Variante, die jede aot-Infanterie-Einheit bekommt (siehe
# aot-units.yaml). Inherits@AUTOTARGET: ^AutoTargetAll (statt GroundAssaultMove)
# - noetig, damit z.B. ein garnisonierter Rocket Soldier (E3, Rockets-Waffe hat
# bereits ValidTargets inkl. Air) auch automatisch Luftziele anvisiert.
aot-pillbox:
	Inherits: ^Support
	Inherits@AUTOTARGET: ^AutoTargetAll
	# Custom RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von
	# ^Support/^BaseBuilding geerbt) wuerde beim Zerstoeren crashen (siehe
	# building-dead-sequence-crash.md - reiner Laufzeit-Crash, check-yaml
	# meldet nur eine Warnung, keinen harten Fehler).
	-WithDeathAnimation:
	# User-Wunsch (2026-07-26): nicht durch Engineer/Saboteur einnehmbar (gilt fuer beide
	# Proxy-Varianten aot-pillbox-base/aot-pillbox-guard, Capturable ist auf der Basis).
	-Capturable:
	# Guard Tower Upgrade (Phase 2, 2026-07-05): reine Namens-/Icon-Aenderung,
	# Pillbox-Funktionalitaet (Cargo/AttackGarrisoned/Stats) bleibt unveraendert -
	# 1:1 das FTUR-Toxic-Tower-Tooltip-Switch-Muster.
	GrantConditionOnPrerequisite@GUARDTOWER:
		Condition: aot-guard-tower-active
		Prerequisites: aot-guard-tower-upgrade
	# Camo-Pillbox-Upgrade (2026-07-27): Ausschluss-Upgrade zum Guard Tower -
	# entweder/oder, siehe ~!-Kreuzverweise auf den beiden Upgrade-Aktoren
	# weiter unten. Reine Namens-/Sprite-/Cloak-Aenderung, Cargo/AttackGarrisoned
	# bleiben unveraendert (1:1 dasselbe Muster wie Guard Tower).
	GrantConditionOnPrerequisite@CAMOPILLBOX:
		Condition: aot-camo-pillbox-active
		Prerequisites: aot-camo-pillbox-upgrade
	# "-Tooltip:" legitim: die unbenannte Tooltip-Instanz kommt von ^Building
	# (GenericName: meta-building-generic-name), nicht aus dieser Datei -
	# ohne diese Entfernung bleibt sie ohne Name (FieldLoader.Require) zurueck
	# und crasht beim Laden.
	-Tooltip:
	Tooltip@normal:
		Name: Pillbox
		RequiresCondition: !aot-guard-tower-active && !aot-camo-pillbox-active
	Tooltip@guard:
		Name: Guard Tower
		RequiresCondition: aot-guard-tower-active
	Tooltip@camo:
		Name: Camo Pillbox
		RequiresCondition: aot-camo-pillbox-active
	Valued:
		Cost: 100
	Health:
		HP: 41000
	Armor:
		Type: Concrete
	Building:
		Footprint: x
		Dimensions: 1,1
	# Sichtweite + Waffenreichweite steigen mit dem Guard-Tower-Upgrade
	# (User-Wunsch 2026-07-05). RevealsShroud ist ConditionalTrait (unproblematisch
	# mehrfach benannt, anders als AttackBase-Familie) - kein "-RevealsShroud:"
	# noetig, da die unbenannte Version nur direkt in dieser Datei stand (nicht
	# von ^Support/^Building geerbt).
	RevealsShroud@normal:
		Range: 6c0
		RequiresCondition: !aot-guard-tower-active && !aot-camo-pillbox-active
	RevealsShroud@guard:
		Range: 9c0
		RequiresCondition: aot-guard-tower-active
	# Camo Pillbox behaelt die normale Sichtweite (KEIN Bonus wie Guard Tower) -
	# der Tausch ist Tarnung gegen Reichweite, nicht beides.
	RevealsShroud@camo:
		Range: 6c0
		RequiresCondition: aot-camo-pillbox-active
	# RangeMultiplier wirkt auf JEDE Waffe, die von diesem Aktor abgefeuert wird
	# - also auch auf die geliehene Garrison-Waffe der eingeladenen Infanterie.
	# Eigenstaendiger Modifier-Trait (kein AttackBase-Abkoemmling), daher ohne
	# Risiko einer zweiten-Instanz-Kollision.
	RangeMultiplier:
		RequiresCondition: aot-guard-tower-active
		Modifier: 150
	# Kein eigenes Buildable mehr (2026-07-05) - Proxy-Pattern (aot-pillbox-base/
	# aot-pillbox-guard unten) steuert Bau-Icon-Wechsel nach dem Upgrade, 1:1
	# das GUN/FTUR-Muster.
	RenderSprites:
		Image: aot-pillbox
	# Sprite-Wechsel nach dem Guard-Tower-Upgrade (2026-07-05): TS Searchlight
	# Tower (GASPOT), per Gemini neu gezeichnet. "-WithSpriteBody:" legitim -
	# entfernt die von ^Building GEERBTE unbenannte Instanz (die eigene direkt
	# in dieser Datei definierte Version wird im selben Edit ersatzlos durch
	# die drei benannten Varianten unten ersetzt, kein Bezug auf die eigene
	# Zeile noetig). Ohne diese Entfernung blieben VIER WithSpriteBody-
	# Instanzen uebrig (die geerbte + 3 neue), die geerbte haette denselben
	# Default-Namen "body" wie WithSpriteBody@normal -> derselbe .Single()-
	# Kollisions-Crash wie bei GUN/FTUR (siehe gun-turret-system.md).
	# Body-Remap-Layer 1:1 das aot-nod-radar-Muster (WithSpriteBody@age2remap)
	# - kein Palette:/IsPlayerPalette: am Trait noetig, das Overlay-PNG traegt
	# die 176-191-Rampe direkt in seiner eigenen Palette.
	-WithSpriteBody:
	WithSpriteBody@normal:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-guard-tower-active && !aot-camo-pillbox-active
	WithSpriteBody@guard:
		Sequence: guard-idle
		Name: body-guard
		RequiresCondition: aot-guard-tower-active
	WithSpriteBody@guardremap:
		Sequence: guard-remap
		Name: body-guard-remap
		# "!build-incomplete" PFLICHT: der Player-Color-Layer hat keine eigene
		# Make-Animation. Ohne die Bedingung steht er waehrend des gesamten Baus
		# in voller Groesse da, waehrend body-guard darunter erst hochwaechst
		# (dieselbe Fehlerklasse wie der LITE-Roof-Pop-in). SLAB/MSLO/TMPL
		# handhaben ihre Remap-Layer bereits genauso.
		RequiresCondition: aot-guard-tower-active && !build-incomplete
	# RA HBOX.ZIP (Camo Pillbox), 1:1 importiert wie die Basis-Pillbox (kein
	# Zwei-Layer-Remap noetig, HBOX ist ein Ein-Layer-RA-Sprite wie PBOX).
	WithSpriteBody@camo:
		Sequence: camo-idle
		Name: body-camo
		RequiresCondition: aot-camo-pillbox-active
	# KRITISCHER Bugfix (2026-07-05, User-Fund: "Verkaufen tut nichts"):
	# Sellable.Sell() sucht sich per WithMakeAnimation.HasActiveBody() die
	# AKTIVE Sprite-Instanz und spielt deren "make"-Sequenz RUECKWAERTS ab, bevor
	# der Aktor entfernt wird. Das von ^BaseBuilding geerbte, unbenannte
	# WithMakeAnimation zeigt per Default nur auf BodyNames:"body" (die
	# Pillbox-Variante) - im Guard-Tower-Zustand ist "body" aber deaktiviert
	# (RequiresCondition: !aot-guard-tower-active), wodurch die Sell-Animation
	# nie fertig wird und der Aktor stehen bleibt (Sound/Abzug passieren, aber
	# der Aktor verschwindet nie). "-WithMakeAnimation:" legitim (von
	# ^BaseBuilding geerbt).
	-WithMakeAnimation:
	WithMakeAnimation@normal:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@guard:
		BodyNames: body-guard
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@camo:
		BodyNames: body-camo
		Condition: build-incomplete
		Sequence: camo-make
	Cargo:
		Types: Infantry
		MaxWeight: 5
		# Insassen steigen beim Zerstoeren des Turms aus (Engine-Default: false =
		# sie sterben mit). Ausstieg nur wenn die Zelle betretbar ist, sonst Tod.
		EjectOnDeath: true
	WithCargoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
	# 6 Fire-Ports rundherum (identische Geometrie wie RAs PBOX) - je ~60 Grad
	# Sichtkegel, deckt alle Richtungen ab.
	AttackGarrisoned:
		# Pillbox braucht KEINE Power und feuert auch bei Low-Power weiter
		# (User 2026-07-26, analog Fire Position).
		PauseOnCondition: build-incomplete
		Armaments: garrisoned
		PortOffsets: 384,0,128, 224,-341,128, -224,-341,128, -384,0,128, -224,341,128, 224,341,128
		PortYaws: 0, 176, 341, 512, 682, 853
		PortCones: 88, 88, 88, 88, 88, 88
	Power:
		Amount: 0
	# RenderDetectionCircle (von ^Support geerbt) verlangt DetectCloaked -
	# ohne das crasht der Aktor beim Laden ("not constructible").
	DetectCloaked:
		Range: 5c0
	# Camo-Pillbox-Upgrade (2026-07-27): 1:1 RAs eigene HBOX-Technik uebernommen
	# (engine/mods/ra/rules/structures.yaml) - Standard-Cloak-Trait, kein
	# eigenes Tarn-System noetig. Default UncloakOn (Attack|Unload|Infiltrate|
	# Demolish|Dock) sorgt automatisch dafuer, dass die Pillbox beim Feuern
	# (auch mit der geliehenen Garrison-Waffe der Insassen) entarnt und erst
	# CloakDelay-Ticks nach dem letzten Angriff wieder tarnt. CloakSound/
	# UncloakSound sind Engine-Default null (RA HBOX setzt sie ebenfalls nicht) -
	# "ohne Geraeusch" ist damit bereits erfuellt, kein Override noetig. Cloak
	# blendet nur die Sicht der GEGNER aus (Shroud/Visibility-System) - der
	# Eigentuemer sieht sein Gebaeude immer normal farbig, wie gefordert.
	Cloak:
		RequiresCondition: aot-camo-pillbox-active
		InitialDelay: 125
		CloakDelay: 60
		PauseOnCondition: cloak-force-disabled
	# Bei kritischem Schaden wird die Tarnung (wie im RA-Original) erzwungen
	# aufgehoben - ein aufgerissener Bunker kann sich nicht mehr tarnen.
	GrantConditionOnDamageState@UNCLOAK:
		Condition: cloak-force-disabled
		ValidDamageStates: Critical
# === Ende aotmod ===

# Proxy-Aktoren fuer den Bau-Icon-/Namens-Wechsel nach dem Guard-Tower-Upgrade
# (User-Icons, 2026-07-05), 1:1 das GUN/E4-Muster: beide bauen denselben
# "aot-pillbox", nur welches Icon/welche Beschreibung im Baumenue erscheint
# unterscheidet sich je nach Guard-Tower-Upgrade-Stand.
aot-pillbox-base:
