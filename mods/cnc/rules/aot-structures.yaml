# === Age of Tiberium (aotmod) - GDI Gate ===
# Buendigkeits-Test gegen die Fortified Wall. Bewusst OHNE LineBuildNode:
# Wall-Nachbarn sollen ihre End-Frames rendern (siehe ts-gates-system.md).
aot-gate-gdi:
	Inherits: ^BaseBuilding
	# Custom-Sprite ohne "dead"-Rubble-Frame -> geerbtes WithDeathAnimation crasht beim Tod.
	-WithDeathAnimation:
	# Kein Infanterie-Spawn beim Verkaufen (User-Wunsch: niemand soll rauskommen).
	-SpawnActorsOnSell:
	# NOD-Gegenstueck der Verkaufs-Infanterie ebenfalls entfernen (siehe ^BaseBuilding oben):
	# ohne diese Zeile wuerde dieses Gebaeude bei NOD-Besitz doch Infanterie ausspucken.
	-SpawnActorsOnSell@nod:
	# WithMakeAnimation bleibt geerbt (grantet build-incomplete fuer Sellable/
	# Capturable); make-Sequenz = 1-Frame-Dummy mit derselben PNG.
	# Nativer Gate-Trait (Engine) uebernimmt Auto-Open/-Close fuer Verbuendete +
	# TS-Sounds. WithGateSpriteBody ersetzt WithSpriteBody: waehlt automatisch den
	# passenden Frame aus "idle" (11 Frames) je nach Gate.Position, OpenSequence
	# "open" fuer den Ruhezustand komplett offen.
	-WithSpriteBody:
	WithGateSpriteBody:
		OpenSequence: open
		# Kein Remap: WithSpriteBody/WithGateSpriteBody haben EIGENE Palette/
		# IsPlayerPalette-Felder (NICHT die der Sequenz-YAML - die werden vom
		# Koerper-Renderer ueberhaupt nicht gelesen, nur vom Icon-Renderer!). Ohne
		# expliziten Wert faellt RenderSprites.Add() intern auf "player" zurueck ->
		# der Fragment-Shader (combined.frag ColorShift()) verschiebt dann JEDEN
		# Pixel, dessen HSV-Farbton in den remapbaren Bereich faellt, Richtung
		# Spielerfarbe. Betraf hier die Beton/Metall-Toene teils sichtbar unter
		# bestimmten Spielerfarben - siehe ts-gates-system.md.
		Palette: effect
		IsPlayerPalette: false
	Gate:
		# LockedCondition (Custom-Erweiterung unseres Engine-Forks, siehe Gate.cs):
		# erzwingt SOFORT Position 0 (zu) und blockt neue Oeffnungsversuche, solange
		# eine der drei Bedingungen aktiv ist. Anders als PauseOnCondition (das nur
		# einfriert, wo immer die Position gerade ist) - siehe ts-gates-system.md.
		LockedCondition: aot-gate-locked || aot-gate-damage-lockout || aot-gate-lowpower
		OpeningSound: gateup1.aud
		ClosingSound: gatedwn1.aud
		BlocksProjectilesHeight: 768
		# Schneller wieder zu (Default waere 150 Ticks = 6s) - 2026-07-03 User-Wunsch.
		CloseDelay: 40
	# Deploy-Toggle (wie Deploy-Button): verriegelt/entriegelt das Tor manuell.
	# text2.aud = kurzer UI-Bestaetigungs-Bip (bereits an anderer Stelle im Mod als
	# Deploy-Sound verwendet, siehe aot-units.yaml Cruiser-Carrier).
	GrantConditionOnDeploy:
		DeployedCondition: aot-gate-locked
		SkipMakeAnimation: true
		Voice: Action
		DeploySounds: text2.aud
		UndeploySounds: text2.aud
	# >50% Schaden (Heavy/Critical DamageState) sperrt das Tor.
	GrantConditionOnDamageState:
		Condition: aot-gate-damage-lockout
		ValidDamageStates: Heavy, Critical
	# Low Power sperrt das Tor.
	GrantConditionOnPowerState:
		Condition: aot-gate-lowpower
		ValidPowerStates: Low, Critical
	Tooltip:
		Name: GDI Automatic Gate
	Valued:
		Cost: 500
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	Buildable:
		BuildPaletteOrder: 190
		# Sichtbar ab Age 1 (~aot-age1), baubar sobald das Science Lab steht
		# (User-Wunsch 2026-08-01) - aot-slab bleibt klartext, graut also nur aus.
		Prerequisites: ~aot-age1, aot-orbc
		Queue: Building.GDI
		Description: Automated gate for walls, opening and closing on friend-or-foe identification.
	# Footprint/Dimensions unangetastet (siehe REVERT-Historie in ts-gates-system.md,
	# der breitere Smudge steckt direkt in der Sprite-Grafik, kein WithBuildingBib mehr).
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,0,0
	# BlocksProjectiles entfaellt: Gate liefert sein eigenes IBlocksProjectiles
	# (skaliert mit Oeffnungsgrad ueber BlocksProjectilesHeight).
	# Zone Trooper hovern hier drueber wie ueber Rock/River (kein echtes Crushen,
	# kein Schaden/Zerstoerung) -- siehe AotHoverPassable.cs.
	AotHoverPassable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - NOD Gate (Laser-Barriere statt Fluegel-Tor) ===
# Baseplate + 2 Laser-Saeulen (siehe ts-gates-system.md). Kein Gitter-Mesh: die 3
# roten Laserlinien selbst SIND die Barriere (idle/damaged-idle = je 2 Frames,
# 0=zu/Laser an, 1=offen/Laser aus). Sonst 1:1 dieselbe Gate/WithGateSpriteBody-
# Mechanik wie aot-gate-gdi (Auto-Open fuer Verbuendete, Deploy-Lock, Damage-Lock,
# Low-Power-Lock). Bei Heavy/Critical-Schaden flackert der Laser zusaetzlich
# unregelmaessig (WithGateSpriteBody.FlickerIntervalMin/Max) - das Tor bleibt dabei
# ueber LockedCondition ohnehin fest zu, das Flackern ist rein optisch.
aot-gate-nod:
	Inherits: ^BaseBuilding
	-WithDeathAnimation:
	# Kein Infanterie-Spawn beim Verkaufen (User-Wunsch: niemand soll rauskommen).
	-SpawnActorsOnSell:
	# NOD-Gegenstueck der Verkaufs-Infanterie ebenfalls entfernen (siehe ^BaseBuilding oben):
	# ohne diese Zeile wuerde dieses Gebaeude bei NOD-Besitz doch Infanterie ausspucken.
	-SpawnActorsOnSell@nod:
	-WithSpriteBody:
	WithGateSpriteBody:
		# Irregulares Flackern (5-35 Ticks = 0.2-1.4s zwischen Umschaltungen) waehrend
		# Heavy/Critical-Schaden. Tor bleibt ueber LockedCondition ohnehin fest zu.
		FlickerInterval: 5, 35
		# Ambientes Schimmern im Ruhezustand (geschlossen, unbeschaedigt) - subtiler
		# Pulse wie bei der echten Laser-Fence (AotWithWallPulseBody), aber eigener
		# Mechanismus da ein Gate keine Nachbarschafts-Frames hat. FESTES statt
		# zufaelliges Intervall (User-Feedback 2026-07-04: zufaellige Abstaende
		# wirkten "ruckartig", die echte Fence pulsiert mit konstantem Takt -
		# PulseInterval:4 in AotWithWallPulseBody - das hier 1:1 uebernommen).
		ShimmerSequence: idle-shimmer
		ShimmerInterval: 4, 5
		# Kein Remap - der eigentliche Grund fuer den "Laser wird manchmal gruen/
		# orange"-Bug war NICHT die Sequenz-YAML (die von WithSpriteBody ueberhaupt
		# nicht gelesen wird), sondern der Fallback auf "player" HIER auf Trait-
		# Ebene. Siehe ts-gates-system.md fuer die volle Herleitung ueber
		# combined.frag ColorShift().
		Palette: effect
		IsPlayerPalette: false
	Gate:
		LockedCondition: aot-gate-locked || aot-gate-damage-lockout || aot-gate-lowpower
		# Laser-Turret-Schuss (NALASR/lastur1.aud aus TS, siehe ts-audio-extraction.md) -
		# eigenes NOD-Gebaeude, NICHT der Obelisk. Fuer beide Richtungen genutzt (Laser
		# "zuendet"/"erlischt"), passt thematisch besser als die GDI-Turmotor-Sounds.
		OpeningSound: lastur1.aud
		ClosingSound: lastur1.aud
		# Praktisch instantaner Wechsel (User-Wunsch 2026-07-04): anders als beim
		# GDI-Fluegeltor gibt es hier keine mehrstufige Animation, nur den 2-Frame-
		# Toggle Laser-an/aus - der Default (33 Ticks, aus der langsamen GDI-Tuer
		# geerbt) liess das Umschalten wie ein "Absenken" wirken. Mit
		# TransitionDelay:1 wird OpenPosition=1: GetGateFrame()'s Lerp(0,1,Pos,1)
		# springt in einem einzigen Tick von Frame0 auf Frame1, exakt synchron mit
		# OpeningSound/ClosingSound (die auf demselben Tick-Uebergang feuern).
		TransitionDelay: 1
		BlocksProjectilesHeight: 768
		# Deutlich schnelleres Wiederschliessen (User-Wunsch 2026-07-04): 40 -> 6 Ticks.
		CloseDelay: 6
	GrantConditionOnDeploy:
		DeployedCondition: aot-gate-locked
		SkipMakeAnimation: true
		Voice: Action
		DeploySounds: text2.aud
		UndeploySounds: text2.aud
	GrantConditionOnDamageState:
		Condition: aot-gate-damage-lockout
		ValidDamageStates: Heavy, Critical
	GrantConditionOnPowerState:
		Condition: aot-gate-lowpower
		ValidPowerStates: Low, Critical
	Tooltip:
		Name: NOD Gate
	Valued:
		Cost: 750
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	Buildable:
		BuildPaletteOrder: 220
		# Sichtbar ab Age 2 (User-Wunsch 2026-08-01, vorher Age 1), aber ausgegraut bis das
		# Laser Technologies Upgrade steht - passt thematisch, da das Tor selbst eine
		# Laser-Barriere ist. aot-laser-fence-upgrade = ProvidesPrerequisite-String
		# von aot-upgrade-laser-fence (siehe dort).
		Prerequisites: ~aot-age2, aot-laser-fence-upgrade
		Queue: Building.Nod
		Description: Fortified gate. Laser-Barriere statt Fluegel.
	Building:
		Footprint: xx ==
		Dimensions: 2,2
		LocalCenterOffset: 0,0,0
	# Zone Trooper hovern hier drueber wie ueber Rock/River (kein echtes Crushen,
	# kein Schaden/Zerstoerung) -- siehe AotHoverPassable.cs.
	AotHoverPassable:
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - FTUR Flame Tower (RA-Import, NOD Age 0) ===
# User-Wunsch 2026-07-04: NOD-Verteidigung neu gestaffelt - Age 0 = importierter
# RA Flame Tower (dieser Aktor), Age 1 = Standard-GUN-Turm (siehe oben), ab Laser
# Defense Systems-Upgrade wechselt GUN zusaetzlich auf Laser. Stats/Weapon 1:1 von
# RA's FTUR uebernommen (engine/mods/ra/rules/structures.yaml), Sprites aus
# TEXTURES_RA_SRGB.MEG extrahiert + umgepackt (siehe aot-sequences.yaml). Custom-
# Sprite ohne verifizierten "dead"-Rubble-Frame -> WithDeathAnimation entfernt
# (siehe building-dead-sequence-crash.md).
# Hybrid-Idee (GUN-Fundament + eigenes Turret-Stueck) WIEDER VERWORFEN (2026-07-04)
# - zurueck zum kompletten Original-RA-Sprite (Turreted bleibt wie im RA-Original:
# NUR interne Zielausrichtung, KEIN WithSpriteTurret, keine sichtbare Rotation).
# Toxic Tower Umschaltung (2026-07-04, Toxic-Upgrade-Konsolidierung): ab
# aot-toxic-upgrade (siehe aot-upgrade-e4-toxic) wechselt die Waffe auf
# aot-FturToxic (Chemspray-Basis, wie E4/TTNK). Sprite bleibt vorerst unveraendert
# (kein neues Toxic-Tower-Asset vorhanden) - nur Name+Waffe wechseln.
aot-ftur:
	# Editor-Checkbox "Requires power" (Default an, wie aot-tesla/ATWR): aus = voellig
	# stromunabhaengig (Neutral-/Deko-Platzierung ohne Kraftwerk).
	AotOptionalPower:
		Condition: aot-power-required
	Power:
		RequiresCondition: aot-power-required
	# ^BaseBuilding -> ^Support gewechselt (2026-07-04, User-Fund: "Stop" und
	# "Waypoint Mode"-Buttons fehlen im Vergleich zu GUN). Ursache:
	# CommandBarBlacklist (auf ^Building, versteckt per Default GENAU diese beiden
	# Buttons: DisableStop=true, DisableWaypointMode=true) wird nur durch ^Support
	# entfernt (-CommandBarBlacklist:), nicht durch das einfachere ^BaseBuilding.
	# GUN erbt ^Support bereits (engine-nativ) - FTUR jetzt ebenso, bringt als Bonus
	# auch RenderRangeCircle/RenderDetectionCircle (Angriffsreichweite sichtbar,
	# wie bei anderen Verteidigungsgebaeuden) und -GivesBuildableArea/
	# -AcceptsDeliveredCash (korrekt fuer eine reine Verteidigungsstruktur).
	Inherits: ^Support
	# Fehlte bisher (User-Fund 2026-07-04: "Weapon hat noch kein STOP command",
	# Turm feuert nach Force-Attack-Ground unbeendet weiter) - RA-Original UND GUN
	# haben beide ^AutoTargetGround (GUN via Inherits@AUTOTARGET, siehe engine/mods/
	# cnc/rules/structures.yaml), das war bei uns schlicht vergessen.
	Inherits@AUTOTARGET: ^AutoTargetGround
	-WithDeathAnimation:
	-Tooltip:
	Tooltip@normal:
		Name: Flame Tower
		RequiresCondition: !aot-ftur-toxic
	Tooltip@toxic:
		Name: Toxic Tower
		RequiresCondition: aot-ftur-toxic
	Valued:
		Cost: 600
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	# Kein eigenes Buildable mehr (2026-07-04): war nur direkt in dieser Datei
	# definiert (nicht geerbt) - "-Buildable:" waere hier ein Fehler ("nothing to
	# remove", derselbe Bug wie zuvor beim Armament, siehe toxic-upgrade-system.md).
	# Proxy-Pattern fuer Bau-Icon-Wechsel nach dem Toxic-Upgrade (aot-ftur-flame/
	# aot-ftur-toxic unten, 1:1 das GUN/E4-Muster) liefert das Buildable jetzt.
	Building:
		Footprint: x
		Dimensions: 1,1
	# Sicht muss mit der Napalm-Reichweite mitwachsen, sonst sieht der Turm seine eigenen Ziele
	# nicht mehr (AutoTarget sucht nur im Sichtbereich) und feuert nur auf fremd-aufgeklaertes.
	RevealsShroud:
		MinRange: 5c0
		Range: 6c0
		RequiresCondition: !aot-ftur-napalm
	RevealsShroud@napalm:
		MinRange: 5c0
		Range: 8c0
		RequiresCondition: aot-ftur-napalm
	Turreted:
		TurnSpeed: 512
		Offset: 0,0,112
	# Toxic braucht BEIDES: Nitro Napalm UND das fraktionsweite Toxic-Upgrade.
	# GrantConditionOnPrerequisite.Prerequisites ist selbst schon eine UND-Liste
	# (TechTree.HasPrerequisites -> .All(...)), die Kombination geht also direkt hier.
	# E4/TTNK bleiben unveraendert am reinen aot-toxic-upgrade -- nur FTUR ist gegated.
	GrantConditionOnPrerequisite@TOXIC:
		Condition: aot-ftur-toxic
		Prerequisites: aot-nitro-napalm-upgrade, aot-toxic-upgrade
	# Menue-Token fuer den Proxy-Wechsel (flame <-> toxic). Muss von einem Aktor kommen,
	# der WIRKLICH auf der Karte steht: GrantConditionOnPrerequisite registriert sich erst
	# in INotifyAddedToWorld, auf einem Upgrade-Aktor feuert das nicht.
	ProvidesPrerequisite@TOXICREADY:
		Prerequisite: aot-ftur-toxic-ready
		RequiresCondition: aot-ftur-toxic
	# Turret-Upgrade verdraengt den Flammenturm nicht nur aus dem Baumenue, sondern baut
	# ALLE bereits stehenden FTURs in Gun Turrets um (User-Wunsch 2026-07-27).
	# Gleicher Trait wie beim Devil's-Tongue-Umbau des TTNK; Footprints sind identisch
	# (beide 1x1 "x"), der Turm steht danach also exakt auf derselben Zelle.
	# Greift nur fuer Spieler MIT dem Upgrade -- map-platzierte FTURs von Creeps/Neutral
	# bleiben unangetastet, da Prerequisites pro Spieler ausgewertet werden.
	# IntoActor ist BEWUSST aot-gun-base und nicht der Vanilla-Aktor "gun": funktional sind beide
	# identisch (aot-gun-base = "Inherits: GUN" + eigenes Bau-Icon/Buildable, gleiches Sprite),
	# aber nur aot-gun-base steht in der GunTypes-Liste der KI (aot-ai.yaml). Mit "gun" war der
	# umgebaute Turm fuer den Base-Builder ein voellig unbekannter Aktor -> RebuildScan hielt den
	# FTUR-Slot fuer zerstoert, baute daneben einen VIERTEN Turm, und der Soll/Ist-Watchdog zaehlte
	# den umgebauten Turm gar nicht erst mit (User-Fund 2026-08-02, Screenshots aller Cabal-Basen).
	AotTransformOnPrerequisite:
		IntoActor: aot-gun-base
		Prerequisites: aot-turret-upgrade
	# Nitro Napalm: mehr Waffenreichweite (5c0 -> 6c5) und passend erweiterte Sicht.
	# RangeMultiplier ist ein eigenstaendiger Modifier-Trait (kein AttackBase-Abkoemmling),
	# daher gefahrlos -- gleiches Muster wie das Guard-Tower-Upgrade der Pillbox.
	GrantConditionOnPrerequisite@NAPALM:
		Condition: aot-ftur-napalm
		Prerequisites: aot-nitro-napalm-upgrade
	RangeMultiplier@NAPALM:
		RequiresCondition: aot-ftur-napalm
		Modifier: 130
	Armament@flame:
		Name: primary
		Weapon: aot-FturFlame
		LocalOffset: 512,0,0
		RequiresCondition: !aot-ftur-toxic
	Armament@toxic:
		Name: toxic
		Weapon: aot-FturToxic
		LocalOffset: 512,0,0
		RequiresCondition: aot-ftur-toxic
	# Live-Sprite-Wechsel (2026-07-05, User-Fund: bereits gebaute Flame Tower
	# aendern nach dem Upgrade nicht ihr Aussehen). "-WithSpriteBody:" entfernt
	# das von ^Building GEERBTE (nicht lokal definierte, also legitime "-X:") Default
	# und ersetzt es durch zwei conditional Instanzen - 1:1 TTNKs
	# WithFacingSpriteBody@flame/@toxin-Pattern (siehe ttnk-system.md), nur ohne
	# Facing (Gebaeude). "toxic-idle"/"damaged-toxic-idle" liegen im SELBEN Image
	# "aot-ftur" (siehe aot-sequences.yaml) - der Damage-State-Wechsel passiert
	# automatisch ueber RenderSprites.NormalizeSequence's "damaged-"-Praefix-
	# Konvention, solange "damaged-toxic-idle" existiert.
	-WithSpriteBody:
	# Drei Sprite-Zustaende (2026-07-27): normal -> Nitro Napalm (schwarze Tanks) ->
	# Toxic (gruene Tanks). Toxic setzt Napalm voraus, die Bedingungen sind trotzdem
	# explizit ausformuliert, damit kein Zustand doppelt rendert.
	WithSpriteBody@flame:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-ftur-napalm && !aot-ftur-toxic
	WithSpriteBody@napalm:
		Sequence: napalm-idle
		Name: body-napalm
		RequiresCondition: aot-ftur-napalm && !aot-ftur-toxic
	# Bau-Animation muss ALLE drei Bodies kennen, sonst baut ein FTUR im Napalm- oder
	# Toxic-Zustand ohne Animation (WithMakeAnimation.BodyNames defaultet auf nur "body",
	# der ist dann deaktiviert -> Forward() findet keinen aktiven Body und kehrt zurueck).
	# Mehrere Namen sind ungefaehrlich: Forward()/Reverse() waehlen per
	# FirstEnabledConditionalTraitOrDefault() GENAU EINEN aktiven Body aus.
	WithMakeAnimation:
		BodyNames: body, body-napalm, body-toxic
	WithSpriteBody@toxic:
		Sequence: toxic-idle
		Name: body-toxic
		RequiresCondition: aot-ftur-toxic
	AttackTurreted:
		PauseOnCondition: build-incomplete
		# KRITISCH (Crash-Fix Runde 5, 2026-07-05, User-Fund "Toxic Turret kann
		# nicht angreifen"): AttackBaseInfo.Armaments (Whitelist der genutzten
		# Armament-NAMEN) defaultet auf ["primary","secondary"] (AttackBase.cs:28).
		# Armament@toxic traegt den Namen "toxic" - nicht in der Default-Liste -
		# und wurde daher von AttackTurreted komplett ignoriert, sobald die Toxic-
		# Bedingung aktiv war. Kein Crash, keine Fehlermeldung, das Gebaeude griff
		# einfach nie an (identischer Bug wie beim GUN-Laser, siehe gun-turret-
		# system.md Runde 5). Muss explizit in die Armaments-Liste.
		Armaments: primary, toxic
		# Versuchsweiser Fix (2026-07-04, User-Report: Stop stoppt Force-Attack-Ground
		# nicht, auch ohne Feind in der Naehe). PersistentTargeting=true (Engine-
		# Default) laesst AttackFollow.OnLastRun() das gerade beendete Ziel als
		# "OpportunityTarget" weiterverfolgen, sobald die Attack-Activity natuerlich
		# ausklingt - Stop selbst loescht zwar explizit beide Ziel-Felder
		# (AttackFollow.OnStopOrder), aber die genaue Ursache des gemeldeten
		# Verhaltens konnte per Code-Lesen nicht zweifelsfrei bestaetigt werden.
		# Deaktivieren als risikoarme Massnahme, braucht In-Game-Verifikation.
		PersistentTargeting: false
	DetectCloaked:
		Range: 5c0
	Power:
		Amount: -20
	FireWarheadsOnDeath:
		Weapon: BuildingExplode
		EmptyWeapon: BuildingExplode

# Proxy-Aktoren fuer den Bau-Icon-Wechsel (User-Icons, 2026-07-04), 1:1 das GUN/E4-
# Muster: beide bauen denselben "aot-ftur", nur welches Icon/welche Beschreibung im
# Baumenue erscheint unterscheidet sich je nach Toxic-Upgrade-Stand.
aot-ftur-flame:
	Inherits: aot-ftur
	RenderSprites:
		Image: aot-ftur
	Buildable:
		# ShowWhenLocked ist per Default TRUE (BuildableInfo.cs) -- nach dem Turret-Upgrade wird
		# die GESAMTE Gruppe aot-grp-ftur unbaubar (~!aot-turret-upgrade auf beiden Proxies), und
		# ohne expliziten False-Wert bleibt der Slot als totes Platzhalter-Icon stehen (User-Fund
		# 2026-08-01). Identischer Fall wie bei aot-gun-base/-laser weiter oben.
		ShowWhenLocked: False
		LockedGroup: aot-grp-ftur
		BuildPaletteOrder: 100
		Prerequisites: barracks, ~!aot-turret-upgrade, ~!aot-ftur-toxic-ready
		Queue: Building.Nod
		Description: RA Flame Tower. Short-range anti-infantry/vehicle defense.

aot-ftur-toxic:
	Inherits: aot-ftur
	# Gruen recolorierte Gas-Tanks liegen als "toxic-idle"/"damaged-toxic-idle"
	# im SELBEN Image "aot-ftur" (2026-07-05, Korrektur - siehe aot-structures.yaml
	# WithSpriteBody@flame/@toxic weiter oben + aot-sequences.yaml). Ein separates
	# RenderSprites.Image (erster Versuch) haette bereits gebaute Flame Tower nach
	# dem Upgrade NICHT retroaktiv umgefaerbt, da Image sich zur Laufzeit nicht per
	# Condition wechseln laesst - der Condition-Switch auf aot-ftur selbst tut das.
	RenderSprites:
		Image: aot-ftur
	Buildable:
		# Siehe aot-ftur-flame: ohne ShowWhenLocked False bleibt nach dem Turret-Upgrade ein
		# totes Platzhalter-Icon der Gruppe aot-grp-ftur im Baumenue stehen.
		ShowWhenLocked: False
		LockedGroup: aot-grp-ftur
		BuildPaletteOrder: 100
		Prerequisites: barracks, ~!aot-turret-upgrade, ~aot-ftur-toxic-ready
		Queue: Building.Nod
		Icon: toxic-icon
		Description: RA Flame Tower upgraded with toxic weaponry. Short-range anti-infantry/vehicle defense.
	-Tooltip@normal:
	-Armament@flame:
	-WithSpriteBody@flame:
	-WithSpriteBody@napalm:
	Tooltip@toxic:
		RequiresCondition: aot-ftur-toxic || !aot-ftur-toxic
	Armament@toxic:
		RequiresCondition: aot-ftur-toxic || !aot-ftur-toxic
	WithSpriteBody@toxic:
		RequiresCondition: aot-ftur-toxic || !aot-ftur-toxic

# === Age of Tiberium (aotmod) - NOD Verteidigungs-Zweig ab Age 1 (2026-07-27) ===
# Zwei sich GEGENSEITIG AUSSCHLIESSENDE Upgrades (Branch-Paar wie Airstrike/Spyplane):
#   Nitro Napalm -> FTUR bleibt und wird besser (mehr Reichweite), Tor zum spaeteren Toxic Tower.
#   Turret       -> schaltet das GUN erst frei, verdraengt dafuer den FTUR, Tor zum Laser Turret.
# Vor Age 1 ist NUR der FTUR da (wie bisher, ab barracks); das GUN ist ohne Turret-Upgrade
# ueberhaupt nicht mehr baubar.
# LockedGroup: beide teilen sich EINEN Platzhalter-Slot, sonst zeigt das C&C3-Icon-System zwei
# Platzhalter fuer eine Entscheidung, von der sich nur eine je materialisieren kann.
aot-upgrade-ftur-napalm:
	Tooltip:
		Name: Nitro Napalm
	Buildable:
		ShowWhenLocked: False
		LockedGroup: aot-grp-up-noddefense
		BuildPaletteOrder: 110
		Prerequisites: ~aot-age1, barracks, ~!aot-turret-upgrade
		Queue: Upgrade.Nod
		BuildLimit: 1
		Description: Nitro-enriched napalm for the Flame Tower - longer reach, and the base for later toxic conversion. Rules out the Turret.
	Valued:
		Cost: 750
	RenderSprites:
		Image: aot-ftur
	ProvidesPrerequisite:
		Prerequisite: aot-nitro-napalm-upgrade
	Interactable:

aot-upgrade-turret:
	Tooltip:
		Name: Turret
	Buildable:
		ShowWhenLocked: False
		LockedGroup: aot-grp-up-noddefense
		BuildPaletteOrder: 115
		Prerequisites: ~aot-age1, lite, ~!aot-nitro-napalm-upgrade
		Queue: Upgrade.Nod
		BuildLimit: 1
		Description: Unlocks the Gun Turret and the later Laser Turret. Rules out the Flame Tower.
	Valued:
		Cost: 750
	RenderSprites:
		Image: gun
	ProvidesPrerequisite:
		Prerequisite: aot-turret-upgrade
	Interactable:
# === Ende aotmod ===

# === Oil Pump (ARCO) UND Oil Derrick (V19): beide lassen beim Zerstoeren eine
# 1000-Credits-Kiste in einer ZUFAELLIGEN, passierbaren Nachbarzelle fallen.
# Der custom Trait AotDropActorOnDeath waehlt aus den umliegenden Zellen zufaellig
# eine, in die der Crate wirklich hineinpasst (passierbares Terrain + frei).
# Der jeweils bestehende (unbenannte) SpawnActorOnDeath fuer den Husk bleibt
# unangetastet. ===
ARCO:
	AotDropActorOnDeath:
		Actor: OILCRATE1000
		Range: 1
		OwnerType: InternalName
		InternalOwner: Neutral
	# Eingenommene Oil Pump erweitert die Bauzone ihres Besitzers (an aktuellen Owner gebunden).
	GivesBuildableArea:
		AreaTypes: building

V19:
	# Einkommen erhoeht 10 -> 25 (User-Wunsch 2026-07-27).
	# Tickrate halbiert (User-Wunsch 2026-08-01): Interval war nie gesetzt und lief damit auf dem
	# Engine-Default von 50 Ticks = alle 2 Sekunden bei Standard-Timestep (40ms), nicht 1x/Sekunde.
	# 100 Ticks = alle 4 Sekunden -> effektives Einkommen halbiert (25/2s -> 25/4s).
	CashTrickler:
		Amount: 25
		Interval: 100
		RequiresCondition: enabled
	AotDropActorOnDeath:
		Actor: OILCRATE1000
		Range: 1
		OwnerType: InternalName
		InternalOwner: Neutral
	# Eingenommener Oil Derrick erweitert die Bauzone seines Besitzers (an aktuellen Owner gebunden).
	GivesBuildableArea:
		AreaTypes: building

# 1000-Credits-Geldkiste, die die Oil Pump beim Tod hinterlaesst.
OILCRATE1000:
	Inherits: ^Crate
	Tooltip:
		Name: meta-crate.name
	GiveCashCrateAction:
		Amount: 1000
		UseCashTick: true
	RenderSprites:
		Image: wcrate

# === Ore Refinery (RA-Remaster PROC): nicht-baubares Zivilgebaeude ===
# - Nur ueber den Karteneditor platzierbar (kein Buildable), erbt ^TechBuilding
#   -> von einem Engineer einnehmbar (CaptureTypes "building").
# - Bei Einnahme einmalig 2500 Credits als Pauschale (GivesCashOnCapture) - im
#   Gegensatz zum Oil Derrick (V19), der per CashTrickler laufend Credits gibt.
# - Beim Zerstoeren faellt dieselbe aufsammelbare 1000-Credits-Kiste wie bei
#   Oil Pump/Derrick (AotDropActorOnDeath -> OILCRATE1000).
# - KEIN Husk/Rubble-Frame im RA-Sprite gebacken -> bewusst kein SpawnActorOnDeath.
#   ^CivBuilding/^TechBuilding erben KEIN WithDeathAnimation (nur ^BaseBuilding hat
#   das), daher tritt der "dead"-Sequenz-Crash hier NICHT auf.
OREREF:
	Inherits: ^TechBuilding
	Inherits@shape: ^3x2Shape
	Selectable:
		Bounds: 3072, 2560
	Building:
		Footprint: xxx xxx
		Dimensions: 3,2
	Health:
		HP: 90000
	RevealsShroud:
		Range: 4c0
	Tooltip:
		Name: Ore Refinery
	GivesCashOnCapture:
		Amount: 2500
	# Eingenommene Ore Refinery erweitert die Bauzone ihres Besitzers (an aktuellen
	# Owner gebunden; Neutral baut nicht -> neutrale Refinery gibt keine Zone).
	GivesBuildableArea:
		AreaTypes: building
	AotDropActorOnDeath:
		Actor: OILCRATE1000
		Range: 1
		OwnerType: InternalName
		InternalOwner: Neutral

