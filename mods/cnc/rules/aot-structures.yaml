	# Age 1 Basis (kein Upgrade): Mine Cluster Missile — automatisch verfügbar sobald MSLO steht.
	# 10 aot-minp Anti-Personen-Minen im selben Streukreis wie Tiberium Missile, kein Sofortschaden.
