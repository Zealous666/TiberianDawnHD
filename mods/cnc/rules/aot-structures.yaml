	SupportPowerChargeBar:
		Power: AotMigAirstrikeOrder
		RequiresCondition: aot-nod-airstrike-active && !aot-nod-banshee-active
	# === Age of Tiberium (aotmod) - NOD Banshee-Airstrike-Superpower (Age-3-Folge des MiG-Airstrike) ===
	# Ersetzt den MiG-Airstrike (siehe !aot-nod-banshee-active oben). Custom AotAirstrikePower
	# (Multi-Pass) wie beim MiG, aber 3 Banshees (SquadSize 3) statt 2 MiGs, je 2 Anflüge.
	# Freigeschaltet durch das Banshee-Airstrike-Upgrade (nur auf dem MiG-Pfad, Age 3 + Temple).
	GrantConditionOnPrerequisite@banshee:
		Condition: aot-nod-banshee-active
		Prerequisites: aot-nod-banshee-upgrade
	AotAirstrikePower@banshee:
		OrderName: AotBansheeAirstrikeOrder
		RequiresCondition: aot-nod-banshee-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-banshee
		ChargeInterval: 7500
		SquadSize: 3
		Passes: 2
		QuantizedFacings: 8
		Name: Banshee Airstrike
		Description: Three Banshee fighters make two attack passes, each firing three plasma salvos that leave toxic gas clouds.
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		IncomingSpeechNotification: EnemyPlanesApproaching
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		IncomingTextNotification: notification-enemy-planes-approaching
		UnitType: aot-banshee
		DisplayBeacon: True
		BeaconPoster: aot-poster-banshee
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		CameraActor: camera
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: airstrikedirection
		SupportPowerPaletteOrder: 13
	SupportPowerChargeBar@banshee:
		Power: AotBansheeAirstrikeOrder
		RequiresCondition: aot-nod-banshee-active
	# === Age of Tiberium (aotmod) - NOD Spy-Plane-Superpower (Alternative zu Airstrike) ===
	# Exakter Nachbau der RA-Soviet-Spy-Plane (AirstrikePower@spyplane): EIN Yak fliegt einen
	# Aufklärungs-Überflug (keine Waffe), CameraActor deckt den Zielbereich auf. Freigeschaltet
	# durch das Spy-Plane-Upgrade — schließt das Airstrike-Upgrade aus (entweder/oder).
	# Stock AirstrikePower (Single-Pass, wie in RA), NICHT AotAirstrikePower.
	GrantConditionOnPrerequisite@spyplane:
		Condition: aot-nod-spyplane-active
		Prerequisites: aot-nod-spyplane-upgrade
	AirstrikePower@spyplane:
		# Eindeutiger OrderName — spyplane und parabombs sind beide AirstrikePower und würden sonst
		# denselben Default-Key ("AirstrikePowerOrder") teilen → Palette zeigt Icon/Tooltip der Spy Plane.
		OrderName: AotSpyPlaneOrder
		# Verschwindet, sobald das Parabombs-Upgrade gekauft ist — Parabombs ERSETZT die Spy Plane.
		RequiresCondition: aot-nod-spyplane-active && !aot-nod-parabombs-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-spyplane
		ChargeInterval: 7500
		QuantizedFacings: 8
		Name: Spy Plane
		Description: A Yak recon plane flies over the target area and reveals it for a short time.
		EndChargeSpeechNotification: SpyPlaneReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		UnitType: aot-yak
		CameraActor: aot-camera-spyplane
		# 20 Sekunden Aufklaerung (User-Wunsch 2026-08-05): 150 -> 500 Ticks. Gilt fuer Schleier-
		# Reveal UND Tarnungs-Erkennung (DetectCloaked auf aot-camera-spyplane). Parabombs teilt
		# sich die Kamera, behaelt aber seine kurze 150-Tick-Sicht.
		CameraRemoveDelay: 500
		DisplayBeacon: True
		BeaconPoster: aot-poster-spyplane
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: airstrikedirection
		SupportPowerPaletteOrder: 11
	SupportPowerChargeBar@spyplane:
		Power: AotSpyPlaneOrder
		RequiresCondition: aot-nod-spyplane-active && !aot-nod-parabombs-active
	# === Age of Tiberium (aotmod) - NOD Parabombs-Superpower (Age-3-Folge der Spy Plane) ===
	# Nachbau der RA-Parabomb-Power (stock AirstrikePower, Single-Pass): 1 Badger-Bomber fliegt
	# ins Ziel, wirft 5 toxische Fallschirmbomben (aot-badr + aot-Parabomb) und dreht ab.
	# Freigeschaltet durch das Parabombs-Upgrade (nur nach Spy Plane + Age 3 + Toxic).
	GrantConditionOnPrerequisite@parabombs:
		Condition: aot-nod-parabombs-active
		Prerequisites: aot-nod-parabombs-upgrade
	AirstrikePower@parabombs:
		OrderName: AotParabombsOrder
