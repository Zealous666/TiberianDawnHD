# === Age of Tiberium (aotmod) - Shipyard (aot-shipyard) ===
# Wasser-Gebäude (TerrainTypes: Water). Basis ^BaseBuilding (CnC-Standard),
# überschrieben für Wasserplatzierung: AreaTypes building bleibt, Adjacent 8
# damit das nahe Wasser von Land-Buildable-Area aus erreicht wird.
# GivesBuildableArea entfernt → erweitert die Bauzone nicht aufs Wasser.
aot-shipyard:
	Inherits: ^BaseBuilding
	Tooltip:
		Name: Shipyard
	Valued:
		Cost: 1000
	Health:
		HP: 80000
	Buildable:
		BuildPaletteOrder: 35
		Prerequisites: lite
		Queue: Building.GDI
		Icon: aot-shipyard-icon
		Description: Naval production facility.
	Targetable:
		TargetTypes: Ground, Water, C4, Structure
	Building:
		Footprint: XXX xxx XXX
		Dimensions: 3,3
		TerrainTypes: Water
	RequiresBuildableArea:
		AreaTypes: building
		Adjacent: 8
	-GivesBuildableArea:
	-SpawnActorsOnSell:
	RevealsShroud:
		Range: 4c0
	ProvidesPrerequisite@buildingname:
	RallyPoint:
	CommandBarBlacklist:
		DisableStop: false
	Exit@1:
		SpawnOffset: 0,-213,0
		Facing: 384
		ExitCell: -1,2
	Exit@2:
		SpawnOffset: 0,-213,0
		Facing: 640
		ExitCell: 3,2
	Exit@3:
		SpawnOffset: 0,0,0
		Facing: 128
		ExitCell: 0,0
	Exit@4:
		SpawnOffset: 0,0,0
		Facing: 896
		ExitCell: 2,0
	RepairsUnits:
		HpPerStep: 1000
		Interval: 15
		PlayerExperience: 5
		StartRepairingNotification: Repairing
		StartRepairingTextNotification: notification-repairing
	Production:
		Produces: Naval.GDI
	ProductionQueue:
		Type: Naval.GDI
		Group: Naval
		DisplayOrder: 5
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar:
		ProductionType: Naval.GDI
	RenderSprites:
		Image: aot-shipyard
	WithSpriteBody:
		Sequence: idle
		Name: body
	WithMakeAnimation:
		Condition: build-incomplete
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place
		SequenceAlpha: 0.65
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Submarine Pen (aot-subpen) — NOD-Pendant zur Werft ===
