		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-ts-make
	WithIdleOverlay@tsblink:
		Sequence: aot-ts-blink
		RequiresCondition: aot-age2-active && !build-incomplete
	# --- Superpower-Struktur (Stand 2026-07-02) ---
	# Age 1 Basis (kein Upgrade): Mine Cluster Missile — automatisch verfügbar sobald MSLO steht.
	# 10 aot-minp Anti-Personen-Minen im selben Streukreis wie Tiberium Missile, kein Sofortschaden.
