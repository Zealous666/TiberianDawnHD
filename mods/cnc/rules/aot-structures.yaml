	# === Age of Tiberium (aotmod) - NOD Parabombs-Superpower (Age-3-Folge der Spy Plane) ===
	# Nachbau der RA-Parabomb-Power (stock AirstrikePower, Single-Pass): 1 Badger-Bomber fliegt
	# ins Ziel, wirft 5 toxische Fallschirmbomben (aot-badr + aot-Parabomb) und dreht ab.
	# Freigeschaltet durch das Parabombs-Upgrade (nur nach Spy Plane + Age 3 + Toxic).
	GrantConditionOnPrerequisite@parabombs:
		Condition: aot-nod-parabombs-active
		Prerequisites: aot-nod-parabombs-upgrade
	AirstrikePower@parabombs:
		OrderName: AotParabombsOrder
		RequiresCondition: aot-nod-parabombs-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		Icon: aot-parabombs
		ChargeInterval: 7500
		QuantizedFacings: 8
		SquadSize: 1
		SquadOffset: 1792,1792,0
		Name: Parabombs
		Description: A heavy bomber flies over the target area and drops five toxic parabombs, each leaving a lingering gas cloud.
		EndChargeSpeechNotification: AirstrikeReady
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeTextNotification: notification-airstrike-ready
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		UnitType: aot-badr
		CameraActor: aot-camera-spyplane
		CameraRemoveDelay: 150
		DisplayBeacon: True
		BeaconPoster: airstrike
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		UseDirectionalTarget: True
		DirectionArrowAnimation: airstrikedirection
		SupportPowerPaletteOrder: 12
	SupportPowerChargeBar@parabombs:
		RequiresCondition: aot-nod-parabombs-active
	RenderSprites:
		Image: stec
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: aot-td-idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithSpriteBody@ts:
		Sequence: stec-ts-idle
		Name: body-ts
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active
	WithIdleOverlay@tsremap:
		Sequence: stec-ts-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active
	WithIdleOverlay@lights:
		Sequence: stec-ts-lights
