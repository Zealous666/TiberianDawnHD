# Stellt aot-atec bereit → schaltet HTNK Dual-Railgun Upgrade sichtbar; stellt atec (Tech-Gate) für ORBC/Ion Cannon Strike bereit.
ATEC:
	Inherits: ^BaseBuilding
	Inherits@IDISABLE: ^DisabledOverlay
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `atec` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Tooltip:
		Name: Tech Center
	Production@UPGRADEGDI:
		Produces: Upgrade.GDI
		MoveIntoWorld: false
	AotOpensProductionTabOnSelection:
		Group: Upgrade
	ProductionQueue@UpgradeGDI:
		Type: Upgrade.GDI
		Factions: gdi
		Group: Upgrade
		ReadyAudio: ConstructionComplete
		ReadyTextNotification: notification-construction-complete
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Valued:
		Cost: 1500
	Health:
		HP: 60000
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	ProvidesPrerequisite:
		Prerequisite: aot-atec
	ProvidesPrerequisite@techname:
		Prerequisite: atec
	ProvidesRadar:
		RequiresCondition: !lowpower
	RevealsShroud:
		Range: 5c0
	WithBuildingBib:
	SpawnActorsOnSell:
		ActorTypes: e1, e1, c2
	Power:
		Amount: -200
	GrantConditionOnPrerequisite@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	GrantConditionOnPrerequisite@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	RenderSprites:
		Image: atec
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: aot-td-idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithSpriteBody@ts:
		Sequence: atec-ts-idle
		Name: body-ts
		# KRITISCH: ohne expliziten Wert faellt RenderSprites.Add() auf "player" zurueck ->
		# PlayerColorShift verschiebt jeden Pixel im entsprechenden Farbton zur Spielerfarbe.
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active
	WithIdleOverlay@remap:
		Sequence: atec-ts-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active
	# Kuppel: eigene pulsierende Player-Color-Sequenz (16 Helligkeitsstufen, Cosinus-Puls
	# ueber 24 Frames), analog Secret Shrine Spitze - ersetzt die alte fixe Lichter-Animation.
	WithIdleOverlay@domepulse:
		Sequence: atec-ts-dome-pulse
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: aot-td-make
		RequiresCondition: aot-age1-active && !aot-age2-active
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: atec-ts-make
		RequiresCondition: aot-age2-active
# === Ende aotmod ===


