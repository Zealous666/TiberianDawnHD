# === Iron Dome (Soviet RA): neutral-capturable Struktur mit Iron-Dome-Superpower ===
# Sprite: IRON.ZIP (Remaster, TEXTURES_RA_SRGB.MEG), 8 Idle-Frames.
# Buildphase: IRONMAKE.ZIP (4 Frames), wird als make-Sequenz verwendet.
# Kein WithDeathAnimation (kein "dead"-Frame im Sprite) -> -WithDeathAnimation: notwendig.
# Nur ueber den Karteneditor platzierbar (kein Buildable).
# Nach Einnahme: AotIronDomePower macht alle eigenen Einheiten+Gebaeude 1 Minute unzerstoerbar.
aot-iron-dome:
	Inherits: ^TechBuilding
	Inherits@shape: ^2x2Shape
	Selectable:
		Bounds: 2048, 2048
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 50000
	Tooltip:
		Name: actor-aot-iron-dome.name
	MapEditorData:
		Categories: Civilians
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	RevealsShroud:
		Range: 4c0
	AotIronDomePower:
		OrderName: AotIronDomePower
		Description: actor-aot-iron-dome.description
		Icon: aot-iron-dome
		ChargeInterval: 15000
		BeginChargeSound: aot-eva-ironcurtain-charging.wav
		GlobalActivationSound: aot-ironcur9.wav
		SupportPowerPaletteOrder: 70
	# ExternalCondition + Overlay/DamageMultiplier fuer den Aktor selbst
	# (nicht ^TechBuilding, erbt kein ^Building in der Iron-Dome-Version dieser Traits
	# da ^TechBuilding -> ^CivBuilding -> ^BaseBuilding, aber NICHT ^Building-override.
	# Sicherheitshalber direkt am Aktor nochmals definieren.)
	ExternalCondition@AOTIRONDOME:
		Condition: aot-iron-dome
	WithColoredOverlay@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
	DamageMultiplier@AOTIRONDOME:
		RequiresCondition: aot-iron-dome
		Modifier: 0
	TimedConditionBar@AOTIRONDOME:
		Condition: aot-iron-dome

# === Civilian Hospital (TD): neutral-capturable Struktur mit Heal-Superpower ===
# HOSP existiert in der Engine bereits vollstaendig (engine/mods/cnc/rules/tech.yaml) inkl.
# fertig kalibrierter Remaster-Sprites (structures-overrides.yaml, RemasteredOffset: 0,-11) -
# im Gegensatz zum Tesla Coil (RA-Import) reicht hier ein einfaches "Inherits: HOSP", kein
# Sprite-/Sound-Import noetig.
# Nach Einnahme: AotHealAlliesPower ("Care under Fire") heilt alle eigenen+verbuendeten
# Einheiten (kein Gebaeude, kein Ziel-Cursor - analog AotIronDomePower) sofort auf volle HP.
# 5min Cooldown = 7500 Ticks (5*60*25 bei 25 tps).
# TooltipDescription@ally/@other entfernt: HOSP's Original-Text bewirbt TD-Vanilla-Selfheal
# fuer Infanterie, die es in diesem Mod nie gab (reiner Flavor-Text) - mit der neuen Superpower
# waere er irrefuehrend.
aot-hospital:
	Inherits: HOSP
	# RenderSprites.Image faellt ohne expliziten Wert auf den Aktornamen zurueck ("aot-hospital"
	# statt "hosp") - die Sequenzen liegen aber unter dem Image-Namen "hosp" (structures-
	# overrides.yaml). Muss explizit gesetzt werden, sonst "Image has no sequences" (check-yaml).
	RenderSprites:
		Image: hosp
	Tooltip:
		Name: actor-aot-hospital.name
	-TooltipDescription@ally:
	-TooltipDescription@other:
	MapEditorData:
		Categories: Civilians
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	RevealsShroud:
		Range: 4c0
	AotHealAlliesPower:
		OrderName: AotHealAlliesPower
		Description: actor-aot-hospital.description
		Icon: aot-hospital
		ChargeInterval: 7500
		SupportPowerPaletteOrder: 72
		# Gleicher Heilsound wie beim Medic (aot-Heal-Waffe, aot-weapons.yaml Report: heal2.aud).
		# Global statt nur lokal (wie Iron Dome), da die Heilung die ganze Karte betrifft.
		GlobalActivationSound: heal2.aud

