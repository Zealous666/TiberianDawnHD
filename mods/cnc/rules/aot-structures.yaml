		Icon: icon-bunkered
		Description: Anti-Aircraft base defense that retracts underground between shots for increased armor protection. Strong vs Aircraft. Cannot target Ground units.
		# Kein ewiger Platzhalter-Slot, solange das Bunkered-Upgrade nicht erforscht ist
		# (dann ist dieser Proxy nie sichtbar gewesen -> ShowWhenLocked-Default=true erzeugt
		# sonst ein leeres, nicht anklickbares Locked-Icon rund um PaletteOrder 110, neben
		# dem echten SAM). Gleiches Muster wie andere branch-exklusive Aktoren, siehe
		# locked-icon-system.md ("branch-exklusiv/dauerhaft-versteckbar -> ShowWhenLocked: False").
		ShowWhenLocked: False

