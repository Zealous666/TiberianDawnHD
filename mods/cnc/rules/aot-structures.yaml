# === Age of Tiberium (aotmod) - Mine Cluster Missile: Minen-Aktoren (RA MINV/MINP) ===
# Von aot-MineDeploy (aot-weapons.yaml) via AotSpawnActor gespawnt, Owner = Feuernder (MSLO-Besitzer).
# ^Mine-Traits 1:1 aus engine/mods/ra/rules/defaults.yaml übernommen, ABER AvoidFriendly/BlockFriendly
# auf true gesetzt (RA-Original nutzt false für neutrale Karten-Minen — unsere sind spielereigen,
# sollen den Feuernden/Verbündete verschonen und nur Gegner treffen).
aot-minv:
	Inherits: ^SpriteActor
	Inherits@shape: ^1x1Shape
	Interactable:
		Bounds: 1024, 1024
	WithSpriteBody:
	HiddenUnderFog:
	Mine:
		CrushClasses: mine
		DetonateClasses: mine
		AvoidFriendly: true
		BlockFriendly: true
	Health:
		HP: 5000
		NotifyAppliedDamage: false
	FireWarheadsOnDeath:
		Weapon: aot-ATMine
		DamageSource: Parent
	Armor:
		Type: Light
	Cloak:
		CloakSound:
		UncloakSound:
		CloakStyle: None
		DetectionTypes: Mine
		InitialDelay: 0
	Tooltip:
		Name: Vehicle Mine
	Targetable:
		# "Ground" ergaenzt, damit die normalen Mod-Waffen (pruefen gegen "Ground") die Mine
		# ueberhaupt treffen (sie trug urspruenglich nur "GroundActor"/"Mine").
		# RequiresForceFire ENTFERNT (User 2026-08-28): AUFGEKLAERTE feindliche Minen sollen von
		# Einheiten automatisch beschossen werden. Da die Mine per Cloak (DetectionTypes: Mine)
		# getarnt ist, wird sie NUR angreifbar, wenn ein Detektor sie aufdeckt -- ungetarnte/
		# unentdeckte Minen bleiben unsichtbar und werden nicht angegriffen. AutoTarget zielt nur
		# auf FEINDLICHE, sichtbare Aktoren -> eigene Minen bleiben unbehelligt.
		TargetTypes: GroundActor, Mine, Ground
	Immobile:
		OccupiesSpace: true
	RenderSprites:
		Image: aot-minv

aot-minp:
	Inherits: aot-minv
	FireWarheadsOnDeath:
		Weapon: aot-APMine
		DamageSource: Parent
	Tooltip:
		Name: Anti-Personnel Mine
	RenderSprites:
		Image: aot-minp
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Tiberium Gas Cloud (Hazard-Actor) ===
# Gespawnt von aot-TiberiumGasBurst/aot-TiberiumGasBurst2 (aot-weapons.yaml) an den Sekundär-Explosionsstellen.
# TS CLOUD1.SHP/CLOUD2.SHP (Chemical Missile Gaswolke, Firestorm), isotem.pal. 60s Lebensdauer + Dissipations-Fadeout.
# Schadenswirkung siehe ^Infantry/^Vehicle/^Building in overrides.yaml (AotDamagedByCondition + ExternalCondition@GAS).
# Health/WithDeathAnimation NUR fürs Fadeout nötig — kein Targetable-Trait, daher von Waffen nicht angreifbar/zerstörbar.
aot-gascloud:
	Inherits: ^SpriteActor
	Inherits@shape: ^1x1Shape
	# User-Korrektur: NICHT wie in einer frueheren Fassung neue Nachbarwolken spawnen (das war
	# nicht wie in TS) -- stattdessen wandert DIESELBE Wolke langsam zufaellig umher, wie in TS.
	# Mobile+Wanders statt Immobile: nur Mobile kann die Zellposition eines Aktors ueberhaupt
	# aendern. Locomotor aot-gas: SharesCell -> blockiert/kollidiert nie mit echten Einheiten.
	Mobile:
		Speed: 25
		Locomotor: aot-gas
	Wanders:
		WanderMoveRadius: 3
		MinMoveDelay: 25
		MaxMoveDelay: 75
	Health:
		HP: 5000
	RenderSprites:
		Image: aot-gascloud
	WithSpriteBody:
		Sequence: idle
	KillsSelf:
		RemoveInstead: false
		Delay: 1500
	WithDeathAnimation:
		FallbackSequence: dissipate
	ProximityExternalCondition@GAS:
		Range: 1c256
		Condition: aot-tiberium-gassed
		ValidRelationships: Ally, Neutral, Enemy

aot-gascloud2:
	Inherits: ^SpriteActor
	Inherits@shape: ^1x1Shape
	Mobile:
		Speed: 25
		Locomotor: aot-gas
	Wanders:
		WanderMoveRadius: 3
		MinMoveDelay: 25
		MaxMoveDelay: 75
	Health:
		HP: 5000
	RenderSprites:
		Image: aot-gascloud2
	WithSpriteBody:
		Sequence: idle
	KillsSelf:
		RemoveInstead: false
		Delay: 1500
	WithDeathAnimation:
		FallbackSequence: dissipate
	ProximityExternalCondition@GAS:
		Range: 1c256
		Condition: aot-tiberium-gassed
		ValidRelationships: Ally, Neutral, Enemy

# Kurzlebige Gaswolke für die Toxic-V2 (20s statt 60s, sonst identisch zur Tiberium-Missile-Wolke)
aot-gascloud-v2:
	Inherits: aot-gascloud
	KillsSelf:
		Delay: 500

# Kurzlebige Gaswolke für die Parabombs (10s, halb so lang wie die Toxic-V2)
aot-gascloud-parabomb:
	Inherits: aot-gascloud
	KillsSelf:
		Delay: 150
# === Ende aotmod ===

