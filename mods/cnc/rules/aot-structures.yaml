		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		# Raketenstart-Vorwarnung fuer ALLE Spieler (User 2026-08-04). SupportPower.PlayLaunchSounds()
		# spielt Verbuendeten LaunchSpeechNotification und allen anderen IncomingSpeechNotification --
		# beide auf denselben Key gesetzt heisst: jeder hoert dieselbe Ansage. Kein Engine-Eingriff noetig.
		LaunchSpeechNotification: MissileLaunchDetected
		IncomingSpeechNotification: MissileLaunchDetected
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		MissileWeapon: aot-MineClusterMissileEnhanced
		MissileImage: atomic
		MissileDelay: 11
		SpawnOffset: 3c0,0,-1c512
		DisplayBeacon: True
		DisplayRadarPing: True
		CameraRange: 8c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 25
	AotTiberiumMissilePower@tiberium:
		RequiresCondition: aot-tiberium-missile-active && !aot-mine-cluster-enhanced
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		IconImage: mslo
		Icon: aot-tiberiummissile-icon
		Cursor: nuke
		ChargeInterval: 22500
		Name: Tiberium Missile
		Description: Launches a toxic Tiberium warhead. Devastating against infantry, far less effective against structures.
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		# Raketenstart-Vorwarnung fuer ALLE Spieler (User 2026-08-04). SupportPower.PlayLaunchSounds()
		# spielt Verbuendeten LaunchSpeechNotification und allen anderen IncomingSpeechNotification --
		# beide auf denselben Key gesetzt heisst: jeder hoert dieselbe Ansage. Kein Engine-Eingriff noetig.
		LaunchSpeechNotification: MissileLaunchDetected
		IncomingSpeechNotification: MissileLaunchDetected
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerTextNotification: notification-insufficient-power
		MissileWeapon: aot-TiberiumStrike
		MissileImage: atomic
		MissileDelay: 11
		SpawnOffset: 3c0,0,-1c512
		DisplayBeacon: True
		DisplayRadarPing: True
		CameraRange: 8c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 35
	AotAtomBombPower@atombomb:
		# Superwaffen-Timer links unten fuer ALLE Spieler sichtbar (User-Wunsch 2026-08-01,
		# klassisches C&C-Feature). Default waere None = kein Timer. Bewusst NUR hier und bei
		# der Ion Cannon gesetzt -- alle anderen Powers bleiben ungetimed.
		DisplayTimerRelationships: Ally, Neutral, Enemy
		RequiresCondition: aot-atom-bomb-active
		PauseOnCondition: lowpower
		Prerequisites: ~techlevel.superweapons
		IconImage: mslo
		Icon: aot-atombomb-icon
		Cursor: nuke
		ChargeInterval: 30000
		Name: Atom Bomb
		Description: Launches a nuclear missile at the target location. Devastating against everything.
		EndChargeSpeechNotification: NuclearWeaponAvailable
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		# Atombombe behaelt ihre EIGENEN Ansagen (User 2026-08-04): die TS-Missile-Warnung bekommen
		# nur die drei anderen Raketen, damit der Atomschlag akustisch unterscheidbar bleibt.
		LaunchSpeechNotification: NuclearWeaponLaunched
		IncomingSpeechNotification: NuclearWarheadApproaching
		SelectTargetTextNotification: notification-select-target
		EndChargeTextNotification: notification-nuclear-weapon-available
		InsufficientPowerTextNotification: notification-insufficient-power
		LaunchTextNotification: notification-nuclear-weapon-launched
		IncomingTextNotification: notification-nuclear-warhead-approaching
		MissileWeapon: Atomic
		MissileImage: atomic
		MissileDelay: 11
		SpawnOffset: 3c0,0,-1c512
		DisplayBeacon: True
		BeaconPoster: atomic
		BeaconPosterPalette: beaconposter
		DisplayRadarPing: True
		CameraRange: 10c0
		ArrowSequence: arrow
		ClockSequence: clock
		CircleSequence: circles
		SupportPowerPaletteOrder: 30
