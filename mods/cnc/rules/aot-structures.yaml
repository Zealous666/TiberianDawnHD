# === Age of Tiberium (aotmod) - NOD SAM Site (RA-Import, 2026-07-05) ===
# User-Wunsch: Verschoben von Support.Nod in die normale Baumenue-Queue.
# RA-Remastered-Sprite (rotierender Turm, "ra-idle"/"ra-turret"/
# "ra-damaged-turret" im geteilten "sam"-Image, siehe structures-overrides.
# yaml) ist jetzt der STANDARD-Look, ersetzt die bisherige TD-Pop-up-Silo-
# Optik als Default. Die TD-Frames/-Mechanik (WithEmbeddedTurretSpriteBody +
# AttackPopupTurreted, native in structures.yaml) bleiben komplett erhalten,
# sind aber jetzt nur noch ueber das "Bunkered SAM"-Upgrade (Age 1) aktiv.
# "Cloaked SAM"-Upgrade (Age 2) ergaenzt Stealth-Tarnung analog zum U-Boot
# (siehe sub-system.md), pausiert bei Angriff/Beschaedigung/Low-Power.
SAM:
	Buildable:
		Queue: Building.Nod
		# Voraussetzung von "hand" (Hand of Nod) auf Energieversorgung + Radar
		# Dome geaendert (User-Wunsch 2026-07-05). "anypower" = generischer
		# Prereq-String, den jedes NOD-Kraftwerk bereitstellt (Konvention im
		# gesamten Mod, siehe z.B. GUN/NUK2). "aot-nod-radar" = NOD Radar Dome.
		Prerequisites: anypower, aot-nod-radar

	# KRITISCH (Crash-Historie 2026-07-05, User-Funde: "sam hat mehrere Traits
	# vom Typ AttackBase" / "Turreted: Sequence contains more than one matching
	# element" / "sam hat mehrere Traits vom Typ AttackFollow"): ZWEI parallele,
	# nur per RequiresCondition ein/ausgeblendete Attack-Traits (AttackTurreted +
	# AttackPopupTurreted) sind in dieser Engine-Version NICHT moeglich -
	# RequiresCondition blendet nur das VERHALTEN aus, nicht die Trait-INSTANZ
	# selbst. Gleich DREI verschiedene Engine-Stellen verlangen Eindeutigkeit
	# ueber die abstrakte Basisklasse AttackBase/AttackFollow (RenderRangeCircle,
	# Turreted.Created(), AttackFollow.AttackActivity-Konstruktor) - Whack-a-Mole
	# ohne Ende. Endgueltige Loesung: EIGENER C#-Trait `AotAttackPopupOrTurreted`
	# (engine/OpenRA.Mods.Cnc/Traits/Attack/AotAttackPopupOrTurreted.cs) vereint
	# BEIDE Verhalten in EINER Instanz - der Bunkered-Zustand wird per
	# BooleanExpression (IObservesVariables) gelesen, nicht per RequiresCondition,
	# es gibt also immer nur EIN AttackBase-Trait auf diesem Aktor.
	-AttackPopupTurreted:
	AotAttackPopupOrTurreted:
		BunkeredCondition: aot-sam-bunkered
		PauseOnCondition: lowpower || build-incomplete

	GrantConditionOnPrerequisite@BUNKERED:
		Condition: aot-sam-bunkered
		Prerequisites: aot-sam-bunkered-upgrade

	GrantConditionOnPrerequisite@CLOAK:
		Condition: aot-sam-cloak-active
		Prerequisites: aot-sam-cloak-upgrade

	# RA-Render-Pfad (Default, 2026-07-05): neue WithSpriteBody/WithSpriteTurret-
	# Instanzen fuer den rotierenden Turm. "Name: body-ra" bewusst NICHT "body" -
	# AotAttackPopupOrTurreted sucht (wie das Original AttackPopupTurreted) per
	# .Single() nach GENAU einer WithSpriteBody-Instanz mit Name=="body"
	# (Default, matcht die native WithEmbeddedTurretSpriteBody). Mit zwei
	# WithSpriteBody-Instanzen namens "body" waere das derselbe .Single()-
	# Kollisions-Crash wie bei GUN/FTUR (siehe gun-turret-system.md) - hier
	# vorab vermieden durch einen eindeutig ANDEREN Namen.
	WithSpriteBody@ra:
		Sequence: ra-idle
		Name: body-ra
		RequiresCondition: !aot-sam-bunkered

	WithSpriteTurret@ra:
		Sequence: ra-turret
		RequiresCondition: !build-incomplete && !aot-sam-bunkered
		Recoils: false

	# TD-Render-Pfad (Bunkered SAM-Upgrade): bereits nativ vorhandene
	# WithEmbeddedTurretSpriteBody bleibt inhaltlich unveraendert - nur
	# RequiresCondition ergaenzt (reiner Feld-Merge, kein "-Trait:" noetig).
	WithEmbeddedTurretSpriteBody:
		RequiresCondition: aot-sam-bunkered

	# Hoehere Panzerung im Bunkered-Zustand (User-Wunsch). "-Armor:" ist hier
	# legitim, da Concrete-Armor NUR in der nativen structures.yaml (frueher
	# geladene Datei) direkt gesetzt ist, nicht in dieser Datei selbst.
	-Armor:
	Armor@base:
		Type: Concrete
		RequiresCondition: !aot-sam-bunkered
	Armor@bunkered:
		Type: Heavy
		RequiresCondition: aot-sam-bunkered

	# Cloaked SAM-Upgrade: getarnt solange nicht feuernd (UncloakOn: Attack),
	# ueber 50% HP und nicht Low-Power. GrantConditionOnDamageState liefert die
	# HP-Bedingung (Heavy/Critical = <=50% HP in diesem Mod, siehe Damage-
	# States-Konvention), PauseOnCondition erzwingt sichtbaren Zustand in
	# beiden Faellen (Cloak.Cloaked ist false solange IsTraitPaused true ist).
	GrantConditionOnDamageState@damaged:
		Condition: aot-sam-damaged
		ValidDamageStates: Heavy, Critical

	Cloak:
		RequiresCondition: aot-sam-cloak-active
		CloakStyle: Alpha
		InitialDelay: 25
		# CloakDelay erhoeht (User-Wunsch 2026-07-05): vorher 25 Ticks (~1s ab dem
		# Angriffs-Trigger) - das SAM begann bereits zu tarnen, waehrend der Turm
		# (im Bunkered-Zustand) noch sichtbar am Einfahren war. Neuer Wert deckt
		# CloseDelay (125 Ticks Leerlauf bis Einfahr-Beginn, siehe
		# AotAttackPopupOrTurreted) PLUS ca. 1 weitere Sekunde (25 Ticks) danach ab,
		# bis der Turm sicher komplett eingefahren ist. Kein Effekt auf Decloak -
		# UncloakOn: Attack/Damage triggert weiterhin sofort, ganz ohne Delay.
		CloakDelay: 150
		UncloakOn: Attack, Damage
		CloakSound: cloak5.aud
		UncloakSound: cloak5.aud
		PauseOnCondition: aot-sam-damaged || lowpower
# === Ende aotmod ===

