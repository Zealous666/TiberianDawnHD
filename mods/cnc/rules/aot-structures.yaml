# === Age of Tiberium (aotmod) - AFLT: Air Field (GDI, sichtbar ab Age 1) ===
# Neues Gebäude analog zu HPAD, aber GDI-only und nur für das neue AJET-Flugzeug.
# Nutzt vorerst HPAD-Sprites als Platzhalter.
AFLT:
	Inherits: ^BaseBuilding
	Inherits@shape: ^2x2Shape
	# Custom TS/RA-Sprite ohne "dead"-Rubble-Frame -> WithDeathAnimation (von ^BaseBuilding
	# geerbt) würde beim Zerstören crashen ("Image `aflt` does not have a sequence named `dead`").
	-WithDeathAnimation:
	Selectable:
		Bounds: 3072, 2048
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 768,-512,0, 768,512,0, -281,-512,0, -630,512,0
	Valued:
		Cost: 1500
	Tooltip:
		Name: Air Field
	Buildable:
		BuildPaletteOrder: 140
		LockedGroup: aot-grp-aflt
		Prerequisites: ~aot-age1, anyhq, ~!aot-age2
		Queue: Building.GDI
		Icon: aflt-gdi-icon
		Description: Advanced air production facility. Produces GDI fighter jets.
	Building:
		Footprint: xxx xxx
		Dimensions: 3,2
	Health:
		HP: 60000
	RevealsShroud:
		Range: 5c0
	Exit@1:
		SpawnOffset: 0,-256,0
		Facing: 768
	# RA-Stil (2026-08-29): A10/Firehawk/AJET spawnen am Kartenrand und fliegen das Air Field an.
	AotProductionFromMapEdge:
		Produces: Aircraft.GDI.AFLT
	Reservable:
	WithBuildingBib:
	RepairsUnits:
		HpPerStep: 1000
		PlayerExperience: 5
		StartRepairingNotification: Repairing
		StartRepairingTextNotification: notification-repairing
	# === Age-2-Sprite-Wechsel (Gemini-Import) ===
	# Die 8 active-Frames tragen wie in Age 1 das Windhosen-Flattern + den Rollbahn-Puls und
	# werden vom selben Mechanismus abgespielt: WithResupplyAnimation ruft
	# PlayCustomAnimationRepeating auf dem WithSpriteBody, dessen Name in "Body" steht.
	# Deshalb zwei Instanzen -- je eine pro Age-Body.
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@base:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		RequiresCondition: aot-age2-active
	# WithResupplyAnimation raus: sie spielte die Animation NUR beim Auftanken, im Ruhezustand
	# stand alles still. Beide Ages animieren jetzt dauerhaft ueber eigene Overlays. Zusaetzlich
	# wuerde "active" das Original-Frame samt eingebackener Windhose einblenden -- doppelt zur
	# Overlay-Windhose. AFLT definiert den Trait selbst (erbt ihn NICHT), deshalb einfach
	# weglassen statt "-WithResupplyAnimation:" -- letzteres crasht mangels Vorgaenger.
	WithIdleOverlay@rawindsock:
		Sequence: aot-ra-windsock
		RequiresCondition: !aot-age2-active && !build-incomplete
	WithIdleOverlay@ralights:
		Sequence: aot-ra-lights
		RequiresCondition: !aot-age2-active && !build-incomplete
	# Age 2: Windhose und Rollbahn-Lichter laufen DAUERHAFT als eigene Overlays. Ueber
	# WithResupplyAnimation haetten sie sich nur beim Auftanken bewegt -- im Ruhezustand
	# stand alles still (User-Report 2026-08-30).
	WithIdleOverlay@tswindsock:
		Sequence: aot-age2-windsock
		RequiresCondition: aot-age2-active && !build-incomplete
	WithIdleOverlay@tslights:
		Sequence: aot-age2-lights
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@base:
		BodyNames: body
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make
	RallyPoint:
	CommandBarBlacklist:
		DisableStop: false
	ProductionQueue@AFLT:
		Type: Aircraft.GDI.AFLT
		DisplayOrder: 4
		Factions: gdi
		Group: Aircraft
		ShowLockedItems: True
		LowPowerModifier: 150
		ReadyAudio: UnitReady
		ReadyTextNotification: notification-unit-ready
		BlockedAudio: NoBuild
		BlockedTextNotification: notification-unable-to-build-more
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: notification-unable-to-comply-building-in-progress
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionBar@AFLT:
		ProductionType: Aircraft.GDI.AFLT
	Power:
		Amount: -20
	ProvidesPrerequisite@buildingname:
	RenderSprites:
		Image: aflt

# Age-2-Bau-Proxy: liefert ab Age 2 die Platzier-Vorschau mit dem Gemini-Sprite. AFLT selbst
# bleibt der Age-1-Menue-Eintrag (Muster wie aot-weap-age2); beide teilen LockedGroup, und
# "!aflt" verhindert einen zweiten (ein bereits ge-upgradetes AFLT stellt "aflt" bereit).
aot-aflt-age2:
	Inherits: AFLT
	RenderSprites:
		Image: aflt
	ProvidesPrerequisite@buildingname:
		Prerequisite: aflt
	# ^BaseBuilding liefert ActorPreviewPlaceBuildingPreview -- Duplikat waere ein
	# TypeDictionary-Crash, deshalb erst entfernen (siehe gemini-building-import).
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: aot-age2-idle
		SequenceAlpha: 0.65
	Buildable:
		BuildPaletteOrder: 140
		LockedGroup: aot-grp-aflt
		Queue: Building.GDI
		# KEIN "!aflt" hier: das wirkte wie BuildLimit 1 (nach dem ersten Bau stellte das
		# Gebaeude "aflt" bereit und der Menue-Eintrag verschwand). AFLT ist unbegrenzt baubar.
		Prerequisites: ~aot-age2, anyhq
		Icon: aflt-gdi-icon
		Description: Advanced air production facility. Produces GDI fighter jets.
	Tooltip:
		Name: Air Field

# === Age of Tiberium (aotmod) - FIX: RA Repair Facility Sprites in Age 0, TD ab Age 1 ===
# Doppel-Aktor-Pattern analog PYLE. FIX muss das Prerequisite "fix" explizit bereitstellen.
FIX:
	-Buildable:
	# User-Wunsch 2026-08-05: 500 -> 1500. Hier am Basis-Aktor, nicht an den Varianten: alle fuenf
	# (aot-fix-age0/1/2 GDI und aot-fix-age1/2-nod) erben von FIX, ein Eintrag deckt also beide
	# Fraktionen ab.
	Valued:
		Cost: 1500
	# User-Wunsch 2026-08-01: repariertes Fahrzeug bleibt nach Abschluss noch ~2 Sekunden stehen
	# (50 Ticks bei Standard-Timestep 40ms), statt im selben Tick loszufahren. Gibt u.a. das
	# Zeitfenster, es dort noch zu verkaufen. RepairsUnits selbst wird von der Engine geerbt,
	# hier nur das neue Feld ergaenzt (Feld-Merge, kein "-Trait:" noetig).
	RepairsUnits:
		LingerAfterRepair: 50
	# Engine-Default ist HasMinibib:true -> WithBuildingBib rendert nur rows=1, also
	# ausschliesslich die Frames 0-2 des 6-Frame-Bibs (BIB2 = 3 breit x 2 Zeilen).
	# Die untere Bib-Zeile wurde dadurch nie gezeichnet ("unten abgeschnitten").
	# false => rows=2, bibOffset = Dimensions.Y-2 = 1 -> exakt dasselbe Layout wie FACT.
	# Leerer Wert wuerde den geerbten true NICHT loeschen, daher explizit false.
	WithBuildingBib:
		HasMinibib: false
	AotGrantConditionOnPrerequisiteLatched@aotage1:
		Condition: aot-age1-active
		Prerequisites: aot-age1
	# Age-2: beide Fraktionen wechseln auf TS GADEPT-Sprite
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-fix-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: aot-ra-idle
		Name: body
		RequiresCondition: !aot-age1-active
	WithSpriteBody@td:
		Sequence: idle
		Name: body-td
		RequiresCondition: aot-age1-active && !aot-fix-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-nod-idle
		Name: body-ts
		RequiresCondition: aot-fix-age2-active
	# Ring pulst weiss NUR waehrend der Reparatur (WithRepairOverlay rendert nur bei aktivem
	# Reparatur-Auftrag). Maske = nur die groesste Remap-Komponente (der Ring), der Anbau bleibt
	# statisch (ueber WithIdleOverlay@tsremap). OHNE StartSequence: die Engine spielt die Sequenz
	# pro Reparatur-Tick einmal und setzt danach visible=false -> loopt waehrend der Reparatur und
	# STOPPT automatisch, sobald sie abgeschlossen ist (mit StartSequence liefe PlayRepeating endlos).
	WithRepairOverlay@ringpulse:
		Sequence: aot-fix-ring-pulse
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-fix-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
		Sequence: aot-ra-make
	WithMakeAnimation@td:
		BodyNames: body-td
		Condition: build-incomplete
		Sequence: make
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
