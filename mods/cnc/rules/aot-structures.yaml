# === Age of Tiberium (aotmod) - HPAD: Proxy-Aktoren für GDI/NOD-Icons ===
# GDI-Helipad ist ein eigenständiger 4x4-Mega-Actor: 4 Landeplätze (HPAD-Composite)
# quadratisch angeordnet um einen dekorativen Guard Tower (GTWR-Sprite, ohne Funktion)
# in der durch die runden Pads natürlich entstehenden Mittellücke. Vier unabhängige
# Reservable-Slots (analog Heli-Carrier-Pattern, siehe heli-system.md) erlauben 4
# gleichzeitige Landungen/Rearms. NOD-Helipad (aot-hpad-nod) bleibt unverändert 2x2.
aot-hpad-gdi:
	Inherits: HPAD
	# Preis verdoppelt 1000 -> 2000 (User-Wunsch 2026-08-01). Beide Helipad-Proxies erbten
	# bisher HPADs 1000 und hatten kein eigenes Valued.
	Valued:
		Cost: 2500
	RenderSprites:
		Image: aot-hpad4
	Building:
		Footprint: xxxx xxxx xxxx xxxx
		Dimensions: 4,4
	Selectable:
		Bounds: 4096, 4096
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -2048
			BottomRight: 2048, 2048
	Exit@1:
		SpawnOffset: 0,-1536,0
		Facing: 896
	-Reservable:
	# Reihenfolge nw->ne->se->sw = im Uhrzeigersinn. Reservable.TryReserve() nimmt den
	# ersten freien Slot in Deklarationsreihenfolge, das bestimmt also auch die
	# Belegungsreihenfolge frisch gebauter/rueckkehrender Aircraft.
	# Nord-Docks (nw/ne) sitzen bei beiden Ages gleich (-1024 Y passt fuer Klassik UND Age-2).
	Reservable@nw:
		LandingOffset: -1024,-1024,0
		ReservedCondition: aot-hpad-gdi-nw-reserved
	Reservable@ne:
		LandingOffset: 1024,-1024,0
		ReservedCondition: aot-hpad-gdi-ne-reserved
	# Sued-Docks: das Age-2-Gemini-Sprite ist vertikal NICHT symmetrisch (obere Pad-Zentren
	# dy~-110px, untere nur dy~+34px im 586px-Sprite) -> +1024 Y laesst die unteren Helis zu
	# weit suedlich landen. Gemessen: unteres Pad = Welt-Y ~+315. Klassik-Quad (Age 0/1) ist
	# dagegen symmetrisch (+1024 korrekt). Reservable ist ConditionalTrait -> je Age eine
	# Variante, TryReserve ueberspringt die disabled. Nord bleibt geteilt.
	Reservable@se:
		LandingOffset: 1024,1024,0
		ReservedCondition: aot-hpad-gdi-se-reserved
		RequiresCondition: !aot-age2-active
	Reservable@se-ts:
		LandingOffset: 1024,315,0
		ReservedCondition: aot-hpad-gdi-se-reserved
		RequiresCondition: aot-age2-active
	Reservable@sw:
		LandingOffset: -1024,1024,0
		ReservedCondition: aot-hpad-gdi-sw-reserved
		RequiresCondition: !aot-age2-active
	Reservable@sw-ts:
		LandingOffset: -1024,315,0
		ReservedCondition: aot-hpad-gdi-sw-reserved
		RequiresCondition: aot-age2-active
	# RA-Stil (2026-08-29): gebaute Aircraft spawnen am Kartenrand und fliegen das Helipad an,
	# statt am Gebaeude zu poppen (loest das Vier-Pad-Crowding). Ohne Rallypoint dockt sie auf dem
	# naechsten freien Pad, mit Rallypoint fliegt sie erst das Gebaeude, dann den Rallypoint an.
	-Production:
	AotProductionFromMapEdge:
		Produces: Aircraft.GDI, Aircraft.Nod
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: anyhq
		Queue: Building.GDI
		Icon: hpad-blue-icon
		Description: Quad landing pad for helicopters. Four aircraft can land and rearm simultaneously. Required for air unit production.
	ProvidesPrerequisite@buildingname:
		Prerequisite: hpad
	# Age-2 Sprite-Switch (Gemini 4-Pad-Composite + moderner Mittelturm). Age 0/1 = klassisches
	# aot-hpad4-Composite (unveraendert), ab Age 2 = Gemini-Render. EIN Aktor, kein Icon-Proxy
	# (Build-Icon bleibt). Muster wie NOD-Helipad/Werft (naval-system.md, hpad-quad-system.md).
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	# Platzier-Ghost soll ab Age 2 das neue Sprite zeigen (kein echter Aktor existiert beim
	# Platzieren -> TechTree des Spielers abfragen, siehe AotForwardTechTreeConditionToPlacementPreview.cs).
	AotForwardTechTreeConditionToPlacementPreview:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-idle
		Name: body-ts
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active
	WithIdleOverlay@tsremap:
		Sequence: aot-age2-remap
		RequiresCondition: aot-age2-active && !build-incomplete
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-make

aot-hpad-nod:
	Inherits: HPAD
	# Preis 1000 -> 3000 (User-Wunsch 2026-08-01, 4000 war zu viel). Teurer als GDIs Helipad,
	# weil NOD es nur zum BAU braucht: NOD-Flugeinheiten laden on-the-fly nach, GDI muss zum
	# Helipad zurueck. Der Aufschlag steckt zusaetzlich in den NOD-Heli-Preisen selbst.
	Valued:
		Cost: 2000
	RenderSprites:
		Image: hpad
	Buildable:
		BuildPaletteOrder: 130
		Prerequisites: anyhq
		Queue: Building.Nod
		Icon: hpad-red-icon
		Description: Landing pad for helicopters. Required for air unit production.
	ProvidesPrerequisite@buildingname:
		Prerequisite: hpad
	# RA-Stil (2026-08-29): gebaute Aircraft spawnen am Kartenrand und fliegen das Helipad an.
	-Production:
	AotProductionFromMapEdge:
		Produces: Aircraft.GDI, Aircraft.Nod
	# Bib-Smudge (User-Wunsch 2026-08-02), Ausmasse exakt wie beim NOD Radar (aot-nod-radar):
	# HPAD ist von Haus aus 2x2 ("xx xx", Dimensions 2,2, kein LocalCenterOffset). Der Bib
	# braucht eine EIGENE Footprint-Zeile, sonst wird er auf die Gebaeudezellen gemalt und
	# unten abgeschnitten. Deshalb - identisch zum Radar:
	#   Footprint: dritte Zeile "==" (befahrbare Smudge-Reihe, blockiert nicht)
	#   Dimensions: Y 2 -> 3 (WithBuildingBib.cs rechnet bibOffset = Dimensions.Y - rows,
	#                        mit rows=2 also Reihen 1+2 = untere Gebaeudereihe + Smudge-Reihe)
	#   LocalCenterOffset: 0,-512,0 -- eine zusaetzliche Zeile verschiebt den geometrischen
	#                        Mittelpunkt um eine halbe Zelle (512) nach unten; das hebt es
	#                        wieder auf, damit das Sprite exakt an derselben Stelle bleibt.
	# Selectable.Bounds bleibt bei 2048,2048 (von HPAD geerbt) - die Auswahlbox soll nur das
	# echte 2x2-Gebaeude umfassen, nicht die Smudge-Reihe (Radar handhabt es genauso).
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	WithBuildingBib:
	# Age-2 Sprite-Switch (Gemini-Render, gleiches Muster wie aot-shipyard/aot-subpen,
	# siehe naval-system.md): Age 0/1 = klassisches HPAD-Sprite (unveraendert), ab Age 2 =
	# Gemini-Render. EIN Aktor fuer beide Ages (kein Icon-Proxy - Build-Icon bleibt
	# ausdruecklich unveraendert, User-Wunsch). Rote Container/Kanister -> Player-Color-Remap
	# (Body auf Neutralgrau entfaerbt, Remap-Layer indiziert 176-191, volle 16er-Rampe wegen
	# der grossen flachen Container-Flaeche - 4-stufiger Remap haette gebandet).
	AotGrantConditionOnPrerequisiteLatched@aotage2:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	# Platzier-Ghost kennt sonst keine Bedingungen (kein echter Aktor existiert noch) und faellt
	# immer auf den EnabledByDefault-Body (klassisch) zurueck, selbst wenn Age 2 laengst aktiv
	# ist. Fragt stattdessen den TechTree des platzierenden Spielers ab (siehe
	# AotForwardTechTreeConditionToPlacementPreview.cs).
	AotForwardTechTreeConditionToPlacementPreview:
		Condition: aot-age2-active
		Prerequisites: aot-age2
	-WithSpriteBody:
	WithSpriteBody@ra:
		Sequence: idle
		Name: body
		RequiresCondition: !aot-age2-active
	WithSpriteBody@ts:
		Sequence: aot-age2-nod-idle
		Name: body-ts
		Palette: effect
		IsPlayerPalette: false
		RequiresCondition: aot-age2-active
	WithIdleOverlay@tsremap:
		Sequence: aot-age2-nod-idle-remap
		Palette: player
		IsPlayerPalette: True
		RequiresCondition: aot-age2-active && !build-incomplete
	# Age-2-Bauanimation: synthetischer Bottom-up-Reveal-Wipe aus dem fertigen Gemini-Idle-
	# Sprite gebacken (siehe make-animation-interpolation.md), NICHT die klassische HPADMAKE
	# wiederverwendet - die zeigte das alte RA-Pad wachsen, obwohl am Ende das neue Age-2-
	# Gebaeude steht (falscher Look waehrend des Baus, User-Korrektur).
	-WithMakeAnimation:
	WithMakeAnimation@ra:
		BodyNames: body
		Condition: build-incomplete
	WithMakeAnimation@ts:
		BodyNames: body-ts
		Condition: build-incomplete
		Sequence: aot-age2-nod-make
