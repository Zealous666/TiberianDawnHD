# === Age of Tiberium (aotmod) - Baeume durch konventionelle Waffen faellbar ===
# Baeume bekommen einen EIGENEN Ruestungstyp (Tree) statt Wood. Grund: Wood ist in
# cnc der Standard-Ruestungstyp fuer Gebaeude (^Building), d.h. wuerde man den Wood-
# Waffenschaden fuer Baeume anpassen, aendert man auch den Schaden gegen Gebaeude.
# Mit eigenem Tree-Typ laesst sich der Baumschaden separat einstellen (siehe
# aot-weapons.yaml: ^BallisticWeapon/^MissileWeapon -> Tree:50 = halbe Wirkung).
# HP von 50000 auf 24000 gesenkt (User-Wunsch 2026-07-12): Baeume fallen schneller;
# Flammen-/Superwaffen bleiben bei 100% (deren Wood-Werte greifen bei Tree-Ruestung
# nicht mehr -> Default 100%), konventionelle Waffen brauchen ~doppelten Schaden.
^Tree:
	Health:
		HP: 24000
	Armor:
		Type: Tree

# Verbrannte Baumreste (Txx.Husk erben von ^TreeHusk) waren bisher unzerstoerbar
# und blockierten dauerhaft den Bauplatz. Sie bekommen jetzt EXAKT dieselbe HP wie
# der Baum (24000) + denselben Tree-Ruestungstyp + Targetable/HitShape, damit sie
# von denselben konventionellen Waffen weggeraeumt werden koennen. ^TreeHusk hat
# KEIN SpawnActorOnDeath und KEINE WithDeathAnimation -> der Rest verschwindet beim
# Zerstoeren spurlos, die Zelle wird wieder bebaubar.
^TreeHusk:
	Health:
		HP: 24000
	Armor:
		Type: Tree
	Targetable:
		TargetTypes: Trees
	HitShape:

# T03.Transformable/T13.Transformable mutieren zu Blossom Trees (TransformsNearResources),
# sobald Tiberium angrenzt. Default-Delay war 1000-3000 Ticks (= 40-120s bei Timestep 40ms) -
# viel zu schnell. User-Wunsch (2026-07-27): fruehestens nach 10 Minuten. 10min = 600s / 0.04s
# pro Tick = 15000 Ticks Minimum, mit etwas Streuung bis 20000 (~13,3min).
T03.Transformable:
	TransformsNearResources:
		Delay: 15000, 20000

T13.Transformable:
	TransformsNearResources:
		Delay: 15000, 20000

# Blossom-Tree-Wachstum (SeedsResource) von 55/55/110 auf 100 Ticks fuer alle drei
# (User-Wunsch 2026-07-30). trees.yaml selbst ist Teil der Engine-Kopie und gitignored
# (siehe .gitignore) -- ein direkter Edit dort ginge beim naechsten Engine-Neubezug
# verloren, deshalb hier ueberschrieben, gleiches Muster wie T03/T13.Transformable oben.
SPLIT2:
	SeedsResource:
		Interval: 100

SPLIT3:
	SeedsResource:
		Interval: 100

SPLITBLUE:
	SeedsResource:
		Interval: 100
