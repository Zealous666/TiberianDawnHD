# === Age of Tiberium (aotmod) - Tiberium Strike: MSLO-Superpower-Warhead (TESTWERT) ===
# Kein Nuke-Warhead — verheerende toxische Explosion. Stark gegen Infanterie (None),
# schwach gegen Gebäude/Panzerung (Wood/Concrete) — umgekehrte Balance zur Atomic-Waffe.
# Platzhalter: MissileImage/-Sound bleiben vorerst die Nuke-Assets (kein eigenes Toxin-Sprite importiert).
aot-TiberiumStrike:
	ValidTargets: Ground, Water, Air, Trees
	Report: nukemisl.aud
	Warhead@1Dam: SpreadDamage
		Spread: 1c512
		Damage: 6000
		Falloff: 1000, 700, 400, 200, 80, 30, 0
		ValidTargets: Ground, Air, Trees
		AffectsParent: True
		Versus:
			None: 200
			Wood: 25
			Light: 50
			Heavy: 35
			Concrete: 15
		DamageTypes: Prone50Percent, TriggerProne, TiberiumDeath
	Warhead@2Eff: CreateEffect
		Explosions: chemball
		ImpactSounds: xplos.aud
		ImpactActors: false
	Warhead@3Shake: ShakeScreen
		Duration: 20
		Intensity: 5
		Multiplier: 1,1
	Warhead@4FlashEffect: FlashEffect
		Duration: 20
	Warhead@5Cluster: FireCluster
		Weapon: aot-TiberiumGasBurst
		RandomClusterCount: 3
		Dimensions: 11,11
		Footprint: _____x_____ __xxxxxxx__ _xxxxxxxxx_ _xxxxxxxxx_ _xxxxXxxxx_ xxxxXxXxxxx _xxxxXxxxx_ _xxxxxxxxx_ _xxxxxxxxx_ __xxxxxxx__ _____x_____
	Warhead@6Cluster2: FireCluster
		Weapon: aot-TiberiumGasBurst2
		RandomClusterCount: 3
		Dimensions: 11,11
		Footprint: _____x_____ __xxxxxxx__ _xxxxxxxxx_ _xxxxxxxxx_ _xxxxxxxxx_ xxxxxxxxxxx _xxxxxxxxx_ _xxxxxxxxx_ _xxxxxxxxx_ __xxxxxxx__ _____x_____
	# === Rodung Phase 1 (User-Wunsch 2026-08-04) ===
	# Baeume haben zwei Phasen: Baum (24000 HP) -> Husk (24000 HP). Der Haupt-Warhead oben
	# schafft ueber die Falloff-Kurve nicht einmal Phase 1 zuverlaessig. Statt seine Werte
	# anzuheben (das wuerde die austarierte Wirkung gegen Einheiten/Gebaeude mitziehen)
	# haengt hier ein ZWEITER, baum-exklusiver Warhead dran: "Trees" ist der einzige
	# TargetType von ^Tree/^TreeHusk, dieser Warhead kann also nichts anderes treffen.
	#
	# Trifft NUR die noch stehenden Baeume, nicht deren Husks: SpawnActorOnDeath erzeugt den
	# Husk in einem AddFrameEndTask (SpawnActorOnDeath.cs:143), also erst NACH der kompletten
	# Warhead-Abarbeitung dieses Einschlags. Phase 2 bleibt damit automatisch stehen und wird
	# vom nachziehenden Gas erledigt (siehe ^TreeHusk in aot-world.yaml).
	#
	# Falloff: 11 Stuetzstellen a 512 (= 0,5 Zellen) auf 100%, danach auf 0 -- volle Wirkung
	# exakt bis 5,0 Zellen, ab 5,5 Zellen gar keine. Schadenswert bewusst ueber den 24000 HP
	# (Sicherheitsmarge, falls ^Tree spaeter mehr HP bekommt).
	Warhead@7Trees: SpreadDamage
		Spread: 512
		Damage: 30000
		Falloff: 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 0
		ValidTargets: Trees
		DamageTypes: TiberiumDeath
# === Ende aotmod ===

