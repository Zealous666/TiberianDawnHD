# Missile Sub Rakete: ECHTE Lenkrakete mit Suchmodus (Projectile: Missile), 1:1 die
# RA-Werte aus ^SubMissileDefault (engine/mods/ra/weapons/missiles.yaml): Speed 234,
# HorizontalRateOfTurn 60 = homt aufs Ziel. Ersetzt die frueher ballistische Bahn
# (Bullet LaunchAngle 120), die nur dorthin schlug wo das Ziel WAR, statt ihm zu folgen.
# RangeLimit bewusst > Range (22c0 > 20c0), sonst geht der Rakete vor Reichweiten-Ende
# der Sprit aus. Sprite (missile) + Sound (missile6) unveraendert = RA-korrekt.
aot-SubMissile:
	Inherits: ^BallisticWeapon
	-Warhead@2Smu:
	-Projectile:
	ReloadDelay: 300
	# Reichweite 20c0->16c0: klar mehr als der Destroyer (10c0), aber unter Cruiser (20c0)
	# -- der Sub ist "etwas besser als der Destroyer", nicht gleichauf mit dem Cruiser (User-Ziel).
	Range: 16c0
	Report: missile6.wav
	Burst: 2
	BurstDelays: 15
	# Underwater/Submarine zusaetzlich (User 2026-08-04): die RAKETEN sollen auch aufgeklaerte
	# getauchte U-Boote treffen koennen. Ohne diese Zieltypen feuerte die Missile Sub zwar, machte
	# aber 0 Schaden (getauchtes Sub = Underwater/Submarine, Warhead traf nur Ground/Water).
	ValidTargets: Ground, Water, Underwater, Submarine
	Projectile: Missile
		Speed: 234
		Blockable: false
		Inaccuracy: 614
		HorizontalRateOfTurn: 60
		RangeLimit: 22c0
		Image: missile
		Shadow: True
		TrailImage: smokey
		ContrailLength: 30
	Warhead@1Dam: SpreadDamage
		Spread: 426
		# Schaden 2500->3000: der Sub liegt damit ueber dem Destroyer (2500) -- "etwas besser
		# als der Destroyer" bei Reichweite UND Schaden (User-Ziel).
		Damage: 3000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: Ground, Water, Underwater, Submarine
		Versus:
			None: 80
			Wood: 50
			Light: 48
			Heavy: 30
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Eff: CreateEffect
		Explosions: poof
		ImpactSounds: xplosml2.wav
		ValidTargets: Ground, Water, Underwater, Submarine

