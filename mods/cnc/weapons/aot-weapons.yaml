# === Age of Tiberium (aotmod) - FTUR Flame Tower (RA-Import, NOD Age 0) ===
# Stats 1:1 von RA's FireballLauncher + ^FireWeapon uebernommen (engine/mods/ra/
# weapons/other.yaml), da diese Basis-Traits im cnc-Mod nicht existieren. Projektil
# JETZT ebenfalls authentisch (User-Korrektur 2026-07-04): Image/TrailImage auf die
# importierten FB1/FB2-Sequenzen (aot-ftur-fb1/aot-ftur-fb2, siehe aot-sequences.yaml)
# umgebogen, Speed 1:1 RA-Wert. Sound bleibt bewusst vom cnc-eigenen ^FlameWeapon
# (flamer2.aud) - RA's FireballLauncher hat GAR KEINEN Report (in vanilla RA stumm).
# Explosions-Effekt auf med_napalm umgebogen (RA's "napalm" existiert im cnc-Mod nicht).
# KRITISCHER Bugfix (2026-07-04, User-Report "macht gar keinen Schaden"): ValidTargets
# nutzte RA's eigene Tag-Konvention ("GroundActor"/"WaterActor") 1:1 aus RA's
# ^FireWeapon uebernommen - dieser CNC-Mod nutzt aber die cnc-eigene Konvention OHNE
# "Actor"-Suffix (siehe ^FlameWeapon: "ValidTargets: Ground, Water, Trees"). Da echte
# Einheiten hier nie als "GroundActor"/"WaterActor" getaggt sind, traf der Warhead
# NIE ein gueltiges Ziel -> 0 Schaden gegen alles ausser (theoretisch) Trees. Auf die
# cnc-Konvention umgestellt.
aot-FturFlame:
	ValidTargets: Ground, Water, Trees
	ReloadDelay: 70
	Range: 5c0
	InvalidTargets: Wall
	Report: flamer2.aud
	Burst: 2
	BurstDelays: 20
	Projectile: Bullet
		Speed: 250
		Image: aot-ftur-fb1
		TrailImage: aot-ftur-fb2
		# Blockable defaultet auf true (Bullet.cs) - ein Verteidigungsturm hinter
		# der eigenen Mauer/dem Zaun konnte dadurch nicht ueber diese hinweg
		# feuern (Fence/Wall haben BlocksProjectiles, siehe aot-structures.yaml).
		# User-Fund 2026-07-05: "muss ueber Zaeune feuern - kommt gerade nicht
		# durch". Fix: Projektil ignoriert eigene BlocksProjectiles-Hindernisse.
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 213
		Damage: 15000
		ValidTargets: Ground, Water, Trees
		Versus:
			None: 90
			Wood: 50
			Tree: 50
			Light: 60
			Heavy: 25
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Structure, Wall
	Warhead@3Eff: CreateEffect
		Explosions: med_napalm

