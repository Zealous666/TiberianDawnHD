		Versus:
			None: 25
			Wood: 100
			Light: 100
			Heavy: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees, Creep

aot-LtnkLaser:
	ReloadDelay: 60
	Range: 6c0
	Report: obelray1.aud
	Burst: 3
	BurstDelay: 8
	Projectile: LaserZap
		Width: 40
		HitAnim: laserfire
		ZOffset: 2047
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 4000
		Versus:
			Wood: 50
		DamageTypes: Prone50Percent, TriggerProne, FireDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees, Creep
# === Age of Tiberium (aotmod) - Apache AG Missiles ===
OrcaAGMissiles:
	Warhead@1Dam: SpreadDamage
		Damage: 2000

# Apache: gleicher Schaden wie ORCA (2000), aber kein AA.
aot-ApacheAGMissiles:
	Inherits: OrcaAGMissiles
