aot-HindAGGun:
	Inherits: HeliAGGun
	Burst: 2
	BurstDelays: 0
	ReloadDelay: 40
	Warhead@1Dam: SpreadDamage
		Damage: 1500

aot-HarpyAGGun:
	Inherits: HeliAGGun
	Burst: 2
	BurstDelays: 0
	ReloadDelay: 20
	Warhead@1Dam: SpreadDamage
		Damage: 2000

# === Age of Tiberium (aotmod) - AJET Waffen ===
# Basieren auf A10-Waffen (Vulcan/Napalm), aber ohne Burst-Offsets die für den
# stationären A10-Überflug ausgelegt sind. AJET greift per AttackAircraft an.

# Vulcan-Kanone ohne FirstBurst/FollowingBurst-Offsets — trifft direkt das Ziel
aot-AjetVulcan:
	Inherits: Vulcan
	Range: 5c0
	FirstBurstTargetOffset: 0,0,0
	FollowingBurstTargetOffset: 0,0,0

# Napalm-Kette: 5 Bomben mit Fallverzögerung (GravityBomb Delay)
aot-AjetNapalm:
	Inherits: ^FlameWeapon
	ReloadDelay: 4
	Range: 5c0
	Burst: 5
	BurstDelays: 1
	-Projectile:
	Projectile: GravityBomb
		Image: BOMBLET
		Shadow: true
		Delay: 8
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 2250
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Versus:
			Wood: 35
			Heavy: 80
			Concrete: 80
	Warhead@3Eff: CreateEffect
		Explosions: med_napalm

# === Age of Tiberium (aotmod) - TTNK Battle Tank: Dual-Kanone ===
# Tier 0 NOD: Burst:2 wie 120mmDual, aber Damage 2000 statt 4000 (50% weniger als HTNK).
# Einzelner LocalOffset (2TNK-Sprite hat nur eine Kanone), trotzdem zweimal feuern.
aot-TtnkDual:
	Inherits: ^BallisticWeapon
	Burst: 2
	BurstDelays: 8
	Report: tnkfire4.aud
	Warhead@1Dam: SpreadDamage
		Damage: 2000

aot-TtnkChemspray:
	Inherits: Chemspray
	Burst: 2
	BurstDelays: 10

aot-TtnkTick:
	Inherits: ^BallisticWeapon
	Report: tnkfire4.aud
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# === Age of Tiberium (aotmod) - NOD Cyborg: Chain Gun ===
# Repliziert TS Vulcan3 (Burst 3, ReloadDelay 30, Damage 1000/Schuss).
# cygun1.aud aus TS sounds.mix (optionales Package in mod.yaml).
aot-CyborgChainGun:
	Inherits: MachineGun
	Range: 5c0
	Burst: 3
	BurstDelays: 4
	ReloadDelay: 30
	Report: cygun1.aud
	Warhead@1Dam: SpreadDamage
		Spread: 108
		Damage: 1000
		Versus:
			None: 100
			Wood: 60
			Light: 40
			Heavy: 25
			Concrete: 10
		DamageTypes: Prone70Percent, TriggerProne, BulletDeath

# === Age of Tiberium (aotmod) - NOD Cyborg: Cripple-Effekt ===
# Feuert auf sich selbst wenn Critical-HP erreicht (ExplosionOnDamageTransition).
# Size: 1,0 = nur die unmittelbare Zelle + 1er-Ring = 2-3 Tiberium-Blüten.
aot-CyborgCrippleEffect:
	Warhead@1Res: CreateResource
		AddsResourceType: Tiberium
		Size: 0,0
	Warhead@2Eff: CreateEffect
		Explosions: chemball
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Gunboat / Destroyer Waffen ===
# Basis BoatMissile (Engine-CnC Naval-Waffe). PT-Gunboat: leichter Einzelschuss.
# Destroyer (nach "Destroyer Enhancement"): stärkere Doppel-Raketensalve.
# PT-Gunboat: originalgetreuer Nachbau der RA-PT-Waffe "2Inch" (Schiffskanone).
# RA: Inherits ^Cannon (= CnC ^BallisticWeapon, Bullet/120MM), ReloadDelay 60,
# Range 5c512, Damage 2500, Report cannon2. Sound aus SFX3D.MEG (RAC_SFX_CANNON2.WAV)
# extrahiert nach bits/aot-cannon2.wav (MS-ADPCM, von OpenRA unterstützt).
aot-GunboatGun:
	Inherits: ^BallisticWeapon
	ReloadDelay: 60
	Range: 5c512
	Report: aot-cannon2.wav
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 2500
		Versus:
			None: 28
			Wood: 72
			Light: 72
			Concrete: 48
# Frigate: 3 Raketen, längere Pause als Destroyer (2 Raketen). Kein Luftangriff.
aot-FrigateMissiles:
	Inherits: BoatMissile
	ReloadDelay: 50
	Range: 6c512
	Burst: 3
	BurstDelays: 12
	ValidTargets: Ground, Water
	Warhead@1Dam: SpreadDamage
		Damage: 4000
aot-DestroyerRockets:
	Inherits: BoatMissile
	ReloadDelay: 30
	Range: 9c0
	Burst: 2
	BurstDelays: 8
	ValidTargets: Ground, Water, Air
	Warhead@1Dam: SpreadDamage
		Damage: 9000

# RA DepthCharge-Nachbau: Bogenprojektil (bomb.shp), feuert seitlich vom Schiff.
# RA original: ValidTargets Underwater (U-Boote) -- in CnC kein Underwater, daher Water
# (trifft Schiffe auf Wasser). LaunchAngle 62 + Speed 125 = sichtbarer Bogenflug wie
# beim RA-Original. Beide Schiffszustände (PT + DD) nutzen dieselbe Waffe.
aot-DepthCharge:
	Inherits: ^BallisticWeapon
	-Report:
	-Warhead@2Smu:
	ReloadDelay: 60
	Range: 5c0
	ValidTargets: Underwater
	Projectile: Bullet
		Image: bomb
		Speed: 125
		LaunchAngle: 62
		Shadow: true
		Inaccuracy: 128
	Warhead@1Dam: SpreadDamage
		Spread: 128
		Damage: 6000
		ValidTargets: Submarine
		Versus:
			None: 30
			Wood: 70
			Light: 80
			Heavy: 40
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@3Eff: CreateEffect
		Explosions: poof
		ImpactSounds: xplobig4.aud
		ValidTargets: Submarine

# RA Torpedo-Nachbau: schnelles Unterwasser-Projektil, trifft Schiffe + Küsten-Gebäude.
# Sub feuert von Bug (LocalOffset +X). UncloakOn: None → Sub bleibt getarnt beim Feuern.
aot-SubTorpedo:
	Inherits: ^BallisticWeapon
	-Warhead@2Smu:
	ReloadDelay: 100
	Range: 9c0
	Report: torpedo1.wav
	Burst: 2
	BurstDelays: 15
	ValidTargets: Water, Underwater
	Projectile: Missile
		Image: torpedo
		Arm: 3
		Speed: 85
		TrailImage: bubbles
		HorizontalRateOfTurn: 4
		RangeLimit: 10c819
		BoundToTerrainType: Water
		Palette: cloak
		Shadow: false
		MaximumLaunchAngle: 0
		CruiseAltitude: 0
	Warhead@1Dam: SpreadDamage
		Spread: 426
		Damage: 12000
		ValidTargets: Water, Underwater
		Versus:
			None: 50
			Light: 75
			Heavy: 100
			Concrete: 50
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@2Eff: CreateEffect
		Explosions: poof
		ImpactSounds: kaboom15.wav
		ValidTargets: Water, Underwater
	Warhead@3EffSplash: CreateEffect
		Explosions: poof
		ImpactSounds: splash9.wav
		ValidTargets: Water

