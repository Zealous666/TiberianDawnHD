# === Age of Tiberium (aotmod) - Satellite Launch: Dummy-Waffe ohne Schaden ===
# Wird von AotSatellitePower genutzt um NukeLaunch-Effekt zu spawnen.
# Kein Warhead = keine Wirkung. Target-Position ist weit oberhalb der Karte.
aot-satellite-launch:
	ValidTargets: Air
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Recon Jeep HUMVEE: stärkeres MG ===
# Tier 1: MachineGunH-Basis, Damage 1150→1500 (~30% mehr), gleiche Versus-Werte.
aot-JeepHumvee:
	Inherits: MachineGunH
	Warhead@1Dam: SpreadDamage
		Damage: 1500
		Versus:
			Light: 70
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - MTNK Predator: schnelleres 120mm ===
# Tier 2: ReloadDelay 40→25 (37.5% schneller), gleiche Projektil/Warhead-Basis.
aot-MtnkPredator:
	Inherits: ^BallisticWeapon
	ReloadDelay: 25
	Report: tnkfire4.aud

# === Age of Tiberium (aotmod) - MTNK Railgun: Hochschaden-Laser ===
# Tier 3: LaserZap-Projektil, ~50% mehr Schaden (6000 statt 4000), kein Spread.
aot-MtnkRailgun:
	ReloadDelay: 50
	Range: 6c0
	Report: bigggun1.aud
	Projectile: LaserZap
		Width: 50
		Color: A0C8FF
		HitAnim: laserfire
		ZOffset: 2047
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 6000
		Versus:
			None: 25
			Wood: 100
			Light: 100
			Heavy: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees, Creep

# === Age of Tiberium (aotmod) - HTNK Laser: weißer LaserZap wie MTNK Railgun ===
aot-HtnkLaser:
	ReloadDelay: 50
	Burst: 2
	BurstDelays: 8
	Range: 6c0
	Report: bigggun1.aud
	Projectile: LaserZap
		Width: 50
		Color: A0C8FF
		HitAnim: laserfire
		ZOffset: 2047
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 8000
		Versus:
			None: 25
			Wood: 100
			Light: 100
			Heavy: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees, Creep

aot-LtnkLaser:
	ReloadDelay: 60
	Range: 6c0
	Report: obelray1.aud
	Burst: 3
	BurstDelay: 8
	Projectile: LaserZap
		Width: 40
		HitAnim: laserfire
		ZOffset: 2047
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 4000
		Versus:
			Wood: 50
		DamageTypes: Prone50Percent, TriggerProne, FireDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees, Creep
# === Age of Tiberium (aotmod) - Apache AG Missiles ===
OrcaAGMissiles:
	Warhead@1Dam: SpreadDamage
		Damage: 2000

# Apache: gleicher Schaden wie ORCA (2000), aber kein AA.
aot-ApacheAGMissiles:
	Inherits: OrcaAGMissiles
	Warhead@1Dam: SpreadDamage
		Damage: 2000

# === Age of Tiberium (aotmod) - HIND / Harpy Waffen ===
# HIND: 1500 Schaden, Burst 2, kein AA.
# Harpy: 2000 Schaden, Burst 3, kein AA.
aot-HindAGGun:
	Inherits: HeliAGGun
	Burst: 2
	BurstDelays: 0
	ReloadDelay: 40
	Warhead@1Dam: SpreadDamage
		Damage: 1500

aot-HarpyAGGun:
	Inherits: HeliAGGun
	Burst: 2
	BurstDelays: 0
	ReloadDelay: 20
	Warhead@1Dam: SpreadDamage
		Damage: 2000

# === Age of Tiberium (aotmod) - AJET Waffen ===
# Basieren auf A10-Waffen (Vulcan/Napalm), aber ohne Burst-Offsets die für den
# stationären A10-Überflug ausgelegt sind. AJET greift per AttackAircraft an.

# Vulcan-Kanone ohne FirstBurst/FollowingBurst-Offsets — trifft direkt das Ziel
aot-AjetVulcan:
	Inherits: Vulcan
	Range: 5c0
	FirstBurstTargetOffset: 0,0,0
	FollowingBurstTargetOffset: 0,0,0

# Napalm-Kette: 5 Bomben mit Fallverzögerung (GravityBomb Delay)
aot-AjetNapalm:
	Inherits: ^FlameWeapon
	ReloadDelay: 4
	Range: 5c0
	Burst: 5
	BurstDelays: 1
	-Projectile:
	Projectile: GravityBomb
		Image: BOMBLET
		Shadow: true
		Delay: 8
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 2250
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Versus:
			Wood: 35
			Heavy: 80
			Concrete: 80
	Warhead@3Eff: CreateEffect
		Explosions: med_napalm

# === Age of Tiberium (aotmod) - TTNK Battle Tank: Dual-Kanone ===
# Tier 0 NOD: Burst:2 wie 120mmDual, aber Damage 2000 statt 4000 (50% weniger als HTNK).
# Einzelner LocalOffset (2TNK-Sprite hat nur eine Kanone), trotzdem zweimal feuern.
aot-TtnkDual:
	Inherits: ^BallisticWeapon
	Burst: 2
	BurstDelays: 8
	Report: tnkfire4.aud
	Warhead@1Dam: SpreadDamage
		Damage: 2000

aot-TtnkChemspray:
	Inherits: Chemspray
	Burst: 2
	BurstDelays: 10

aot-TtnkTick:
	Inherits: ^BallisticWeapon
	Report: tnkfire4.aud
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# === Age of Tiberium (aotmod) - NOD Cyborg: Chain Gun ===
# Repliziert TS Vulcan3 (Burst 3, ReloadDelay 30, Damage 1000/Schuss).
# cygun1.aud aus TS sounds.mix (optionales Package in mod.yaml).
aot-CyborgChainGun:
	Inherits: MachineGun
	Range: 5c0
	Burst: 3
	BurstDelays: 4
	ReloadDelay: 30
	Report: cygun1.aud
	Warhead@1Dam: SpreadDamage
		Spread: 108
		Damage: 1000
		Versus:
			None: 100
			Wood: 60
			Light: 40
			Heavy: 25
			Concrete: 10
		DamageTypes: Prone70Percent, TriggerProne, BulletDeath

# === Age of Tiberium (aotmod) - NOD Cyborg: Cripple-Effekt ===
# Feuert auf sich selbst wenn Critical-HP erreicht (ExplosionOnDamageTransition).
# Size: 1,0 = nur die unmittelbare Zelle + 1er-Ring = 2-3 Tiberium-Blüten.
aot-CyborgCrippleEffect:
	Warhead@1Res: CreateResource
		AddsResourceType: Tiberium
		Size: 0,0
	Warhead@2Eff: CreateEffect
		Explosions: chemball
# === Ende aotmod ===

# === Age of Tiberium (aotmod) - Gunboat / Destroyer Waffen ===
# Basis BoatMissile (Engine-CnC Naval-Waffe). PT-Gunboat: leichter Einzelschuss.
# Destroyer (nach "Destroyer Enhancement"): stärkere Doppel-Raketensalve.
# PT-Gunboat: originalgetreuer Nachbau der RA-PT-Waffe "2Inch" (Schiffskanone).
# RA: Inherits ^Cannon (= CnC ^BallisticWeapon, Bullet/120MM), ReloadDelay 60,
# Range 5c512, Damage 2500, Report cannon2. Sound aus SFX3D.MEG (RAC_SFX_CANNON2.WAV)
# extrahiert nach bits/aot-cannon2.wav (MS-ADPCM, von OpenRA unterstützt).
aot-GunboatGun:
	Inherits: ^BallisticWeapon
	ReloadDelay: 60
	Range: 5c512
	Report: aot-cannon2.wav
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 2500
		Versus:
			None: 28
			Wood: 72
			Light: 72
			Concrete: 48
aot-DestroyerRockets:
	Inherits: BoatMissile
	ReloadDelay: 30
	Range: 9c0
	Burst: 2
	BurstDelays: 8
	Warhead@1Dam: SpreadDamage
		Damage: 9000
# === Ende aotmod ===
