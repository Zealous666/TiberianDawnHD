# === Age of Tiberium (aotmod) - Garrison-Waffen fuer Pillbox (2026-07-05) ===
# AttackGarrisoned-Fire-Ports duerfen nicht durch Mauern blockiert werden
# (User-Wunsch: "Pillbox muss ueber Mauern schiessen koennen"). Bullet-
# Projektile sind per Default Blockable:true - E2 (Grenade) und E3 (Rockets)
# haben das schon selbst auf false (^BallisticWeapon bzw. ^MissileWeapon), E1
# (M16), E4 (Flamethrower/Chemspray) NICHT - dafuer diese Varianten mit
# Blockable:false. Nur fuer die Armament@GARRISONED-Instanz genutzt, das
# normale Feld-Verhalten der Einheiten bleibt unveraendert.
aot-M16Garrisoned:
	Inherits: M16
	Projectile: Bullet
		Blockable: false
	# Damage-Multiplier vs. Infanterie (User-Wunsch 2026-07-05): macht die
	# Pillbox zur effizienten Infanterie-Abwehr. Nur die Garrison-Variante
	# betroffen - E1s normale Feld-Waffe (M16) bleibt unveraendert.
	Warhead@1Dam: SpreadDamage
		Versus:
			None: 300

aot-FlamethrowerGarrisoned:
	Inherits: Flamethrower
	Projectile: Bullet
		Blockable: false

aot-ChemsprayGarrisoned:
	Inherits: Chemspray
	Projectile: Bullet
		Blockable: false

