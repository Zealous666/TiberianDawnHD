# (stark vs Heavy 120 / schwach vs Concrete 60 -- Panzerbrecher, kein Basiskiller), kurze
# Reichweite 7c512 (vs 20c0 des Subs). Nur ab Destroyer-Upgrade aktiv.
#
# ZUSTELLUNG von der bewaehrten Sub-Rakete uebernommen, weil die ROHEN RA-Werte in diesem
# Mod gegen Gebaeude quasi 0 Schaden machten (User-Test): RAs Gebaeude sind winzig, hier
# haben sie 55k-80k HP mit grossen HitShapes. Zwei Ursachen behoben:
#  1. Spread 128 + Default-Falloff [100,37,14,5,0] = viel zu enger Radius -> der Grossteil
#     der Gebaeude-HitShape lag ausserhalb. Jetzt Spread 426 + sanfter Falloff wie beim Sub.
#  2. CloseEnough 149 < Speed 170 -> die Rakete uebersprang das Detonationsfenster jeden
#     Tick, kreiste und detonierte weit vom Ziel. CloseEnough entfernt = Default 298 (> Speed).
