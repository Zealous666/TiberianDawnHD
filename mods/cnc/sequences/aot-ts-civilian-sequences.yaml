# Neu gebacken (2026-07-27): rohes ctaray.shp direkt referenziert sah bei groesserer Skalierung
# extrem pixelig aus (identisches Problem wie beim Wolverine-Mech-Import, siehe
# [[ts-shp-mech-import]] "Cyborg-Palette-Ansatz ... extrem pixelig/grobkoernig"). Fix: eigener
# SHP-TS-Format-Decoder (Python, TS-Frame-Format aus ShpTSLoader.cs rekonstruiert) liest die
# rohen Palette-Indizes von Frame 0 direkt (keine Hausfarben-Pixel 16-31 vorhanden -> kein
# Player-Color-Layer noetig), Scale3x/EPX-Vorskalierung (indexed-erhaltend, scharfe Kanten,
# kein LANCZOS-Blur) 84x80 -> 252x240, dann erst zu RGBA (unittem.pal) geflattet und als
# statisches PNG gebacken (bits/aot-ts-ctaray.png) - analog zum aot-ts-galite-Rebake.
# Scale kompensiert die 3x-Vorskalierung: alte Ziel-Groesse (Scale 1.0 auf Rohgroesse) / 3 = 0.333.
# User-Wunsch 2026-07-27: nochmal 25% kleiner -> 0.333 * 0.75 = 0.25.
aot-ts-ctaray:
	idle:
		Filename: aot-ts-ctaray.png
		Length: 1
		Scale: 0.25

