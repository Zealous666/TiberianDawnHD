# === Ende aotmod ===
# === Wassereinschlag (RA Remaster VFX) — Eis-Einbruch ===
# Derselbe Splash, den RA beim Schuss ins Wasser zeigt. Ersetzt die normale
# Fahrzeug-Explosion, wenn eine Einheit im Eis einbricht (siehe [[ice-growth-system]]).
# WICHTIG: CreateEffect.Explosions erwartet SEQUENZ-Namen auf dem Image "explosion"
# (Default von CreateEffect.Image), NICHT eigene Image-Namen -- sonst:
# "Image `explosion` does not have a sequence named `...`".
explosion:
	aot-h2o-splash:
		RemasteredFilename: DATA\ART\TEXTURES\SRGB\RED_ALERT\VFX\H2O_EXP1.ZIP
		Length: *
	aot-h2o-splash2:
		RemasteredFilename: DATA\ART\TEXTURES\SRGB\RED_ALERT\VFX\H2O_EXP2.ZIP
		Length: *
	aot-h2o-splash3:
		RemasteredFilename: DATA\ART\TEXTURES\SRGB\RED_ALERT\VFX\H2O_EXP3.ZIP
		Length: *
