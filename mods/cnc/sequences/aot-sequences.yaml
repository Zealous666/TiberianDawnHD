# === Tiberium Silo (silo): Age-0 RA-Tank + Gemini-Pumpstation, Age-2 TD-Klassik im selben Image ===
# Age-0 (aot-silo-ra-stages.png, 5 Frames leer->voll): der Gemini-Tank wurde KOMPLETT entfernt
# (nur die "Process Pump Station" blieb stehen) und durch das echte RA-Remaster-Einzelsilo
# ersetzt, ausgerichtet an dessen Sockelring (Ziel x30..645, Unterkante y683, Scale ~4.85).
# Das RA-Silo liegt HINTER der Pumpstation -- Ventil/Manometer/Rohre muessen davor bleiben,
# sonst werden sie ueberdeckt. Der Fuellstand kommt aus den Originalframes, nicht aus Synthese.
# Scale 0.1875 = 24/128 (TileSize/RemasteredTileSize) — der Faktor den RemasterSpriteSequence
# sonst automatisch anwendet; unsere PNGs laufen über den klassischen Filename-Pfad und brauchen
# ihn daher explizit. Gleicher Image-Name "silo" wie Engine — Sequenzen werden gemergt, nicht
# ersetzt, damit auch der unveränderte Basis-SILO-Aktor (Image: silo) sie findet (Muster wie PYLE/HAND).
