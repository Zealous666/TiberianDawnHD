aot-ice01:
	Defaults:
		# DREI Ebenen: Fahrzeuge (0) > Host-Scholle (-1023) > gewachsene Zellen (-2047).
		# 0 liess die Scholle ueber Panzern liegen, -2047 (wie die Zellen) liess sie darunter
		# verschwinden. Muss also strikt ZWISCHEN beiden liegen.
		ZOffset: -1023
		RemasteredFilenamePattern: DATA\ART\TEXTURES\SRGB\RED_ALERT\TERRAIN\TEMPERATE\ICE01.TEM\ICE01.TEM-0000-{0:D4}.DDS
