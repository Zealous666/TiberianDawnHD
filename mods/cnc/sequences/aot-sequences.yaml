# === Age of Tiberium (aotmod) - GDI Quad Helipad (aot-hpad-gdi) ===
# 4x4-Composite: 4x HPAD-Pad (je 2x2 Zellen, TD-Remastered) quadratisch angeordnet
# um einen dekorativen GTWR (Guard Tower, ohne Funktion) in der Mittellücke, die durch
# die runden Pad-Silhouetten natürlich entsteht. Frames aus HPAD.ZIP/GTWR.ZIP/
# HPADMAKE.ZIP/GTWRMAKE.ZIP (TEXTURES_TD_SRGB.MEG) mit .meta-Crop-Offset auf volle
# 128px/Zelle-Referenzcanvas zurückgepackt, dann zu 512x512-Sheets zusammengesetzt
# (siehe silo-system.md für das identische Grundprinzip). Scale 0.1875 = 24/128
# (TileSize/RemasteredTileSize), da wir über den klassischen Filename-Pfad laufen.
# Bib (Schmutz-Smudge) deckt die GESAMTE 4x4-Fläche und ist DIREKT in jedes Frame
# hineingebacken (Hintergrund-Layer vor den Pads/Turm gepaintet), NICHT über die native
# WithBuildingBib/WithIdleOverlay-Traits:
# - WithBuildingBib deckt hart nur 2 Reihen (bottom-anchored) - keine Option für 4 Reihen.
# - Ein zweiter Block per WithIdleOverlay@northbib scheiterte doppelt: kein konfigurierbarer
#   ZOffset (RenderUtils.ZOffsetFromCenter neutralisiert sich fast zu 0 -> sortierte vor
#   statt hinter den Pads), UND zwei separate 4x2-bib1-Mosaike (nativ Süd + gebacken Nord)
#   erzeugten eine sichtbare Nahtstelle in der Mitte, weil beide Patches unabhängig
#   voneinander zur Kante hin ausfaden.
# Lösung: das reguläre bib1-Mosaik (8 Tiles, 512x256, exakt das was WithBuildingBib sonst
# nativ für 2 Reihen rendert) wird auf 512x512 gestreckt -> EIN durchgehender, nahtloser
# Fleck über die volle Fläche. Dreck-/Schutt-Textur hat keine starke Richtungsstruktur,
# die 2x-Streckung fällt nicht auf. WithBuildingBib-Trait komplett entfernt.
aot-hpad4:
	idle:
		Filename: aot-hpad4-idle.png
		Length: 1
		Scale: 0.1875
		Offset: 0,-1
		ZOffset: -1536
	damaged-idle:
		Filename: aot-hpad4-damaged.png
		Length: 1
		Scale: 0.1875
		Offset: 0,-1
		ZOffset: -1536
	active:
		Filename: aot-hpad4-active.png
		Length: *
		Tick: 100
		Scale: 0.1875
		Offset: 0,-1
		ZOffset: -1536
	damaged-active:
		Filename: aot-hpad4-damaged-active.png
		Length: *
		Tick: 100
		Scale: 0.1875
		Offset: 0,-1
		ZOffset: -1536
	dead:
		Filename: aot-hpad4-dead.png
		Length: 1
		Scale: 0.1875
		Offset: 0,-1
		ZOffset: -1536
	make:
		Filename: aot-hpad4-make.png
		Length: *
		Tick: 80
		Scale: 0.1875
		Offset: 0,-1
	hpad-blue-icon:
		Filename: hpad_blue.png
		Length: 1
	# Age-2 Gemini-Composite (2026-08-30): 4 Gemini-Pad-Plattformen + zentraler moderner Turm.
	# Basis entsaettigt (-75% Saettigung / -10% Helligkeit), blaue Container + gruenes Turmdach
