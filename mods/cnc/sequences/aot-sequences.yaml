# === Tiberium Silo (silo): Age-0 RA-Doppel-Sprite + Age-2 TD-Klassik im selben Image ===
# Statische Composites (kein dynamisches Füllstands-Rendering für Age-0): links immer voll,
# rechts immer halbvoll — sowohl im Normal- als auch im beschädigten Zustand.
# aot-silo-idle.png: links=Frame4 (voll, unbeschädigt), rechts=Frame2 (halbvoll, unbeschädigt).
# aot-silo-damaged.png: links=Frame9 (voll, beschädigt), rechts=Frame7 (halbvoll, beschädigt).
# Scale 0.1875 = 24/128 (TileSize/RemasteredTileSize) — der Faktor den RemasterSpriteSequence
# sonst automatisch anwendet; unsere PNGs laufen über den klassischen Filename-Pfad und brauchen
# ihn daher explizit. Gleicher Image-Name "silo" wie Engine — Sequenzen werden gemergt, nicht
# ersetzt, damit auch der unveränderte Basis-SILO-Aktor (Image: silo) sie findet (Muster wie PYLE/HAND).
silo:
	aot-ra-idle:
		Filename: aot-silo-idle.png
		RemasteredFilename:
		Length: 1
		Scale: 0.1875
		Offset: 0,-1
	damaged-aot-ra-idle:
		Filename: aot-silo-damaged.png
		RemasteredFilename:
		Length: 1
		Scale: 0.1875
		Offset: 0,-1
	aot-ra-make:
		Filename: aot-silomake.png
		RemasteredFilename:
		Length: *
		Scale: 0.1875
		Offset: 0,-1
	aot-ts-idle:
		Filename: aot-silo-ts-idle.png
		RemasteredFilename:
		Length: 1
		Scale: 0.70
		Offset: 0,-20
	damaged-aot-ts-idle:
		Filename: aot-silo-ts-damaged.png
		RemasteredFilename:
		Length: 1
		Scale: 0.70
		Offset: 0,-20
	aot-ts-idle-remap:
		Filename: aot-silo-ts-idle-remap.png
		RemasteredFilename:
		Length: 1
		Scale: 0.70
		Offset: 0,-20
	damaged-aot-ts-idle-remap:
		Filename: aot-silo-ts-damaged-remap.png
		RemasteredFilename:
		Length: 1
		Scale: 0.70
		Offset: 0,-20
	aot-ts-make:
		Filename: aot-silomake-ts.png
		RemasteredFilename:
		Length: *
		Scale: 0.70
		Offset: 0,-20
	bib:
		Filename: bib3.tem
		TilesetFilenames:
			DESERT: bib3.des
			WINTER: bib3.win
			SNOW: bib3.sno
			TEMPERAT: bib3.tem
		Length: *
		RemasteredFilenamePattern: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\TEMPERATE\BIB3\BIB3.TEM-{0:D4}.DDS
			Count: 4
		RemasteredTilesetFilenamesPattern:
			WINTER: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\WINTER\BIB3.WIN\BIB3.WIN-{0:D4}.DDS
				Count: 4
			DESERT: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\DESERT\BIB3.DES\BIB3.DES-{0:D4}.DDS
