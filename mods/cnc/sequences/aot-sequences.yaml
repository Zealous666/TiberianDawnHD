		RemasteredFilename:
		Length: 1
		Scale: 0.37
		Offset: 0,-20
	aot-age1-idle:
		Filename: aot-nod-radar-age1-idle.png
		RemasteredFilename:
		Length: 12
		Tick: 120
		Scale: 0.57
		Offset: 0,-30
	make:
		Filename: aot-nod-radar-age0-make.png
		RemasteredFilename:
		Length: 14
		Tick: 40
		Scale: 0.37
		Offset: 0,-20
	aot-age1-make:
