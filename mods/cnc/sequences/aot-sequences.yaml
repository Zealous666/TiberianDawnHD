# === NOD Radar (aot-nod-radar): RA DOME Sprites ===
# Frames aus DOME.ZIP extrahiert — ZIP hat zwei Präfix-Gruppen (dome-0000-/dome-0001-)
# die der OpenRA RemasteredLoader nicht verarbeiten kann. PNG-Extrakt als Workaround.
# idle: 8 Frames (dome-0000-*), damaged: 8 Frames (dome-0001-*).
# Icon: domeicon.shp aus allies.mix (Classic Content Installer), bis dahin kein Icon.
aot-nod-radar:
	idle:
		Filename: aot-nod-radar-age0-idle.png
		RemasteredFilename:
		Length: 1
		Scale: 0.37
		Offset: 0,-20
	# Schadensbild aus der urspruenglichen DOME-Extraktion (aot-nod-radar-damaged-idle-000X,
	# 8 Frames, 255x198). Die lagen seit dem Sprite-Wechsel ungenutzt herum. Skaliert mit
	# 71/186 = 0.38172 -- hergeleitet ueber die Breite des gruenen Basisrings, der in beiden
	# Quellen identisch 186 px misst. Y-Anker ist die RING-UNTERKANTE (nicht die Oberkante:
	# die zerstoerte Kuppel gibt mehr Ringflaeche frei und verfaelscht die Oberkante).
	damaged-idle:
		Filename: aot-nod-radar-age0-damaged-idle.png
		RemasteredFilename:
		Length: 8
		Tick: 120
		Scale: 0.37
		Offset: 0,-20
	aot-age1-idle:
		Filename: aot-nod-radar-age1-idle.png
		RemasteredFilename:
		Length: 12
		Tick: 120
		Scale: 0.57
		Offset: 0,-30
	make:
		Filename: aot-nod-radar-age0-make.png
		RemasteredFilename:
		Length: 14
		Tick: 40
		Scale: 0.37
		Offset: 0,-20
	aot-age1-make:
		Filename: aot-nod-radar-age1-make.png
		RemasteredFilename:
		Length: 14
		Tick: 40
		Scale: 0.57
		Offset: 0,-30
	bib:
		TilesetFilenames:
			DESERT: bib3.des
			WINTER: bib3.win
			SNOW: bib3.sno
			TEMPERAT: bib3.tem
		Length: *
		RemasteredFilenamePattern: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\TEMPERATE\BIB3\BIB3.TEM-{0:D4}.DDS
			Count: 4
		RemasteredTilesetFilenamesPattern:
			WINTER: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\WINTER\BIB3.WIN\BIB3.WIN-{0:D4}.DDS
				Count: 4
			DESERT: DATA\ART\TEXTURES\SRGB\TIBERIAN_DAWN\TERRAIN\DESERT\BIB3.DES\BIB3.DES-{0:D4}.DDS
				Count: 4
		RemasteredPremultiplied: false
	icon:
		Filename: aot-nod-radar-icon.png
		RemasteredFilename:
		Length: 1
	aot-age2-icon:
		Filename: aot-nod-radar-age2-icon.png
		RemasteredFilename:
		Length: 1
	# === TS NOD Radar (NARADR) ab Age 2 — fixe Einzelbild-Basis + Dish-Overlay (2026-07-08) ===
	# Aus dem gebackenen 24-Frame-Kombi-Sprite bei Linie 17 (native y=355) horizontal geteilt:
	# oberhalb = Dish-Rotation (24 Frames), unterhalb = Basis, davon NUR Frame 0 einmalig
	# verwendet -> Basis kann strukturell nicht mehr zwischen Frames springen, da es buchstaeblich
	# immer derselbe Pixel-Frame ist. Scale identisch zum Kombi-Sprite (reiner Crop, keine
	# Neuskalierung); Offsets aus der Kombi-Offset (2,111) fuer den jeweiligen Crop-Ausschnitt
	# neu hergeleitet (Formel: screen_y = Scale*(y_nativ - Canvas_h/2 + Offset_y) muss fuer
	# denselben y_nativ-Punkt in Voll- und Teil-Canvas uebereinstimmen).
	aot-age2-idle:
		Filename: aot-nod-radar-age2-base-only.png
		RemasteredFilename:
		Length: 1
		Scale: 0.1875
		Offset: 1,79
