# === Age of Tiberium (aotmod) - Shroud Generator (RA Gap Generator, GDI) ===
# Sprite: RA Remaster GAP.ZIP (64 Frames: 0-31 idle-Spin, 32-63 damaged-Spin) +
# GAPMAKE.ZIP (13 Frames Bau-Animation). Kein "dead"-Rubble-Frame -> Aktor setzt
# -WithDeathAnimation (siehe building-dead-sequence-crash Memory).
# SPLIT in fixes Fundament + rotierende Dish (User-Wunsch): der komplette 32-Frame-Spin
# aus GAP.ZIP hatte sub-pixel-Jitter (Frame-Anker = crop-top/2, springt Ganz-/Halb-Pixel)
# -> der Mast/Sockel "hüpfte". Jetzt aus GAP.ZIP gebacken (bake, siehe asset wip/sgen):
#   gap_found(.._damaged).png = Sockel+Coil+Base OHNE Dish, statisch (Zeilen >=120).
#   gap_dish.png = nur die rotierende Gabel als 32-Frame-Horizontal-Sheet (Zeilen <=132).
# Beide 128x256 @ Scale 0.1875 (= 24/128, klassischer Pfad classicUpscaleFactor 128/24)
# -> identische Größe/Anker wie das Original-Remaster-Sprite, exakt überlagert.
aot-gap:
	icon:
		Filename: aot-gap-icon.png
		RemasteredFilename:
		Length: 1
	idle:
		Filename: gap_found.png
		RemasteredFilename:
		Length: 1
		Scale: 0.1875
	damaged-idle:
		Filename: gap_found_damaged.png
		RemasteredFilename:
		Length: 1
		Scale: 0.1875
	dish:
		Filename: gap_dish.png
		RemasteredFilename:
		Length: 32
		Scale: 0.1875
	make:
		RemasteredFilename: DATA\ART\TEXTURES\SRGB\RED_ALERT\STRUCTURES\GAPMAKE.ZIP
		RemasteredStart: 0
		RemasteredLength: 13
	# 2x2 Concrete-Bib, REMASTERED (wie PYLE/TD-Gebäude, siehe structures-overrides.yaml):
	# WithBuildingBib zeichnet rows(2) x width(2) = 4 Kacheln -> braucht 4 Frames. Der alte
	# mbSILO hatte nur 2 Frames (Minibib) UND kein Remaster-Pendant -> "2 zusammengebaute",
	# low-res. BIB3 = genau 4 Frames, HD, nahtlos.
	bib:
		Filename: bib3.tem
