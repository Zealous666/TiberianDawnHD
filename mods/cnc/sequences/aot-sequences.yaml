		# spawnt die echten aot-foundation-cell-Zellen, die den ZOffset unten tragen) -- dieser
		# Sprite wird dort nie sichtbar. Im Karteneditor laeuft dieser Dispose NIE (keine echte
		# Simulation), der Placer bleibt dauerhaft mit diesem un-geoffseteten Sprite stehen und
		# sortiert dadurch auf normaler Gebaeude-Hoehe -> ueberlappt Gebaeude im Editor. Gleicher
