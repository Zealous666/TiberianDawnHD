General:
	Name: tileset-aot-temperat
	Id: AOT_TEMPERAT
	IndexedSheetSize: 1024
	EditorTemplateOrder: Terrain, Debris, Road, Cliffs, Water Cliffs, Beach, River, Bridge, Floor (Indoor), Wall (Indoor), Cliffs (Jungle)
	HeightDebugColors: AA0000

Terrain:
	TerrainType@Beach:
		Type: Beach
		TargetTypes: Ground
		Color: B09C78
	TerrainType@Bridge:
		Type: Bridge
		TargetTypes: Ground, Bridge
		Color: 606060
	TerrainType@Clear:
		Type: Clear
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 284428
		RestrictPlayerColor: true
	# Interior-Floor-Typ (aus RA Interior uebernommen): kein Smudge, damit Indoor-Boeden sauber bleiben.
	TerrainType@ClearNoSmudges:
		Type: ClearNoSmudges
		TargetTypes: Ground
		Color: 000000
	TerrainType@BlueTiberium:
		Type: BlueTiberium
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 54FCFC
		RestrictPlayerColor: true
	TerrainType@Tiberium:
		Type: Tiberium
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: A1E21C
		RestrictPlayerColor: true
	TerrainType@River:
		Type: River
		TargetTypes: Ground
		Color: 5C8CB4
	TerrainType@Road:
		Type: Road
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 5E430D
	TerrainType@Rock:
		Type: Rock
		TargetTypes: Ground
		Color: 44443C
	# === Age of Tiberium (aotmod) - Jumpjet Custom-Movement-Layer (Zone Trooper Hover) ===
	TerrainType@Jumpjet:
		Type: Jumpjet
		Color: 44443C
	# === Age of Tiberium (aotmod) - Subterranean Custom-Movement-Layer (Devil's Tongue / Sub APC) ===
	TerrainType@Subterranean:
		Type: Subterranean
		Color: 745537
	TerrainType@Rough:
		Type: Rough
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 44443C
	TerrainType@Tree:
		Type: Tree
		TargetTypes: Ground
		Color: 1C2024
	TerrainType@Wall:
		Type: Wall
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: D0C0A0
	TerrainType@Water:
		Type: Water
		TargetTypes: Water
		Color: 5C74A4
		RestrictPlayerColor: true

	# Tiberian Veins (aot-vein-cell, ChangesTerrain: Veins). Begehbar wie Clear; gruene Radarfarbe.
	# Fahrzeuge nehmen darauf langsamen DoT (DamagedByTerrain@VEINS in overrides.yaml).
	TerrainType@Veins:
		Type: Veins
		TargetTypes: Ground
		AcceptsSmudgeType: Crater, Scorch
		Color: 3CA028

